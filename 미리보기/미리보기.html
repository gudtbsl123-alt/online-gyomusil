  // ============================================================ 홈 검색
  var searchTimer = null, searchSeq = 0;

  function homeSearchBox() {
    return '<form class="search home-search print-hide" id="home-search" role="search"><label for="home-q" class="sr-only">일정·자료·선생님 검색</label>' +
      icon('search', 20) + '<input id="home-q" type="search" placeholder="일정·자료·선생님 찾기" value="' + esc(S.homeQ || '') + '" autocomplete="off"></form>';
  }

  function bindHomeSearch() {
    var form = qs('#home-search'), inp = qs('#home-q');
    if (!form) return;
    form.addEventListener('submit', function (e) { e.preventDefault(); clearTimeout(searchTimer); runSearch(inp.value); });
    inp.addEventListener('input', function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { runSearch(inp.value); }, 400);
    });
  }

  function runSearch(q) {
    q = String(q || '').trim();
    if (q === (S.homeQ || '') && (S.search || !q)) return;
    S.homeQ = q;
    var body = qs('#home-body');
    if (!body) return;
    var seq = ++searchSeq;
    if (!q) { S.search = null; if (S.home) drawHome(); else SCREENS.home(qs('#screen')); return; }
    body.innerHTML = loadingHtml('찾는 중이에요');
    server('search', { q: q }).then(function (r) {
      if (seq !== searchSeq) return;
      S.search = r;
      drawSearch();
    }).catch(function (e) { if (seq === searchSeq) body.innerHTML = failHtml(e); });
  }

  function srRow(action, id, ico, title, sub, right, extra) {
    return '<button type="button" class="sr-row" data-action="' + action + '" data-id="' + esc(id) + '"' + (extra || '') + '>' + icon(ico, 20, ' class="sr-ico"') +
      '<span class="sr-main"><span class="sr-t">' + title + '</span>' + (sub ? '<span class="sr-sub">' + esc(sub) + '</span>' : '') + '</span>' +
      (right ? '<span class="sr-right">' + esc(right) + '</span>' : '') + icon('chev', 18, ' class="sr-chev"') + '</button>';
  }

  function drawSearch() {
    var r = S.search, body = qs('#home-body');
    if (!body || !r) return;
    var groups = [
      { key: 'library', label: '자료', icon: 'folder', more: '자료실에서 모두 보기', row: function (i) {
        return srRow('sr-lib', i.id, i.hasFile ? 'doc' : 'link', esc(i.title), [i.common ? '공통' : '', i.dept, i.kind, i.archived ? i.year + ' 보관함' : ''].filter(Boolean).join(' · '));
      } },
      { key: 'events', label: '일정', icon: 'calendar', row: function (e) {
        return srRow('ev-open', e.id, 'calendar', (e.important ? starHtml() : '') + esc(e.title),
          (e.end !== e.start ? mdw(e.start) + ' – ' + mdw(e.end) : mdw(e.start)) + (e.start.slice(0, 4) !== r.today.slice(0, 4) ? ' · ' + e.start.slice(0, 4) + '년' : '') +
          [e.time, e.dept, e.place].filter(Boolean).map(function (x) { return ' · ' + x; }).join(''), '', ' data-ev="' + esc(e.id) + '"');
      } },
      { key: 'staff', label: '교직원', icon: 'people', more: '교직원 명단에서 모두 보기', row: function (p) {
        return srRow('sr-staff', p.name, 'people', esc(p.name) + (p.position ? ' <span class="faint">' + esc(p.position) + '</span>' : ''),
          [p.group, p.dept, p.duty].filter(Boolean).join(' · '), p.ext ? '내선 ' + p.ext : '');
      } },
      { key: 'help', label: '도움말', icon: 'help', more: '도움말에서 모두 보기', row: function (h) {
        return srRow('sr-help', h.id, 'help', esc(h.title), h.kind);
      } },
      { key: 'notices', label: '공지', icon: 'bell', row: function (n) {
        return srRow('notice-open', n.id, 'bell', (n.pinned ? starHtml() : '') + esc(n.title), [n.dept, n.active ? '' : '끝난 공지'].filter(Boolean).join(' · '));
      } },
      { key: 'surveys', label: '조사·신청', icon: 'survey', row: function (c) {
        return srRow('sr-sv', c.id, 'survey', esc(c.title), (c.closed ? '끝남' : c.deadlineText + '까지') + (c.dept ? ' · ' + c.dept : ''),
          c.inTarget && !c.closed ? (c.answered ? '냈어요' : '아직 안 냄') : '');
      } }
    ];
    groups = groups.filter(function (g) { return r[g.key]; });
    var total = groups.reduce(function (n, g) { return n + r[g.key].total; }, 0);
    body.innerHTML = '<section class="card search-res" aria-live="polite"><div class="card-head"><h2>\'' + esc(r.q) + '\' 찾은 결과 <span class="accent-num">' + total + '</span></h2>' +
      '<button type="button" class="btn btn-sm" data-action="search-clear">' + icon('x', 18) + '검색 지우기</button></div>' +
      (total ? groups.filter(function (g) { return r[g.key].total; }).map(function (g) {
        var res = r[g.key];
        return '<div class="sr-group"><h3 class="sr-h">' + icon(g.icon, 20) + g.label + ' <span class="faint">' + res.total + '</span></h3>' +
          '<div class="sr-list">' + res.items.map(g.row).join('') + '</div>' +
          (res.total > res.items.length ? (g.more ? '<button type="button" class="linkish sr-more" data-action="sr-more" data-k="' + g.key + '">' + g.more + ' (' + res.total + ')</button>'
            : '<p class="faint">' + (res.total - res.items.length) + '개 더 있어요. 낱말을 더 넣어 좁혀 보세요.</p>') : '') + '</div>';
      }).join('') : '<div class="box"><p style="font-weight:800">찾는 것이 없어요</p><p class="faint">낱말을 줄이거나 다르게 적어 보세요. 예: 협의록, 체육대회, 선생님 이름</p></div>') +
      '</section>';
  }

  function searchGo(key) {
    var q = S.homeQ || '';
    if (key === 'library') { S.lib.q = q; S.lib.view = 'now'; S.lib.dept = ''; S.lib.kind = ''; go('library'); }

        toast(edit ? '공지를 고쳤어요' : '공지를 올렸어요');
        S.notice.view = 'now';
        return loadNotices();
      }).catch(function (e) { busy(btn, false); err.textContent = e.message; });
    });
  }

  /** 홈 공지 카드 */
  function homeNoticeCard(h) {
    var nt = h.notices || { items: [], total: 0 };
    return '<section class="card notice-card"><div class="card-head"><h2>공지 <span class="accent-num">' + nt.total + '</span></h2>' +
      '<div class="row-btns"><button type="button" class="linkish" data-go="notice">전체 보기</button></div></div>' +
      (nt.items.length ? '<div class="sr-list">' + nt.items.map(function (n) {
        return srRow('notice-open', n.id, 'info', (n.pinned ? starHtml() : '') + esc(n.title), [n.dept, n.at ? md(n.at.slice(0, 10)) : ''].filter(Boolean).join(' · '));
      }).join('') + '</div>' : '<p class="faint">지금 걸린 공지가 없어요.</p>') +
      '<button type="button" class="btn btn-sm print-hide" data-action="notice-new" style="align-self:flex-start">' + icon('plus', 18) + '공지 쓰기</button></section>';
  }

  // ============================================================ 관리자
  SCREENS.admin = function ($s) {
    if (!S.admin) return adminGate($s);
    var tabs = [['staff', '교직원 표'], ['cat', '분류'], ['settings', '설정'], ['year', '새 학년도'], ['log', '수정 기록'], ['trash', '휴지통'], ['pw', '비밀번호']];
    $s.innerHTML = pageHead('관리 · 연구부장·부담당', '관리자', '계정·분류·설정을 관리해요. 바꾼 내용은 모두 수정 기록에 남아요.',
      '<button type="button" class="btn btn-sm print-hide" data-action="admin-out">' + icon('lock', 18) + '관리자 화면 닫기</button>') +
      (S.me ? '' : '<div class="box" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px"><span class="warn-text" style="font-size:15px">본인 확인 전이라 기록에 "관리자(본인 확인 전)"으로 남아요.</span>' +
        '<button type="button" class="btn btn-sm" data-action="identity">본인 확인하기</button></div>') +
      '<div class="tabs print-hide" role="tablist">' + tabs.map(function (t) {
        return '<button type="button" class="tab" role="tab" data-admin-tab="' + t[0] + '" aria-selected="' + (S.adminTab === t[0]) + '">' + t[1] + '</button>';
      }).join('') + '</div><div id="admin-panel" role="tabpanel"></div>';
    var panel = qs('#admin-panel');
    ({ staff: adminStaff, cat: adminCat, settings: adminSettings, year: adminYear, log: adminLog, trash: adminTrash, pw: adminPw }[S.adminTab] || adminStaff)(panel);
  };

  function adminGate($s) {
    $s.innerHTML = pageHead('관리 · 연구부장·부담당', '관리자') +
      '<form class="card" id="admin-form" style="max-width:520px" novalidate><span class="glow" aria-hidden="true"></span>' +
      '<div style="display:flex;align-items:center;gap:12px"><span class="brand-mark">' + icon('shield', 24) + '</span><h2>관리자 비밀번호를 넣어 주세요</h2></div>' +
      '<p class="muted">공통 비밀번호와 다른 비밀번호예요. 연구부장·부담당만 알고 있어요.</p>' +
      '<div class="field"><label class="label" for="admin-pw">관리자 비밀번호</label>' +
      '<div class="pw-wrap"><input id="admin-pw" class="input" type="password" autocomplete="off">' +
      '<button type="button" class="icon-btn" data-action="pw-eye" data-for="admin-pw" aria-label="비밀번호 보이기">' + icon('eye') + '</button></div></div>' +
      '<p class="err" id="admin-err" role="alert"></p>' +
      '<button type="submit" class="btn btn-primary">관리자 화면 열기</button>' +
      '<p class="hint">' + icon('info', 16) + '<span>관리자 화면은 2시간 동안 열려 있고, 이 기기에 기억하지 않아요.</span></p></form>';
    qs('#admin-form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var pw = qs('#admin-pw').value;
      var err = qs('#admin-err');
      if (!pw) { err.textContent = '관리자 비밀번호를 넣어 주세요.'; return; }
      var btn = ev.target.querySelector('[type=submit]');
      busy(btn, true, '확인하는 중');
      server('adminLogin', { password: pw }).then(function (r) {
        stSet('gy.admin', r.admin, false);
        S.admin = true;
        renderApp();
      }).catch(function (e) {
        busy(btn, false);
        err.textContent = e.message;
      });
    });
  }

  function loadingHtml(t) {
    return '<div class="loading"><span class="spin" aria-hidden="true"></span>' + esc(t || '불러오는 중이에요') + '</div>';
  }
  function failHtml(e) {
    return '<div class="card"><p class="err">' + esc(e.message) + '</p></div>';
  }

  // ------------------------------------------------------------ 관리자 · 교직원 표
  function adminStaff(panel) {
    panel.innerHTML = loadingHtml('교직원 표를 불러오는 중이에요');
    server('admin.staff.list').then(function (r) {
      S.cache.staff = r.staff;
      S.cache.depts = r.depts;
      S.cache.pinMode = !!r.pinMode;
      drawStaff(panel);
    }).catch(function (e) { panel.innerHTML = failHtml(e); });
  }

  function drawStaff(panel) {
    var all = S.cache.staff || [];
    var on = all.filter(function (x) { return x['사용 여부'] !== '사용 안 함'; });
    var noPin = on.filter(function (x) { return !x.hasPin; });
    var q = S.staffSearch.trim();
    var shown = all.filter(function (x) {
      if (!S.showOff && x['사용 여부'] === '사용 안 함') return false;
      return !q || [x['이름'], x['직위'], x['소속'], x.deptName, x['담당 업무'], x['내선']].join(' ').indexOf(q) >= 0;
    });
    panel.innerHTML =
      '<div class="wrap" style="gap:16px">' +
      '<div class="counts"><span class="chip chip-ok">사용 ' + on.length + '명</span><span class="chip">사용 안 함 ' + (all.length - on.length) + '명</span>' +
      (!S.cache.pinMode ? '<span class="chip">본인 확인: 이름만</span>' : noPin.length ? '<span class="chip chip-warn">번호 없음 ' + noPin.length + '명</span>' : '<span class="chip">모두 번호 있음</span>') + '</div>' +
      '<div class="toolbar print-hide">' +
      '<label class="search" for="staff-find">' + icon('search', 20) + '<span class="sr-only">교직원 찾기</span>' +
      '<input id="staff-find" type="search" placeholder="이름·소속·업무로 찾기" value="' + esc(S.staffSearch) + '" autocomplete="off"></label>' +
      '<label class="check" style="padding:0 6px"><input type="checkbox" id="staff-off"' + (S.showOff ? ' checked' : '') + '>사용 안 함도 보기</label>' +
      (S.cache.pinMode ? '<button type="button" class="btn btn-sm" data-action="staff-issue"' + (noPin.length ? '' : ' disabled') + '>' + icon('key', 18) + '번호 없는 분 번호 만들기</button>' : '') +
      '<button type="button" class="btn btn-sm btn-primary" data-action="staff-add">' + icon('plus', 18) + '교직원 추가</button></div>' +
      (shown.length
        ? '<div class="rows" role="table" aria-label="교직원 표">' +
          '<div class="srow head" role="row"><span role="columnheader">이름·직위</span><span role="columnheader">소속·부서</span><span role="columnheader">담당 업무</span><span role="columnheader">내선</span><span role="columnheader" style="text-align:right">관리</span></div>' +
          shown.map(staffRow).join('') + '</div>'
        : '<div class="card"><p class="empty">' + (all.length ? '찾는 교직원이 없어요.' : '아직 교직원이 없어요. "교직원 추가"로 넣어 주세요.') + '</p></div>') +
      '<p class="hint">' + icon('info', 16) + '<span>전출·휴직하면 지우지 말고 "사용 안 함"으로 바꿔 주세요. 이름 목록과 알림에서 빠지고, 기록은 그대로 남아요. 개인 연락처는 넣지 않아요(내선만).</span></p>' +
      '</div>';
    var find = qs('#staff-find');
    find.addEventListener('input', function () {
      S.staffSearch = find.value;
      var pos = find.selectionStart;
      drawStaff(panel);
      var f2 = qs('#staff-find'); f2.focus(); try { f2.setSelectionRange(pos, pos); } catch (e) {}
    });
    qs('#staff-off').addEventListener('change', function (e) { S.showOff = e.target.checked; drawStaff(panel); });
  }

  function staffRow(x) {
    var off = x['사용 여부'] === '사용 안 함';
    var chips = [];
    if (x['역할'] === '관리') chips.push('<span class="chip chip-accent">관리</span>');
    var pinMode = !!S.cache.pinMode;
    if (off) chips.push('<span class="chip">사용 안 함</span>');
    else if (pinMode && !x.hasPin) chips.push('<span class="chip chip-warn">번호 없음</span>');
    if (pinMode && x.locked) chips.push('<span class="chip chip-warn">잠김</span>');
    var id = esc(x['교직원ID']);
    return '<div class="srow' + (off ? ' off' : '') + '" role="row">' +
      '<div role="cell"><div class="s-name">' + esc(x['이름']) + '</div><div class="s-sub">' + esc(x['직위'] || '') + '</div>' +
      (chips.length ? '<div class="s-chips">' + chips.join('') + '</div>' : '') + '</div>' +
      '<div role="cell" class="s-col-mid">' + esc(x['소속'] || '') + (x.deptName ? '<div class="s-sub">' + esc(x.deptName) + '</div>' : '') + '</div>' +
      '<div role="cell" class="s-col-job s-sub">' + esc(x['담당 업무'] || '') + '</div>' +
      '<div role="cell" class="s-col-tel">' + esc(x['내선'] || '') + '</div>' +
      '<div role="cell" class="s-btns print-hide">' +
      '<button type="button" class="btn btn-sm" data-action="staff-edit" data-id="' + id + '">고치기</button>' +
      (off || !pinMode ? '' : x.locked
        ? '<button type="button" class="btn btn-sm" data-action="staff-unlock" data-id="' + id + '">잠금 풀기</button>'
        : '<button type="button" class="btn btn-sm" data-action="staff-pin" data-id="' + id + '">' + (x.hasPin ? '번호 새로' : '번호 만들기') + '</button>') +
      '<button type="button" class="btn btn-sm btn-ghost" data-action="staff-active" data-id="' + id + '">' + (off ? '다시 사용' : '사용 안 함') + '</button>' +
      '</div></div>';
  }

  function findStaff(id) {
    return (S.cache.staff || []).filter(function (x) { return x['교직원ID'] === id; })[0];
  }
  function putStaff(row) {
    var list = S.cache.staff || [];
    var i = list.map(function (x) { return x['교직원ID']; }).indexOf(row['교직원ID']);
    if (i >= 0) list[i] = row; else list.push(row);
    S.cache.staff = list;
  }

  function staffForm(x) {
    x = x || {};
    var depts = S.cache.depts || [];
    var deptOpts = '<option value="">(없음)</option>' + depts.filter(function (d) { return d.active || d.id === x['부서ID']; }).map(function (d) {
      return '<option value="' + esc(d.id) + '"' + (d.id === x['부서ID'] ? ' selected' : '') + '>' + esc(d.name) + (d.active ? '' : ' (사용 안 함)') + '</option>';
    }).join('');
    function f(key, label, opts) {
      opts = opts || {};
      return '<div class="field"><label class="label" for="sf-' + key + '">' + label + (opts.req ? ' <span class="req">*</span>' : '') + '</label>' +
        '<input id="sf-' + key + '" class="input" data-k="' + key + '" value="' + esc(x[key] || '') + '"' + (opts.attr || '') + ' placeholder="' + (opts.ph || '') + '"></div>';
    }
    return '<form class="form" id="staff-form" novalidate>' +
      '<div class="form-grid">' + f('이름', '이름', { req: true, attr: ' maxlength="20" autocomplete="off"' }) + f('직위', '직위', { ph: '예: 교사, 수석교사', attr: ' maxlength="20"' }) + '</div>' +
      '<div class="form-grid">' + f('소속', '소속', { ph: '예: 3학년 1반, 과학 전담', attr: ' maxlength="30"' }) +
      '<div class="field"><label class="label" for="sf-부서ID">부서</label><select id="sf-부서ID" class="input" data-k="부서ID">' + deptOpts + '</select></div></div>' +
      f('담당 업무', '담당 업무', { ph: '예: 교육과정, 전문적학습공동체', attr: ' maxlength="200"' }) +
      '<div class="form-grid">' + f('내선', '내선', { ph: '숫자만', attr: ' inputmode="numeric" maxlength="15"' }) + f('순서', '명단 순서', { ph: '숫자가 작을수록 위', attr: ' inputmode="numeric" maxlength="4"' }) + '</div>' +
      '<div class="field"><span class="label">역할</span><div class="seg" role="group" aria-label="역할" style="max-width:320px">' +
      '<button type="button" data-role="일반" aria-pressed="' + (x['역할'] !== '관리') + '">일반</button>' +
      '<button type="button" data-role="관리" aria-pressed="' + (x['역할'] === '관리') + '">관리</button></div>' +
      '<p class="hint">' + icon('info', 16) + '<span>"관리"는 연구부장·부담당 표시예요. 관리자 화면은 관리자 비밀번호로 들어가요.</span></p></div>' +
      (depts.length ? '' : '<p class="hint">' + icon('info', 16) + '<span>부서 목록이 비어 있어요. "분류" 탭에서 부서를 먼저 넣으면 고를 수 있어요.</span></p>') +
      '<p class="err" id="sf-err" role="alert"></p>' +
      '<div class="modal-btns"><button type="button" class="btn" data-action="close-modal">닫기</button>' +
      '<button type="submit" class="btn btn-primary">저장</button></div></form>';
  }

  function openStaffForm(x) {
    openModal('<h2 id="m-title">' + (x ? esc(x['이름']) + ' 선생님 고치기' : '교직원 추가') + '</h2>' + staffForm(x));
    var form = qs('#staff-form');
    qsa('[data-role]', form).forEach(function (b) {
      b.addEventListener('click', function () {
        qsa('[data-role]', form).forEach(function (o) { o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); });
      });
    });
    setTimeout(function () { qs('#sf-이름').focus(); }, 30);
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var fields = {};
      qsa('[data-k]', form).forEach(function (i) { fields[i.getAttribute('data-k')] = i.value; });
      fields['역할'] = qs('[data-role][aria-pressed=true]', form).getAttribute('data-role');
      var err = qs('#sf-err');
      if (!fields['이름'].trim()) { err.textContent = '이름을 적어 주세요.'; return; }
      var btn = form.querySelector('[type=submit]');
      busy(btn, true, '저장하는 중');
      server('admin.staff.save', { id: x ? x['교직원ID'] : '', fields: fields }).then(function (row) {
        putStaff(row);
        closeModal();
        drawStaff(qs('#admin-panel'));
        toast(row['이름'] + ' 선생님을 ' + (x ? '고쳤어요' : '넣었어요') + (row.hasPin ? '' : '. 개인 번호도 만들어 주세요'));
      }).catch(function (e) { busy(btn, false); err.textContent = e.message; });
    });
  }

  function confirmBox(title, body, okText, onOk, danger) {
    openModal('<h2 id="m-title">' + title + '</h2><p class="muted" style="margin:0">' + body + '</p><p class="err" id="cf-err" role="alert"></p>' +
      '<div class="modal-btns"><button type="button" class="btn" data-action="close-modal">그만두기</button>' +
      '<button type="button" class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" id="cf-ok">' + okText + '</button></div>');
    var ok = qs('#cf-ok');
    ok.addEventListener('click', function () {
      busy(ok, true, '하는 중');
      onOk().catch(function (e) { busy(ok, false); qs('#cf-err').textContent = e.message; });
    });
  }

  function staffResetPin(x) {
    confirmBox(esc(x['이름']) + ' 선생님 개인 번호 ' + (x.hasPin ? '새로 만들기' : '만들기'),
      x.hasPin ? '새 번호를 만들면 지금 번호는 더 쓸 수 없고, 이 분의 기기에 기억된 본인 확인도 풀려요.' : '무작위 4자리 번호를 만들어요. 번호는 한 번만 보여 드려요.',
      '번호 만들기', function () {
        return server('admin.staff.resetPin', { id: x['교직원ID'] }).then(function (r) {
          x.hasPin = true; x.locked = false;
          drawStaff(qs('#admin-panel'));
          showPins([r], false);
        });
      });
  }

  function staffIssueMissing() {
    var n = (S.cache.staff || []).filter(function (x) { return x['사용 여부'] !== '사용 안 함' && !x.hasPin; }).length;
    confirmBox('번호 없는 ' + n + '명의 번호 만들기', '사용 중이면서 아직 번호가 없는 분들의 무작위 4자리 번호를 한꺼번에 만들어요. 다음 창에서 한 번만 보여 드리니, 쪽지로 인쇄해 한 분씩 전해 주세요.',
      n + '명 번호 만들기', function () {
        return server('admin.staff.issueMissing').then(function (list) {
          return server('admin.staff.list').then(function (r) {
            S.cache.staff = r.staff;
            drawStaff(qs('#admin-panel'));
            showPins(list, true);
          });
        });
      });
  }

  /** 개인 번호를 한 번만 보여 준다. 창을 닫으면 화면에서도 지운다. */
  function showPins(list, many) {
    S.pinSlips = list;
    var body = list.length === 1 && !many
      ? '<p class="muted" style="margin:0">' + esc(list[0].name) + ' 선생님' + (list[0].group ? ' · ' + esc(list[0].group) : '') + '</p><p class="pin-big" aria-label="개인 번호">' + esc(list[0].pin) + '</p>'
      : list.length
        ? '<div class="pin-list">' + list.map(function (p) { return '<div><span><b style="all:unset;font-weight:800">' + esc(p.name) + '</b> <span class="faint">' + esc(p.group || '') + '</span></span><b>' + esc(p.pin) + '</b></div>'; }).join('') + '</div>'
        : '<p class="muted">번호를 만들 분이 없었어요.</p>';
    openModal('<h2 id="m-title">개인 번호' + (list.length > 1 ? ' ' + list.length + '명' : '') + '</h2>' + body +
      '<p class="hint">' + icon('info', 16) + '<span>이 창을 닫으면 다시 볼 수 없어요. 쪽지로 인쇄하거나 종이에 옮겨 적어 한 분씩 전해 주세요. 메신저나 단체방에는 올리지 마세요.</span></p>' +
      '<div class="modal-btns">' + (list.length ? '<button type="button" class="btn" data-action="print-slips">' + icon('print', 18) + '쪽지로 인쇄</button>' : '') +
      '<button type="button" class="btn btn-primary" data-action="close-pins">확인했어요</button></div>', { noBackdropClose: true });
  }

  function printSlips() {
    var school = S.start ? S.start.school : '';
    var area = qs('#print-area');
    area.innerHTML = '<div class="slips">' + (S.pinSlips || []).map(function (p) {
      return '<div class="slip"><div>' + esc(school) + ' 온라인 교무실 · 개인 번호</div>' +
        '<div style="font-size:18px;font-weight:800;margin-top:4px">' + esc(p.name) + ' 선생님 <span style="font-weight:600;font-size:14px">' + esc(p.group || '') + '</span></div>' +
        '<div class="slip-pin">' + esc(p.pin) + '</div>' +
        '<div>조사에 답하거나 일정을 넣을 때 이름을 고르고 이 번호를 넣어요. 다른 사람에게 보여 주지 마세요. 잊으면 연구부장·부담당에게 다시 받으세요.</div></div>';
    }).join('') + '</div>';
    document.body.classList.add('printing-slips');
    setTimeout(function () {
      window.print();
      setTimeout(function () { document.body.classList.remove('printing-slips'); }, 500);
    }, 50);

      '<p class="faint">자동 백업: ' + (backup ? '켜져 있어요(백업 폴더가 만들어져 있어요).' : '아직 꺼져 있어요. 전용 시트 메뉴 "4. 매일 자동 백업 켜기"로 켜 주세요.') + '</p></section>' +

      '<p class="faint">특별실 시간표·방학 근무·연수 이수 확인처럼 2차에 옮길 일의 바로가기예요. 주소는 https:// 로 시작해야 해요.</p>' +

    }).catch(function (e) { qs('#log-list').innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });

  function logItem(l) {
    var keys = [];
    if (l.before || l.after) {
      var b = l.before || {}, a = l.after || {};
      keys = Object.keys(a).concat(Object.keys(b)).filter(function (k, i, arr) { return arr.indexOf(k) === i; });
    }
    var detail = l.before && l.after && keys.length
      ? '<details><summary>바뀐 내용 ' + keys.length + '칸</summary><div class="diff">' + keys.map(function (k) {
          return '<span class="k">' + esc(k) + '</span><span class="b">' + esc(l.before[k] || '(빈칸)') + '</span><span class="to" aria-label="에서">→</span><span>' + esc(l.after[k] || '(빈칸)') + '</span>';
        }).join('') + '</div></details>'
      : '';
    var tone = l.action === '삭제' || l.action === '잠김' ? 'chip-warn' : l.action === '추가' ? 'chip-ok' : '';
    return '<div class="log-item"><div class="log-top"><span class="log-time">' + esc(l.time) + '</span>' +
      '<span class="chip ' + tone + '">' + esc(l.action) + '</span><span class="chip">' + esc(l.tab) + '</span>' +
      '<span class="faint">' + esc(l.who || '이름 없음') + '</span></div>' +
      '<p class="log-sum">' + esc(l.summary || '') + '</p>' + detail + '</div>';
  }

  // ============================================================ 창(모달)
  var lastFocus = null;
  function openModal(html, opts) {
    opts = opts || {};
    lastFocus = document.activeElement;
    $modal.innerHTML = '<div class="modal-back" id="modal-back"><div class="modal' + (opts.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="m-title">' + html + '</div></div>';
    var back = qs('#modal-back');
    if (!opts.noBackdropClose) back.addEventListener('click', function (e) { if (e.target === back) closeModal(); });
    var first = qs('.modal button, .modal input, .modal select', $modal);
    if (first) setTimeout(function () { first.focus(); }, 30);
  }
  function closeModal() {
    if (!$modal.innerHTML) return;
    if (qs('#modal-form', $modal) && S.sched) S.sched.form = null;
    $modal.innerHTML = '';
    clearPins();
    if (lastFocus && document.body.contains(lastFocus)) { try { lastFocus.focus(); } catch (e) {} }
  }

  // ============================================================ 누르기 처리 (한곳에서)
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go],[data-action],[data-theme-btn],[data-admin-tab],[data-sched-view],[data-home-f],[data-sv-tab]');
    if (!t) return;
    if (t.hasAttribute('data-go')) {
      if (t.getAttribute('data-go') === 'schedule' && S.screen === 'home') S.sched.view = 'cal';
      go(t.getAttribute('data-go'));
      return;
    }
    if (t.hasAttribute('data-sched-view')) { S.sched.view = t.getAttribute('data-sched-view'); S.sched.form = null; renderApp(); return; }
    if (t.hasAttribute('data-home-f')) { S.homeFilter = t.getAttribute('data-home-f'); drawHome(); return; }
    if (t.hasAttribute('data-sv-tab')) { S.survey.tab = t.getAttribute('data-sv-tab'); S.survey.sel = ''; S.survey.showResults = false; drawSurvey(); return; }
    if (t.hasAttribute('data-theme-btn')) { setTheme(t.getAttribute('data-theme-btn')); return; }
    if (t.hasAttribute('data-admin-tab')) { S.adminTab = t.getAttribute('data-admin-tab'); renderApp(); return; }
    var a = t.getAttribute('data-action');
    var id = t.getAttribute('data-id');
    switch (a) {
      case 'theme-toggle':
        setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        if (qs('.app')) renderApp(); else {
          t.innerHTML = icon(root.getAttribute('data-theme') === 'dark' ? 'sun' : 'moon');
          t.setAttribute('aria-label', root.getAttribute('data-theme') === 'dark' ? '밝은 화면으로 바꾸기' : '어두운 화면으로 바꾸기');
        }
        break;
      case 'big': setBig(!root.classList.contains('big')); break;
      case 'reload': location.reload(); break;
      case 'sheet': openSheet(); break;
      case 'close-sheet': closeSheet(); break;
      case 'close-modal': closeModal(); break;
      case 'close-pins': closeModal(); toast('번호 창을 닫았어요'); break;
      case 'print-slips': printSlips(); break;
      case 'pw-eye':
        var inp = qs('#' + t.getAttribute('data-for'));
        var show = inp.type === 'password';
        inp.type = show ? 'text' : 'password';
        t.setAttribute('aria-label', show ? '비밀번호 가리기' : '비밀번호 보이기');
        break;
      case 'identity': closeSheet(); showIdentity(); break;
      case 'switch':
        closeSheet();
        stDel('gy.identity');
        S.me = null;
        showIdentity();
        break;
      case 'skip-identity':
        stSet('gy.skipIdentity', '1', false);
        renderApp();
        break;
      case 'logout':
        closeSheet();
        stDel('gy.login'); stDel('gy.identity'); stDel('gy.admin'); stDel('gy.skipIdentity');
        S.me = null; S.admin = false;
        showLogin();
        toast('나갔어요. 이 기기에 기억된 로그인도 지웠어요');
        break;
      case 'admin-out':
        stDel('gy.admin');
        S.admin = false;
        renderApp();
        break;
      case 'staff-add': openStaffForm(null); break;
      case 'staff-edit': openStaffForm(findStaff(id)); break;
      case 'staff-pin': staffResetPin(findStaff(id)); break;
      case 'staff-issue': staffIssueMissing(); break;
      case 'staff-active': staffToggle(findStaff(id)); break;
      case 'staff-unlock': staffUnlock(findStaff(id)); break;
      case 'cat-save': catSave(id); break;
      case 'cat-add': catAdd(t.getAttribute('data-kind')); break;
      case 'cat-active': catActive(id, t.getAttribute('data-on') === '1'); break;
      case 'ev-open': closeModal(); openEvent(t.getAttribute('data-ev')); break;
      case 'ev-edit': closeModal(); startEventForm({ id: t.getAttribute('data-ev') }); break;
      case 'ev-add':
        var sc = S.sched, today = localToday();
        var d0 = t.getAttribute('data-day') || (S.screen === 'schedule' && isPhone() && !sc.phoneMonth ? sc.day
          : S.screen === 'schedule' && (sc.y !== +today.slice(0, 4) || sc.m !== +today.slice(5, 7)) ? sc.y + '-' + ('0' + sc.m).slice(-2) + '-01' : today);
        closeModal();
        startEventForm({ start: d0 });
        break;
      case 'ev-cancel': cancelEventForm(); break;
      case 'ev-del': deleteEvent(t.getAttribute('data-ev')); break;
      case 'day-open': openDay(t.getAttribute('data-day')); break;
      case 'm-prev': moveMonth(-1); break;
      case 'm-next': moveMonth(1); break;
      case 'm-today':
        var td = localToday();
        S.sched.y = +td.slice(0, 4); S.sched.m = +td.slice(5, 7); S.sched.week = mondayOf(td); S.sched.day = td; S.sched.form = null;
        loadSched();
        break;
      case 'y-prev': S.sched.y--; loadSched(); break;
      case 'y-next': S.sched.y++; loadSched(); break;
      case 'w-prev': moveWeek(-1); break;
      case 'w-next': moveWeek(1); break;
      case 'pick-day': S.sched.day = t.getAttribute('data-day'); drawCal(); break;
      case 'phone-month': S.sched.phoneMonth = true; drawCal(); break;
      case 'phone-week': S.sched.phoneMonth = false; drawCal(); break;
      case 'print': window.print(); break;
      case 'focus-edit': editFocus(); break;
      case 'sv-open': S.survey.sel = id; S.survey.showResults = false; drawSurvey(); if (isPhone()) window.scrollTo(0, 0); break;
      case 'sv-back': S.survey.sel = ''; drawSurvey(); break;
      case 'sv-new': openSurveyForm(null); break;
      case 'sv-edit': openSurveyForm(S.survey.detail); break;
      case 'sv-csv': surveyCsv(); break;
      case 'sv-results': S.survey.showResults = !S.survey.showResults; drawSurveyDetail(); break;
      case 'sv-as-owner': S.survey.tab = 'mine'; drawSurvey(); break;
      case 'sv-copy':
        copyText(S.survey.detail.messenger).then(function (ok) { toast(ok ? '안내 문구를 복사했어요. 메신저에 붙여 넣으세요' : '복사하지 못했어요. 글을 길게 눌러 복사해 주세요'); });
        break;
      case 'sv-close':
        var reopen = t.getAttribute('data-open') === '1';
        confirmBox(reopen ? '조사 다시 열기' : '조사 지금 끝내기', reopen ? '다시 열면 마감 전까지 다시 낼 수 있어요.' : '끝내면 더 이상 내거나 고칠 수 없어요. 나중에 다시 열 수 있어요.', reopen ? '다시 열기' : '끝내기', function () {
          return server('survey.setOpen', { id: S.survey.sel, open: reopen }).then(function () {
            closeModal(); toast(reopen ? '조사를 다시 열었어요' : '조사를 끝냈어요');
            if (!reopen) S.survey.tab = 'past';
            refreshSurveyList();
          });
        });
        break;
      case 'sv-del':
        confirmBox('조사 지우기', '"' + esc(S.survey.detail.card.title) + '" 조사를 지울까요? 낸 답도 함께 숨겨져요. 연구부장·부담당이 휴지통에서 되살릴 수 있어요.', '지우기', function () {
          return server('survey.delete', { id: S.survey.sel }).then(function () { closeModal(); toast('조사를 지웠어요'); S.survey.sel = ''; refreshSurveyList(); });
        }, true);
        break;
      case 'sv-remind':
        var nd = (S.survey.detail.notDone || []).length;
        confirmBox('안 낸 분께 다시 알리기', '안 낸 ' + nd + '명의 홈 화면 \'내가 할 일\' 맨 위에 이 조사가 다시 보여요. 메신저로도 알리려면 위의 안내 문구를 복사해 보내 주세요.', nd + '명에게 알리기', function () {
          return server('survey.remind', { id: S.survey.sel }).then(function (r) { closeModal(); toast(r.count + '명에게 다시 알렸어요'); loadSurveyDetail(); });
        });
        break;
      case 'todo-open': S.survey.tab = 'answer'; S.survey.sel = id; go('survey'); break;
      case 'trash-restore': trashRestore(id); break;
      case 'trash-restore-sv':
        server('admin.trash.restoreSurvey', { id: id }).then(function () { toast('조사를 되살렸어요'); S.survey.list = null; adminTrash(qs('#admin-panel')); }).catch(function (e2) { toast(e2.message); });
        break;
      case 'trash-restore-lib':
        server('admin.trash.restoreLibrary', { tab: t.getAttribute('data-tab'), id: id }).then(function () {
          toast('되살렸어요'); S.lib.data = null; S.help.data = null; adminTrash(qs('#admin-panel'));
        }).catch(function (e2) { toast(e2.message); });
        break;
      case 'intro-off': stSet('gy.intro', 'off', true); var ib = t.closest('.intro'); if (ib) ib.parentNode.removeChild(ib); break;
      case 'search-clear': var hq = qs('#home-q'); if (hq) hq.value = ''; runSearch(''); if (hq) hq.focus(); break;
      case 'sr-more': searchGo(t.getAttribute('data-k')); break;
      case 'sr-lib':
        if (S.screen === 'library' && S.lib.data) { openLib(id); break; }
        var li = libById(id);
        S.lib.openId = id; S.lib.q = ''; S.lib.dept = ''; S.lib.kind = '';
        S.lib.view = li && li.archived ? 'archive' : 'now'; S.lib.year = li ? li.year : '';
        go('library');
        break;
      case 'sr-staff': S.dir.q = id; S.dir.dept = ''; go('staff'); break;
      case 'sr-help': S.help.q = ''; S.help.kind = ''; S.help.openId = id; go('help'); break;
      case 'sr-sv':
        var sc2 = (S.search && S.search.surveys.items || []).filter(function (c) { return c.id === id; })[0] || {};
        S.survey.tab = !sc2.closed && sc2.inTarget ? 'answer' : !sc2.closed && sc2.canEdit ? 'mine' : 'past';
        S.survey.sel = id; S.survey.list = null;
        go('survey');
        break;
      case 'file-dl': downloadFile(t.getAttribute('data-tab'), id, t); break;
      case 'lib-new': openLibForm(null); break;
      case 'lib-open': openLib(id); break;
      case 'lib-edit': closeModal(); openLibForm(libById(id)); break;
      case 'lib-view': S.lib.view = t.getAttribute('data-v'); drawLib(); break;
      case 'lib-year': S.lib.year = t.getAttribute('data-y'); drawLib(); break;
      case 'lib-del':
        var ld = libById(id);
        confirmBox('자료 지우기', '"' + esc(ld.title) + '" 자료를 지울까요? 연구부장·부담당이 휴지통에서 되살릴 수 있어요.', '지우기', function () {
          return server('lib.delete', { id: id }).then(function () {
            S.lib.data.items = S.lib.data.items.filter(function (x) { return x.id !== id; });
            S.home = null;
            closeModal(); drawLibList(); toast('자료를 지웠어요');
          });
        }, true);
        break;
      case 'lib-unarchive':
        var lu = libById(id);
        confirmBox('지금 학년도로 꺼내기', '"' + esc(lu.title) + '" 자료를 ' + esc(S.lib.data.year) + '학년도 자료실에 다시 넣어요. 보관함의 지난 자료도 그대로 남아요.', '꺼내기', function () {
          return server('lib.unarchive', { id: id }).then(function (row) {
            putLib(row); closeModal(); S.lib.view = 'now'; drawLib(); toast('지금 학년도로 꺼냈어요');
          });
        });
        break;
      case 'up-template': saveBlob(templateXlsx(S.up.year), (S.up.year || '') + '학년도_학사일정_양식.xlsx'); toast('양식을 내려받았어요'); break;
      case 'up-input': S.up.input = t.getAttribute('data-v'); S.up.pasteGrid = null; drawUpload(); break;
      case 'up-read-paste':
        var ptxt = qs('#up-paste').value;
        upErr('');
        if (!ptxt.trim() && !S.up.pasteGrid) { upErr('표를 복사해 붙여 넣어 주세요.'); break; }
        S.up.res = null;
        uploadCheck({ grid: S.up.pasteGrid || parseDelimited(ptxt) });
        break;
      case 'up-filter': S.up.filter = t.getAttribute('data-v'); S.up.more = false; drawUploadPreview(); break;
      case 'up-more': S.up.more = true; drawUploadPreview(); break;
      case 'up-mode': S.up.mode = t.getAttribute('data-v'); uploadCheck({ rows: uploadRaws() }); break;
      case 'up-edit': upEditRow(Number(t.getAttribute('data-n'))); break;
      case 'up-save': uploadSave(t); break;
      case 'up-undo': uploadUndo(); break;
      case 'up-again': S.up.done = null; S.up.res = null; drawUpload(); break;
      case 'notice-new':
        if (S.screen === 'notice' && S.notice.data) openNoticeForm(null);
        else if (needMe('공지를 쓰면')) { S.notice.openNew = true; go('notice'); }
        break;
      case 'notice-open': openNotice(id); break;
      case 'notice-view': S.notice.view = t.getAttribute('data-v'); drawNotices(); break;
      case 'notice-edit': openNoticeForm(noticeById(id)); break;
      case 'notice-del':
        var nd2 = noticeById(id);
        confirmBox('공지 지우기', '"' + esc(nd2.title) + '" 공지를 지울까요? 연구부장·부담당이 휴지통에서 되살릴 수 있어요.', '지우기', function () {
          return server('notice.delete', { id: id }).then(function () { closeModal(); S.home = null; toast('공지를 지웠어요'); return loadNotices(); });
        }, true);
        break;
      case 'help-new': openHelpForm(null); break;
      case 'help-edit': openHelpForm(helpById(id)); break;
      case 'help-kind': S.help.kind = id || ''; drawHelp(); break;
      case 'help-del':
        var hd = helpById(id);
        confirmBox('도움말 지우기', '"' + esc(hd.title) + '" 글을 지울까요? 연구부장·부담당이 휴지통에서 되살릴 수 있어요.', '지우기', function () {
          return server('help.delete', { id: id }).then(function () {
            S.help.data.items = S.help.data.items.filter(function (x) { return x.id !== id; });
            closeModal(); drawHelpList(); toast('도움말을 지웠어요');
          });
        }, true);
        break;
      case 'ny-all':
        var on = t.getAttribute('data-on') === '1';
        qsa('.ny-item input').forEach(function (x) { x.checked = on; });
        var nc = qs('#ny-count'); if (nc) nc.textContent = (on ? qsa('.ny-item input').length : 0) + '/' + qsa('.ny-item input').length;
        break;
      case 'link-add': readLinks(); S.cache.links.push({ name: '', url: '' }); drawLinks(); break;
      case 'link-del': readLinks(); S.cache.links.splice(Number(t.getAttribute('data-i')), 1); drawLinks(); break;
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (qs('#sheet')) closeSheet();
    else if ($modal.innerHTML && !qs('[data-action="close-pins"]')) closeModal();
  });

  document.addEventListener('change', function (e) {
    var f = e.target.getAttribute && e.target.getAttribute('data-filter');
    if (!f) return;
    S.sched.filter[f] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    drawCal();
  });

  // 화면 폭이 바뀌어 휴대폰/PC 모양이 달라지면 일정 화면을 다시 그린다
  var lastShape = isPhone() + '/' + isWide();
  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var shape = isPhone() + '/' + isWide();
      if (shape === lastShape) return;
      lastShape = shape;
      if (S.screen === 'schedule' && qs('.app')) renderApp();
    }, 200);
  });

  // 인쇄할 때는 접힌 도움말도 모두 펼친다
  window.addEventListener('beforeprint', function () { qsa('.help-item').forEach(function (d) { d.open = true; }); });

  window.addEventListener('hashchange', function () {
    var h = (location.hash || '').replace('#', '');
    if (menuItem(h) && h !== S.screen && qs('.app')) go(h);
  });

  // 미리보기·자동 점검에서 쓰는 창구
  window.__gy = { S: S, go: go, renderApp: renderApp, server: server };

  init();
})();
</script>

</body>
</html>
