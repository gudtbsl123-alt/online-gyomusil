    if (steps) steps.innerHTML = [first, '열 정하기', '만들기'].map(function (s, k) { return '<li' + (k === (M.g ? 1 : 0) ? ' class="on"' : '') + '>' + (k + 1) + ' ' + s + '</li>'; }).join('');
    var off = M.header ? 1 : 0;
    var styled = M.g && ((M.g.colors || []).some(function (line) { return line.some(Boolean); }) || (M.g.merges || []).length || (M.g.fmts || []).some(function (line) { return line.some(Boolean); }));
    if (msg) msg.textContent = !M.g ? '' : M.blank ? '' : body.length + '줄 · ' + M.cols.length + '열을 가져왔어요' + (styled ? '(글꼴·색·테두리·합친 칸·열 너비 그대로)' : '');
    if (!M.g) { if (!(M.how === 'tpl' && M.tplSel)) prev.innerHTML = ''; auto.innerHTML = ''; return; }
    var show = body.slice(0, 6), occ = {};
    tbMakeMerges(M).forEach(function (m) {
      if (m.r >= show.length) return;
      var rs = Math.min(m.rs, show.length - m.r);
      occ[m.r + ':' + m.k] = { rs: rs, cs: m.cs };
      for (var a = m.r; a < m.r + rs; a++) for (var b = m.k; b < m.k + m.cs; b++) if (a !== m.r || b !== m.k) occ[a + ':' + b] = { a: 1 };
    });
    var copyMode = M.mode === 'sheet' && M.how === 'copy';
    var head = M.cols.map(function (c, k) {
      return '<th style="min-width:' + Math.min(260, Math.max(130, 36 + c.name.length * 15)) + 'px"><input class="tb-cn" data-k="' + k + '" value="' + esc(c.name) + '" maxlength="40" aria-label="' + (k + 1) + '번째 열 이름">' +
        '<span class="tb-colset">' +
        '<button type="button" class="tb-chip' + (c.lock ? ' on' : '') + '" data-mk="lock" data-k="' + k + '" aria-pressed="' + c.lock + '">' + icon('lock', 12) + '잠금</button>' +
        '<button type="button" class="tb-chip' + (c.type === 'pick' ? ' on' : '') + '" data-mk="type" data-k="' + k + '" title="누르면 글 ↔ 고르기">' + (c.type === 'pick' ? '고르기' : '글') + '</button>' +
        (c.type === 'pick' ? '<button type="button" class="tb-chip" data-mk="opts" data-k="' + k + '" title="고를 값 고치기">' + esc(c.options.join('·')) + '</button>' : '') +
        (M.cols.length > 1 && !copyMode ? '<button type="button" class="tb-chip x" data-mk="del" data-k="' + k + '" aria-label="' + esc(c.name) + ' 열 빼기">' + icon('x', 12) + '</button>' : '') +
        '</span></th>';
    }).join('') + (copyMode ? '' : '<th class="tb-addcol"><button type="button" class="tb-chip" data-mk="add" aria-label="열 더하기">' + icon('plus', 12) + '열</button></th>');
    var rowsHtml = show.map(function (line, i) {
      return '<tr>' + M.cols.map(function (c, k) {
        var o = occ[i + ':' + k];
        if (o && o.a) return '';
        var v = c.src >= 0 ? line[c.src] || '' : '', p = c.src >= 0 ? tbPaint((M.g.colors[i + off] || [])[c.src]) : null;
        var f = c.src >= 0 ? ((M.g.fmts || [])[i + off] || [])[c.src] : null, st = (p ? '--bg:' + p.rgb + ';' : '') + tbFmtStyle(f, dark);
        return '<td' + (o ? (o.rs > 1 ? ' rowspan="' + o.rs + '"' : '') + (o.cs > 1 ? ' colspan="' + o.cs + '"' : '') : '') +
          ' class="' + (p ? 'paint' + (p.dark ? ' paint-dark' : '') : '') + (o ? ' mg' : '') + '"' + (st ? ' style="' + st + '"' : '') + '>' + esc(v).replace(/\n/g, '<br>') + '</td>';
      }).join('') + (copyMode ? '' : '<td></td>') + '</tr>';
    }).join('');
    var filled = body.filter(function (line) { return line.some(function (v) { return String(v || '').trim(); }); }).length;
    prev.innerHTML = (copyMode ? '<p class="faint" style="margin:0">지금 시트의 열 ' + M.cols.length + '개(이름·종류·잠금·너비)로 빈 시트를 만들어요.</p>'
      : M.how === 'tpl' && M.tpl ? '<p class="faint tb-tplsel" style="margin:0"><b>「' + esc(M.tpl.name) + '」</b> 양식 · 열 ' + M.cols.length + '개 · ' +
        (filled ? '줄 ' + body.length + '개' : '빈 줄 ' + body.length + '개') + (styled ? '(서식·합친 칸 그대로)' : '') + '. 만들기 전에 열 이름·종류·잠금을 바꿀 수 있어요.</p>'
      : '<label class="check tb-headchk"><input type="checkbox" id="tbm-header"' + (M.header ? ' checked' : '') + (M.blank ? ' disabled' : '') + '>첫 줄은 열 이름이에요</label>') +
      '<div class="tb-prev"><table class="tb-prevt"><thead><tr>' + head + '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div>' +
      (body.length > show.length ? '<p class="faint" style="margin:0">…그리고 ' + (body.length - show.length) + '줄 더 있어요</p>' : '') +
      (body.length > 500 ? '<p class="err" style="margin:0">줄은 500개까지 넣을 수 있어요(지금 ' + body.length + '줄). 나눠서 만들어 주세요.</p>' : '') +
      (M.cols.length > 30 ? '<p class="err" style="margin:0">열은 30개까지예요(지금 ' + M.cols.length + '열). 필요 없는 열을 빼 주세요.</p>' : '');
    auto.innerHTML = M.cols.filter(function (c) { return c.auto && c.type === 'pick'; }).slice(0, 3).map(function (c) {
      var q = c.options.map(function (o) { return "'" + o + "'"; }), list;
      if (q.length === 1) list = q[0];
      else list = q.slice(0, -1).join(', ') + josa(c.options[c.options.length - 2], '과', '와') + ' ' + q[q.length - 1];
      return '<div class="tb-suggest">' + icon('info', 18) + '<div>\'' + esc(c.name) + '\' 열에는 ' + esc(list) + '만 있어서 <b>고르기 열</b>로 바꿨어요. 표 위에 ' + esc(c.options.join('·')) + ' 수가 보여요.' +
        '<button type="button" class="linkish" data-mk="untext" data-k="' + M.cols.indexOf(c) + '">글 열로 되돌리기</button></div></div>';
    }).join('');
  }

  function tbMakeClick(e) {
    var b = e.target.closest('[data-mk]'), M = S.table.make;
    if (!b || !M) return;
    var m = b.getAttribute('data-mk'), k = +b.getAttribute('data-k'), c = M.cols[k];
    if (m === 'add') {
      if (M.cols.length >= 30) return;
      M.cols.push({ id: 'c' + (M.nextId++), src: -1, name: '열 ' + (M.cols.length + 1), type: 'text', options: [], lock: false, merge: false, w: 0 });
    } else if (!c) return;
    else if (m === 'lock') c.lock = !c.lock;
    else if (m === 'del') { if (M.cols.length > 1) M.cols.splice(k, 1); }
    else if (m === 'untext') { c.type = 'text'; c.auto = false; }
    else if (m === 'type') {
      c.auto = false;
      if (c.type === 'pick') c.type = 'text';
      else {
        c.type = 'pick';
        if (!c.options.length) c.options = (c.src >= 0 ? tbOptsFrom(tbMakeBody(M).map(function (line) { return line[c.src]; })) : null) || ['완료', '미완료'];
      }
    } else if (m === 'opts') {
      var inp = document.createElement('input');
      inp.className = 'tb-optin';
      inp.setAttribute('data-k', String(k));
      inp.setAttribute('aria-label', '고를 값(쉼표로 나눠 적기)');
      inp.value = c.options.join(', ');
      b.parentNode.replaceChild(inp, b);
      inp.focus();
      inp.select();
      return;

    tbMakeDraw();
  }

  function tbMakeGo(btn) {
    var T = S.table, M = T.make, err = qs('#tbm-err'), sheet = M && M.mode === 'sheet';
    if (!M) return;
    var title = sheet ? '' : qs('#tbm-title').value.trim(), sname = (qs('#tbm-sheet') || {}).value || '';
    if (!sheet && !title) { err.textContent = '표 이름을 적어 주세요.'; qs('#tbm-title').focus(); return; }
    if (sheet && !sname.trim()) { err.textContent = '시트 이름을 적어 주세요.'; qs('#tbm-sheet').focus(); return; }
    if (!M.g) { err.textContent = M.how === 'tpl' ? '쓸 양식을 골라 주세요.' : sheet ? '구글 시트에서 칸을 복사해 붙여 넣거나, "빈 시트"를 골라 주세요.' : '구글 시트에서 칸을 복사해 붙여 넣거나, "빈 표"를 골라 주세요.'; return; }
    qsa('.tb-cn', qs('#tbm-prev')).forEach(function (inp) { var c = M.cols[+inp.getAttribute('data-k')]; if (c) c.name = inp.value; });
    var body = M.how === 'copy' && sheet ? [] : tbMakeBody(M), off = M.header ? 1 : 0;
    if (body.length > 500) { err.textContent = '줄은 500개까지 넣을 수 있어요(지금 ' + body.length + '줄). 나눠서 만들어 주세요.'; return; }
    if (M.cols.length > 30) { err.textContent = '열은 30개까지예요. 필요 없는 열을 빼 주세요.'; return; }
    var cols = M.cols.map(function (c) { return { id: c.id, name: c.name.trim(), type: c.type, options: c.options, lock: c.lock, merge: c.merge, w: c.w }; });
    var rows = body.map(function (line, i) {
      var cells = {}, colors = {}, fmt = {};
      M.cols.forEach(function (c) {
        if (c.src < 0) return;
        var v = String(line[c.src] || '');
        if (v.trim()) cells[c.id] = v;
        var bg = (M.g.colors[i + off] || [])[c.src];
        if (bg) colors[c.id] = bg;
        var f = ((M.g.fmts || [])[i + off] || [])[c.src];
        if (f) fmt[c.id] = f;
      });
      return { cells: cells, colors: colors, fmt: fmt, ms: {}, h: (M.g.heights || [])[i + off] || 0 };
    });
    tbMakeMerges(M).forEach(function (m) { if (rows[m.r]) rows[m.r].ms[M.cols[m.k].id] = [Math.min(m.rs, rows.length - m.r), m.cs]; });
    err.textContent = '';

      var doc = T.sel, view = M.how === 'copy' ? T.d.table.view : M.how === 'tpl' && M.view ? M.view : { fr: 0, gap: 'n' };
      server('table.sheet.add', { id: doc, name: sname.trim(), desc: (qs('#tbm-desc') || {}).value || '', cols: cols, rows: rows, view: view, tpl: M.tpl ? M.tpl.name : '' }).then(function (r) {
        closeModal();
        toast('시트를 더했어요');

      return;
    }
    server('table.create', { fields: { title: title, sheet: sname.trim(), deptId: qs('#tbm-dept').value, deadline: qs('#tbm-deadline').value, desc: '' }, cols: cols, rows: rows,
      view: M.how === 'tpl' && M.view ? M.view : undefined, tpl: M.tpl ? M.tpl.name : '' }, [['table.list', {}]]).then(function (r) {

    }, function (e) { busy(btn, false); err.textContent = e.message; });
  }

  // ------------------------------------------------------------ 누르기·키·창 크기(이 화면 것만, App.html은 손대지 않는다)
  /** 같은 단추를 다시 누르면 메뉴를 닫는다 */

  }
  function tbAction(a, t) {
    var T = S.table, id = t.getAttribute('data-id');
    switch (a) {
      case 'tb-new': tbNew('doc'); break;
      case 'tb-open': T.sel = id; T.sheet = T.last[id] || ''; T.d = null; T.find = null; SCREENS.table(qs('#screen')); window.scrollTo(0, 0); break;
      case 'tb-back': tbBackToList(); break;
      case 'tb-resend': tbResend(); break;
      case 'tb-copy': tbCopyAll(); break;
      case 'tb-csv': tbCsv(); break;
      case 'tb-menu': tbToggleMenu(t, function () { tbTableMenu(t); }); break;
      case 'tb-row-add': tbRowAdd(''); break;
      case 'tb-rowmenu': tbToggleMenu(t, function () { tbRowMenu(t, t.getAttribute('data-row')); }); break;
      case 'tb-rowedit': tbRowEditor(t.getAttribute('data-row')); break;
      case 'tb-view': T.phoneGrid = t.getAttribute('data-v') === 'grid'; tbDrawMain(); break;
      case 'tb-tool': tbToggleMenu(t, function () { tbTool(t.getAttribute('data-k'), t); }); break;
      case 'tb-head': tbToggleMenu(t, function () { tbHeadMenu(t, +t.getAttribute('data-j')); }); break;
      case 'tb-selall': tbSelectAll(); tbFocusEd(); break;
      case 'tb-local-clear': tbLocalClear(); break;
      case 'tb-fprev': tbFindGo(-1); break;
      case 'tb-fnext': tbFindGo(1); break;
      case 'tb-frep': tbFindReplace(false); break;
      case 'tb-frepall': tbFindReplace(true); break;
      case 'tb-fclose': tbFindClose(); break;
      case 'tb-sheet': tbSwitchSheet(id); break;
      case 'tb-sheet-menu': tbToggleMenu(t, function () { tbSheetMenu(t); }); break;
      case 'tb-sheet-add': tbNew('sheet'); break;
      case 'tb-sheet-list': tbToggleMenu(t, function () { tbSheetList(t); }); break;
    }
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action],[data-tb-tab]');
    if (!t) return;
    if (t.hasAttribute('data-tb-tab')) { S.table.tab = t.getAttribute('data-tb-tab'); tbDrawList(); return; }
    var a = t.getAttribute('data-action') || '';
    if (a.indexOf('tb-') === 0) tbAction(a, t, e);
  });
  // 끌어서 여러 칸 고르기·열 너비·줄 높이, 떠 있는 메뉴 닫기
  document.addEventListener('mouseup', function () { if (tbRs) tbResizeEnd(); if (S.table.drag) tbUp(); });
  document.addEventListener('mousemove', function (e) { if (tbRs) tbResizeMove(e); });
  document.addEventListener('mousedown', function (e) {
    var m = S.table.menu;
    if (m && !m.el.contains(e.target) && !(m.anchor && m.anchor.contains(e.target))) tbCloseMenu();
  }, true);
  // 활성 시트 탭: 두 번 누르면 이름 고치기(만든 분·관리), 오른쪽 단추(길게 누르기)는 시트 메뉴(이름을 고른 분, 다른 분은 '양식으로 저장'만)
  document.addEventListener('dblclick', function (e) {

  });
  document.addEventListener('contextmenu', function (e) {
    var tab = e.target.closest('.tb-tab');

    e.preventDefault();
    if (tab.getAttribute('aria-selected') === 'true') tbSheetMenu(tab);
  });
  // 표 화면에서는 Ctrl+F가 이 표의 찾기(구글 시트처럼)
  document.addEventListener('keydown', function (e) {
    var T = S.table, mod = e.ctrlKey || e.metaKey, k = String(e.key).toLowerCase();
    if (!mod || (k !== 'f' && k !== 'h') || S.screen !== 'table' || !T.d || !qs('#tb-wrap') || isPhone() || $modal.innerHTML) return;
    if (e.target && e.target.id === 'tb-ed') return; // 편집 칸은 tbKey가 맡는다

function routeTabs_(action, args, then) {
  var out = BASE_TABS_.slice();
  var add = function (name, a) {
    if (name === 'boot') { add('start'); add('session'); if (a && a.home) add('home'); return; }
    if (name === 'batch') {
      (a && Array.isArray(a.reads) ? a.reads : []).slice(0, 8).forEach(function (x) { if (Array.isArray(x)) add(String(x[0])); });

    (ROUTE_TABS_[name] || []).forEach(function (t) { if (out.indexOf(t) < 0) out.push(t); });

function preloadTabs_(tabs) {

/**
 * req.then = [[읽기 이름, args], …] (max개까지, 기본 3) → [{ data } 또는 null, …]. 하나가 안 되면 그것만 null(화면이 따로 다시 부른다)

function thenReads_(list, actor, ctx, max) {
  if (!Array.isArray(list)) return undefined;
  var routes = routes_();
  return list.slice(0, max || 3).map(function (x) {
    try {
      if (!ctx || ctx.login !== true) return null;
      var name = Array.isArray(x) ? String(x[0]) : '';
      var r = THEN_READS_[name] ? routes[name] : null;
      if (!r || r.need !== 'login') return null;
      var f = typeof r.fn === 'string' ? globalFn_(r.fn) : r.fn;
      return f ? { data: f(x[1] || {}, actor, ctx) } : null;

}

/**
 * 화면에서 부르는 하나뿐인 창구. 주고받는 값은 JSON 글자다.

function api(reqText) {

    var route = routes_()[req.action];
    if (!route) throw userError_('알 수 없는 요청이에요. 화면을 새로 고쳐 주세요.');
    var fn = typeof route.fn === 'string' ? globalFn_(route.fn) : route.fn;
    if (!fn) {
      throw userError_('이 기능의 코드 파일이 빠졌거나 예전 것이에요(' + route.fn + '). 연구부장·부담당이 관리자 › 점검에서 확인해 주세요.', 'MISSING');
    }

    var a = req.action;

    return JSON.stringify({ ok: false, error: '잠시 문제가 생겼어요. 잠깐 뒤에 다시 해 주세요. 계속 안 되면 연구부장·부담당에게 알려 주세요.', code: 'ERROR', detail: detail.slice(0, 300) });
  }
}

/**
 * 이름으로 함수 찾기(없으면 null). 이름은 코드에 적힌 글자만 쓰고(화면에서 받은 글자는 쓰지 않음),
 * 영문·숫자·_ 만 허락한다. 미리보기(한 함수 안에 묶어 돌림)와 Apps Script 모두에서 찾을 수 있게 eval로 찾는다.
 */
function globalFn_(name) {
  if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(String(name))) return null;
  try {
    var f = eval(name);
    return typeof f === 'function' ? f : null;
  } catch (e) {
    return null;
  }
}

function apiStart_() {

  return {

}

/** 미리 받기: 화면이 뒤에서 자주 여는 화면들을 한 번에 받아 둔다. args.reads = [[읽기 이름, args], …] (8개까지, 이어 읽기와 같은 읽기만) */
function apiBatch_(args, actor, ctx) {
  return thenReads_(args.reads, actor, ctx, 8) || [];
}

/** 처음 열기(로그인이 기억된 기기): 시작 정보·로그인 상태·홈을 한 번에. 홈은 화면이 곧바로 홈을 그릴 때만(args.home) */
function apiBoot_(args, actor, ctx) {
  var start = apiStart_();
  if (!start.ready) return { start: start };
  var out = { start: start, session: apiSession_(args, actor, ctx) };
  if (args.home) {
    var home = globalFn_('apiHome_');
    if (home) out.home = home({}, actor, ctx);
  }
  return out;
}

/**
 * 다른 파일의 함수를 부를 때, 그 파일이 빠졌어도 화면 전체가 멈추지 않게 대신 값을 돌려준다
 * (빠진 파일은 관리자 › 점검에 '문제'로 보인다)
 */
function optional_(name, fallback) {

}

var DB_SS_ = null; // 한 번 실행하는 동안만 쓰는 캐시

/** 속도 재기(관리자 › 점검): 한 요청 안에서 시트 열기·시트 읽기·서버 기억 읽기에 걸린 시간 */
var PERF_ = newPerf_();
function newPerf_() { return { openMs: 0, reads: 0, readMs: 0, hits: 0, memoMs: 0, memoCalls: 0 }; }

function ss_() {
  if (DB_SS_) return DB_SS_;
  var t0 = Date.now();

}

  return DB_SS_;
}

// ---------------------------------------------------------------- 한 요청 안에서 다시 읽지 않기(속도)
// 탭마다 값을 한 번만 읽어 두고(글자로), 그 탭에 쓰면 버린다. 잠금에 들어갈 때도 모두 버려
// 잠금 안에서는 늘 최신 값을 읽는다(다른 분이 그사이 저장했어도 꼬이지 않게).
var DB_CACHE_ = {};
var DB_SHEETS_ = {};

function dbReset_() {
  DB_CACHE_ = {};
  DB_SHEETS_ = {};
  MEMO_EP_ = null;
  MEMO_PRE_ = {};
}

/**
 * 탭에 쓴 뒤 부른다(tab을 비우면 이 요청에서 읽어 둔 값을 모두 버림). 쓴 탭은 잠금을 풀기 전에 서버 기억의 판을 바꾼다.
 * 서버 기억에서 미리 꺼내 둔 것(MEMO_PRE_)도 함께 버린다(쓰기 전 판이라서)
 */
function dirty_(tab) {
  if (!tab) { DB_CACHE_ = {}; MEMO_PRE_ = {}; return; }
  delete DB_CACHE_[tab];
  delete MEMO_PRE_[tab];
  if (DB_LOCK_DEPTH_ > 0) DB_WRITTEN_[tab] = true;
  else memoBump_([tab]); // 잠금 밖에서 쓴 경우
}

/** 탭 값(글자 2차원 배열). 서버 기억에 있으면 시트를 열지 않는다. 잠금 안(쓰기)에서는 늘 시트에서 */
function sheetValues_(tab) {
  if (DB_CACHE_[tab]) return DB_CACHE_[tab];
  var t0 = Date.now();
  var look = DB_LOCK_DEPTH_ > 0 || MEMO_BYPASS_ ? null : memoLookup_(tab);
  var t1 = Date.now();
  PERF_.memoMs += t1 - t0;
  if (look && look.vals) {
    PERF_.hits++;
    DB_CACHE_[tab] = look.vals;
    return look.vals;
  }
  var vals = sheet_(tab).getDataRange().getValues().map(function (row) { return row.map(cellText_); });
  PERF_.reads++;
  PERF_.readMs += Date.now() - t1;
  DB_CACHE_[tab] = vals;
  if (look) {
    var t2 = Date.now();
    memoStore_(tab, vals, look);
    PERF_.memoMs += Date.now() - t2;
  }
  return vals;
}

// ---------------------------------------------------------------- 서버 기억(속도)
// 탭 내용을 구글 서버의 임시 기억(CacheService)에 글자로 넣어 두고, 시트를 열지 않고 읽는다.
// - 웹앱으로 쓰면(잠금 안 + dirty_) 잠금을 풀기 전에 시트에 확정(flush)하고 그 탭의 판을 바꿔 옛 기억을 버린다
// - 잠금 안(쓰기)에서는 기억을 쓰지 않고 시트에서 바로 읽는다(쓰기는 늘 최신 값으로)
// - 시트를 손으로 고치면 onEdit(Setup.gs)가 그 탭의 판을 바꾼다
// - 줄 지우기·정렬처럼 onEdit가 오지 않는 바꿈: 화면이 뒤에서 보내는 요청(req.bg: 미리 받기·뒤에서 새로 받기)은
//   담은 지 10분(MEMO_FRESH_)이 넘은 기억을 쓰지 않고 시트에서 다시 읽어 담는다. 기다리는 요청은 기억을 그대로 쓴다(빠르게)
// - 관리자 › 점검 '시트 새로 읽기'로 언제든 모두 버린다
var MEMO_TTL_ = 21600;      // 탭 내용 기억 시간(초, 최대 6시간). 판이 맞을 때만 쓰므로 웹앱으로 바꾼 것은 곧바로 보인다
var MEMO_FRESH_ = 600;      // 뒤에서 보내는 요청이 시트와 다시 맞추는 나이(초)
var MEMO_RECHECK_ = false;  // 이번 요청이 뒤에서 보내는 요청인지(api가 req.bg로 정한다)
var MEMO_KEEP_ = 21600;     // 판 표시 기억 시간(초, 최대 6시간)
var MEMO_CHUNK_ = 30000;    // 한 칸에 넣는 글자 수(한 칸 100KB 한도, 한글은 3바이트)
var MEMO_MAX_CHUNKS_ = 20;  // 이보다 큰 탭은 기억하지 않는다
var MEMO_ZIP_MIN_ = 100000; // 이보다 긴 탭은 줄여서(gzip) 담는다. 응답 탭처럼 해마다 느는 탭도 기억에 들어가고, 한 번에 꺼낼 수 있다(작은 탭은 풀 일이 없게 그대로)
var MEMO_ZIP_CHUNK_ = 90000; // 줄인 글(영문·숫자뿐, 1글자 1바이트)은 한 칸에 이만큼 넣는다(한 칸 100KB 한도)
var MEMO_SKIP_ = { '기록': 1 }; // 크고 쓸 때마다 늘어나 기억하지 않는 탭
var MEMO_EP_ = null;        // 이번 요청에서 읽은 전체 판
var MEMO_BYPASS_ = false;   // 속도 재기에서 '시트에서 읽을 때'를 잴 때만 켠다
var DB_WRITTEN_ = {};       // 이번 잠금 안에서 쓴 탭
var MEMO_PRE_ = {};         // 이번 요청에서 미리 꺼내 둔 탭 기억 { 탭: { v, chunks: [첫 칸, …] } } (memoPreload_)
var MEMO_PRE_CHUNKS_ = 4;   // 미리 꺼낼 때 탭마다 앞에서부터 이만큼 칸을 함께 꺼낸다(없는 칸은 그냥 비어 온다)

function memoCache_() {
  try { return CacheService.getScriptCache(); } catch (e) { return null; }
}

function memoToken_() {
  return Utilities.getUuid().replace(/-/g, '').slice(0, 10);
}

/** 전체 판(gy:ep)을 받아 둔다. 없으면 새로 정한다 */
function memoTakeEp_(cache, got) {
  MEMO_EP_ = got['gy:ep'] || null;
  if (!MEMO_EP_) { MEMO_EP_ = memoToken_(); PERF_.memoCalls++; cache.put('gy:ep', MEMO_EP_, MEMO_KEEP_); }
}

/**
 * 이 요청이 읽을 탭들의 판과 기억(앞쪽 칸)을 서버 기억에서 한 번에 꺼내 둔다(탭마다 따로 다녀오지 않게, 속도).
 * 판이 없는 탭은 여기서 한 번에 판을 정한다(시트를 읽기 전에 정해야 옛 값이 새 판으로 기억되지 않는다).
 * 이미 읽었거나 꺼내 둔 탭, '기록' 탭, 잠금 안(쓰기)에서는 꺼내지 않는다. 꺼내 둔 것은 memoLookup_이 한 번 쓰고 버린다
 */
function memoPreload_(tabs) {
  if (DB_LOCK_DEPTH_ > 0 || MEMO_BYPASS_ || !tabs || !tabs.length) return;
  var defs = tabs_(), want = [];
  tabs.forEach(function (t) {
    if (defs[t] && !MEMO_SKIP_[t] && !DB_CACHE_[t] && !MEMO_PRE_[t] && want.indexOf(t) < 0) want.push(t);
  });
  if (!want.length) return;
  var cache = memoCache_();
  if (!cache) return;
  var t0 = Date.now();
  try {
    var keys = MEMO_EP_ ? [] : ['gy:ep'];
    want.forEach(function (t) {
      keys.push('gy:v:' + t);
      for (var i = 0; i < MEMO_PRE_CHUNKS_; i++) keys.push('gy:d:' + t + ':' + i);
    });
    PERF_.memoCalls++;
    var got = cache.getAll(keys);
    if (!MEMO_EP_) memoTakeEp_(cache, got);
    var fresh = {}, pre = {};
    want.forEach(function (t) {
      var v = got['gy:v:' + t] || null;
      if (!v) { v = memoToken_(); fresh['gy:v:' + t] = v; }
      var chunks = [];
      for (var i = 0; i < MEMO_PRE_CHUNKS_; i++) chunks.push(got['gy:d:' + t + ':' + i]);
      pre[t] = { v: v, chunks: chunks };
    });
    if (Object.keys(fresh).length) { PERF_.memoCalls++; cache.putAll(fresh, MEMO_KEEP_); }
    want.forEach(function (t) { MEMO_PRE_[t] = pre[t]; });
  } catch (e) { /* 꺼내지 못하면 탭마다 찾는다 */ }
  PERF_.memoMs += Date.now() - t0;
}

/** 탭 기억 찾기 → { ep, v, vals(없으면 null) }. 서버 기억을 쓸 수 없으면 null */
function memoLookup_(tab) {
  if (MEMO_SKIP_[tab]) return null;
  var cache = memoCache_();
  if (!cache) return null;
  try {
    var kv = 'gy:v:' + tab, k0 = 'gy:d:' + tab + ':0';
    var pre = MEMO_PRE_[tab], v, chunks;
    if (pre) {
      delete MEMO_PRE_[tab]; // 한 번만 쓴다(그 뒤로는 이 요청의 DB_CACHE_가 들고 있다)
      v = pre.v;
      chunks = pre.chunks;
    } else {
      PERF_.memoCalls++;
      var got = cache.getAll(MEMO_EP_ ? [kv, k0] : ['gy:ep', kv, k0]);
      if (!MEMO_EP_) memoTakeEp_(cache, got);
      v = got[kv] || null;
      chunks = [got[k0]];
      if (!v) { v = memoToken_(); PERF_.memoCalls++; cache.put(kv, v, MEMO_KEEP_); }
    }
    var out = { ep: MEMO_EP_, v: v, vals: null };
    var c0 = chunks[0];
    if (typeof c0 !== 'string') return out;
    var nl = c0.indexOf('\n');
    var meta = JSON.parse(c0.slice(0, nl));
    if (meta.ep !== out.ep || meta.v !== out.v) return out;
    if (MEMO_RECHECK_ && !(meta.at > Date.now() - MEMO_FRESH_ * 1000)) return out; // 뒤에서 보내는 요청: 오래된 기억은 시트와 다시 맞춘다
    var text = c0.slice(nl + 1);
    if (meta.n > 1) {
      // 둘째 칸부터는 앞에 판 표시가 붙어 있다. 다른 판의 칸이 섞이면(그사이 누가 새로 담음) 쓰지 않는다
      var tag = meta.ep + '.' + meta.v + '\n', need = [], rest = {};
      for (var i = 1; i < meta.n; i++) if (typeof chunks[i] !== 'string') need.push('gy:d:' + tab + ':' + i);
      if (need.length) { PERF_.memoCalls++; rest = cache.getAll(need); }
      for (var j = 1; j < meta.n; j++) {
        var s = typeof chunks[j] === 'string' ? chunks[j] : rest['gy:d:' + tab + ':' + j];
        if (typeof s !== 'string' || s.slice(0, tag.length) !== tag) return out; // 사라졌거나 다른 판이면 시트에서
        text += s.slice(tag.length);
      }
    }
    if (meta.z) text = Utilities.ungzip(Utilities.newBlob(Utilities.base64Decode(text), 'application/x-gzip')).getDataAsString('UTF-8');
    out.vals = JSON.parse(text);
    return out;
  } catch (e) {
    return null;
  }
}

/** 시트에서 읽은 값을 기억에 넣는다. 판(look.v)은 시트를 읽기 전에 받아 둔 것이라, 그사이 누가 쓰면 이 기억은 저절로 버려진다 */
function memoStore_(tab, vals, look) {
  var cache = memoCache_();
  if (!cache) return;
  try {
    var text = JSON.stringify(vals), z = 0, size = MEMO_CHUNK_;
    if (text.length > MEMO_ZIP_MIN_) {
      text = Utilities.base64Encode(Utilities.gzip(Utilities.newBlob(text, 'application/json')).getBytes());
      z = 1;
      size = MEMO_ZIP_CHUNK_;
    }
    var parts = [], pos = 0;
    while (pos < text.length || !parts.length) {
      var end = Math.min(text.length, pos + size);
      var hi = end < text.length ? text.charCodeAt(end - 1) : 0;
      if (hi >= 0xD800 && hi <= 0xDBFF) end--; // 이모지처럼 두 글자로 된 문자를 칸 경계에서 반으로 자르지 않는다
      parts.push(text.slice(pos, end));
      pos = end;
    }
    var n = parts.length;
    if (n > MEMO_MAX_CHUNKS_) return;
    var tag = look.ep + '.' + look.v + '\n';
    var put = {};
    for (var i = 0; i < n; i++) {
      put['gy:d:' + tab + ':' + i] = (i ? tag : JSON.stringify({ ep: look.ep, v: look.v, n: n, at: Date.now(), z: z }) + '\n') + parts[i];
    }
    PERF_.memoCalls++;
    cache.putAll(put, MEMO_TTL_);
  } catch (e) { /* 기억하지 못해도 읽기는 된다 */ }
}

/** 쓴 탭의 판을 바꾼다. 시트에 먼저 확정(flush)해서, 바뀐 판으로 옛 값을 기억하는 일이 없게 한다 */
function memoBump_(tabs) {
  var cache = memoCache_();
  if (!cache) return;
  try {
    SpreadsheetApp.flush();
    var put = {};
    tabs.forEach(function (t) { put['gy:v:' + t] = memoToken_(); });
    cache.putAll(put, MEMO_KEEP_);
  } catch (e) {
    memoClearAll_();
  }
}

/** 기억을 모두 버린다(전체 판을 바꾼다): 처음 설정 뒤, 관리자 › 점검 '시트 새로 읽기' */
function memoClearAll_() {
  MEMO_EP_ = null;
  MEMO_PRE_ = {};
  var cache = memoCache_();
  if (!cache) return false;
  try {
    try { SpreadsheetApp.flush(); } catch (e0) { /* 확정할 것이 없으면 그대로 */ }
    cache.put('gy:ep', memoToken_(), MEMO_KEEP_);
    return true;
  } catch (e) {
    return false;
  }
}

function sheet_(tab) {
  if (DB_SHEETS_[tab]) return DB_SHEETS_[tab];
  var sh = ss_().getSheetByName(tab);
  if (!sh) throw userError_('시트에 "' + tab + '" 탭이 없어요. 관리자가 시트 메뉴에서 "처음 설정"을 먼저 해 주세요.', 'SETUP');
  DB_SHEETS_[tab] = sh;
  return sh;
}

// ---------------------------------------------------------------- 값 다루기

/** 시트에서 읽은 값을 글자로 */
function cellText_(v) {
  if (v === null || v === undefined) return '';
  if (Object.prototype.toString.call(v) === '[object Date]') {
    var hasTime = v.getHours() || v.getMinutes() || v.getSeconds();
    return Utilities.formatDate(v, tz_(), hasTime ? 'yyyy-MM-dd HH:mm:ss' : 'yyyy-MM-dd');
  }
  return String(v);
}

/**
 * 시트에 쓸 값. 모두 글자로 남긴다.
 * 빈칸이 아니면 늘 앞에 ' 를 붙여, 시트가 수식(=…)·숫자(0101, 1e3)·날짜(2026-03-02, 3-1)로 바꾸지 못하게 한다.
 * 시트에서 ' 는 보이지 않고, 읽을 때도 빠진다.
 */
function cellWrite_(v) {
  if (v === null || v === undefined) return '';
  var s = String(v);
  if (s === '') return '';
  return "'" + s;
}

function tz_() {
  return 'Asia/Seoul';
}

function nowText_() {
  return Utilities.formatDate(new Date(), tz_(), 'yyyy-MM-dd HH:mm:ss');
}

// ---------------------------------------------------------------- 읽기

/** 표 전체를 [{머리글: 값, _row: 행 번호}] 로 읽는다 */
function readRows_(tab) {
  var vals = sheetValues_(tab);
  var head = vals[0].map(cellText_);
  var rows = [];
  for (var i = 1; i < vals.length; i++) {
    var o = { _row: i + 1 };
    var empty = true;
    for (var j = 0; j < head.length; j++) {
      if (!head[j]) continue;
      o[head[j]] = cellText_(vals[i][j]);
      if (o[head[j]] !== '') empty = false;
    }
    if (!empty) rows.push(o);
  }
  return rows;
}

/** 삭제 표시가 없는 행만 */
function liveRows_(tab) {
  return readRows_(tab).filter(function (r) { return !r['삭제 여부']; });
}

function findRow_(tab, id) {
  var key = tabs_()[tab][0];
  var rows = readRows_(tab);
  for (var i = 0; i < rows.length; i++) if (rows[i][key] === id) return rows[i];
  return null;
}

/** 화면에 보낼 때 숨길 칸을 뺀다 */
function publicRow_(r) {
  var o = {};
  var hide = hiddenCols_();
  Object.keys(r).forEach(function (k) {
    if (k === '_row' || hide.indexOf(k) >= 0) return;
    o[k] = r[k];
  });
  return o;
}

// ---------------------------------------------------------------- 쓰기 (모두 잠금 안에서)

var DB_LOCK_DEPTH_ = 0;
var DB_AFTER_ = []; // 잠금을 풀기 직전(시트에 확정한 뒤)에 할 일: 취합 시트의 '바뀐 줄' 적기(Table.gs tbLogFlush_)

/** 잠금 안에서 부른다: 잠금을 풀기 직전, 시트에 확정하고 서버 기억의 판을 바꾼 뒤에 fn을 한 번 부른다 */
function afterLock_(fn) {
  if (DB_AFTER_.indexOf(fn) < 0) DB_AFTER_.push(fn);
}

function withLock_(fn) {
  if (DB_LOCK_DEPTH_ > 0) return fn(); // 이미 잠금 안이면 그대로
  var lock = LockService.getScriptLock();
  if (!lock.tryLock(20000)) throw userError_('다른 분이 저장하는 중이에요. 잠시 뒤에 다시 눌러 주세요.', 'BUSY');
  dirty_(); // 잠금 안에서는 최신 값을 다시 읽는다
  DB_LOCK_DEPTH_++;
  DB_WRITTEN_ = {};
  DB_AFTER_ = [];
  try {
    return fn();
  } finally {
    DB_LOCK_DEPTH_--;
    var written = Object.keys(DB_WRITTEN_), after = DB_AFTER_;
    DB_WRITTEN_ = {};
    DB_AFTER_ = [];
    try {
      if (written.length) {
        try { SpreadsheetApp.flush(); } catch (e0) { /* 아래 판 바꾸기에서 한 번 더 */ } // 서버 기억을 못 써도 잠금을 풀기 전에 시트에 확정한다
        memoBump_(written); // 잠금을 풀기 전에: 서버 기억의 판을 바꾼다
      }
      after.forEach(function (f) { try { f(); } catch (e1) { /* 못 해도 저장은 끝났다 */ } });
    } finally {
      lock.releaseLock();
    }
  }
}

function headOf_(tab) {
  return sheetValues_(tab)[0].map(cellText_);
}

/** 머리글만(기록 탭처럼 아주 큰 탭은 1행만 읽는다) */
function headRowOnly_(tab) {
  if (!MEMO_SKIP_[tab] || DB_CACHE_[tab]) return headOf_(tab);
  var sh = sheet_(tab);
  return sh.getRange(1, 1, 1, Math.max(1, sh.getLastColumn())).getValues()[0].map(cellText_);
}

/** 끝에서부터 n줄만 읽어 [{머리글: 값, _row}] (기록 탭처럼 계속 느는 탭을 볼 때) */
function tailRows_(tab, n) {
  var sh = sheet_(tab);
  var last = sh.getLastRow(), cols = Math.max(1, sh.getLastColumn());
  if (last < 2) return [];
  var head = sh.getRange(1, 1, 1, cols).getValues()[0].map(cellText_);
  var from = Math.max(2, last - n + 1);
  return sh.getRange(from, 1, last - from + 1, cols).getValues().map(function (line, i) {
    var o = { _row: from + i }, empty = true;
    head.forEach(function (h, j) { if (!h) return; o[h] = cellText_(line[j]); if (o[h] !== '') empty = false; });
    return empty ? null : o;
  }).filter(Boolean);
}

/** 머리글 차례에 맞춘 한 줄(시트에 쓸 글자). 칸 위치를 머리글 이름으로 찾는다 */
function rowByHead_(tab, obj) {
  return headOf_(tab).map(function (h) { return cellWrite_(h && obj[h] !== undefined ? obj[h] : ''); });
}

/** 나중에 더한 탭이 시트에 없으면 처음 설정과 같은 모양(머리글·굵게·1행 고정)으로 만든다 */
function ensureTab_(tab) {
  if (ss_().getSheetByName(tab)) return;
  withLock_(function () {
    var ss = ss_();
    if (ss.getSheetByName(tab)) return; // 잠금을 기다리는 사이 다른 분이 만들었으면 그대로
    var head = tabs_()[tab];
    var sh = ss.insertSheet(tab);
    sh.getRange(1, 1, 1, head.length).setValues([head]);
    sh.setFrozenRows(1);
    sh.getRange(1, 1, 1, head.length).setFontWeight('bold').setBackground('#F2F4F6');
    delete DB_SHEETS_[tab];
    dirty_(tab);
  });
}

/** 나중에 더한 칸이 시트에 없으면 머리글 끝에 붙인다(있는 데이터는 그대로) */
function ensureCols_(tab) {
  var want = tabs_()[tab];
  var head0 = headOf_(tab); // 잠금 밖에서는 서버 기억으로 먼저 본다. 대부분 빠진 칸이 없어 잠그지 않고 끝난다
  if (!want.some(function (h) { return head0.indexOf(h) < 0; })) return;
  withLock_(function () {
    var head = headOf_(tab);
    var missing = tabs_()[tab].filter(function (h) { return head.indexOf(h) < 0; });
    if (!missing.length) return;
    var sh = sheet_(tab);
    growCols_(sh, head.length + missing.length);
    sh.getRange(1, head.length + 1, 1, missing.length).setValues([missing]);
    dirty_(tab);
  });
}

function newId_(tab) {
  var key = tabs_()[tab][0];
  var used = {};
  readRows_(tab).forEach(function (r) { used[r[key]] = true; });
  for (var n = 0; n < 20; n++) {
    var id = idPrefix_(tab) + Utilities.getUuid().replace(/-/g, '').slice(0, 8).toUpperCase();
    if (!used[id]) return id;
  }
  throw new Error('ID를 만들지 못했어요');
}

/**
 * 새 행 넣기. actor = {id, name}
 * 돌려주는 값: 넣은 행(숨김 칸 제외)
 */
function insertRow_(tab, obj, actor, summary) {
  return withLock_(function () {
    var head = headOf_(tab);
    var key = tabs_()[tab][0]; // ID 칸은 이름으로 찾는다(누가 앞에 칸을 끼워 넣어도)
    var rec = {};
    head.forEach(function (h) { if (obj[h] !== undefined) rec[h] = String(obj[h]); });
    rec[key] = newId_(tab);
    rec['입력자ID'] = actor.id || '';
    rec['입력 시각'] = nowText_();
    rec['수정자ID'] = '';
    rec['수정 시각'] = '';
    rec['삭제 여부'] = '';
    sheet_(tab).appendRow(head.map(function (h) { return cellWrite_(rec[h]); }));
    dirty_(tab);
    writeLog_(actor, tab, rec[key], '추가', summary || '', null, auditView_(rec));
    return publicRow_(rec);
  });
}

/**
 * 여러 줄을 한 번에 넣기(다시 알리기처럼 수십 줄을 쓸 때). 기록은 한 줄로 남긴다.
 * keepAudit: true면 obj의 입력자ID·입력 시각·수정자ID·수정 시각을 그대로 둔다
 *   (새 학년도로 옮긴 자료를 처음 넣은 분이 계속 고칠 수 있고, 수정일도 그대로 보이게. 옮긴 일은 기록 탭에 남는다)
 * keepIds: true면 obj에 미리 정한 ID를 그대로 쓴다(이미 있는 ID면 새로 만든다. 취합 시트의 합친 칸이 새 줄을 가리킬 때)
 */
function insertRows_(tab, list, actor, summary, keepAudit, keepIds) {
  if (!list.length) return [];
  return withLock_(function () {
    var head = headOf_(tab);
    var key = tabs_()[tab][0];
    var used = {};
    readRows_(tab).forEach(function (r) { used[r[key]] = true; });
    var now = nowText_();
    var recs = list.map(function (obj) {
      var rec = {};
      head.forEach(function (h) { if (obj[h] !== undefined) rec[h] = String(obj[h]); });
      var id = keepIds && obj[key] && !used[obj[key]] ? String(obj[key]) : '';
      while (!id || used[id]) id = idPrefix_(tab) + Utilities.getUuid().replace(/-/g, '').slice(0, 8).toUpperCase();
      used[id] = true;
      rec[key] = id;
      rec['입력자ID'] = actor.id || '';
      rec['입력 시각'] = now;
      rec['수정자ID'] = '';
      rec['수정 시각'] = '';
      if (keepAudit) ['입력자ID', '입력 시각', '수정자ID', '수정 시각'].forEach(function (h) { if (obj[h]) rec[h] = String(obj[h]); });
      rec['삭제 여부'] = '';
      return rec;
    });
    var sh = sheet_(tab);
    var start = sh.getLastRow() + 1;
    growRows_(sh, start + recs.length - 1);
    sh.getRange(start, 1, recs.length, head.length)
      .setValues(recs.map(function (rec) { return head.map(function (h) { return cellWrite_(rec[h]); }); }));
    dirty_(tab);
    writeLog_(actor, tab, '', '추가', summary || (recs.length + '줄 추가'), null, { '줄 수': String(recs.length) });
    return recs.map(publicRow_);
  });
}

/**
 * 행 고치기. patch에 있는 칸만 바꾼다(ID·입력 칸은 못 바꿈).
 * 바뀐 칸이 없으면 기록을 남기지 않는다.
 */
function updateRow_(tab, id, patch, actor, summary, action) {
  return withLock_(function () {
    var row = findRow_(tab, id);
    if (!row) throw userError_('고칠 항목을 찾지 못했어요. 화면을 새로 고쳐 주세요.', 'NOTFOUND');
    var head = headOf_(tab);
    var raw = sheet_(tab).getRange(row._row, 1, 1, head.length).getValues()[0]; // 머리글 없는 칸은 손대지 않으려고
    var locked = [tabs_()[tab][0], '입력자ID', '입력 시각', '수정자ID', '수정 시각'];
    var before = {}, after = {}, changed = false;
    var next = {};
    head.forEach(function (h) { next[h] = row[h] === undefined ? '' : row[h]; });
    Object.keys(patch).forEach(function (h) {
      if (head.indexOf(h) < 0 || locked.indexOf(h) >= 0) return;
      var v = patch[h] === null || patch[h] === undefined ? '' : String(patch[h]);
      if (next[h] !== v) {
        before[h] = next[h];
        after[h] = v;
        next[h] = v;
        changed = true;
      }
    });
    if (!changed) return publicRow_(row);
    next['수정자ID'] = actor.id || '';
    next['수정 시각'] = nowText_();
    sheet_(tab).getRange(row._row, 1, 1, head.length)
      .setValues([head.map(function (h, j) { return h ? cellWrite_(next[h]) : raw[j]; })]);
    dirty_(tab);
    writeLog_(actor, tab, id, action || '수정', summary || '', auditView_(before), auditView_(after));
    next._row = row._row;
    return publicRow_(next);
  });
}

/**
 * 여러 줄에 같은 값을 한 번에 쓰기(새 학년도 보관, 학사일정 올리기의 바꾸기·되돌리기). 기록은 한 줄로 남긴다.
 * 바뀌기 전 값과 ID 목록을 기록에 남겨 되돌릴 수 있게 한다.
 * 보관처럼 내용을 고친 것이 아니면 수정일은 그대로 두고, 숨기기·되살리기('삭제 여부')면 수정자·수정 시각을 남긴다.
 */
function updateRowsSame_(tab, ids, patch, actor, summary, action) {
  if (!ids.length) return 0;
  return withLock_(function () {
    var head = headOf_(tab);
    var key = tabs_()[tab][0];
    var want = {};
    ids.forEach(function (id) { want[id] = true; });
    var vals = {};
    Object.keys(patch).forEach(function (h) { if (head.indexOf(h) >= 0) vals[h] = String(patch[h]); });
    if ('삭제 여부' in patch) { // 숨기기·되살리기는 누가 했는지 수정자 칸에 남긴다(휴지통에 보이게)
      vals['수정자ID'] = actor.id || '';
      vals['수정 시각'] = nowText_();
    }
    var rows = readRows_(tab).filter(function (row) { return want[row[key]]; });
    var before = {};
    rows.forEach(function (row) {
      Object.keys(patch).forEach(function (h) {
        if (head.indexOf(h) >= 0) { before[h] = before[h] || {}; before[h][row[key]] = row[h] === undefined ? '' : row[h]; }
      });
    });
    // 바꿀 칸만, 붙어 있는 줄·칸끼리 묶어 한 번에 쓴다(줄마다 읽고 쓰면 수백 번 시트를 불러 잠금이 길어진다)
    var sh = sheet_(tab);
    var cols = Object.keys(vals).filter(function (h) { return head.indexOf(h) >= 0; }).map(function (h) { return head.indexOf(h) + 1; });
    var rowRuns = runs_(rows.map(function (r) { return r._row; })), colRuns = runs_(cols);
    rowRuns.forEach(function (rr) {
      colRuns.forEach(function (cc) {
        var line = [];
        for (var c = cc[0]; c <= cc[1]; c++) line.push(cellWrite_(vals[head[c - 1]]));
        var block = [];
        for (var r = rr[0]; r <= rr[1]; r++) block.push(line.slice());
        sh.getRange(rr[0], cc[0], block.length, line.length).setValues(block);
      });
    });
    if (rows.length) dirty_(tab);
    var after = {};
    Object.keys(patch).forEach(function (h) { after[h] = String(patch[h]); });
    after['ID 목록'] = ids.join(',');
    writeLog_(actor, tab, '', action || '수정', summary || (rows.length + '줄 고침'), before, after);
    return rows.length;
  });
}

/** 숫자들을 붙어 있는 덩어리 [처음, 끝]으로 묶는다(작은 것부터) */
function runs_(nums) {
  var out = [];
  nums.slice().sort(function (a, b) { return a - b; }).forEach(function (x) {
    var last = out[out.length - 1];
    if (last && x === last[1] + 1) last[1] = x;
    else if (!last || x > last[1]) out.push([x, x]);
  });
  return out;
}

/** 시트의 줄 수가 모자라면 늘린다(새 탭은 1000줄이라, 한 번에 여러 줄을 쓸 때 범위를 벗어나지 않게) */
function growRows_(sh, lastRow) {
  var max = sh.getMaxRows();
  if (lastRow > max) sh.insertRowsAfter(max, lastRow - max);
}

/** 시트의 칸 수가 모자라면 늘린다(머리글을 끝에 더할 때) */
function growCols_(sh, lastCol) {
  var max = sh.getMaxColumns();
  if (lastCol > max) sh.insertColumnsAfter(max, lastCol - max);
}

/** 지우기 = 숨김 표시. 되살릴 수 있다. */
function softDelete_(tab, id, actor, summary) {
  return updateRow_(tab, id, { '삭제 여부': '삭제' }, actor, summary, '삭제');
}

function restoreRow_(tab, id, actor, summary) {
  return updateRow_(tab, id, { '삭제 여부': '' }, actor, summary, '되살리기');
}

/**
 * 기록을 남기지 않고 칸만 바꾼다. 틀린 횟수처럼 보안용 숫자에만 쓴다.
 * 반드시 withLock_ 안에서 부른다.
 */
function setCellsNoLog_(tab, row, patch) {
  var head = headOf_(tab);
  var sh = sheet_(tab);
  Object.keys(patch).forEach(function (h) {
    var c = head.indexOf(h);
    if (c < 0) return;
    sh.getRange(row._row, c + 1).setValue(cellWrite_(patch[h]));
    row[h] = String(patch[h]);
  });
  dirty_(tab);
}

// ---------------------------------------------------------------- 기록

function auditView_(rec) {
  if (!rec) return null;
  var o = {};
  var secret = secretCols_();
  Object.keys(rec).forEach(function (k) {
    if (k === '_row') return;
    o[k] = secret.indexOf(k) >= 0 ? '(비공개)' : rec[k];
  });
  return o;
}

function writeLog_(actor, tab, id, action, summary, before, after) {
  var sh = sheet_('기록');
  sh.appendRow([
    nowText_(),
    actor.id || '',
    actor.name || '',
    tab,
    id || '',
    action,
    summary || '',
    before ? JSON.stringify(before) : '',
    after ? JSON.stringify(after) : ''
  ].map(function (v) { return cellWrite_(String(v).slice(0, 49000)); })); // 시트 한 칸은 5만 자까지
  dirty_('기록');
}

// ---------------------------------------------------------------- 오류

/** 사용자에게 그대로 보여 줄 오류 */
function userError_(msg, code) {
  var e = new Error(msg);
  e.userMessage = msg;
  e.code = code || 'USER';
  return e;
}

/** 글자 길이 확인 */
function cleanText_(v, max, label, required) {
  var s = v === null || v === undefined ? '' : String(v).trim();
  if (required && !s) throw userError_(label + josa_(label, '을', '를') + ' 적어 주세요.');
  if (s.length > max) throw userError_(label + josa_(label, '은', '는') + ' ' + max + '자까지 적을 수 있어요.');
  return s;
}

/** 받침에 맞는 조사 */
function josa_(word, withBatchim, without) {
  var c = String(word).charCodeAt(String(word).length - 1);
  if (c < 0xAC00 || c > 0xD7A3) return withBatchim + '(' + without + ')';
  return (c - 0xAC00) % 28 ? withBatchim : without;
}

/* ===== Auth.gs ===== */
/**
 * Auth.gs — 로그인·본인 확인·관리자 확인
 *
 * 비밀번호를 두는 곳
 * - 공통 비밀번호·관리자 비밀번호: 스크립트 속성에 '해시'로만 저장한다. 원래 글자는 어디에도 남지 않는다.
 * - 개인 번호 4자리: 교직원 탭에 '사람마다 다른 솔트 + 비밀 값(PIN_PEPPER)'을 섞은 해시로만 저장한다.
 * - 로그인 상태: 서명한 표(토큰)를 브라우저가 들고 있다. 번호·비밀번호 자체는 브라우저에 저장하지 않는다.
 *
 * 스크립트 속성 이름
 *   SHEET_ID, PIN_PEPPER, TOKEN_SECRET,
 *   COMMON_PW_HASH, COMMON_PW_SALT, COMMON_PW_VER,
 *   ADMIN_PW_HASH, ADMIN_PW_SALT, ADMIN_PW_VER, ADMIN_FAILS, ADMIN_LOCK_UNTIL
 */

function fileMark_Auth_() { return '2026-10-16e'; } // 판 표시(관리자 › 점검)

var AUTH_LOGIN_HOURS_ = 12;   // '기억하기'를 끈 로그인·본인 확인이 유지되는 시간 (제안)
var AUTH_ADMIN_HOURS_ = 2;    // 관리자 화면이 열려 있는 시간 (제안)
var AUTH_MIN_PW_ = 6;         // 공통·관리자 비밀번호 최소 글자 수 (제안)

function props_() {
  return PropertiesService.getScriptProperties();
}

// ---------------------------------------------------------------- 해시·서명

function hex_(bytes) {
  return bytes.map(function (b) {
    var v = (b + 256) % 256;
    return (v < 16 ? '0' : '') + v.toString(16);
  }).join('');
}

function sha256Hex_(s) {
  return hex_(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, s, Utilities.Charset.UTF_8));
}

/** 없으면 만들어 두는 비밀 값(설치할 때 한 번 생김) */
function secretProp_(name) {
  var p = props_();
  var v = p.getProperty(name);
  if (!v) {
    v = Utilities.getUuid() + Utilities.getUuid();
    p.setProperty(name, v);
  }
  return v;
}

function sign_(body) {
  var sig = Utilities.computeHmacSha256Signature(body, secretProp_('TOKEN_SECRET'));
  return Utilities.base64EncodeWebSafe(sig).replace(/=+$/, '');
}

/** 같은 길이로 끝까지 비교 */
function sameText_(a, b) {
  a = String(a); b = String(b);
  if (a.length !== b.length) return false;
  var diff = 0;
  for (var i = 0; i < a.length; i++) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
  return diff === 0;
}

function makeToken_(payload) {
  var body = Utilities.base64EncodeWebSafe(JSON.stringify(payload), Utilities.Charset.UTF_8).replace(/=+$/, '');
  return body + '.' + sign_(body);
}

function readToken_(token, kind) {
  if (!token || typeof token !== 'string' || token.length > 2000) return null;
  var i = token.lastIndexOf('.');
  if (i < 1) return null;
  var body = token.slice(0, i);
  if (!sameText_(sign_(body), token.slice(i + 1))) return null;
  var o;
  try {
    var pad = body + '===='.slice(0, (4 - body.length % 4) % 4);
    o = JSON.parse(Utilities.newBlob(Utilities.base64DecodeWebSafe(pad)).getDataAsString('UTF-8'));
  } catch (e) {
    return null;
  }
  if (!o || o.k !== kind || !(o.exp > Date.now())) return null;
  return o;
}

// ---------------------------------------------------------------- 공통·관리자 비밀번호

function pwKey_(kind) {
  return kind === 'admin' ? 'ADMIN' : 'COMMON';
}

function hasPassword_(kind) {
  return !!props_().getProperty(pwKey_(kind) + '_PW_HASH');
}

function pwHash_(pw, salt) {
  return sha256Hex_(secretProp_('PIN_PEPPER') + ':' + salt + ':' + pw);
}

/** 비밀번호 정하기. 버전이 올라가 예전 로그인은 모두 풀린다. */
function setPassword_(kind, pw) {
  pw = String(pw || '');
  if (pw.length < AUTH_MIN_PW_) throw userError_('비밀번호는 ' + AUTH_MIN_PW_ + '자 이상으로 정해 주세요.');
  if (pw.length > 64) throw userError_('비밀번호는 64자까지 정할 수 있어요.');
  var k = pwKey_(kind);
  var other = kind === 'admin' ? 'common' : 'admin';
  if (hasPassword_(other) && checkPassword_(other, pw)) {
    throw userError_('공통 비밀번호와 관리자 비밀번호는 서로 다르게 정해 주세요.');
  }
  var salt = Utilities.getUuid();
  var p = props_();
  var ver = Number(p.getProperty(k + '_PW_VER') || 0) + 1;
  p.setProperty(k + '_PW_SALT', salt);
  p.setProperty(k + '_PW_HASH', pwHash_(pw, salt));
  p.setProperty(k + '_PW_VER', String(ver));
  if (kind === 'admin') {
    p.setProperty('ADMIN_FAILS', '0');
    p.setProperty('ADMIN_LOCK_UNTIL', '0');
  }
}

function checkPassword_(kind, pw) {
  var k = pwKey_(kind);
  var p = props_();
  var hash = p.getProperty(k + '_PW_HASH');
  var salt = p.getProperty(k + '_PW_SALT');
  if (!hash || !salt) return false;
  return sameText_(pwHash_(String(pw || ''), salt), hash);
}

function pwVer_(kind) {
  return Number(props_().getProperty(pwKey_(kind) + '_PW_VER') || 0);
}

// ---------------------------------------------------------------- 잠금 기준 (설정 탭)

function lockRule_() {
  return {
    tries: Math.max(1, Number(setting_('잠금 횟수')) || 5),
    minutes: Math.max(1, Number(setting_('잠금 분')) || 10)
  };
}

function rememberDays_() {
  return Math.max(1, Number(setting_('기기 기억 일수')) || 30);
}

function expiry_(remember, hours) {
  return Date.now() + (remember ? rememberDays_() * 24 : hours) * 3600 * 1000;
}

// ---------------------------------------------------------------- 1) 공통 로그인

// 웹앱 주소를 아는 누구나 공통 비밀번호를 넣어 볼 수 있으므로, 학교 전체에서 짧은 시간에 많이 틀리면 잠시 막는다.
// 이미 로그인된(기억된) 기기는 그대로 쓴다. 숫자는 서버 기억(CacheService)에 두는 어림값이다
var LOGIN_FAIL_WINDOW_ = 15 * 60; // 초
var LOGIN_FAIL_MAX_ = 20;          // 이 시간 안에 이만큼 틀리면 남은 시간 동안 막는다

/** 최근에 공통 비밀번호를 틀린 수 { n, at(처음 틀린 때) } */
function loginFails_() {
  try {
    var v = CacheService.getScriptCache().get('gy:pwfail');
    var f = v ? JSON.parse(v) : null;
    if (f && f.at && Date.now() - f.at < LOGIN_FAIL_WINDOW_ * 1000) return f;
  } catch (e) { /* 기억을 못 쓰면 막지 않는다 */ }
  return { n: 0, at: 0 };
}

function addLoginFail_() {
  try {
    var f = loginFails_();
    if (!f.at) f = { n: 0, at: Date.now() };
    f.n++;
    CacheService.getScriptCache().put('gy:pwfail', JSON.stringify(f), LOGIN_FAIL_WINDOW_);
    return f.n;
  } catch (e) {
    return 0;
  }
}

function login_(args) {
  if (!hasPassword_('common')) {
    throw userError_('아직 공통 비밀번호가 정해지지 않았어요. 연구부장·부담당에게 알려 주세요.', 'SETUP');
  }
  var f = loginFails_();
  if (f.n >= LOGIN_FAIL_MAX_) {
    var left = Math.max(1, Math.ceil((f.at + LOGIN_FAIL_WINDOW_ * 1000 - Date.now()) / 60000));
    throw userError_('비밀번호를 여러 번 틀린 기록이 있어서 로그인을 잠시 막았어요. ' + left + '분 뒤에 다시 해 주세요. 이미 로그인된 기기는 그대로 쓸 수 있어요.', 'LOCKED');
  }
  if (!checkPassword_('common', args.password)) {
    var n = addLoginFail_();
    if (n === LOGIN_FAIL_MAX_) {
      withLock_(function () {
        writeLog_({ id: '', name: '' }, '설정', '', '잠김', '공통 비밀번호를 ' + Math.round(LOGIN_FAIL_WINDOW_ / 60) + '분 안에 ' + n + '번 틀려서 새 로그인을 잠시 막음', null, null);
      });
    }
    Utilities.sleep(1200); // 하나씩 맞춰 보는 것을 느리게
    throw userError_('비밀번호가 맞지 않아요. 다시 넣어 주세요.', 'BADPW');
  }
  // '이름만' 방식에서는 공통 비밀번호를 기기에 기억해 둔다(기억 기간: 설정 '기기 기억 일수')
  var remember = !!args.remember || !pinMode_();
  return {
    login: makeToken_({ k: 'L', v: pwVer_('common'), exp: expiry_(remember, AUTH_LOGIN_HOURS_) }),
    remember: remember
  };
}

/** 본인 확인 방식: '이름만'(이름 고르기) 또는 '이름+개인 번호' — 설정 탭에서 바꾼다 */
function pinMode_() {
  return setting_('본인 확인 방식') === '이름+개인 번호';
}

function identityModeCode_() {
  return pinMode_() ? 'P' : 'N';
}

function checkLogin_(token) {
  var o = readToken_(token, 'L');
  return !!(o && o.v === pwVer_('common'));
}

// ---------------------------------------------------------------- 2) 본인 확인 (이름 + 개인 번호)

/** 이름 고르기 목록: 사용 중인 분만 */
function staffPicker_() {
  var depts = categoryNames_('부서');
  return sortStaff_(liveRows_('교직원').filter(function (r) { return r['사용 여부'] !== '사용 안 함'; }))
    .map(function (r) {
      return {
        id: r['교직원ID'],
        name: r['이름'],
        position: r['직위'],
        group: r['소속'],
        dept: depts[r['부서ID']] || '',
        hasPin: !!r['개인번호해시']
      };
    });
}

function sortStaff_(rows) {
  return rows.slice().sort(function (a, b) {
    var oa = Number(a['순서']) || 9999, ob = Number(b['순서']) || 9999;
    if (oa !== ob) return oa - ob;
    return String(a['이름']).localeCompare(String(b['이름']), 'ko');
  });
}

function pinHash_(pin, salt) {
  return sha256Hex_(secretProp_('PIN_PEPPER') + ':' + salt + ':' + pin);
}

function verifyPin_(args) {
  if (!pinMode_()) return pickName_(args);
  var staffId = String(args.staffId || '');
  var pin = String(args.pin || '');
  if (!/^\d{4}$/.test(pin)) throw userError_('개인 번호 4자리를 숫자로 넣어 주세요.', 'BADPIN');
  var remember = !!args.remember;
  var rule = lockRule_();

  var result = withLock_(function () {
    var row = findRow_('교직원', staffId);
    if (!row || row['삭제 여부'] || row['사용 여부'] === '사용 안 함') {
      throw userError_('명단에서 이름을 다시 골라 주세요.', 'NOTFOUND');
    }
    if (!row['개인번호해시']) {
      throw userError_('아직 개인 번호가 없어요. 연구부장·부담당에게 받아 주세요.', 'NOPIN');
    }
    var until = Number(row['잠금 해제 시각']) || 0;
    if (until > Date.now()) {
      var left = Math.ceil((until - Date.now()) / 60000);
      throw userError_('번호를 여러 번 틀려서 잠시 잠겼어요. ' + left + '분 뒤에 다시 해 주세요. 급하면 연구부장·부담당에게 알려 주세요.', 'LOCKED');
    }
    if (sameText_(pinHash_(pin, row['솔트']), row['개인번호해시'])) {
      if (row['틀린 횟수'] && row['틀린 횟수'] !== '0') setCellsNoLog_('교직원', row, { '틀린 횟수': '0', '잠금 해제 시각': '' });
      return { ok: true, row: row };
    }
    var fails = (Number(row['틀린 횟수']) || 0) + 1;
    if (fails >= rule.tries) {
      setCellsNoLog_('교직원', row, { '틀린 횟수': '0', '잠금 해제 시각': String(Date.now() + rule.minutes * 60000) });
      writeLog_({ id: row['교직원ID'], name: row['이름'] }, '교직원', row['교직원ID'], '잠김',
        '개인 번호를 ' + rule.tries + '번 틀려서 ' + rule.minutes + '분 잠김', null, null);
      return { ok: false, msg: '번호를 ' + rule.tries + '번 틀려서 ' + rule.minutes + '분 동안 잠겼어요. 잠시 뒤에 다시 해 주세요.', code: 'LOCKED' };
    }
    setCellsNoLog_('교직원', row, { '틀린 횟수': String(fails) });
    return { ok: false, msg: '번호가 맞지 않아요. 남은 기회는 ' + (rule.tries - fails) + '번이에요.', code: 'BADPIN' };
  });

  if (!result.ok) {
    Utilities.sleep(600);
    throw userError_(result.msg, result.code);
  }
  var row = result.row;
  var out = {
    identity: makeToken_({ k: 'I', m: 'P', s: row['교직원ID'], p: row['번호 바꾼 날'], exp: expiry_(remember, AUTH_LOGIN_HOURS_) }),
    me: meView_(row),
    remember: remember
  };
  // 기억하기를 켜면 공통 로그인도 같은 기간 동안 유지한다
  if (remember) out.login = makeToken_({ k: 'L', v: pwVer_('common'), exp: expiry_(true, AUTH_LOGIN_HOURS_) });
  return out;
}

/** '이름만' 방식: 명단에서 고른 이름으로 본인 확인(번호 없음). 기록에는 고른 이름으로 남는다. */
function pickName_(args) {
  var row = findRow_('교직원', String(args.staffId || ''));
  if (!row || row['삭제 여부'] || row['사용 여부'] === '사용 안 함') {
    throw userError_('명단에서 이름을 다시 골라 주세요.', 'NOTFOUND');
  }
  var remember = !!args.remember;
  var out = {
    identity: makeToken_({ k: 'I', m: 'N', s: row['교직원ID'], p: row['번호 바꾼 날'], exp: expiry_(remember, AUTH_LOGIN_HOURS_) }),
    me: meView_(row),
    remember: remember
  };
  if (remember) out.login = makeToken_({ k: 'L', v: pwVer_('common'), exp: expiry_(true, AUTH_LOGIN_HOURS_) });
  return out;
}

/** 본인 확인 표를 확인하고 교직원 행을 돌려준다. 번호를 다시 정했거나 사용 안 함이거나 확인 방식이 바뀌면 풀린다. */
function checkIdentity_(token) {
  var o = readToken_(token, 'I');
  if (!o) return null;
  if ((o.m || 'P') !== identityModeCode_()) return null;
  var row = findRow_('교직원', o.s);
  if (!row || row['삭제 여부'] || row['사용 여부'] === '사용 안 함') return null;
  if (String(row['번호 바꾼 날']) !== String(o.p)) return null;
  return row;
}

function meView_(row) {
  var depts = categoryNames_('부서');
  return {
    id: row['교직원ID'],
    name: row['이름'],
    position: row['직위'],
    group: row['소속'],
    dept: depts[row['부서ID']] || '',
    deptId: row['부서ID'] || '',
    role: row['역할'] || '일반'
  };
}

// ---------------------------------------------------------------- 3) 관리자

function adminLogin_(args, actor) {
  if (!hasPassword_('admin')) {
    throw userError_('아직 관리자 비밀번호가 정해지지 않았어요. 시트 메뉴 "온라인 교무실 > 관리자 비밀번호 정하기"에서 먼저 정해 주세요.', 'SETUP');
  }
  checkAdminPwCounted_(args.password, actor);
  return { admin: makeToken_({ k: 'A', v: pwVer_('admin'), exp: Date.now() + AUTH_ADMIN_HOURS_ * 3600 * 1000 }) };
}

/**
 * 관리자 비밀번호 확인(틀린 횟수를 세고 여러 번 틀리면 잠근다). 관리자 들어가기와 관리자 비밀번호 바꾸기에서 함께 쓴다.
 * 틀리면 오류를 던진다. 잠김 기록에는 고른 이름(있으면)을 남긴다
 */
function checkAdminPwCounted_(password, actor) {
  var rule = lockRule_();
  var p = props_();
  var who = actor && actor.name ? { id: actor.id || '', name: actor.name } : { id: '', name: '' };
  var res = withLock_(function () {
    var until = Number(p.getProperty('ADMIN_LOCK_UNTIL') || 0);
    if (until > Date.now()) {
      return { ok: false, code: 'LOCKED', msg: '관리자 비밀번호를 여러 번 틀려서 잠겼어요. ' + Math.ceil((until - Date.now()) / 60000) + '분 뒤에 다시 해 주세요.' };
    }
    if (checkPassword_('admin', password)) {
      p.setProperty('ADMIN_FAILS', '0');
      return { ok: true };
    }
    var fails = Number(p.getProperty('ADMIN_FAILS') || 0) + 1;
    if (fails >= rule.tries) {
      p.setProperty('ADMIN_FAILS', '0');
      p.setProperty('ADMIN_LOCK_UNTIL', String(Date.now() + rule.minutes * 60000));
      writeLog_(who, '설정', '', '잠김', '관리자 비밀번호를 ' + rule.tries + '번 틀려서 ' + rule.minutes + '분 잠김', null, null);
      return { ok: false, code: 'LOCKED', msg: '관리자 비밀번호를 ' + rule.tries + '번 틀려서 ' + rule.minutes + '분 동안 잠겼어요.' };
    }
    p.setProperty('ADMIN_FAILS', String(fails));
    return { ok: false, code: 'BADPW', msg: '관리자 비밀번호가 맞지 않아요. 남은 기회는 ' + (rule.tries - fails) + '번이에요.' };
  });
  if (!res.ok) {
    Utilities.sleep(1200);
    throw userError_(res.msg, res.code);
  }
}

function checkAdmin_(token) {
  var o = readToken_(token, 'A');
  return !!(o && o.v === pwVer_('admin'));
}

// ---------------------------------------------------------------- 개인 번호 만들기

/** 무작위 4자리. 쉬운 번호(0000, 1234 등)는 피한다. */
function newPin_() {
  var bad = { '0000': 1, '1111': 1, '2222': 1, '3333': 1, '4444': 1, '5555': 1, '6666': 1, '7777': 1, '8888': 1, '9999': 1, '1234': 1, '4321': 1, '0123': 1, '9876': 1 };
  for (var n = 0; n < 50; n++) {
    var hex = Utilities.getUuid().replace(/[^0-9a-f]/gi, '');
    var v = parseInt(hex.slice(0, 7), 16);
    if (v >= 268430000) continue; // 0~268429999 만 써서 10000으로 나눈 나머지가 고르게
    var pin = ('000' + (v % 10000)).slice(-4);
    if (!bad[pin]) return pin;
  }
  throw new Error('번호를 만들지 못했어요');
}

/** 번호를 새로 정한다. 원래 숫자는 돌려주기만 하고 어디에도 저장하지 않는다. */
function assignPin_(row, actor) {
  var pin = newPin_();
  var salt = Utilities.getUuid();
  setCellsNoLog_('교직원', row, {
    '개인번호해시': pinHash_(pin, salt),
    '솔트': salt,
    '틀린 횟수': '0',
    '잠금 해제 시각': '',
    '번호 바꾼 날': String(Date.now())
  });
  writeLog_(actor, '교직원', row['교직원ID'], '번호 다시 정함', row['이름'] + ' 선생님 개인 번호를 새로 만듦(번호는 기록하지 않음)', null, null);
  return pin;
}

var SETTINGS_CACHE_ = null;

function settingsMap_() {
  if (SETTINGS_CACHE_) return SETTINGS_CACHE_;
  var m = {};
  settingDefs_().forEach(function (d) { m[d.key] = d.def; });
  try {
    readRows_('설정').forEach(function (r) { if (r['키']) m[r['키']] = r['값']; });
  } catch (e) {
    if (e.code !== 'SETUP') throw e;
  }
  SETTINGS_CACHE_ = m;
  return m;
}

function setting_(key) {
  var v = settingsMap_()[key];
  return v === undefined ? '' : v;
}

/** 설정 한 칸을 바꾸고 기록을 남긴다(잠금 안에서 부른다) */
function putSetting_(key, value, actor) {
  withLock_(function () {
    var rows = readRows_('설정');
    var row = null;
    rows.forEach(function (r) { if (r['키'] === key) row = r; });
    var sh = sheet_('설정');
    var before = row ? row['값'] : '';
    if (before === String(value)) return;
    if (row) {
      var col = headOf_('설정').indexOf('값') + 1; // 칸 위치는 머리글 이름으로(누가 칸을 끼워 넣어도)
      if (col < 1) throw userError_("설정 탭에 '값' 칸이 없어요. 전용 시트 메뉴 '1. 처음 설정'을 눌러 주세요.", 'SETUP');
      sh.getRange(row._row, col).setValue(cellWrite_(value));
    } else {
      var def = settingDefs_().filter(function (d) { return d.key === key; })[0];
      sh.appendRow(rowByHead_('설정', { '키': key, '값': value, '설명': def ? (def.note || def.label) : '' }));
    }
    dirty_('설정');
    writeLog_(actor, '설정', key, '수정', key + ' 바꿈', { '값': before }, { '값': String(value) });
  });
  SETTINGS_CACHE_ = null;
}

function adminSettingsGet_() {
  var m = settingsMap_();
  var list = settingDefs_().map(function (d) {
    return { key: d.key, label: d.label, type: d.type, note: d.note || '', unit: d.unit || '', min: d.min, max: d.max, options: d.options, value: m[d.key] };
  });
  // 학기 기간: 학년도마다 따로('학기' 탭, 2026-10-19 교사 결정). 지금 학년도와 다음 학년도를 함께 보여 준다
  var sy = Number(m['학년도']) || schoolYearOf_(todayYmd_());
  list.push({ key: '학기 기간', label: '학기 기간', type: 'semesters', value: [semesterView_(sy), semesterView_(sy + 1)] });
  return list;
}

function adminSettingsSave_(args, actor) {
  var values = args.values || {};
  var defs = settingDefs_();
  var clean = {};
  if ('학년도' in values && String(values['학년도']).trim() !== String(setting_('학년도'))) {
    // 학년도만 바꾸면 자료실 자료가 모두 보관함으로 간다 → 자료를 옮겨 적는 '새 학년도'에서만 바꾼다
    throw userError_("학년도는 관리자 › 새 학년도에서 바꿔요(지금 학년도 자료를 보관하고 고른 자료를 옮겨 적는 일과 함께 해요).");
  }
  defs.forEach(function (d) {
    if (!(d.key in values) || d.type === 'readonly') return;
    var v = values[d.key] === null || values[d.key] === undefined ? '' : String(values[d.key]).trim();
    if (d.type === 'text') v = cleanText_(v, 40, d.label, true);
    if (d.type === 'year') {
      if (!/^20\d\d$/.test(v)) throw userError_('학년도는 2026처럼 네 자리로 적어 주세요.');
    }
    if (d.type === 'date' && v && !isDate_(v)) throw userError_(d.label + josa_(d.label, '을', '를') + ' 날짜(예: 2026-03-02)로 골라 주세요.');
    if (d.type === 'int') {
      var n = Number(v);
      if (!/^\d+$/.test(v) || n < d.min || n > d.max) {
        throw userError_(d.label + ': ' + d.min + '~' + d.max + d.unit + ' 사이로 적어 주세요.');
      }
    }
    if (d.type === 'links') v = JSON.stringify(cleanLinks_(v));
    if (d.type === 'choice' && d.options.indexOf(v) < 0) throw userError_(d.label + josa_(d.label, '을', '를') + ' 다시 골라 주세요.');
    clean[d.key] = v;
  });
  var s1 = clean['1학기 시작일'] || setting_('1학기 시작일'), e1 = clean['1학기 끝일'] || setting_('1학기 끝일');
  var s2 = clean['2학기 시작일'] || setting_('2학기 시작일'), e2 = clean['2학기 끝일'] || setting_('2학기 끝일');
  if (s1 && e1 && s1 > e1) throw userError_('1학기 끝일이 시작일보다 앞에 있어요.');
  if (s2 && e2 && s2 > e2) throw userError_('2학기 끝일이 시작일보다 앞에 있어요.');
  if (e1 && s2 && e1 >= s2) throw userError_('1학기 끝일은 2학기 시작일보다 앞이어야 해요(겹치면 수업일수를 두 번 세요).');
  if (args.semesters) saveSemesters_(args.semesters, actor); // 학년도마다 학기 기간(먼저 확인하고 저장한다)
  Object.keys(clean).forEach(function (k) { putSetting_(k, clean[k], actor); });
  return adminSettingsGet_();
}

function isDate_(v) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
  var d = new Date(v + 'T00:00:00Z');
  return !isNaN(d) && d.toISOString().slice(0, 10) === v;
}

function cleanLinks_(v) {
  var list;
  try { list = typeof v === 'string' ? JSON.parse(v || '[]') : v; } catch (e) { list = []; }
  if (!Array.isArray(list)) list = [];
  if (list.length > 12) throw userError_('바로가기는 12개까지 둘 수 있어요.');
  return list.filter(function (x) { return x && (x.name || x.url); }).map(function (x) {
    var name = cleanText_(x.name, 20, '바로가기 이름', true);
    var url = cleanText_(x.url, 500, '바로가기 주소', true);
    if (!/^https:\/\//.test(url)) throw userError_('바로가기 주소는 https:// 로 시작해야 해요.');
    return { name: name, url: url };
  });
}

function adminCategorySave_(args, actor) {
  var kind = String(args.kind || '');
  var name = cleanText_(args.name, 20, '분류 이름', true);

  var rows = liveRows_('분류');

/** 휴대폰 번호 같은지(010-1234-5678·01012345678 등). 내선은 모두에게 보이니 개인 연락처가 들어가지 않게 */
function looksPhone_(s) {
  var d = String(s || '').replace(/\D/g, '');
  return d.length >= 10 && /^0?1[016789]/.test(d);
}

function adminStaffSave_(args, actor) {
  var f = args.fields || {};
  var rec = {
    '이름': cleanText_(f['이름'], 20, '이름', true),
    '직위': cleanText_(f['직위'], 20, '직위'),
    '소속': cleanText_(f['소속'], 30, '소속'),
    '부서ID': cleanText_(f['부서ID'], 20, '부서'),
    '담당 업무': cleanText_(f['담당 업무'], 200, '담당 업무'),
    '내선': cleanText_(f['내선'], 15, '내선'),
    '역할': f['역할'] === '관리' ? '관리' : '일반',
    '순서': cleanText_(f['순서'], 4, '순서')
  };
  if (looksPhone_(rec['내선'])) throw userError_('휴대폰 번호 같아요. 내선 칸은 모든 선생님께 보여서 학교 내선만 적어 주세요.');
  if (rec['내선'] && !/^[0-9\-]+$/.test(rec['내선'])) throw userError_('내선은 숫자와 - 만 적어 주세요. (개인 연락처는 넣지 않아요)');
  if (rec['순서'] && !/^\d+$/.test(rec['순서'])) throw userError_('순서는 숫자로 적어 주세요.');
  if (rec['부서ID'] && !categoryNames_('부서')[rec['부서ID']]) throw userError_('부서를 다시 골라 주세요.');
  var rows = liveRows_('교직원');
  var dup = rows.filter(function (r) {
    return r['이름'] === rec['이름'] && r['소속'] === rec['소속'] && r['교직원ID'] !== args.id;
  });
  if (dup.length) throw userError_('같은 이름과 소속의 교직원이 이미 있어요. 소속을 다르게 적어 구분해 주세요.');
  var depts = categoryNames_('부서');
  if (args.id) {
    var row = findRow_('교직원', args.id);
    if (!row || row['삭제 여부']) throw userError_('교직원을 찾지 못했어요. 화면을 새로 고쳐 주세요.');
    var saved = updateRow_('교직원', args.id, rec, actor, rec['이름'] + ' 선생님 정보 고침');

  }
  rec['사용 여부'] = '사용';
  rec['틀린 횟수'] = '0';

function adminStaffSetActive_(args, actor) {

  return staffAdminView_(findRow_('교직원', row['교직원ID']), categoryNames_('부서'));

function adminStaffResetPin_(args, actor) {
  return withLock_(function () {
    var row = findRow_('교직원', String(args.id || ''));

/** 번호가 없는 사용 중인 분 모두에게 번호를 만든다. 종이로 나눠 줄 목록을 한 번만 돌려준다. */
function adminStaffIssueMissing_(args, actor) {
  return withLock_(function () {
    var list = [];
    sortStaff_(liveRows_('교직원')).forEach(function (row) {

function adminStaffUnlock_(args, actor) {

// ---------------------------------------------------------------- 수정 기록

function adminLogList_(args) {
  var tab = String(args.tab || '');
  var rows = tailRows_('기록', 5000); // 기록은 계속 늘어서 끝 5000줄만 본다(최근 200개를 보여 준다)
  var out = [];
  for (var i = rows.length - 1; i >= 0 && out.length < 200; i--) {
    var r = rows[i];
    if (tab && r['탭'] !== tab) continue;
    out.push({
      time: r['시각'], who: r['이름'], tab: r['탭'], target: r['대상ID'], action: r['동작'], summary: r['요약'],
      before: safeJson_(r['바뀌기 전']), after: safeJson_(r['바뀐 뒤'])
    });
  }
  return out;
}

function safeJson_(s) {
  if (!s) return null;
  try { return JSON.parse(s); } catch (e) { return null; }
}

// ---------------------------------------------------------------- 점검 (관리자): 파일·시트·비밀번호·백업·설정을 한 번에

/**
 * args.client = { app, styles, index, table } : 화면 파일의 판 표시(화면이 보낸다. table: 취합 시트 화면 TableUi.html)
 * 돌려주는 값: { build, at, items: [{ group, label, state: 'ok'|'warn'|'bad', detail, fix }] }
 */
function adminCheck_(args) {
  var items = [];
  var add = function (group, label, state, detail, fix) { items.push({ group: group, label: label, state: state, detail: detail || '', fix: fix || '' }); };
  var paste = function (f) { return "설치안내 표의 '" + f + "' 파일을 Copy raw file로 다시 붙여 넣고, 배포 관리 → 새 버전으로 배포해 주세요"; };

  // 1) 코드 파일(빠진 파일·예전 파일). 파일마다 있어야 할 판은 Code.gs의 fileBuilds_() 표에 있다
  var buildsFn = globalFn_('fileBuilds_');
  var builds = buildsFn ? buildsFn() : {};
  var want = function (f) { return builds[f] || APP_BUILD_; };
  // 판 표시가 없어도 이 파일의 함수가 있으면 판 표시를 넣기 전(2026-10-15)의 예전 파일이다
  var probe = { 'Code': 'api', 'Db': 'sheetValues_', 'Auth': 'checkLogin_', 'Admin': 'adminCheck_', 'Schedule': 'apiSchedMonth_',
    'Survey': 'apiSurveyList_', 'Library': 'apiLibList_', 'Help': 'apiHelpList_', 'Setup': 'setupAll_', 'Table': 'apiTableList_' };
  ['Code', 'Db', 'Auth', 'Admin', 'Schedule', 'Survey', 'Library', 'Help', 'Setup', 'Table'].forEach(function (f) {
    var mark = globalFn_('fileMark_' + f + '_');
    if (!mark && globalFn_(probe[f])) add('코드 파일', f + '.gs', 'warn', '판 표시가 없는 예전 파일이에요(기능은 돌아가요)', paste(f));
    else if (!mark) add('코드 파일', f + '.gs', 'bad', '파일이 없거나 내용이 비어 있어요', paste(f));
    else if (f === 'Code' && !buildsFn) add('코드 파일', 'Code.gs', 'warn', '예전 판이에요(' + mark() + ')', paste(f));
    else if (mark() !== want(f)) add('코드 파일', f + '.gs', 'warn', '예전 판이에요(' + mark() + ')', paste(f));
    else add('코드 파일', f + '.gs', 'ok', '최신 판 ' + mark());
  });
  var c = (args && args.client) || {};
  [['App.html', c.app], ['Styles.html', c.styles], ['Index.html', c.index], ['TableUi.html', c.table]].forEach(function (x) {

    else if (!x[1]) add('코드 파일', x[0], 'warn', '판 표시를 찾지 못했어요(예전 파일일 수 있어요)', paste(f));
    else if (x[1] !== want(f)) add('코드 파일', x[0], 'warn', '예전 판이에요(' + x[1] + ')', paste(f));
    else add('코드 파일', x[0], 'ok', '최신 판 ' + x[1]);

  var routes = routes_(), missing = [], n = 0;

  else add('코드 파일', '기능 연결', 'ok', '기능 ' + n + '개가 모두 연결됐어요');

  // 2) 시트 탭·칸 (나중에 더한 탭·칸 중 처음 쓸 때 저절로 생기는 것은 없어도 괜찮다)
  var tabs = tabs_(), bad = 0;

    '시트양식': '취합 시트의 양식을 처음 저장할 때 저절로 생겨요', '학기': '학기 기간을 처음 넣을 때 저절로 생겨요(그 전에는 예전 설정 값을 써요)' }, notYet = 0;
  var autoCols = { // 저장할 때 ensureCols_가 붙이는 칸

    '일정': { cols: ['중요'], when: '일정을 저장할 때' },
    '자료': { cols: ['파일 이름', '파일 크기', '홈에 보이기', '원본 자료ID', '공통', '공통 순서'], when: '자료를 저장할 때' },
    '도움말': { cols: ['파일ID', '파일 이름', '파일 크기'], when: '도움말을 저장할 때' },
    '조사': { cols: ['설명', '결과 공개'], when: '조사를 저장할 때' },
    '함께표': { cols: ['문서ID', '시트 이름', '시트 순서', '보기', '시트 지움', '문서 판'], when: '취합 시트를 저장할 때' },
    '함께표줄': { cols: ['서식', '높이'], when: '취합 시트에 서식을 넣을 때' }
  };
  Object.keys(tabs).forEach(function (tab) {
    var head;
    try { head = headRowOnly_(tab); } catch (e) {
      if (autoTabs[tab]) { notYet++; add('시트', tab + ' 탭', 'ok', '아직 없어요 · ' + autoTabs[tab]); return; }
      bad++;
      add('시트', tab + ' 탭', 'bad', '탭이 없어요', "전용 시트 메뉴 '온라인 교무실 → 1. 처음 설정'을 눌러 주세요");

    }
  });
  if (!bad) add('시트', '탭과 칸', 'ok', '탭 ' + (Object.keys(tabs).length - notYet) + '개와 칸이 모두 있어요');
  try {
    var vals = sheetValues_('교직원');
    var blank = 0;
    for (var i = 1; i < vals.length; i++) if (!vals[i].some(function (v) { return String(v) !== ''; })) blank++;
    if (blank) add('시트', '교직원 탭 빈 줄', 'warn', '시트에서 직접 비운 줄이 ' + blank + '개 있어요. 앱은 건너뛰지만 기록에는 남지 않았어요', "앞으로는 줄을 지우지 말고 웹앱 교직원 표에서 '사용 안 함'으로 바꿔 주세요");
  } catch (e) { /* 탭이 없으면 위에서 알렸다 */ }

  // 3) 비밀번호
  add('비밀번호', '공통 비밀번호', hasPassword_('common') ? 'ok' : 'bad', hasPassword_('common') ? '정해져 있어요' : '아직 없어요', "전용 시트 메뉴 '2. 공통 비밀번호 정하기'");
  add('비밀번호', '관리자 비밀번호', hasPassword_('admin') ? 'ok' : 'bad', hasPassword_('admin') ? '정해져 있어요' : '아직 없어요', "전용 시트 메뉴 '3. 관리자 비밀번호 정하기'");
  var lf = globalFn_('loginFails_') ? loginFails_() : { n: 0 };

  else if (!trig) add('백업', '매일 자동 백업', 'warn', '꺼져 있어요 · 마지막 백업 ' + lastText, "전용 시트 메뉴 '4. 매일 자동 백업 켜기'");

  else add('백업', '매일 자동 백업', 'ok', '켜져 있어요 · 마지막 백업 ' + lastText);

  var memoOk = false;

  return { build: APP_BUILD_, at: nowText_(), items: items };
