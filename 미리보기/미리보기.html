}

/**
 * 날짜 글자 → 'yyyy-MM-dd'. 연도가 없으면 학년도로 채운다(3~12월 = 학년도, 1·2월 = 다음 해)
 * 읽는 모양: 2026-03-02, 2026.3.2., 2026/3/2, 2026년 3월 2일, 3/2, 3.2.(월), 3월 2일, 엑셀 날짜 숫자(46083)
 * 돌려주는 값: { ymd } 또는 { err }
 */
var DAY_NAMES_ = ['일', '월', '화', '수', '목', '금', '토'];

/**
 * 날짜 칸 읽기 → { ymd, guessed(연도를 학년도로 채움), shifted(요일에 맞춰 다음 해로), warn } 또는 { err }
 * '3. 2.(화)'처럼 연도가 없으면 학년도 설정으로 채운다. 적힌 요일이 맞지 않으면 다음 해(새 학년도 일정을 미리 올릴 때)를 맞춰 보고,
 * 그래도 다르면 확인 필요로 알린다
 */
function parseDay_(v, schoolYear) {
  var raw = String(v || '').trim();
  var wm = /\(\s*(월|화|수|목|금|토|일)(?:요일)?\s*\)|(월|화|수|목|금|토|일)요일\s*$/.exec(raw);
  var wday = wm ? DAY_NAMES_.indexOf(wm[1] || wm[2]) : -1;
  var s = raw.replace(/\([^)]*\)/g, '').replace(/\s*(월|화|수|목|금|토|일)요일\s*$/, '').trim().replace(/\.$/, '');
  if (!s) return { err: '' };
  var y, m, d, hit, guessed = false;
  if (/^\d{5}(\.\d+)?$/.test(s)) {
    var t = Date.UTC(1899, 11, 30) + Math.floor(Number(s)) * 86400000;
    return { ymd: utcToYmd_(t) };
  }
  if ((hit = /^(\d{4})\s*[-.\/년]\s*(\d{1,2})\s*[-.\/월]\s*(\d{1,2})\s*일?$/.exec(s))) { y = +hit[1]; m = +hit[2]; d = +hit[3]; }
  else if ((hit = /^(\d{1,2})\s*[-.\/월]\s*(\d{1,2})\s*일?$/.exec(s))) { m = +hit[1]; d = +hit[2]; y = m >= 3 ? schoolYear : schoolYear + 1; guessed = true; }
  else return { err: '날짜를 읽지 못했어요' };
  var fmt = function (yy) { return yy + '-' + ('0' + m).slice(-2) + '-' + ('0' + d).slice(-2); };
  var ymd = fmt(y);
  if (!isDate_(ymd) && !(guessed && wday >= 0 && isDate_(fmt(y + 1)))) return { err: '없는 날짜예요(' + m + '월 ' + d + '일)' };
  if (wday >= 0 && (!isDate_(ymd) || weekday_(ymd) !== wday)) {
    if (guessed && isDate_(fmt(y + 1)) && weekday_(fmt(y + 1)) === wday) {
      return { ymd: fmt(y + 1), guessed: true, shifted: true,
        warn: '적힌 요일(' + DAY_NAMES_[wday] + ')에 맞춰 ' + (y + 1) + '년으로 읽었어요. 다음 학년도 일정이면 학년도 설정도 확인해 주세요' };
    }
    if (isDate_(ymd)) return { ymd: ymd, guessed: guessed, warn: '요일이 맞지 않아요: ' + y + '년 ' + m + '월 ' + d + '일은 ' + DAY_NAMES_[weekday_(ymd)] + '요일이에요' };
    return { err: '없는 날짜예요(' + m + '월 ' + d + '일)' };
  }
  return { ymd: ymd, guessed: guessed };
}

/** '3·4학년', '3~6', '전교', '교직원' → '3,4' 같은 저장 글자 */
function parseTargetText_(v) {
  var s = String(v || '').trim();
  if (/^(전|모든)?(교직원|교원|교사)(전체|모두)?$/.test(s.replace(/[\s·,()]/g, ''))) return '교직원'; // 전교직원·전 교직원·교직원 전체 = 교직원만
  if (!s || /전체|전교|전학년/.test(s)) return /교직원|교원|교사/.test(s) ? '전체,교직원' : '전체';
  var list = [];
  s.replace(/([1-6])\s*[~\-–]\s*([1-6])/g, function (all, a, b) {
    for (var g = +a; g <= +b; g++) list.push(String(g));
    return '';
  }).replace(/[1-6]/g, function (g) { list.push(g); return ''; });
  if (/교직원|교원|교사/.test(s)) list.push('교직원');
  return cleanTarget_(list) || '';
}

function parseKind_(v) {
  var s = String(v || '').replace(/\s/g, '');
  if (!s) return '';
  if (/공휴/.test(s)) return '공휴일';
  if (/휴업|휴교|재량/.test(s)) return '휴업일';
  if (/교육활동|활동|교육/.test(s)) return '교육활동';
  if (/행사/.test(s)) return '행사';
  return null;
}

function titleKey_(s) {
  return String(s || '').replace(/\s+/g, '').toLowerCase();
}

/** 마지막으로 올린 묶음(되돌리기용). 바꾼(숨긴) 행사 ID 목록은 길 수 있어 LAST_UPLOAD_R1, R2…에 나눠 둔다(속성 한 칸 9KB 한도) */
function lastUpload_() {
  var p = PropertiesService.getScriptProperties();
  var s = p.getProperty('LAST_UPLOAD');
  var info = s ? safeParse_(s, null) : null;
  if (info && info.parts) {
    var txt = '';
    for (var i = 1; i <= info.parts; i++) txt += p.getProperty('LAST_UPLOAD_R' + i) || '';
    info.replaced = safeParse_(txt, []);
  }
  return info;
}

function saveLastUpload_(info) {
  var p = PropertiesService.getScriptProperties();
  var old = safeParse_(p.getProperty('LAST_UPLOAD') || '', null);
  var rep = JSON.stringify(info.replaced || []), parts = [];
  for (var i = 0; i < rep.length; i += 8000) parts.push(rep.slice(i, i + 8000));
  parts.forEach(function (x, j) { p.setProperty('LAST_UPLOAD_R' + (j + 1), x); });
  for (var k = parts.length + 1; k <= ((old && old.parts) || 0); k++) p.deleteProperty('LAST_UPLOAD_R' + k);
  var head = {};
  Object.keys(info).forEach(function (key) { if (key !== 'replaced') head[key] = info[key]; });
  head.parts = parts.length;
  p.setProperty('LAST_UPLOAD', JSON.stringify(head));
}

/**
 * 줄마다 읽고 확인한다.
 * 줄 상태: ok(그대로 올림) / warn(확인 필요, 올릴 수는 있음) / error(올릴 수 없음)
 * dup: '' | 'dept'(부서가 넣은 같은 행사 → 늘 건너뜀) | 'upload'(전에 올린 같은 행사 → 건너뛰기·바꾸기) | 'file'(파일 안에 같은 줄)
 */
function uploadCheck_(rows) {
  var sy = Number(setting_('학년도')) || Number(todayYmd_().slice(0, 4));
  var deptIds = {};
  catOptions_('부서').forEach(function (d) { deptIds[normHead_(d.name)] = d.id; deptIds[normHead_(d.name).replace(/부$/, '')] = deptIds[normHead_(d.name).replace(/부$/, '')] || d.id; });
  var deptNames = categoryNames_('부서');
  var existing = {};
  liveRows_('일정').forEach(function (e) { (existing[e['시작일'] + '|' + titleKey_(e['행사명'])] = existing[e['시작일'] + '|' + titleKey_(e['행사명'])] || []).push(e); });
  var seen = {};
  return rows.map(function (raw, i) {
    var msgs = [], status = 'ok', dup = '';
    var warn = function (t) { msgs.push(t); if (status === 'ok') status = 'warn'; };
    var fail = function (t) { msgs.push(t); status = 'error'; };
    var title = String(raw.title || '').trim();
    var a = parseDay_(raw.start, sy);
    var b = raw.end ? parseDay_(raw.end, sy) : { ymd: '' };
    if (a.shifted && b.ymd && b.guessed && !b.shifted) b.ymd = (Number(b.ymd.slice(0, 4)) + 1) + b.ymd.slice(4); // 끝나는 날도 같은 해로
    if (!a.ymd) fail(a.err || '날짜가 비어 있어요');
    if (raw.end && !b.ymd) fail('끝나는 날: ' + (b.err || '읽지 못했어요'));
    if (a.warn) warn(a.warn);
    if (b.warn && !a.shifted) warn('끝나는 날: ' + b.warn);
    if (!title) fail('행사명이 비어 있어요');
    var kind = parseKind_(raw.kind);
    if (kind === '') { kind = '행사'; warn("구분이 비어 있어서 '행사'로 넣어요"); }
    else if (kind === null) { kind = '행사'; warn("구분 '" + raw.kind + "'" + josa_(String(raw.kind), '을', '를') + " 몰라서 '행사'로 넣어요"); }
    var deptId = '';
    if (String(raw.dept || '').trim()) {
      deptId = deptIds[normHead_(raw.dept)] || deptIds[normHead_(raw.dept).replace(/부$/, '')] || '';
      if (!deptId) warn("부서 '" + raw.dept + "'" + josa_(String(raw.dept), '이', '가') + ' 분류에 없어서 비워 두고 넣어요');
    }
    var target = parseTargetText_(raw.target);
    if (String(raw.target || '').trim() && !target) { target = '전체'; warn("대상 '" + raw.target + "'" + josa_(String(raw.target), '을', '를') + " 읽지 못해서 '전체'로 넣어요"); }
    var important = /^(예|o|y|yes|중요|●|○|v|✓|✔|1|true)$/i.test(String(raw.important || '').trim());
    if (/^0?\.\d+$/.test(String(raw.time || '').trim())) { // 엑셀 시각 칸(하루의 몇 분의 몇) → 09:00
      var mins = Math.round(Number(raw.time) * 1440);
      raw.time = ('0' + Math.floor(mins / 60)).slice(-2) + ':' + ('0' + mins % 60).slice(-2);
    }
    var f = { start: a.ymd || '', end: b.ymd || '', time: raw.time, title: title, target: target || '전체', deptId: deptId, place: raw.place, kind: kind, memo: raw.memo, important: important };
    var rec = null;
    if (status !== 'error') {
      try { rec = cleanEvent_(f); } catch (e) { if (!e.userMessage) throw e; fail(e.userMessage); }
    }
    var example = /^\(?예시\)?/.test(title);
    if (example) warn('예시 줄이에요. 지우지 않았다면 빼고 올려요');
    if (rec) {
      var key = rec['시작일'] + '|' + titleKey_(rec['행사명']);
      var same = existing[key] || [];
      if (seen[key]) { dup = 'file'; warn('위의 ' + (seen[key] + 1) + '번째 줄과 같아요'); }
      else if (same.some(function (e) { return !e['올린 묶음ID']; })) { dup = 'dept'; warn('부서가 넣은 같은 행사가 있어서 건너뛰어요'); }
      else if (same.length) { dup = 'upload'; warn('전에 올린 같은 행사가 있어요'); }
      seen[key] = seen[key] === undefined ? i : seen[key];
    }
    var include = status !== 'error' && dup !== 'dept' && dup !== 'file' && !example;
    if (raw.include === false) include = false;
    else if (raw.include === true && status !== 'error' && dup !== 'dept') include = true;
    return {
      n: i + 1,
      raw: (function () { var o = {}; uploadCols_().forEach(function (k) { o[k] = raw[k] === undefined || raw[k] === null ? '' : String(raw[k]); }); return o; })(),
      start: f.start, end: f.end, title: title, target: f.target, dept: deptNames[deptId] || '', deptId: deptId, kind: kind, important: important,
      time: String(raw.time || ''), place: String(raw.place || ''), memo: String(raw.memo || ''),
      status: status, msgs: msgs, dup: dup, include: include,
      dupIds: rec ? (existing[rec['시작일'] + '|' + titleKey_(rec['행사명'])] || []).filter(function (e) { return e['올린 묶음ID']; }).map(function (e) { return e['일정ID']; }) : []
    };
  });
}

/** 올릴 줄과 바꿀(숨길) 전 행사 */
function uploadPlan_(checked, mode) {
  var add = [], replace = [], skipped = 0;
  checked.forEach(function (r) {
    if (!r.include || r.status === 'error' || r.dup === 'dept') { skipped++; return; }
    if (r.dup === 'upload') {
      if (mode !== 'replace') { skipped++; return; }
      replace = replace.concat(r.dupIds);
    }
    add.push(r);
  });
  return { add: add, replace: replace, skipped: skipped };
}

function uploadRec_(r, batch) {
  var rec = cleanEvent_({ start: r.start, end: r.end, time: r.time, title: r.title, target: r.target, deptId: r.deptId, place: r.place, kind: r.kind, memo: r.memo, important: r.important });
  rec['올린 묶음ID'] = batch;
  return rec;
}

/**
 * args = { grid } (처음 읽을 때) 또는 { rows } (미리보기에서 고친 뒤), mode: 'skip' | 'replace'
 */
function apiUploadCheck_(args, actor, ctx) {
  requireManage_(ctx);
  var rows = args.grid ? gridToRows_(args.grid) : (args.rows || []);
  if (rows.length > 1000) throw userError_('한 번에 1000줄까지 올릴 수 있어요. 나눠서 올려 주세요.');
  var checked = uploadCheck_(rows);
  var plan = uploadPlan_(checked, args.mode);
  var sy = Number(setting_('학년도')) || Number(todayYmd_().slice(0, 4));
  var skip = {};
  plan.replace.forEach(function (id) { skip[id] = true; });
  var addOff = plan.add.filter(function (r) { return r.kind === '휴업일' || r.kind === '공휴일'; })
    .map(function (r) { return { '시작일': r.start, '끝일': r.end, '구분': r.kind, '행사명': r.title }; });
  return {
    rows: checked,
    counts: {
      total: checked.length,
      warn: checked.filter(function (r) { return r.status === 'warn'; }).length,
      error: checked.filter(function (r) { return r.status === 'error'; }).length,
      dupUpload: checked.filter(function (r) { return r.dup === 'upload'; }).length,
      add: plan.add.length,
      replace: plan.replace.length
    },
    days: { now: semesterDays_(sy), after: semesterDays_(sy, { add: addOff, skip: skip }) },
    last: lastUpload_()
  };
}

function apiUploadSave_(args, actor, ctx) {
  requireManage_(ctx);
  actor = manageActor_(actor);
  var rows = args.rows || [];
  if (rows.length > 1000) throw userError_('한 번에 1000줄까지 올릴 수 있어요. 나눠서 올려 주세요.');
  var mode = args.mode === 'replace' ? 'replace' : 'skip';
  return withLock_(function () {
    ensureCols_('일정');
    var plan = uploadPlan_(uploadCheck_(rows), mode);
    if (!plan.add.length) throw userError_('올릴 행사가 없어요. 미리보기에서 넣을 줄을 골라 주세요.');
    var batch = 'B' + Utilities.formatDate(new Date(), tz_(), 'yyyyMMddHHmmss');
    var recs = plan.add.map(function (r) { return uploadRec_(r, batch); });
    if (plan.replace.length) updateRowsSame_('일정', plan.replace, { '삭제 여부': '삭제' }, actor, '학사일정 올리기(' + batch + '): 전에 올린 같은 행사 ' + plan.replace.length + '개를 바꿈', '삭제');
    insertRows_('일정', recs, actor, '학사일정 올리기(' + batch + '): 행사 ' + recs.length + '개');
    var info = { batch: batch, count: recs.length, replaced: plan.replace, at: nowText_(), by: actor.name || '' };
    saveLastUpload_(info);
    return { batch: batch, added: recs.length, replaced: plan.replace.length, skipped: plan.skipped, last: info };
  });
}

/** 방금(마지막으로) 올린 묶음만 되돌린다: 올린 행사는 숨김 삭제, 바꿨던 전 행사는 되살림 */
function apiUploadUndo_(args, actor, ctx) {
  requireManage_(ctx);
  actor = manageActor_(actor);
  return withLock_(function () {
    var last = lastUpload_();
    if (!last || last.batch !== args.batch || last.undone) throw userError_('방금 올린 것만 되돌릴 수 있어요. 화면을 새로 고쳐 주세요.');
    var ids = liveRows_('일정').filter(function (e) { return e['올린 묶음ID'] === last.batch; }).map(function (e) { return e['일정ID']; });
    var removed = updateRowsSame_('일정', ids, { '삭제 여부': '삭제' }, actor, '학사일정 올리기 되돌림(' + last.batch + '): ' + ids.length + '개 숨김', '삭제');
    var restored = updateRowsSame_('일정', last.replaced || [], { '삭제 여부': '' }, actor, '학사일정 올리기 되돌림(' + last.batch + '): 바꿨던 행사 되살림', '되살리기');
    last.undone = true;
    saveLastUpload_(last);
    return { removed: removed, restored: restored };
  });
}

function apiUploadInfo_(args, actor, ctx) {
  requireManage_(ctx);
  return { last: lastUpload_(), depts: deptOptions_(), year: setting_('학년도') };
}

/* ===== Survey.gs ===== */
/**
 * Survey.gs — 조사·신청
 *
 * - 조사: 제목·설명·담당 부서·대상·마감 일시·질문(JSON)·메신저 문구·결과 공개
 * - 대상(JSON): {"type":"all"} | {"type":"dept","ids":[부서ID]} | {"type":"grade","grades":["3"]} | {"type":"people","ids":[교직원ID]}
 * - 질문 종류: one(하나 고르기) many(여러 개) short(짧은 글) long(긴 글) number(숫자) date(날짜)
 * - 응답: 한 사람이 한 조사에 한 줄. 다시 내면 새 줄이 아니라 고치기.
 * - 다시 알리기: '알림' 탭에 안 낸 분마다 한 줄 → 그분 홈 '내가 할 일' 맨 위
 * - 결과(누가 뭐라고 답했는지): 만든 사람·관리자, 그리고 '결과 공개'를 켠 조사는 대상 교직원 모두
 */

function fileMark_Survey_() { return '2026-10-16e'; } // 판 표시(관리자 › 점검)

function qTypes_() {
  return { one: '하나 고르기', many: '여러 개 고르기', short: '짧은 글', long: '긴 글', number: '숫자', date: '날짜' };
}

// ---------------------------------------------------------------- 도구

function safeParse_(s, fallback) {
  try { var v = JSON.parse(s); return v === null || v === undefined ? fallback : v; } catch (e) { return fallback; }
}

var NOW_MIN_MEMO_ = { at: 0, v: '' }; // 조사마다 날짜 형식을 부르지 않게 1초 동안 같은 값을 쓴다
function nowMin_() {
  var t = Date.now();
  if (t - NOW_MIN_MEMO_.at > 1000 || t < NOW_MIN_MEMO_.at) NOW_MIN_MEMO_ = { at: t, v: Utilities.formatDate(new Date(t), tz_(), 'yyyy-MM-dd HH:mm') };
  return NOW_MIN_MEMO_.v;
}

/** 끝났는지: 손으로 끝냈거나 마감이 지났으면 */
function surveyClosed_(s) {
  return s['상태'] === '끝남' || (s['마감 일시'] && s['마감 일시'] <= nowMin_());
}

function gradeOf_(staff) {
  var m = /(\d)\s*학년/.exec(staff['소속'] || '');
  return m ? m[1] : '';
}

function activeStaff_() {
  return liveRows_('교직원').filter(function (r) { return r['사용 여부'] !== '사용 안 함'; });
}

/** 대상에 드는 사용 중인 교직원 행 */
function targetStaff_(target, staff) {
  var t = target || { type: 'all' };
  return (staff || activeStaff_()).filter(function (r) {
    if (t.type === 'dept') return (t.ids || []).indexOf(r['부서ID']) >= 0;
    if (t.type === 'grade') return (t.grades || []).indexOf(gradeOf_(r)) >= 0;
    if (t.type === 'people') return (t.ids || []).indexOf(r['교직원ID']) >= 0;
    return true;
  });
}

function targetText_(t, depts, names) {
  t = t || { type: 'all' };
  if (t.type === 'dept') return (t.ids || []).map(function (id) { return depts[id] || '(지운 부서)'; }).join('·');
  if (t.type === 'grade') return (t.grades || []).map(function (g) { return g + '학년'; }).join('·');
  if (t.type === 'people') return (t.ids || []).length + '명 직접 고름';
  return '전체 교직원';
}

function canEditSurvey_(s, ctx) {
  if (canManage_(ctx)) return true;
  return !!(ctx.identity && s['입력자ID'] && s['입력자ID'] === ctx.identity['교직원ID']);
}

function liveResponses_(surveyId) {
  return liveRows_('응답').filter(function (r) { return r['조사ID'] === surveyId; });
}

/** 마감 글: 10월 14일(수) 17:00 */
function deadlineText_(d) {
  if (!d) return '';
  var day = d.slice(0, 10);
  return Number(day.slice(5, 7)) + '월 ' + Number(day.slice(8, 10)) + '일(' + '일월화수목금토'.charAt(weekday_(day)) + ') ' + d.slice(11, 16);
}

function defaultMessenger_(title, deptName, deadline) {
  return (deptName ? '[' + deptName + '] ' : '') + title + josa_(title, '을', '를') + ' ' + deadlineText_(deadline) + '까지 내 주세요.\n' +
    '온라인 교무실 › 조사·신청에서 바로 낼 수 있어요.';
}

// ---------------------------------------------------------------- 목록

/** 카드에 쓰는 조사 요약 */
function surveyCard_(s, ctx, cache) {
  var target = safeParse_(s['대상'], { type: 'all' });
  var tStaff = targetStaff_(target, cache.staff);
  var tIds = {};
  tStaff.forEach(function (r) { tIds[r['교직원ID']] = true; });
  var resp = cache.resp[s['조사ID']] || [];
  var done = resp.filter(function (r) { return tIds[r['교직원ID']]; }).length;
  var me = ctx.identity ? ctx.identity['교직원ID'] : '';
  var mine = resp.filter(function (r) { return r['교직원ID'] === me; })[0];
  var qs = safeParse_(s['질문'], []);
  var closed = surveyClosed_(s);
  return {
    id: s['조사ID'],
    title: s['제목'],
    dept: cache.depts[s['부서ID']] || '',
    deadline: s['마감 일시'],
    deadlineText: deadlineText_(s['마감 일시']),
    closed: closed,
    closedEarly: s['상태'] === '끝남',
    targetText: targetText_(target, cache.depts, cache.names),
    targetCount: tStaff.length,
    doneCount: done,
    inTarget: !!tIds[me],
    answered: !!mine,
    answeredAt: mine ? (mine['고친 시각'] || mine['낸 시각']) : '',
    qCount: qs.length,
    by: cache.names[s['입력자ID']] || '',
    byId: s['입력자ID'],
    createdAt: s['입력 시각'],
    canEdit: canEditSurvey_(s, ctx),
    showResults: s['결과 공개'] === '예',
    reminded: !!(me && cache.remind[s['조사ID'] + '/' + me])
  };
}

function surveyCache_() {
  var resp = {};
  liveRows_('응답').forEach(function (r) { (resp[r['조사ID']] = resp[r['조사ID']] || []).push(r); });
  var remind = {};
  liveRows_('알림').forEach(function (r) { remind[r['조사ID'] + '/' + r['대상 교직원ID']] = r['알린 시각'] || r['입력 시각']; });
  return { staff: activeStaff_(), resp: resp, remind: remind, depts: categoryNames_('부서'), names: staffNames_() };
}

/** 내가 낼 조사(열려 있고, 대상이고, 아직 안 냄). 다시 알림 받은 것 → 마감 가까운 순 */
function todoList_(ctx, cache) {
  if (!ctx.identity) return [];
  cache = cache || surveyCache_();
  return liveRows_('조사').map(function (s) { return surveyCard_(s, ctx, cache); })
    .filter(function (c) { return !c.closed && c.inTarget && !c.answered; })
    .sort(function (a, b) {
      if (a.reminded !== b.reminded) return a.reminded ? -1 : 1;
      return a.deadline < b.deadline ? -1 : a.deadline > b.deadline ? 1 : 0;
    });
}

function apiSurveyList_(args, actor, ctx) {
  var cache = surveyCache_();
  var cards = liveRows_('조사').map(function (s) { return surveyCard_(s, ctx, cache); });
  var me = ctx.identity ? ctx.identity['교직원ID'] : '';
  var manage = canManage_(ctx);
  var byDeadline = function (a, b) { return a.deadline < b.deadline ? -1 : a.deadline > b.deadline ? 1 : 0; };
  var toAnswer = cards.filter(function (c) { return !c.closed && c.inTarget; }).sort(function (a, b) {
    if (a.answered !== b.answered) return a.answered ? 1 : -1;
    if (a.reminded !== b.reminded) return a.reminded ? -1 : 1;
    return byDeadline(a, b);
  });
  var mine = cards.filter(function (c) { return !c.closed && (c.byId === me || manage); }).sort(byDeadline);
  var past = cards.filter(function (c) { return c.closed && (c.inTarget || c.byId === me || manage); })
    .sort(function (a, b) { return byDeadline(b, a); });
  return {
    needIdentity: !ctx.identity,
    canManage: manage,
    toAnswer: toAnswer,
    mine: mine,
    past: past,
    todoCount: toAnswer.filter(function (c) { return !c.answered; }).length,
    now: nowMin_(),
    today: todayYmd_()
  };
}

// ---------------------------------------------------------------- 한 조사 보기

function apiSurveyGet_(args, actor, ctx) {
  var s = findRow_('조사', String(args.id || ''));
  if (!s || s['삭제 여부']) throw userError_('이 조사를 찾지 못했어요. 지워졌을 수 있어요.', 'NOTFOUND');
  var cache = surveyCache_();
  var card = surveyCard_(s, ctx, cache);
  var questions = safeParse_(s['질문'], []);
  var target = safeParse_(s['대상'], { type: 'all' });
  var resp = cache.resp[s['조사ID']] || [];
  var me = ctx.identity ? ctx.identity['교직원ID'] : '';
  var mine = resp.filter(function (r) { return r['교직원ID'] === me; })[0];
  var owner = card.canEdit;
  var out = {
    card: card,
    description: s['설명'],
    questions: questions,
    target: target,
    deptId: s['부서ID'],
    messenger: s['메신저 문구'] || defaultMessenger_(s['제목'], card.dept, s['마감 일시']),
    myAnswer: mine ? { answers: safeParse_(mine['답'], {}), note: mine['하고 싶은 말'], at: mine['고친 시각'] || mine['낸 시각'] } : null,
    owner: owner,
    canSeeResults: owner || (card.showResults && (card.inTarget || card.byId === me)),
    hasResponses: resp.length > 0
  };
  if (out.canSeeResults) {
    var tStaff = targetStaff_(target, cache.staff);
    var doneIds = {};
    resp.forEach(function (r) { doneIds[r['교직원ID']] = r; });
    var person = function (r) { return { id: r['교직원ID'], name: r['이름'], group: r['소속'], position: r['직위'] }; };
    out.notDone = owner ? sortStaff_(tStaff.filter(function (r) { return !doneIds[r['교직원ID']]; })).map(person) : [];
    var staffById = {};
    readRows_('교직원').forEach(function (r) { staffById[r['교직원ID']] = r; });
    out.responses = resp.map(function (r) {
      var st = staffById[r['교직원ID']] || {};
      return { name: st['이름'] || '(알 수 없음)', group: st['소속'] || '', answers: safeParse_(r['답'], {}), note: r['하고 싶은 말'], at: r['고친 시각'] || r['낸 시각'], edited: !!r['고친 시각'] };
    }).sort(function (a, b) { return a.at < b.at ? -1 : 1; });
    out.summary = summarize_(questions, out.responses);
    var presses = {}; // 알림 줄은 사람마다 하나씩이라, 누른 횟수는 알린 시각으로 센다
    if (owner) liveRows_('알림').forEach(function (r) { if (r['조사ID'] === s['조사ID']) presses[r['알린 시각']] = 1; });
    out.remindedCount = Object.keys(presses).length;
  }
  if (owner) out.depts = deptOptions_();
  return out;
}

/** 질문별 요약: 고르기는 선택지별 개수, 숫자는 합계·평균, 날짜는 날짜별 개수, 글은 답 모음 */
function summarize_(questions, responses) {
  return questions.map(function (q) {
    var vals = responses.map(function (r) { return r.answers[q.id]; }).filter(function (v) {
      return v !== undefined && v !== null && v !== '' && !(Array.isArray(v) && !v.length);
    });
    var out = { id: q.id, type: q.type, title: q.title, answered: vals.length };
    if (q.type === 'one' || q.type === 'many') {
      var counts = {};
      (q.options || []).forEach(function (o) { counts[o] = 0; });
      vals.forEach(function (v) { [].concat(v).forEach(function (o) { counts[o] = (counts[o] || 0) + 1; }); });
      out.counts = Object.keys(counts).map(function (k) { return { option: k, count: counts[k] }; });
    } else if (q.type === 'number') {
      var nums = vals.map(Number).filter(function (n) { return !isNaN(n); });
      var sum = nums.reduce(function (a, b) { return a + b; }, 0);
      out.sum = Math.round(sum * 100) / 100;
      out.avg = nums.length ? Math.round(sum / nums.length * 100) / 100 : null;
    } else if (q.type === 'date') {
      var dc = {};
      vals.forEach(function (v) { dc[v] = (dc[v] || 0) + 1; });
      out.counts = Object.keys(dc).sort().map(function (k) { return { option: k, count: dc[k] }; });
    } else {
      out.texts = vals.slice(0, 300);
    }
    return out;
  });
}

// ---------------------------------------------------------------- 만들기·고치기

function cleanQuestions_(list) {
  if (!Array.isArray(list) || !list.length) throw userError_('질문을 하나 이상 넣어 주세요.');
  if (list.length > 30) throw userError_('질문은 30개까지 넣을 수 있어요.');
  var types = qTypes_();
  var seen = {};
  return list.map(function (q, i) {
    var type = String(q.type || '');
    if (!types[type]) throw userError_((i + 1) + '번 질문의 종류를 골라 주세요.');
    var title = cleanText_(q.title, 200, (i + 1) + '번 질문', true);
    var id = /^q[0-9a-z]{1,12}$/.test(String(q.id || '')) && !seen[q.id] ? q.id : 'q' + Utilities.getUuid().replace(/-/g, '').slice(0, 8);
    seen[id] = true;
    var out = { id: id, type: type, title: title, required: !!q.required };
    if (type === 'one' || type === 'many') {
      var opts = (Array.isArray(q.options) ? q.options : String(q.options || '').split('\n'))
        .map(function (o) { return String(o).trim(); }).filter(Boolean);
      opts = opts.filter(function (o, k) { return opts.indexOf(o) === k; });
      if (opts.length < 2) throw userError_((i + 1) + '번 질문의 보기를 두 개 이상 적어 주세요.');
      if (opts.length > 30) throw userError_((i + 1) + '번 질문의 보기는 30개까지 적을 수 있어요.');
      opts.forEach(function (o) { if (o.length > 80) throw userError_((i + 1) + '번 질문의 보기는 80자까지 적을 수 있어요.'); });
      out.options = opts;
    }
    return out;
  });
}

function cleanTargetJson_(t) {
  t = t || {};
  var type = String(t.type || 'all');
  if (type === 'dept') {
    var depts = categoryNames_('부서');
    var ids = (t.ids || []).filter(function (id) { return depts[id]; });
    if (!ids.length) throw userError_('대상 부서를 하나 이상 골라 주세요.');
    return { type: 'dept', ids: ids };
  }
  if (type === 'grade') {
    var grades = (t.grades || []).map(String).filter(function (g) { return /^[1-6]$/.test(g); });
    if (!grades.length) throw userError_('대상 학년을 하나 이상 골라 주세요.');
    return { type: 'grade', grades: grades };
  }
  if (type === 'people') {
    var live = {};
    activeStaff_().forEach(function (r) { live[r['교직원ID']] = true; });
    var pids = (t.ids || []).filter(function (id) { return live[id]; });
    if (!pids.length) throw userError_('대상 교직원을 한 명 이상 골라 주세요.');
    return { type: 'people', ids: pids };
  }
  return { type: 'all' };
}

function apiSurveySave_(args, actor, ctx) {
  var f = args.fields || {};
  var title = cleanText_(f.title, 80, '조사 제목', true);
  var deptId = cleanText_(f.deptId, 20, '담당 부서');
  var depts = categoryNames_('부서');
  if (deptId && !depts[deptId]) throw userError_('담당 부서를 다시 골라 주세요.');
  var deadline = String(f.deadline || '');
  if (!/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(deadline) || !isDate_(deadline.slice(0, 10))) throw userError_('마감 날짜와 시각을 골라 주세요.');
  var questions = cleanQuestions_(f.questions);
  var target = cleanTargetJson_(f.target);
  var messenger = cleanText_(f.messenger, 500, '메신저 문구');
  // 자동 문구는 저장하지 않고 읽을 때 만든다(제목·마감을 고치면 문구도 따라 바뀌게). 직접 고쳐 쓴 문구만 저장한다
  var plain = function (t) { return String(t || '').replace(/\s+/g, ' ').trim(); };
  if (plain(messenger) === plain(defaultMessenger_(title, depts[deptId] || '', deadline))) messenger = '';
  var rec = {
    '제목': title,
    '설명': cleanText_(f.description, 1000, '설명'),
    '부서ID': deptId,
    '대상': JSON.stringify(target),
    '마감 일시': deadline,
    '질문': JSON.stringify(questions),
    '메신저 문구': messenger,
    '결과 공개': f.showResults ? '예' : ''
  };
  ensureCols_('조사');
  if (args.id) {
    var s = findRow_('조사', String(args.id));
    if (!s || s['삭제 여부']) throw userError_('이 조사를 찾지 못했어요.', 'NOTFOUND');
    if (!canEditSurvey_(s, ctx)) throw userError_('만든 분과 연구부장·부담당만 고칠 수 있어요.', 'FORBIDDEN');
    if (liveResponses_(s['조사ID']).length && !sameQuestions_(safeParse_(s['질문'], []), questions)) {
      throw userError_('이미 낸 답이 있어서 질문은 고칠 수 없어요. 제목·마감·대상·안내 문구만 고칠 수 있어요.', 'LOCKED');
    }
    if (plain(messenger) === plain(defaultMessenger_(s['제목'], depts[s['부서ID']] || '', s['마감 일시']))) rec['메신저 문구'] = ''; // 예전 자동 문구 그대로면 자동으로
    // '지금 끝내기'로 끝낸 조사는 마감을 전보다 늦췄을 때만 다시 연다(글만 고쳐 저장하면 끝난 그대로)
    if (s['상태'] === '끝남' && f.reopen && deadline > nowMin_() && deadline > String(s['마감 일시'] || '')) rec['상태'] = '진행 중';
    updateRow_('조사', s['조사ID'], rec, actor, '조사 고침: ' + title);
    return { id: s['조사ID'] };
  }
  if (deadline <= nowMin_()) throw userError_('마감은 지금보다 뒤로 정해 주세요.');
  rec['상태'] = '진행 중';
  var added = insertRow_('조사', rec, actor, '조사 만듦: ' + title);
  return { id: added['조사ID'] };
}

function sameQuestions_(a, b) {
  var key = function (list) {
    return JSON.stringify(list.map(function (q) { return [q.id, q.type, q.title, q.required, q.options || []]; }));
  };
  return key(a) === key(b);
}

// ---------------------------------------------------------------- 응답

function cleanAnswers_(questions, answers) {
  answers = answers || {};
  var out = {};
  questions.forEach(function (q, i) {
    var v = answers[q.id];
    var n = (i + 1) + '번 질문';
    var empty = v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length);
    if (empty) {
      if (q.required) throw userError_(n + '에 답해 주세요.');
      return;
    }
    if (q.type === 'one') {
      if ((q.options || []).indexOf(String(v)) < 0) throw userError_(n + '의 보기를 다시 골라 주세요.');
      out[q.id] = String(v);
    } else if (q.type === 'many') {
      var list = [].concat(v).map(String);
      list.forEach(function (o) { if ((q.options || []).indexOf(o) < 0) throw userError_(n + '의 보기를 다시 골라 주세요.'); });
      out[q.id] = q.options.filter(function (o) { return list.indexOf(o) >= 0; });
    } else if (q.type === 'number') {
      var s = String(v).trim().replace(/,/g, '');
      if (!/^-?\d+(\.\d+)?$/.test(s) || s.length > 15) throw userError_(n + '에는 숫자만 적어 주세요.');
      out[q.id] = s;
    } else if (q.type === 'date') {
      if (!isDate_(String(v))) throw userError_(n + '의 날짜를 골라 주세요.');
      out[q.id] = String(v);
    } else {
      out[q.id] = cleanText_(v, q.type === 'long' ? 2000 : 200, n);
    }
  });
  return out;
}

function apiSurveyRespond_(args, actor, ctx) {
  var me = ctx.identity['교직원ID'];
  return withLock_(function () {
    var s = findRow_('조사', String(args.id || ''));
    if (!s || s['삭제 여부']) throw userError_('이 조사를 찾지 못했어요. 지워졌을 수 있어요.', 'NOTFOUND');
    if (surveyClosed_(s)) throw userError_('마감된 조사예요. 더 이상 내거나 고칠 수 없어요.', 'CLOSED');
    var target = safeParse_(s['대상'], { type: 'all' });
    if (!targetStaff_(target).some(function (r) { return r['교직원ID'] === me; })) {
      throw userError_('이 조사의 대상이 아니에요. 만든 분께 여쭤봐 주세요.', 'FORBIDDEN');
    }
    var answers = cleanAnswers_(safeParse_(s['질문'], []), args.answers);
    // 조사마다 '긴 글' 질문으로 받으므로 화면에는 따로 칸이 없다. 예전 값은 그대로 둔다.
    var noteSent = args.note !== undefined && args.note !== null;
    var note = noteSent ? cleanText_(args.note, 500, '하고 싶은 말') : '';
    var now = nowText_();
    var old = liveResponses_(s['조사ID']).filter(function (r) { return r['교직원ID'] === me; })[0];
    if (old) {
      var patch = { '답': JSON.stringify(answers), '고친 시각': now };
      if (noteSent) patch['하고 싶은 말'] = note;
      updateRow_('응답', old['응답ID'], patch, actor, s['제목'] + ' 응답 고침');
      return { edited: true, at: now };
    }
    insertRow_('응답', { '조사ID': s['조사ID'], '교직원ID': me, '답': JSON.stringify(answers), '하고 싶은 말': note, '낸 시각': now }, actor, s['제목'] + ' 응답 냄');
    return { edited: false, at: now };
  });
}

function apiSurveyRemind_(args, actor, ctx) {
  var s = findRow_('조사', String(args.id || ''));
  if (!s || s['삭제 여부']) throw userError_('이 조사를 찾지 못했어요.', 'NOTFOUND');
  if (!canEditSurvey_(s, ctx)) throw userError_('만든 분과 연구부장·부담당만 알릴 수 있어요.', 'FORBIDDEN');
  if (surveyClosed_(s)) throw userError_('마감된 조사예요. 마감을 늦춘 뒤에 알려 주세요.');
  var done = {};
  liveResponses_(s['조사ID']).forEach(function (r) { done[r['교직원ID']] = true; });
  var targets = targetStaff_(safeParse_(s['대상'], { type: 'all' })).filter(function (r) { return !done[r['교직원ID']]; });
  if (!targets.length) return { count: 0 };
  var now = nowText_();
  insertRows_('알림', targets.map(function (r) {
    return { '조사ID': s['조사ID'], '대상 교직원ID': r['교직원ID'], '알린 시각': now };
  }), actor, s['제목'] + ': 안 낸 ' + targets.length + '명에게 다시 알림');
  return { count: targets.length };
}

/** CSV 글자(엑셀에서 한글이 깨지지 않게 화면에서 BOM을 붙인다) */
function apiSurveyCsv_(args, actor, ctx) {
  var d = apiSurveyGet_(args, actor, ctx);
  if (!d.canSeeResults) throw userError_('이 조사의 결과는 만든 분만 볼 수 있어요.', 'FORBIDDEN');
  var cell = function (v) {
    var t = Array.isArray(v) ? v.join(', ') : String(v === undefined || v === null ? '' : v);
    if (/^[=+\-@\t\r]/.test(t) && !/^-?\d+(\.\d+)?$/.test(t)) t = "'" + t; // 엑셀 수식으로 읽히지 않게(음수 같은 숫자는 그대로)
    return '"' + t.replace(/"/g, '""') + '"';
  };
  var hasNote = d.responses.some(function (r) { return r.note; });
  var head = ['이름', '소속', '낸 시각'].concat(d.questions.map(function (q, i) { return (i + 1) + '. ' + q.title; })).concat(hasNote ? ['하고 싶은 말'] : []);
  var lines = [head.map(cell).join(',')];
  d.responses.forEach(function (r) {
    lines.push([r.name, r.group, r.at].concat(d.questions.map(function (q) { return r.answers[q.id]; })).concat(hasNote ? [r.note] : []).map(cell).join(','));
  });
  return { filename: d.card.title.replace(/[\\\/:*?"<>|]/g, '_') + ' 응답.csv', csv: lines.join('\r\n') };
}

/* ===== Library.gs ===== */
/**
 * Library.gs — 자료실(자료 카드, 파일 올리기·내려받기)과 새 학년도 넘기기
 *
 * - 자료 한 줄 = 링크 하나 또는 올린 파일 하나. 학년도마다 따로 두고, 지난 학년도 자료는 '보관 여부' = 보관
 * - 올린 파일은 웹앱 주인 드라이브의 '온라인 교무실 자료' 폴더에 둔다.
 *   폴더·파일은 아무와도 공유하지 않고, 웹앱(공통 비밀번호 로그인)을 거쳐서만 내려받는다.
 * - 넣기: 이름을 고른 교직원 누구나. 고치기·지우기: 처음 넣은 분과 관리(역할 '관리' 또는 관리자 화면)
 * - 공통 자료: 넣는 누구나 '공통'으로 표시할 수 있다. 자료실 맨 위 '공통 자료' 칸에 '공통 순서' 번호 → 제목 순으로 보인다
 * - 새 학년도 넘기기(관리자): 지금 학년도 자료를 모두 보관함으로 보내고, 고른 자료만 새 학년도로 옮겨 적는다.
 *   옮긴 자료는 같은 파일을 가리키고(파일을 복사하지 않음), 처음 넣은 분이 계속 고칠 수 있다.
 * - 파일은 지우지 않는다. 자료를 지우거나 파일을 바꿔도 드라이브 파일은 그대로 남고, 기록 탭에 파일ID가 남는다.
 */

function fileMark_Library_() { return '2026-10-16e'; } // 판 표시(관리자 › 점검)

// ---------------------------------------------------------------- 도구

/** 분류 목록(종류별, 순서대로) */
function catOptions_(kind) {
  return liveRows_('분류').filter(function (r) { return r['종류'] === kind; })
    .sort(function (a, b) { return (Number(a['순서']) || 999) - (Number(b['순서']) || 999) || a['이름'].localeCompare(b['이름'], 'ko'); })
    .map(function (r) { return { id: r['분류ID'], name: r['이름'], active: r['사용 여부'] !== '사용 안 함' }; });
}

/** 처음 넣은 분 / 관리 */
function canEditOwned_(row, ctx) {
  if (canManage_(ctx)) return true;
  return !!(ctx.identity && row['입력자ID'] && row['입력자ID'] === ctx.identity['교직원ID']);
}

function libYear_() {
  return String(setting_('학년도') || '');
}

/** 파일 크기 한도(MB) */
function fileLimitMb_() {
  return Math.max(1, Number(setting_('파일 크기 한도')) || 10);
}

/** 링크: https:// 로 시작하는 주소만 */
function cleanUrl_(v, label, required) {
  var url = cleanText_(v, 1000, label, required);
  if (url && !/^https:\/\/[^\s]+$/.test(url)) throw userError_(label + josa_(label, '은', '는') + ' https:// 로 시작하는 주소를 넣어 주세요.');
  return url;
}

/** 분류ID가 그 종류에 있는지(빈 값은 그대로) */
function checkCat_(id, kind, label) {
  id = cleanText_(id, 20, label);
  if (id && !categoryNames_(kind)[id]) throw userError_(label + josa_(label, '을', '를') + ' 다시 골라 주세요.');
  return id;
}

// ---------------------------------------------------------------- 파일 (드라이브)

/** 자료 파일 폴더. 없거나 휴지통에 있으면 새로 만든다. 공유하지 않는다. */
function filesFolder_() {
  var id = setting_('자료 폴더ID');
  if (id) {
    try {
      var f = DriveApp.getFolderById(id);
      if (!f.isTrashed()) return f;
    } catch (e) { /* 폴더가 없어졌으면 새로 만든다 */ }
  }
  var folder = DriveApp.createFolder('온라인 교무실 자료');
  putSetting_('자료 폴더ID', folder.getId(), { id: '', name: '자동' });
  return folder;
}

function cleanFileName_(v) {
  var s = String(v || '').replace(/[\\\/:*?"<>|\u0000-\u001f]/g, ' ').replace(/\s+/g, ' ').trim();
  if (!s) s = '파일';
  if (s.length > 100) {
    var dot = s.lastIndexOf('.');
    var ext = dot > 0 && s.length - dot <= 10 ? s.slice(dot) : '';
    s = s.slice(0, 100 - ext.length) + ext;
  }
  return s;
}

/**
 * 화면에서 보낸 파일 { name, type, data(base64) } 을 자료 폴더에 만든다.
 * 돌려주는 값: { id, name, size }
 */
function saveUpload_(file) {
  var name = cleanFileName_(file && file.name);
  var b64 = String((file && file.data) || '');
  if (!b64) throw userError_('파일을 읽지 못했어요. 다시 골라 주세요.');
  var limit = fileLimitMb_();
  // base64는 원래 크기의 약 4/3. 너무 큰 것은 풀기 전에 막는다
  if (b64.length > Math.ceil(limit * 1024 * 1024 / 3) * 4 + 8) {
    throw userError_('파일이 너무 커요. ' + limit + 'MB까지 올릴 수 있어요. 더 큰 파일은 드라이브에 올리고 링크로 넣어 주세요.');
  }
  var bytes;
  try { bytes = Utilities.base64Decode(b64); } catch (e) { throw userError_('파일을 읽지 못했어요. 다시 골라 주세요.'); }
  if (!bytes.length) throw userError_('빈 파일이에요. 다른 파일을 골라 주세요.');
  if (bytes.length > limit * 1024 * 1024) {
    throw userError_('파일이 너무 커요. ' + limit + 'MB까지 올릴 수 있어요. 더 큰 파일은 드라이브에 올리고 링크로 넣어 주세요.');
  }
  var type = /^[\w.+-]+\/[\w.+-]+$/.test(String(file.type || '')) ? String(file.type) : 'application/octet-stream';
  var made = filesFolder_().createFile(Utilities.newBlob(bytes, type, name));
  return { id: made.getId(), name: name, size: bytes.length };
}

/**
 * 파일 내려받기. 자료·도움말 표에 적힌 파일만 준다(다른 드라이브 파일은 못 받는다).
 * args = { tab: '자료' | '도움말', id }
 */
function apiFileGet_(args, actor, ctx) {
  var tab = args.tab === '도움말' ? '도움말' : '자료';
  var row = findRow_(tab, String(args.id || ''));
  if (!row || row['삭제 여부'] || !row['파일ID']) throw userError_('파일을 찾지 못했어요. 화면을 새로 고쳐 주세요.', 'NOTFOUND');
  var blob;
  try {
    blob = DriveApp.getFileById(row['파일ID']).getBlob();
  } catch (e) {
    throw userError_('드라이브에서 파일을 찾지 못했어요. 연구부장·부담당에게 알려 주세요.', 'NOTFOUND');
  }
  return {
    name: row['파일 이름'] || blob.getName() || '파일',
    type: blob.getContentType() || 'application/octet-stream',
    data: Utilities.base64Encode(blob.getBytes())
  };
}

// ---------------------------------------------------------------- 자료 읽기

function libCache_() {
  return { depts: categoryNames_('부서'), kinds: categoryNames_('자료 분류'), names: staffNames_(), year: libYear_() };
}

/** 화면에 보낼 자료 한 줄(파일ID는 보내지 않는다) */
function libView_(r, ctx, c) {
  return {
    id: r['자료ID'],
    year: r['학년도'] || c.year,
    deptId: r['부서ID'],
    dept: c.depts[r['부서ID']] || '',
    kindId: r['분류ID'],
    kind: c.kinds[r['분류ID']] || '',
    title: r['제목'],
    desc: r['설명'],
    link: r['링크'],
    hasFile: !!r['파일ID'],
    fileName: r['파일 이름'],
    fileSize: Number(r['파일 크기']) || 0,
    owner: r['담당'],
    by: c.names[r['입력자ID']] || '',
    byId: r['입력자ID'],
    updated: (r['수정 시각'] || r['입력 시각'] || '').slice(0, 10),
    archived: r['보관 여부'] === '보관' || (!!r['학년도'] && r['학년도'] !== c.year),
    home: r['홈에 보이기'] === '예',
    common: r['공통'] === '예',
    commonOrder: r['공통'] === '예' ? r['공통 순서'] || '' : '',
    canEdit: canEditOwned_(r, ctx)
  };
}

function apiLibList_(args, actor, ctx) {
  var c = libCache_();
  var items = liveRows_('자료').map(function (r) { return libView_(r, ctx, c); })
    .sort(function (a, b) { return a.title.localeCompare(b.title, 'ko'); });
  return {
    year: c.year,
    items: items,
    depts: deptOptions_(),
    kinds: catOptions_('자료 분류'),
    canManage: canManage_(ctx),
    maxMb: fileLimitMb_()
  };
}

/** 홈 '자주 찾는 자료': 지금 학년도 자료 중 '홈에 보이기'(관리가 고름) */
function homeLibrary_(ctx) {
  var c = libCache_();
  return liveRows_('자료').filter(function (r) { return r['홈에 보이기'] === '예'; })
    .map(function (r) { return libView_(r, ctx, c); })
    .filter(function (v) { return !v.archived; })
    .sort(function (a, b) { return a.title.localeCompare(b.title, 'ko'); })
    .slice(0, 6);
}

// ---------------------------------------------------------------- 자료 넣기·고치기·지우기

function libSummary_(r) {
  return (r['제목'] || '') + (r['학년도'] ? ' (' + r['학년도'] + ')' : '');
}

/**
 * args = { id?, fields: { 제목, 설명, 부서ID, 분류ID, 담당, mode: 'link'|'file', link, home }, file?: { name, type, data } }
 */
function apiLibSave_(args, actor, ctx) {
  var f = args.fields || {};
  var rec = {
    '제목': cleanText_(f['제목'], 60, '제목', true),
    '설명': cleanText_(f['설명'], 500, '설명'),
    '부서ID': checkCat_(f['부서ID'], '부서', '부서'),
    '분류ID': checkCat_(f['분류ID'], '자료 분류', '자료 분류'),
    '담당': cleanText_(f['담당'], 20, '담당'),
    '공통': f.common ? '예' : '',
    '공통 순서': f.common ? cleanText_(f.commonOrder, 3, '공통 순서') : ''
  };
  if (rec['공통 순서'] && !/^\d+$/.test(rec['공통 순서'])) throw userError_('공통 순서는 숫자로 적어 주세요.');
  if (f.common === undefined) { delete rec['공통']; delete rec['공통 순서']; } // 예전 화면에서 보낸 요청은 공통 표시를 건드리지 않음
  var row = null;
  if (args.id) {
    row = findRow_('자료', String(args.id));
    if (!row || row['삭제 여부']) throw userError_('자료를 찾지 못했어요. 화면을 새로 고쳐 주세요.', 'NOTFOUND');
    if (!canEditOwned_(row, ctx)) throw userError_('처음 넣은 분과 연구부장·부담당만 고칠 수 있어요.', 'FORBIDDEN');
    if (libView_(row, ctx, libCache_()).archived) throw userError_('보관함 자료는 고칠 수 없어요. 연구부장·부담당이 지금 학년도로 꺼내면 고칠 수 있어요.');
  }
  if (f.mode === 'file') {
    if (!args.file && !(row && row['파일ID'])) throw userError_('올릴 파일을 골라 주세요.');
    rec['링크'] = '';
  } else {
    rec['링크'] = cleanUrl_(f.link, '링크', true);
    rec['파일ID'] = '';
    rec['파일 이름'] = '';
    rec['파일 크기'] = '';
  }
  if (canManage_(ctx) && f.home !== undefined) rec['홈에 보이기'] = f.home ? '예' : '';
  ensureCols_('자료');
  // 값 확인을 모두 마친 뒤에 파일을 만든다(확인에서 걸리면 드라이브에 남지 않게)
  if (f.mode === 'file' && args.file) {
    var up = saveUpload_(args.file);
    rec['파일ID'] = up.id;
    rec['파일 이름'] = up.name;
    rec['파일 크기'] = String(up.size);
  }
  var saved;
  if (row) {
    saved = updateRow_('자료', row['자료ID'], rec, actor, '자료 고침: ' + libSummary_(rec));
  } else {
    rec['학년도'] = libYear_();
    rec['보관 여부'] = '';
    saved = insertRow_('자료', rec, actor, '자료 추가: ' + libSummary_(rec));
  }
  return libView_(findRow_('자료', saved['자료ID']), ctx, libCache_());
}

function apiLibDelete_(args, actor, ctx) {
  var row = findRow_('자료', String(args.id || ''));
  if (!row || row['삭제 여부']) throw userError_('자료를 찾지 못했어요. 화면을 새로 고쳐 주세요.', 'NOTFOUND');
  if (!canEditOwned_(row, ctx)) throw userError_('처음 넣은 분과 연구부장·부담당만 지울 수 있어요.', 'FORBIDDEN');
  softDelete_('자료', row['자료ID'], actor, '자료 지움: ' + libSummary_(row));
  return { done: true };
}

/** 보관함 자료를 지금 학년도로 다시 꺼내기(관리) */
function apiLibUnarchive_(args, actor, ctx) {
  if (!canManage_(ctx)) throw userError_('보관 풀기는 연구부장·부담당이 해요.', 'FORBIDDEN');
  var row = findRow_('자료', String(args.id || ''));
  if (!row || row['삭제 여부']) throw userError_('자료를 찾지 못했어요. 화면을 새로 고쳐 주세요.', 'NOTFOUND');
  var cur = libYear_();
  var c = libCache_();
  if (!libView_(row, ctx, c).archived) throw userError_('이미 지금 학년도 자료예요.');
  // 지난 학년도 줄은 그대로 두고, 지금 학년도로 옮겨 적는다(새 학년도 넘기기와 같은 방식).
  // 이미 꺼낸 것이 있으면(두 번 누르거나 두 분이 함께 누름) 새로 만들지 않고 그것을 돌려준다
  var id = withLock_(function () {
    var dup = liveRows_('자료').filter(function (r) { return r['원본 자료ID'] === row['자료ID'] && String(r['학년도']) === String(cur) && r['보관 여부'] !== '보관'; })[0];
    if (dup) return dup['자료ID'];
    var added = insertRows_('자료', [libCopyObj_(row, cur)], actor, '보관함에서 꺼냄: ' + libSummary_(row) + ' → ' + cur, true);
    return added[0]['자료ID'];
  });
  return libView_(findRow_('자료', id), ctx, libCache_());
}

function libCopyObj_(row, year) {
  var o = {};
  ['분류ID', '부서ID', '제목', '설명', '링크', '파일ID', '담당', '파일 이름', '파일 크기', '홈에 보이기', '공통', '공통 순서', '입력자ID', '입력 시각', '수정자ID', '수정 시각'].forEach(function (h) {
    o[h] = row[h] || '';
  });
  o['학년도'] = year;
  o['보관 여부'] = '';
  o['원본 자료ID'] = row['자료ID'];
  return o;
}

// ---------------------------------------------------------------- 휴지통 (관리자)

function adminLibTrash_() {
  var c = libCache_(), names = c.names;
  var lib = readRows_('자료').filter(function (r) { return r['삭제 여부']; }).map(function (r) {
    var v = libView_(r, { identity: null, tokens: {} }, c);
    return { tab: '자료', id: v.id, title: v.title, sub: [v.year + '학년도', v.dept, v.kind].filter(Boolean).join(' · '), by: v.by, deletedBy: names[r['수정자ID']] || '', deletedAt: r['수정 시각'] };
  });
  var helpNames = categoryNames_('도움말 분류');
  var help = readRows_('도움말').filter(function (r) { return r['삭제 여부']; }).map(function (r) {
    return { tab: '도움말', id: r['항목ID'], title: r['제목'], sub: helpNames[r['분류ID']] || '', by: names[r['입력자ID']] || '', deletedBy: names[r['수정자ID']] || '', deletedAt: r['수정 시각'] };
  });
  var depts = categoryNames_('부서');
  var notices = readRows_('공지').filter(function (r) { return r['삭제 여부']; }).map(function (r) {
    return { tab: '공지', id: r['공지ID'], title: r['제목'], sub: depts[r['부서ID']] || '', by: names[r['입력자ID']] || '', deletedBy: names[r['수정자ID']] || '', deletedAt: r['수정 시각'] };
  });
  return lib.concat(help).concat(notices).sort(function (a, b) { return a.deletedAt < b.deletedAt ? 1 : a.deletedAt > b.deletedAt ? -1 : 0; }).slice(0, 200);
}

function adminLibRestore_(args, actor) {
  var tab = args.tab === '도움말' || args.tab === '공지' ? args.tab : '자료';
  var row = findRow_(tab, String(args.id || ''));
  if (!row || !row['삭제 여부']) throw userError_('되살릴 항목을 찾지 못했어요.');
  restoreRow_(tab, row[tabs_()[tab][0]], actor, tab + ' 되살림: ' + row['제목']);
  return { done: true };
}

// ---------------------------------------------------------------- 새 학년도 넘기기 (관리자)

/** 넘기기 전에 볼 것: 지금 학년도와 자료 목록 */
function adminYearPreview_() {
  var c = libCache_();
  var ctx = { identity: null, tokens: {} };
  var items = liveRows_('자료').map(function (r) { return libView_(r, ctx, c); })
    .filter(function (v) { return !v.archived; })
    .sort(function (a, b) { return (a.dept || '힣').localeCompare(b.dept || '힣', 'ko') || a.title.localeCompare(b.title, 'ko'); });
  var y = Number(c.year) || Number(todayYmd_().slice(0, 4));
  return { year: c.year, next: String(y + 1), items: items };
}

/**
 * args = { year: '2027', keep: [자료ID…] }
 * 1) 지금 학년도 자료를 모두 '보관'으로 표시 → 보관함
 * 2) keep에 든 자료만 새 학년도로 옮겨 적기(처음 넣은 분·수정일 그대로)
 * 3) 설정 '학년도'를 새 학년도로
 */
function adminYearStart_(args, actor) {
  var next = String(args.year || '').trim();
  var cur = libYear_();
  if (!/^20\d\d$/.test(next)) throw userError_('새 학년도는 2027처럼 네 자리로 적어 주세요.');
  if (cur && Number(next) <= Number(cur)) throw userError_('새 학년도는 지금 학년도(' + cur + ')보다 뒤여야 해요.');
  var keep = {};
  (args.keep || []).forEach(function (id) { keep[String(id)] = true; });
  return withLock_(function () {
    ensureCols_('자료');
    var c = libCache_();
    var ctx = { identity: null, tokens: {} };
    var rows = liveRows_('자료').filter(function (r) { return !libView_(r, ctx, c).archived; });
    var ids = rows.map(function (r) { return r['자료ID']; });
    var copies = rows.filter(function (r) { return keep[r['자료ID']]; }).map(function (r) { return libCopyObj_(r, next); });
    // 학년도가 비어 있던 줄은 지금 학년도로 적어 둔다(보관함에서 학년도별로 보이게)
    var blank = rows.filter(function (r) { return !r['학년도']; }).map(function (r) { return r['자료ID']; });
    if (blank.length && cur) updateRowsSame_('자료', blank, { '학년도': cur }, actor, '학년도 빈 자료에 ' + cur + ' 적음', '수정');
    var archived = updateRowsSame_('자료', ids, { '보관 여부': '보관' }, actor, (cur || '지난') + '학년도 자료 ' + ids.length + '개 보관함으로', '보관');
    insertRows_('자료', copies, actor, next + '학년도로 자료 ' + copies.length + '개 옮겨 적음', true);
    putSetting_('학년도', next, actor);
    return { year: next, archived: archived, copied: copies.length };
  });
}

/**

 * - 도움말: 분류(복무·인사, 학교 규칙·제규정 등 '도움말 분류')별 안내 글. 내용은 학교에서 넣는다(앱이 규정을 지어내지 않음)

function fileMark_Help_() { return '2026-10-16'; } // 판 표시(관리자 › 점검)

// ---------------------------------------------------------------- 도움말

function helpView_(r, ctx, kinds, names) {
  return {
    id: r['항목ID'],
    kindId: r['분류ID'],
    kind: kinds[r['분류ID']] || '',
    title: r['제목'],
    body: r['내용'],
    link: r['링크'],
    hasFile: !!r['파일ID'],
    fileName: r['파일 이름'],
    fileSize: Number(r['파일 크기']) || 0,
    order: r['순서'],
    by: names[r['입력자ID']] || '',
    updated: (r['수정 시각'] || r['입력 시각'] || '').slice(0, 10),
    canEdit: canEditOwned_(r, ctx)
  };
}

function sortHelp_(list, kindOrder) {
  return list.sort(function (a, b) {
    return (kindOrder[a.kindId] === undefined ? 999 : kindOrder[a.kindId]) - (kindOrder[b.kindId] === undefined ? 999 : kindOrder[b.kindId]) ||
      (Number(a.order) || 999) - (Number(b.order) || 999) || a.title.localeCompare(b.title, 'ko');
  });
}

function apiHelpList_(args, actor, ctx) {
  var kinds = catOptions_('도움말 분류');
  var kindNames = categoryNames_('도움말 분류'), names = staffNames_();
  var order = {};
  kinds.forEach(function (k, i) { order[k.id] = i; });
  var items = liveRows_('도움말').map(function (r) { return helpView_(r, ctx, kindNames, names); });
  return { items: sortHelp_(items, order), kinds: kinds, canManage: canManage_(ctx), maxMb: fileLimitMb_() };
}

/**
 * args = { id?, fields: { 분류ID, 제목, 내용, 링크, 순서, mode: 'none'|'file' }, file?: { name, type, data } }
 */
function apiHelpSave_(args, actor, ctx) {
  var f = args.fields || {};
  var rec = {
    '분류ID': checkCat_(f['분류ID'], '도움말 분류', '분류'),
    '제목': cleanText_(f['제목'], 60, '제목', true),
    '내용': cleanText_(f['내용'], 5000, '내용'),
    '링크': cleanUrl_(f['링크'], '링크'),
    '순서': cleanText_(f['순서'], 3, '순서')
  };
  if (rec['순서'] && !/^\d+$/.test(rec['순서'])) throw userError_('순서는 숫자로 적어 주세요.');
  if (!rec['분류ID']) throw userError_('분류를 골라 주세요.');
  var row = null;
  if (args.id) {
    row = findRow_('도움말', String(args.id));
    if (!row || row['삭제 여부']) throw userError_('도움말을 찾지 못했어요. 화면을 새로 고쳐 주세요.', 'NOTFOUND');
    if (!canEditOwned_(row, ctx)) throw userError_('처음 넣은 분과 연구부장·부담당만 고칠 수 있어요.', 'FORBIDDEN');
  }
  if (f.removeFile) {
    rec['파일ID'] = '';
    rec['파일 이름'] = '';
    rec['파일 크기'] = '';
  }
  var keepsFile = !f.removeFile && row && row['파일ID'];
  if (!rec['내용'] && !rec['링크'] && !args.file && !keepsFile) throw userError_('내용을 적거나 링크·파일을 넣어 주세요.');
  ensureCols_('도움말');
  if (args.file) {
    var up = saveUpload_(args.file);
    rec['파일ID'] = up.id;
    rec['파일 이름'] = up.name;
    rec['파일 크기'] = String(up.size);
  }
  var saved = row
    ? updateRow_('도움말', row['항목ID'], rec, actor, '도움말 고침: ' + rec['제목'])
    : insertRow_('도움말', rec, actor, '도움말 추가: ' + rec['제목']);
  return helpView_(findRow_('도움말', saved['항목ID']), ctx, categoryNames_('도움말 분류'), staffNames_());
}

function apiHelpDelete_(args, actor, ctx) {
  var row = findRow_('도움말', String(args.id || ''));
  if (!row || row['삭제 여부']) throw userError_('도움말을 찾지 못했어요. 화면을 새로 고쳐 주세요.', 'NOTFOUND');
  if (!canEditOwned_(row, ctx)) throw userError_('처음 넣은 분과 연구부장·부담당만 지울 수 있어요.', 'FORBIDDEN');
  softDelete_('도움말', row['항목ID'], actor, '도움말 지움: ' + row['제목']);
  return { done: true };
}

// ---------------------------------------------------------------- 홈 검색

/** 낱말을 모두 품고 있으면 맞음(띄어쓰기·대소문자 무시) */
function searchTerms_(q) {
  return String(q || '').toLowerCase().split(/\s+/).filter(Boolean);
}

function matchAll_(terms, fields) {
  var hay = fields.join(' ').toLowerCase();
  var flat = hay.replace(/\s+/g, '');
  return terms.every(function (t) { return hay.indexOf(t) >= 0 || flat.indexOf(t) >= 0; });
}

/**
 * args = { q }
 * 돌려주는 값: { q, library, events, staff, help, surveys } 각 { total, items(앞 몇 개) }
 */
function apiSearch_(args, actor, ctx) {
  var q = String(args.q || '').trim().slice(0, 40);
  var terms = searchTerms_(q);
  var empty = { total: 0, items: [] };
  if (!terms.length) return { q: q, library: empty, events: empty, staff: empty, help: empty, surveys: empty, notices: empty };
  var depts = categoryNames_('부서');
  var names = staffNames_();
  function pack(list, n) { return { total: list.length, items: list.slice(0, n) }; }

  // 자료: 지금 학년도 먼저, 보관함은 뒤에
  var c = libCache_();
  var lib = liveRows_('자료').map(function (r) { return libView_(r, ctx, c); }).filter(function (v) {
    return matchAll_(terms, [v.title, v.desc, v.dept, v.kind, v.owner, v.fileName, v.year]);
  }).sort(function (a, b) {
    return (a.archived - b.archived) || (b.year > a.year ? 1 : b.year < a.year ? -1 : 0) || a.title.localeCompare(b.title, 'ko');
  });

  // 일정: 오늘부터 다가오는 것 먼저(가까운 순), 지난 것은 뒤에(최근 순)
  var today = todayYmd_();
  var evs = sortEvents_(liveRows_('일정').filter(function (e) {
    return e['시작일'] && matchAll_(terms, [e['행사명'], e['장소'], e['메모'], depts[e['담당 부서ID']] || '', e['구분']]);
  })).map(function (e) { return eventView_(e, ctx, depts, names); });
  var next = evs.filter(function (e) { return e.end >= today; });
  var past = evs.filter(function (e) { return e.end < today; }).reverse();

  var staff = sortStaff_(activeStaff_()).filter(function (r) {
    return matchAll_(terms, [r['이름'], r['직위'], r['소속'], depts[r['부서ID']] || '', r['담당 업무'], r['내선']]);
  }).map(function (r) { return staffDirView_(r, depts); });

  var helpKinds = categoryNames_('도움말 분류');
  var help = liveRows_('도움말').map(function (r) { return helpView_(r, ctx, helpKinds, names); }).filter(function (h) {
    return matchAll_(terms, [h.title, h.body, h.kind, h.fileName]);
  });

  var cache = surveyCache_();
  var surveys = liveRows_('조사').filter(function (s) {
    return matchAll_(terms, [s['제목'], s['설명'], depts[s['부서ID']] || '']);
  }).map(function (s) { return surveyCard_(s, ctx, cache); }).sort(function (a, b) {
    return (a.closed - b.closed) || (a.deadline < b.deadline ? 1 : a.deadline > b.deadline ? -1 : 0);
  });

  return {
    q: q,
    today: today,
    library: pack(lib, 6),
    events: pack(next.concat(past), 6),
    staff: pack(staff, 6),
    help: pack(help, 6),
    surveys: pack(surveys, 4),
    notices: pack(noticeViews_(ctx).filter(function (n) { return matchAll_(terms, [n.title, n.body, n.dept]); }), 4)
  };
}

// ---------------------------------------------------------------- 공지 (홈 공지 카드)
// - 쓰기: 이름을 고른 교직원 누구나. 고치기·지우기: 쓴 분과 관리. '맨 위 고정'은 관리만
// - '게시 끝일'이 지나면 홈에서 내려가고, 공지 화면의 '지난 공지'에 남는다

function noticeView_(r, ctx, depts, names, today) {
  return {
    id: r['공지ID'],
    title: r['제목'],
    body: r['내용'],
    link: r['링크'],
    deptId: r['부서ID'],
    dept: depts[r['부서ID']] || '',
    until: r['게시 끝일'],
    pinned: r['고정'] === '예',
    active: !r['게시 끝일'] || r['게시 끝일'] >= today,
    by: names[r['입력자ID']] || '',
    at: r['입력 시각'],
    updated: r['수정 시각'],
    canEdit: canEditOwned_(r, ctx)
  };
}

function noticeViews_(ctx) {
  var depts = categoryNames_('부서'), names = staffNames_(), today = todayYmd_();
  return liveRows_('공지').map(function (r) { return noticeView_(r, ctx, depts, names, today); }).sort(function (a, b) {
    return (b.active - a.active) || (b.active && a.active ? b.pinned - a.pinned : 0) || (a.at < b.at ? 1 : a.at > b.at ? -1 : 0);
  });
}

function apiNoticeList_(args, actor, ctx) {
  return { items: noticeViews_(ctx), canManage: canManage_(ctx), depts: deptOptions_(), today: todayYmd_() };
}

/** 지금 걸린 공지 중 가장 최근에 올라온 시각(화면의 '새 공지' 점 표시용, 기기마다 본 시각과 비교) */
function latestNoticeAt_() {
  var t = todayYmd_(), last = '';
  liveRows_('공지').forEach(function (r) {
    if (r['게시 끝일'] && r['게시 끝일'] < t) return;
    if (r['입력 시각'] > last) last = r['입력 시각'];
  });
  return last;
}

/** 홈: 지금 걸린 공지(고정 먼저, 새것 먼저) 4개까지 */
function homeNotices_(ctx) {
  var list = noticeViews_(ctx).filter(function (n) { return n.active; });
  return { items: list.slice(0, 4), total: list.length };
}

/** args = { id?, fields: { 제목, 내용, 링크, 부서ID, 게시 끝일, pinned } } */
function apiNoticeSave_(args, actor, ctx) {
  var f = args.fields || {};
  var rec = {
    '제목': cleanText_(f['제목'], 60, '제목', true),
    '내용': cleanText_(f['내용'], 2000, '내용'),
    '링크': cleanUrl_(f['링크'], '링크'),
    '부서ID': checkCat_(f['부서ID'], '부서', '부서'),
    '게시 끝일': String(f['게시 끝일'] || '').trim()

function setupAll_() {
  MEMO_BYPASS_ = true; // 시트에서 손으로 줄을 지운 직후여도 옛 기억으로 판단하지 않게
  try {
    return setupAllNow_();
  } finally {
    MEMO_BYPASS_ = false;
  }
}

function setupAllNow_() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var p = PropertiesService.getScriptProperties();
  p.setProperty('SHEET_ID', ss.getId());
  secretProp_('PIN_PEPPER');
  secretProp_('TOKEN_SECRET');
  DB_SS_ = ss;
  dbReset_();

  var created = [], extended = [];
  var defs = tabs_();
  Object.keys(defs).forEach(function (name) {
    var head = defs[name];
    var sh = ss.getSheetByName(name);
    if (!sh) {
      sh = ss.insertSheet(name);
      created.push(name);
    }
    var lastCol = Math.max(sh.getLastColumn(), 1);
    var cur = sh.getRange(1, 1, 1, lastCol).getValues()[0].map(cellText_);
    var curUsed = cur.filter(function (h) { return h !== ''; });
    var missing = head.filter(function (h) { return cur.indexOf(h) < 0; });
    if (missing.length) {
      var start = curUsed.length ? cur.length + 1 : 1;
      growCols_(sh, start + missing.length - 1);
      sh.getRange(1, start, 1, missing.length).setValues([missing]);
      if (curUsed.length) extended.push(name);
    }
    sh.setFrozenRows(1);
    sh.getRange(1, 1, 1, sh.getLastColumn()).setFontWeight('bold').setBackground('#F2F4F6');
  });

  dbReset_(); // 머리글을 바꿨으니 다시 읽는다
  // 설정 기본값(없는 키만). 있는 키는 값은 그대로 두고 '설명' 칸만 지금 안내로 바꾼다
  var have = {};
  var sheet = sheet_('설정');
  var notes = {};
  settingDefs_().forEach(function (d) { notes[d.key] = d.note || d.label; });
  var noteCol = headOf_('설정').indexOf('설명') + 1; // 칸 위치는 머리글 이름으로(누가 칸을 끼워 넣어도)
  readRows_('설정').forEach(function (r) {
    have[r['키']] = true;
    if (noteCol > 0 && notes[r['키']] !== undefined && r['설명'] !== notes[r['키']]) sheet.getRange(r._row, noteCol).setValue(cellWrite_(notes[r['키']]));
  });
  settingDefs_().forEach(function (d) {
    if (!have[d.key]) sheet.appendRow(rowByHead_('설정', { '키': d.key, '값': d.def, '설명': d.note || d.label }));
  });
  SETTINGS_CACHE_ = null;
  dbReset_();
  memoClearAll_(); // 탭·칸을 바꿨으니 서버 기억을 모두 버린다
  return { created: created, extended: extended };
}

/** 시간 트리거가 부른다. 너무 자주 불리면(1시간 안) 건너뛴다. */
/**
 * 매일 자동 백업(시간 트리거 전용). 이름이 _로 끝나지 않아 웹앱에서도 부를 수 있으므로,
 * 이 프로젝트의 진짜 dailyBackup 트리거가 부른 것(e.triggerUid가 맞을 때)만 백업한다.
 */
function dailyBackup(e) {
  var uid = e && e.triggerUid;
  var mine = uid && ScriptApp.getProjectTriggers().some(function (t) {
    return t.getHandlerFunction() === 'dailyBackup' && String(t.getUniqueId()) === String(uid);
  });
  if (!mine) return;
  var p = PropertiesService.getScriptProperties();
  var last = Number(p.getProperty('LAST_BACKUP_AT') || 0);
  if (Date.now() - last < 20 * 3600 * 1000) return;
  backupNow_('매일 백업');
}

function backupNow_(why) {
  var ss = ss_();
  var folder = backupFolder_();
  var name = '온라인 교무실 백업 ' + Utilities.formatDate(new Date(), tz_(), 'yyyy-MM-dd HHmm');
  DriveApp.getFileById(ss.getId()).makeCopy(name, folder);
  PropertiesService.getScriptProperties().setProperty('LAST_BACKUP_AT', String(Date.now()));

  var keep = Math.max(3, Number(setting_('백업 남길 개수')) || 30);
  var files = [];
  var it = folder.getFilesByType(MimeType.GOOGLE_SHEETS);
  while (it.hasNext()) files.push(it.next());
  files.sort(function (a, b) { return b.getDateCreated().getTime() - a.getDateCreated().getTime(); });
  var trashed = 0;
  files.slice(keep).forEach(function (f) { f.setTrashed(true); trashed++; });

  withLock_(function () {
    writeLog_({ id: '', name: '자동 백업' }, '설정', '', '백업', why + ': ' + name + (trashed ? ' (오래된 사본 ' + trashed + '개 휴지통으로)' : ''), null, null);
  });
  return { name: name, folder: folder.getName(), keep: keep };
}

function backupFolder_() {
  var id = setting_('백업 폴더ID');
  if (id) {
    try {
      var f = DriveApp.getFolderById(id);
      if (!f.isTrashed()) return f;
    } catch (e) { /* 폴더가 없어졌으면 새로 만든다 */ }
  }
  var folder = DriveApp.createFolder('온라인 교무실 백업');
  putSetting_('백업 폴더ID', folder.getId(), { id: '', name: '자동 백업' });
  return folder;
}

<script>
/**
 * App.html — 온라인 교무실 화면

(function () {

  }

  function qsa(sel, el) { return Array.prototype.slice.call((el || document).querySelectorAll(sel)); }

    var c = String(word).charCodeAt(String(word).length - 1);

    return (c - 0xAC00) % 28 ? a : b;

  // ------------------------------------------------------------ 브라우저 저장(안 되면 기억만 안 됨)
  var mem = {};

    try { var w = sessionStorage.getItem(k); if (w !== null) return w; } catch (e) {}

  }
  /** keep: true면 기기에 오래(localStorage), 아니면 이 창을 닫을 때까지(sessionStorage) */
  function stSet(k, v, keep) {
    stDel(k);
    mem[k] = v;
    try { (keep ? localStorage : sessionStorage).setItem(k, v); } catch (e) {}
  }
  function stDel(k) {
    delete mem[k];
    try { localStorage.removeItem(k); } catch (e) {}
    try { sessionStorage.removeItem(k); } catch (e) {}
  }
  function tokens() {
    return { login: stGet('gy.login'), identity: stGet('gy.identity'), admin: stGet('gy.admin') };
  }

  // ------------------------------------------------------------ 서버 부르기
  // 읽기만 하는 요청. 이것 말고는 모두 무언가를 바꾸는 요청이라, 성공하면 화면 기억(MEMO)을 모두 잊는다
  var READS = {
    start: 1, ping: 1, boot: 1, batch: 1, session: 1, staffPicker: 1, home: 1, search: 1, 'sched.month': 1, 'sched.year': 1,
    'sched.upload.info': 1, 'sched.upload.check': 1, 'survey.list': 1, 'survey.get': 1, 'survey.csv': 1, 'lib.list': 1, 'file.get': 1,
    'help.list': 1, 'staff.list': 1, 'notice.list': 1, 'admin.settings.get': 1, 'admin.cat.list': 1, 'admin.staff.list': 1,
    'admin.log.list': 1, 'admin.trash.list': 1, 'admin.trash.surveys': 1, 'admin.trash.library': 1, 'admin.year.preview': 1,
    'admin.check': 1, 'admin.speed': 1, 'admin.staff.importCheck': 1
  };
  var recentCalls = []; // 속도 재기: 이 창에서 최근에 서버를 다녀온 요청과 걸린 시간(ms)

  /**
   * then: [[읽기 이름, args], …] 를 함께 보내면 서버가 저장한 다음 그 화면들을 같은 요청으로 돌려준다(왕복 한 번).
   * 받은 것은 화면 기억에 넣어 두므로, 저장 뒤 평소처럼 화면을 다시 불러오면 기다리지 않고 바로 그려진다.
   * bg: 뒤에서 보내는 요청(미리 받기·뒤에서 새로 받기). 기다리는 사람이 없으니 서버가 오래된 기억을 시트와 다시 맞춘다

  var pendingWrites = 0; // 저장 같은 요청이 서버에 가 있는 동안에는 창을 닫지 않게(실패하면 쓰던 것과 안내가 사라지므로)
  function server(action, args, then, bg) {
    var t0 = Date.now();
    var writing = !READS[action];

    var settled = false;

    return new Promise(function (resolve, reject) {
      var payload = { action: action, args: args || {}, tokens: tokens() };
      if (then) payload.then = then;
      if (bg) payload.bg = 1;
      var req = JSON.stringify(payload);
      function done(text) {
        settle();
        recentCalls.unshift({ action: action, ms: Date.now() - t0, bg: !!bg });
        recentCalls.length = Math.min(recentCalls.length, 15);
        var r;

        err.detail = r.detail || '';

          .withSuccessHandler(done)
          .withFailureHandler(function (e) {
            settle();
            // 연결이 끊긴 것과 서버가 처리하다 멈춘 것(시간 초과·권한 등)을 나눠 알린다
            var msg = e && e.message ? String(e.message) : '';

            var err = new Error(net ? '서버에 닿지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.'
              : '서버에서 처리하다 멈췄어요. 잠깐 뒤에 다시 해 주세요. 계속 안 되면 연구부장·부담당에게 알려 주세요.');
            err.code = net ? 'NET' : 'ERROR';
            err.detail = msg ? ((e.name ? e.name + ': ' : '') + msg).slice(0, 300) : '';
            reject(err);
          })
          .api(req);
      }
    });
  }

  /** 로그인·본인 확인·관리자 표가 만료됐을 때 */
  function authTrouble(err) {
    if (err.code === 'LOGIN') {
      stDel('gy.login'); stDel('gy.identity'); stDel('gy.admin');
      S.me = null; S.admin = false;
      forgetScreens();
      setTimeout(function () { showLogin('다시 로그인해 주세요.'); }, 0);
    } else if (err.code === 'ADMIN') {
      stDel('gy.admin');
      S.admin = false;
      forgetScreens();
      setTimeout(renderApp, 0);
    } else if (err.code === 'IDENTITY') {
      stDel('gy.identity');
      S.me = null;
      forgetScreens();
      setTimeout(function () { showIdentity(); }, 0);
    }
  }

  /**
   * 누구로 보는지(로그인·이름·관리자 화면)가 바뀌면 화면 기억과 들고 있던 화면 내용을 모두 버린다
   * (그 권한으로만 보이던 조사 결과 같은 것이 남지 않게)
   */
  function forgetScreens() {
    memoClear();
    S.home = null; S.search = null;
    S.sched.data = null; S.sched.yearData = null; S.sched.form = null;
    S.survey.list = null; S.survey.detail = null; S.survey.showResults = false; S.survey.draft = null;

  }

  // ------------------------------------------------------------ 화면 기억(속도)
  // 한 번 본 화면은 기억한 내용을 곧바로 그리고, 오래됐으면 뒤에서 새로 받아 바뀐 경우에만 다시 그린다.
  // 이 창에서만 기억한다(창을 닫으면 사라져 함께 쓰는 PC에 남지 않는다). 무엇이든 저장하면 모두 잊는다(server).
  var MEMO = {};
  var MEMO_FRESH = 15000; // 이보다 최근에 받은 것은 다시 받지 않는다(서버를 덜 부르게)
  var navSeq = 0;         // 화면을 새로 그릴 때마다 늘어난다(늦게 온 답이 다른 화면을 덮지 않게)
  var screenEdited = false; // 그린 뒤 화면에서 무언가 입력했으면 뒤에서 다시 그리지 않는다(쓰던 것이 지워지지 않게)

  var refreshN = 0;
  var memoGen = 0;          // 기억을 비울 때마다 늘어난다(저장하기 전에 떠난 요청의 옛 답을 버리게)
  function memoKey(action, args) { return action + '|' + JSON.stringify(args || {}); }
  function memoPut(action, args, data) { MEMO[memoKey(action, args)] = { data: data, json: JSON.stringify(data), at: Date.now() }; }
  function memoClear() { MEMO = {}; pendingDraw = null; memoGen++; }
  function editingNow() {
    if ($modal.innerHTML || qs('#sheet')) return true;
    var a = document.activeElement;
    return !!(a && a.closest && a.closest('#screen') && (a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' ||

  }

  }

   * 기억이 있으면 곧바로 draw(data)하고, 15초보다 오래됐으면 뒤에서 새로 받는다.
   * 새 내용이 다르면 다시 draw(그사이 화면을 옮겼거나 쓰던 것이 있으면 그리지 않음, 창이 열려 있으면 닫은 뒤에).

   */
  var paintN = {}; // 키마다 그린 횟수(같은 화면을 두 요청이 받아 와도 두 번째 답이 쓰던 것을 덮지 않게)

        if (!m && seq === navSeq && (paintN[key] || 0) === p0) loadMemo(action, args, draw, fail); // 아직 아무것도 못 그렸으면 새로 받는다('불러오는 중'에 멈추지 않게)

      if (!m && (paintN[key] || 0) === p0) { paint(d, false); return; } // 처음 그리기
      if (!changed || screenEdited) return; // 같거나, 쓰던 것이 있으면 그대로(다음에 열 때 새 내용으로)
      var redraw = function () { if (seq === navSeq && !screenEdited) { paintN[key] = (paintN[key] || 0) + 1; draw(d, false); } };
      if (editingNow()) pendingDraw = redraw; else redraw();
    }, function (e) {
      done();
      if (!m && seq === navSeq && (paintN[key] || 0) === p0 && fail) fail(e);

  // ============================================================ 화면들
  function pageHead(kicker, title, lead, right) {
    return '<header class="page-head"><div>' + (kicker ? '<p class="kicker">' + kicker + '</p>' : '') +
      '<h1 class="title">' + title + '</h1>' + (lead ? '<p class="lead">' + lead + '</p>' : '') + '</div>' + (right || '') + '</header>';
  }

  function todayText() {
    var d = new Date();
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + '일월화수목금토'.charAt(d.getDay()) + '요일';
  }

  var SCREENS = {};

  // ============================================================ 날짜·일정 도구
  var DOW = '일월화수목금토';
  function ymdUtc(s) { var p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function ymdOf(t) {
    var d = new Date(t);
    return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2);
  }
  function addD(s, n) { return ymdOf(ymdUtc(s) + n * 86400000); }
  function wd(s) { return new Date(ymdUtc(s)).getUTCDay(); }
  function mondayOf(s) { var w = wd(s); return addD(s, w === 0 ? -6 : 1 - w); }
  function md(s) { return Number(s.slice(5, 7)) + '월 ' + Number(s.slice(8, 10)) + '일'; }
  function mdw(s) { return md(s) + ' (' + DOW.charAt(wd(s)) + ')'; }
  function dayNum(s) { return Number(s.slice(8, 10)); }
  function localToday() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function isOff(e) { return e.kind === '휴업일' || e.kind === '공휴일'; }
  function onDay(e, d) { return e.start <= d && e.end >= d; }
  function timeText(e) { return e.time || (e.end !== e.start ? md(e.start) + '~' + md(e.end) : '종일'); }
  function targetText(t) {
    if (!t) return '';
    return t.split(',').map(function (x) { return /^\d$/.test(x) ? x + '학년' : x; }).join('·')
      .replace(/(\d)학년·(?=\d)/g, '$1·');
  }
  function metaText(e) { return [e.place, e.dept].filter(Boolean).join(' · '); }
  function myGrade() {
    var m = S.me && /(\d)\s*학년/.exec(S.me.group || '');
    return m ? m[1] : '';
  }
  function isPhone() { return window.matchMedia('(max-width: 899px)').matches; }
  function isWide() { return window.innerWidth / zoomFactor() >= 1200; } // 화면 크기를 키우면 그만큼 좁은 화면처럼
  function zoomFactor() {
    var z = parseFloat(getComputedStyle(root).getPropertyValue('--gy-zoom'));
    return z > 0 ? z : 1;
  }

  /** 필터: grade('', '1'~'6', '교직원'), dept(부서ID), mine */
  function passFilter(e, f) {
    if (f.grade) {
      var list = (e.target || '').split(',');
      if (e.target) {
        if (f.grade === '교직원') { if (list.indexOf('교직원') < 0) return false; }
        else if (list.indexOf('전체') < 0 && list.indexOf(f.grade) < 0) return false;
      }
    }
    if (f.dept && e.deptId !== f.dept) return false;
    if (f.imp && !e.important) return false;
    if (f.mine) {
      if (!S.me) return false;
      if (!(S.me.deptId && e.deptId === S.me.deptId) && e.byId !== S.me.id) return false;
    }
    return true;
  }

  function evChip(e, opts) {
    opts = opts || {};
    var cls = 'ev' + (isOff(e) ? ' ev-off' : e.important ? ' ev-imp' : e.kind === '교육활동' ? ' ev-act' : '');
    return '<button type="button" class="' + cls + '" data-action="ev-open" data-ev="' + esc(e.id) + '">' +
      (opts.prefix ? '<span class="ev-pre">' + opts.prefix + '</span>' : '') + (e.important ? starHtml() : '') + esc(e.title) + '</button>';
  }

  function evRow(e) {
    return '<button type="button" class="ev-row' + (isOff(e) ? ' off' : '') + (e.important ? ' imp' : '') + '" data-action="ev-open" data-ev="' + esc(e.id) + '">' +

      (metaText(e) ? '<span class="ev-meta">' + esc(metaText(e)) + '</span>' : '') +
      (e.target && e.target !== '전체' ? '<span class="chip">' + esc(targetText(e.target)) + '</span>' : '') + '</span></button>';
  }

  /** 일정을 들고 있는 곳들. 지금 보는 화면의 것을 먼저 본다 */
  function eventPools() {
    var home = S.home && S.home.events, month = S.sched.data && S.sched.data.events, year = S.sched.yearData && S.sched.yearData.events,
      found = S.search && S.search.events && S.search.events.items;
    return S.screen === 'schedule' ? [month, year, found, home] : S.screen === 'search' ? [found, home, month, year] : [home, month, year, found];
  }
  function eventById(id) {
    var pools = eventPools();
    for (var i = 0; i < pools.length; i++) {
      var hit = (pools[i] || []).filter(function (e) { return e.id === id; })[0];
      if (hit) return hit;
    }
    return null;
  }
  /** 저장·지운 일정을 들고 있는 모든 곳에 바로 반영한다(다른 화면에서 다시 열어도 옛 내용이 나오지 않게) */
  function patchEvent(saved, removedId) {
    eventPools().forEach(function (list) {
      if (!list) return;
      for (var i = list.length - 1; i >= 0; i--) {
        if (list[i].id !== (saved ? saved.id : removedId)) continue;
        if (saved) list[i] = saved; else list.splice(i, 1);
      }
    });
  }
