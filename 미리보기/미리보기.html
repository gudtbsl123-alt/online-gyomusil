<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>온라인 교무실</title>
<!-- 글꼴: Pretendard (SIL Open Font License 1.1, https://github.com/orioncactus/pretendard). 인터넷이 안 되면 기기 기본 글꼴로 보입니다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
/* 색 토큰: 온라인교무실_시안.html 그대로 (이름·값 바꾸지 않기) */
:root,:root[data-theme="light"]{--c-bg:#F2F4F6;--c-sub:#FFFFFF;--c-card:#FFFFFF;--c-card2:#F2F4F6;--c-pill:#F2F4F6;--c-line:#E5E8EB;--c-line2:#D1D6DB;--c-seg:#F2F4F6;--c-avatar:#E5E8EB;--c-t0:#191F28;--c-t1:#191F28;--c-t2:#4E5968;--c-t3:#606B78;--c-dot:#B0B8C1;--c-radio:#B0B8C1;--c-warnBg:#FFF4E5;--c-warnFg:#9A5200;--c-okBg:#E8F7EE;--c-okFg:#12784A;--c-red:#D92D20;--c-onAccent:#FFFFFF;--accent:#1B64DA;--accent-soft:rgba(27, 100, 218, 0.1);--accent-ring:rgba(27, 100, 218, 0.35);--accent-glow:rgba(27, 100, 218, 0.22);--hero-a:rgba(27, 100, 218, 0.14);--hero-b:rgba(27, 100, 218, 0.05);--scheme:light;--seg-light-bg:#FFFFFF;--seg-light-fg:#191F28;--seg-dark-bg:transparent;--seg-dark-fg:#606B78;--sun-display:none;--moon-display:block;--stage:#E5E8EB}
:root[data-theme="dark"]{--c-bg:#0F1115;--c-sub:#15171C;--c-card:#1A1D24;--c-card2:#1F222A;--c-pill:#21232A;--c-line:#21232A;--c-line2:#2C2F37;--c-seg:#2C2F37;--c-avatar:#2C2F37;--c-t0:#F9FAFB;--c-t1:#F2F4F6;--c-t2:#B0B8C1;--c-t3:#8B95A1;--c-dot:#8B95A1;--c-radio:#4E5968;--c-warnBg:#2E1F00;--c-warnFg:#FFB547;--c-okBg:#0F2E1C;--c-okFg:#4ADE80;--c-red:#FF6B6B;--c-onAccent:#0F1115;--accent:#4795FF;--accent-soft:rgba(71, 149, 255, 0.14);--accent-ring:rgba(71, 149, 255, 0.32);--accent-glow:rgba(71, 149, 255, 0.18);--hero-a:rgba(71, 149, 255, 0.32);--hero-b:rgba(71, 149, 255, 0.14);--scheme:dark;--seg-light-bg:transparent;--seg-light-fg:#8B95A1;--seg-dark-bg:#2C2F37;--seg-dark-fg:#F2F4F6;--sun-display:block;--moon-display:none;--stage:#08090B}
html{background:var(--c-bg)}
body{margin:0;word-break:keep-all;background:var(--c-bg);color:var(--c-t1);font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
input::placeholder,textarea::placeholder{color:currentColor;opacity:.7}
button,input,select,textarea{font-family:inherit;letter-spacing:inherit}
*,*::before,*::after{box-sizing:border-box}
body{font-size:17px;line-height:1.5;letter-spacing:-0.02em}
html.big body{zoom:1.12}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent-ring);outline-offset:2px}
svg{flex:none}

/* ---------- 앱 틀: PC 사이드 메뉴 + 본문 ---------- */
.app{display:flex;min-height:100vh;min-height:100dvh;background:var(--c-bg)}
.side{flex:none;width:248px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;padding:28px 16px 24px;background:var(--c-sub);border-right:1px solid var(--c-line);display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px;color:var(--c-t1);text-decoration:none;background:none;border:0;cursor:pointer;text-align:left}
.brand-mark{width:40px;height:40px;flex:none;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.brand-text{display:flex;flex-direction:column;line-height:1.3}
.brand-sub{font-size:13px;font-weight:600;color:var(--c-t3)}
.brand-name{font-size:18px;font-weight:800;letter-spacing:-0.03em}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 14px;border:0;border-radius:12px;background:transparent;color:var(--c-t2);font-size:17px;font-weight:600;text-decoration:none;text-align:left;cursor:pointer}
.nav-item.small{min-height:44px;font-size:15px}
.nav-item[aria-current="page"]{background:var(--c-card2);color:var(--c-t1);font-weight:700}
.nav-item[aria-current="page"] svg{color:var(--accent)}
.nav-soon{margin-left:auto;padding:2px 8px;border-radius:9999px;background:var(--c-pill);font-size:12px;font-weight:700;color:var(--c-t3)}
.nav-group{display:flex;flex-direction:column;gap:6px;padding-top:20px;border-top:1px solid var(--c-line)}
.nav-label{padding:0 14px;font-size:13px;font-weight:700;color:var(--c-t3)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--c-card2);border:1px solid var(--c-line)}
.seg button{flex:1 1 0;min-height:40px;display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:9px;background:transparent;color:var(--c-t3);font-size:15px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c-card);color:var(--c-t1);box-shadow:0 0 0 1px var(--c-line)}
.toolbar .seg,.card-head .seg{flex:none}
.toolbar .seg button,.card-head .seg button{flex:0 0 auto;padding:0 14px;white-space:nowrap}
[hidden]{display:none!important}
.me-card{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--c-card);border:1px solid var(--c-line)}
.me-lines{display:flex;flex-direction:column;min-width:0;line-height:1.4}
.me-name{font-size:16px;font-weight:700}
.me-sub{font-size:14px;color:var(--c-t3)}
.linkish{padding:0;border:0;background:none;color:var(--c-t2);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.avatar{width:40px;height:40px;flex:none;border-radius:50%;background:var(--c-avatar);color:var(--c-t1);display:grid;place-items:center;font-size:16px;font-weight:800}
.ok-text{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--c-okFg)}
.warn-text{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--c-warnFg)}

.main{flex:1 1 auto;min-width:0;padding:36px 40px 56px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.page-head>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.kicker{margin:0;font-size:15px;font-weight:600;color:var(--c-t3)}
.title{margin:0;font-size:32px;line-height:1.2;font-weight:800;letter-spacing:-0.03em}
.lead{margin:0;font-size:16px;color:var(--c-t2)}

/* ---------- 휴대폰: 위 막대 + 아래 메뉴 ---------- */
.topbar{display:none}
.bottom-nav{display:none}

/* ---------- 카드·상자 ---------- */
.card{position:relative;overflow:hidden;background:var(--c-card);border:1px solid var(--c-line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:16px}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.card h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-0.03em}
.card h3{margin:0;font-size:17px;font-weight:800}
.card p{margin:0}
.glow{position:absolute;right:-90px;top:-110px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,var(--hero-a) 0%,var(--hero-b) 40%,transparent 70%);pointer-events:none}
.box{padding:16px 18px;border-radius:14px;background:var(--c-card2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:24px}
.muted{color:var(--c-t2)}
.faint{color:var(--c-t3);font-size:14px}
.big-num{margin:0;font-size:44px;line-height:1.15;font-weight:800;letter-spacing:-0.04em}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:12px;align-items:flex-start}
.step-no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:14px;font-weight:800}
.step-no.done{background:var(--c-okBg);color:var(--c-okFg)}
.soon-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.soon-list li{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--c-line);font-weight:700}
.soon-list li:first-child{border-top:0}
.soon-list li .chip{margin-left:auto}

/* ---------- 단추 ---------- */
.btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;border-radius:12px;border:1px solid var(--c-line2);background:var(--c-card);color:var(--c-t1);font-size:16px;font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--c-onAccent);box-shadow:0 8px 20px var(--accent-glow)}
.btn-block{width:100%;min-height:52px;font-size:17px}
.btn-sm{min-height:40px;padding:0 14px;border-radius:10px;font-size:15px}
.btn-ghost{border-color:transparent;background:transparent;color:var(--c-t2)}
.btn-danger{color:var(--c-red)}
.btn:disabled{opacity:.55;cursor:default;box-shadow:none}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:12px;background:transparent;color:var(--c-t2);cursor:pointer}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- 입력 ---------- */
.form{display:flex;flex-direction:column;gap:16px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-size:15px;font-weight:700;color:var(--c-t2)}
.req{color:var(--c-red)}
.input{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--c-line2);background:var(--c-card);color:var(--c-t1);font-size:16px}
textarea.input{min-height:96px;padding:12px 14px;resize:vertical}
select.input{appearance:auto}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input-pin{font-size:24px;font-weight:800;letter-spacing:.5em;text-align:center;padding-left:calc(14px + .5em)}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:56px}
.pw-wrap .icon-btn{position:absolute;right:2px;top:2px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:16px;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.hint{display:flex;gap:6px;margin:0;font-size:14px;line-height:1.5;color:var(--c-t3)}
.hint svg{margin-top:2px}
.err{margin:0;min-height:0;color:var(--c-red);font-size:15px;font-weight:700}
.err:empty{display:none}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;background:var(--c-card);border:1px solid var(--c-line2);border-radius:12px;color:var(--c-t3)}
.search{min-width:0}
.search input{flex:1 1 auto;width:100%;min-width:0;height:100%;border:0;outline:none;background:transparent;color:var(--c-t1);font-size:16px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* ---------- 칩 ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;min-height:26px;padding:0 10px;border-radius:9999px;background:var(--c-pill);color:var(--c-t2);font-size:13px;font-weight:700;white-space:nowrap}
.chip-ok{background:var(--c-okBg);color:var(--c-okFg)}
.chip-warn{background:var(--c-warnBg);color:var(--c-warnFg)}
.chip-accent{background:var(--accent-soft);color:var(--accent)}

/* ---------- 탭 ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--c-line);overflow-x:auto;scrollbar-width:none}
.tab{flex:none;min-height:48px;padding:0 16px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--c-t3);font-size:17px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--c-t1);border-bottom-color:var(--accent)}

/* ---------- 로그인·본인 확인 ---------- */
.gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px 16px}
.gate-card{width:min(460px,100%);background:var(--c-card);border:1px solid var(--c-line);border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:20px;position:relative;overflow:hidden}
.gate-card h1{margin:0;font-size:28px;line-height:1.25;font-weight:800;letter-spacing:-0.03em}
.gate-top{width:min(460px,100%);display:flex;align-items:center;justify-content:space-between;gap:12px}
.gate-foot{width:min(460px,100%);margin:0;font-size:14px;color:var(--c-t3);text-align:center}
.people{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;padding:2px}
.person{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px;border:1px solid var(--c-line);border-radius:14px;background:var(--c-card);cursor:pointer}
.person input{position:absolute;opacity:0;pointer-events:none}
.person.on{border:2px solid var(--accent);background:var(--accent-soft);padding:7px 13px}
.person:has(input:focus-visible){outline:3px solid var(--accent-ring);outline-offset:2px}
.person-lines{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.person-name{font-weight:800}
.person-sub{font-size:14px;color:var(--c-t3)}
.person .chip{margin-left:auto}
.preview-banner{width:min(460px,100%);padding:12px 16px;border-radius:14px;background:var(--c-warnBg);color:var(--c-warnFg);font-size:14px;font-weight:600}

/* ---------- 목록(교직원 표 등) ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.toolbar .search{flex:1 1 240px}
.counts{display:flex;flex-wrap:wrap;gap:8px}
.rows{display:flex;flex-direction:column;border:1px solid var(--c-line);border-radius:16px;overflow:hidden}
.srow{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(150px,1fr) minmax(160px,1.5fr) 64px minmax(250px,auto);align-items:center;gap:12px;padding:14px 18px;border-top:1px solid var(--c-line);background:var(--c-card)}
.srow:first-child{border-top:0}
.srow.head{background:var(--c-card2);font-size:14px;font-weight:700;color:var(--c-t3);padding-top:10px;padding-bottom:10px}
.srow.off{background:var(--c-card2)}
.srow.off .s-name{color:var(--c-t3)}
.s-name{font-weight:800}
.s-sub{font-size:14px;color:var(--c-t3)}
.s-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.s-btns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.empty{padding:32px 16px;text-align:center;color:var(--c-t3)}
/* 분류: 이름 칸은 6글자 이상이 한 번에 보이게(최소 156px), 순서 칸은 숫자 3자리만큼 */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:24px;align-items:start}
.cat-list{display:flex;flex-direction:column;gap:8px}
.cat-row{display:grid;grid-template-columns:minmax(156px,1fr) 68px 172px;gap:8px;align-items:center}
.cat-row .input{min-width:0}
.cat-row .cat-order{padding:0 8px;text-align:center}
.cat-row .row-btns{flex-wrap:nowrap;justify-content:flex-end;gap:4px}
.cat-row.off .input{color:var(--c-t3)}
.cat-cols{display:grid;grid-template-columns:minmax(156px,1fr) 68px 172px;gap:8px;font-size:13px;font-weight:700;color:var(--c-t3)}
.cat-cols span:nth-child(2){text-align:center}
.cat-new{display:grid;grid-template-columns:minmax(156px,1fr) auto;gap:8px;align-items:center;padding-top:12px;border-top:1px solid var(--c-line)}
.link-row{display:grid;grid-template-columns:minmax(120px,1fr) minmax(160px,2fr) auto;gap:8px;align-items:center}
.log-item{padding:14px 0;border-top:1px solid var(--c-line)}
.log-item:first-child{border-top:0}
.log-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.log-time{font-size:14px;color:var(--c-t3);font-variant-numeric:tabular-nums}
.log-sum{margin:4px 0 0;font-weight:600}
.log-item details{margin-top:6px}
.log-item summary{min-height:32px;display:inline-flex;align-items:center;font-size:14px;font-weight:700;color:var(--c-t2);cursor:pointer}
.diff{margin-top:6px;display:grid;grid-template-columns:max-content minmax(0,max-content) auto minmax(0,1fr);gap:4px 10px;font-size:14px;overflow-wrap:anywhere}
.diff .to{color:var(--c-t3)}
.diff .k{font-weight:700;color:var(--c-t2)}
.diff .b{color:var(--c-t3);text-decoration:line-through}

/* ---------- 창(모달)·알림 ---------- */
.modal-back{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.45)}
.modal{width:min(560px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;background:var(--c-card);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-0.03em}
.modal-btns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.pin-big{margin:0;padding:22px 12px;border-radius:16px;background:var(--c-card2);text-align:center;font:800 52px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.3em;padding-left:calc(12px + .3em)}
.pin-list{display:flex;flex-direction:column;border:1px solid var(--c-line);border-radius:14px;overflow:hidden}
.pin-list div{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--c-line)}
.pin-list div:first-child{border-top:0}
.pin-list b{margin-left:auto;font:800 20px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em}
.sheet-back{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:85vh;max-height:85dvh;overflow:auto;background:var(--c-sub);border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet-grab{width:40px;height:4px;border-radius:2px;background:var(--c-line2);margin:0 auto 4px}
.toast{position:fixed;left:50%;bottom:76px;z-index:80;transform:translateX(-50%);max-width:calc(100% - 32px);padding:12px 16px;border-radius:12px;background:var(--c-t1);color:var(--c-bg);font:600 14px/1.4 Pretendard,-apple-system,'Malgun Gothic',sans-serif;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;min-height:120px;color:var(--c-t3);font-weight:600}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--c-line2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}.toast{transition:none}}
.print-only{display:none}
.slips{display:grid;grid-template-columns:repeat(2,1fr);gap:0}
.slip{border:1px dashed #9AA3AD;padding:16px 18px;break-inside:avoid;font-size:14px;line-height:1.5;color:#191F28}
.slip-pin{margin:6px 0;font:800 30px/1.1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.3em}

@media (hover:hover){
  .nav-item:hover{background:var(--c-card2);color:var(--c-t1)}
  .btn:not(:disabled):hover{filter:brightness(.97)}
  .btn-primary:not(:disabled):hover{filter:brightness(1.06)}
  .person:hover{border-color:var(--c-line2)}
  .icon-btn:hover{background:var(--c-card2)}
}

<script>
/* ---- 미리보기 서버: apps-script/*.gs 를 그대로 가짜 시트 위에서 돌린다 ---- */
(function () {
  var env = GasMock.createEnv({});

      Utilities = env.Utilities, Session = env.Session;
/* ===== Code.gs ===== */
/**
 * 인천장도초등학교 온라인 교무실 — Apps Script 웹앱
 *
 * Code.gs — 웹앱 시작과 화면→서버 요청 창구
 * 화면은 api() 하나로만 서버를 부른다. 요청마다 로그인·본인 확인·관리자 표를 확인한다.
 *
 * 파일
 *   Code.gs   시작, 요청 창구
 *   Db.gs     시트 읽기·쓰기, 기록, 잠금
 *   Auth.gs   비밀번호, 개인 번호, 로그인 표
 *   Admin.gs  설정, 분류, 교직원 표, 수정 기록
 *   Schedule.gs  일정(달력·연간 학사일정·월별 계획·홈), 수업일수, 휴지통
 *   Setup.gs  시트 메뉴, 처음 설정, 매일 백업, 테스트 데이터
 *   Index.html / Styles.html / App.html  화면
 */

function doGet() {
  return HtmlService.createTemplateFromFile('Index').evaluate()
    .setTitle('온라인 교무실')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover');
}

/** Index.html 안에서 다른 HTML 파일을 끼워 넣을 때 쓴다 */
function include(name) {
  return HtmlService.createHtmlOutputFromFile(name).getContent();
}

/**
 * 요청 목록
 * need: 'public'(누구나) | 'login'(공통 로그인) | 'identity'(본인 확인까지) | 'admin'(관리자)
 */
function routes_() {
  return {
    'start': { need: 'public', fn: apiStart_ },
    'login': { need: 'public', fn: function (a) { return login_(a); } },
    'session': { need: 'login', fn: apiSession_ },
    'staffPicker': { need: 'login', fn: function () { return staffPicker_(); } },
    'verify': { need: 'login', fn: function (a) { return verifyPin_(a); } },
    'adminLogin': { need: 'login', fn: function (a) { return adminLogin_(a); } },

    'home': { need: 'login', fn: apiHome_ },
    'sched.month': { need: 'login', fn: apiSchedMonth_ },
    'sched.year': { need: 'login', fn: apiSchedYear_ },
    'sched.save': { need: 'identity', fn: apiSchedSave_ },
    'sched.delete': { need: 'identity', fn: apiSchedDelete_ },
    'focus.save': { need: 'identity', fn: apiFocusSave_ },

    'admin.settings.get': { need: 'admin', fn: function () { return adminSettingsGet_(); } },
    'admin.settings.save': { need: 'admin', fn: adminSettingsSave_ },
    'admin.cat.list': { need: 'admin', fn: function () { return adminCategoryList_(); } },
    'admin.cat.save': { need: 'admin', fn: adminCategorySave_ },
    'admin.cat.setActive': { need: 'admin', fn: adminCategorySetActive_ },
    'admin.staff.list': { need: 'admin', fn: function () { return { staff: adminStaffList_(), depts: deptOptions_(), pinMode: pinMode_() }; } },
    'admin.staff.save': { need: 'admin', fn: adminStaffSave_ },
    'admin.staff.setActive': { need: 'admin', fn: adminStaffSetActive_ },
    'admin.staff.resetPin': { need: 'admin', fn: adminStaffResetPin_ },
    'admin.staff.issueMissing': { need: 'admin', fn: adminStaffIssueMissing_ },
    'admin.staff.unlock': { need: 'admin', fn: adminStaffUnlock_ },
    'admin.log.list': { need: 'admin', fn: adminLogList_ },
    'admin.trash.list': { need: 'admin', fn: function () { return adminTrashList_(); } },
    'admin.trash.restore': { need: 'admin', fn: adminTrashRestore_ },

/**
 * 화면에서 부르는 하나뿐인 창구. 주고받는 값은 JSON 글자다.
 * req = { action, args, tokens: { login, identity, admin } }
 */
function api(reqText) {
  SETTINGS_CACHE_ = null;
  DB_SS_ = null;
  try {
    var req = JSON.parse(String(reqText || '{}'));
    var route = routes_()[req.action];
    if (!route) throw userError_('알 수 없는 요청이에요. 화면을 새로 고쳐 주세요.');
    var t = req.tokens || {};
    var ctx = { login: false, identity: null, admin: false, tokens: t };
    if (route.need !== 'public') {
      ctx.login = checkLogin_(t.login);
      if (!ctx.login) throw userError_('다시 로그인해 주세요.', 'LOGIN');
      ctx.identity = t.identity ? checkIdentity_(t.identity) : null;
      if (route.need === 'identity' && !ctx.identity) throw userError_('먼저 이름을 고르고 개인 번호를 넣어 주세요.', 'IDENTITY');
      if (route.need === 'admin') {
        ctx.admin = checkAdmin_(t.admin);
        if (!ctx.admin) throw userError_('관리자 비밀번호를 다시 넣어 주세요.', 'ADMIN');
      }

    var actor = ctx.identity
      ? { id: ctx.identity['교직원ID'], name: ctx.identity['이름'] }
      : { id: '', name: ctx.admin ? '관리자(본인 확인 전)' : '' };

    if (err && err.userMessage) return JSON.stringify({ ok: false, error: err.userMessage, code: err.code });
    console.error(err && err.stack ? err.stack : err);
    return JSON.stringify({ ok: false, error: '잠시 문제가 생겼어요. 잠깐 뒤에 다시 해 주세요. 계속 안 되면 연구부장·부담당에게 알려 주세요.', code: 'ERROR' });
  }
}

function apiStart_() {
  var ready = true;

  return {
    school: ready ? setting_('학교명') : '인천장도초등학교',
    year: ready ? setting_('학년도') : '',
    ready: ready && hasPassword_('common'),
    rememberDays: ready ? rememberDays_() : 365,
    pinMode: ready ? pinMode_() : false

}

function apiSession_(args, actor, ctx) {
  return {
    me: ctx.identity ? meView_(ctx.identity) : null,
    admin: !!(ctx.tokens.admin && checkAdmin_(ctx.tokens.admin))

}

function deptOptions_() {
  return liveRows_('분류').filter(function (r) { return r['종류'] === '부서'; })
    .sort(function (a, b) { return (Number(a['순서']) || 999) - (Number(b['순서']) || 999) || a['이름'].localeCompare(b['이름'], 'ko'); })

}

/** 시트에서 읽은 값을 글자로 */

    return Utilities.formatDate(v, tz_(), hasTime ? 'yyyy-MM-dd HH:mm:ss' : 'yyyy-MM-dd');

    var o = { _row: i + 1 };
    var empty = true;
    for (var j = 0; j < head.length; j++) {
      if (!head[j]) continue;
      o[head[j]] = cellText_(vals[i][j]);
      if (o[head[j]] !== '') empty = false;
    }
    if (!empty) rows.push(o);
  }
  return rows;
}

/** 삭제 표시가 없는 행만 */
function liveRows_(tab) {
  return readRows_(tab).filter(function (r) { return !r['삭제 여부']; });
}

function findRow_(tab, id) {
  var key = tabs_()[tab][0];
  var rows = readRows_(tab);
  for (var i = 0; i < rows.length; i++) if (rows[i][key] === id) return rows[i];
  return null;
}

/** 화면에 보낼 때 숨길 칸을 뺀다 */
function publicRow_(r) {
  var o = {};
  var hide = hiddenCols_();
  Object.keys(r).forEach(function (k) {
    if (k === '_row' || hide.indexOf(k) >= 0) return;
    o[k] = r[k];
  });
  return o;
}

// ---------------------------------------------------------------- 쓰기 (모두 잠금 안에서)

var DB_LOCK_DEPTH_ = 0;

function withLock_(fn) {
  if (DB_LOCK_DEPTH_ > 0) return fn(); // 이미 잠금 안이면 그대로
  var lock = LockService.getScriptLock();
  if (!lock.tryLock(20000)) throw userError_('다른 분이 저장하는 중이에요. 잠시 뒤에 다시 눌러 주세요.', 'BUSY');
  DB_LOCK_DEPTH_++;
  try {
    return fn();
  } finally {
    DB_LOCK_DEPTH_--;
    lock.releaseLock();
  }
}

function headOf_(tab) {
  var sh = sheet_(tab);
  return sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0].map(cellText_);
}

function newId_(tab) {
  var key = tabs_()[tab][0];
  var used = {};
  readRows_(tab).forEach(function (r) { used[r[key]] = true; });
  for (var n = 0; n < 20; n++) {
    var id = idPrefix_(tab) + Utilities.getUuid().replace(/-/g, '').slice(0, 8).toUpperCase();
    if (!used[id]) return id;
  }
  throw new Error('ID를 만들지 못했어요');
}

/**
 * 새 행 넣기. actor = {id, name}
 * 돌려주는 값: 넣은 행(숨김 칸 제외)
 */
function insertRow_(tab, obj, actor, summary) {
  return withLock_(function () {
    var head = headOf_(tab);
    var key = head[0];
    var rec = {};
    head.forEach(function (h) { if (obj[h] !== undefined) rec[h] = String(obj[h]); });
    rec[key] = newId_(tab);
    rec['입력자ID'] = actor.id || '';
    rec['입력 시각'] = nowText_();
    rec['수정자ID'] = '';
    rec['수정 시각'] = '';
    rec['삭제 여부'] = '';
    sheet_(tab).appendRow(head.map(function (h) { return cellWrite_(rec[h]); }));
    writeLog_(actor, tab, rec[key], '추가', summary || '', null, auditView_(rec));
    return publicRow_(rec);
  });
}

/**
 * 행 고치기. patch에 있는 칸만 바꾼다(ID·입력 칸은 못 바꿈).
 * 바뀐 칸이 없으면 기록을 남기지 않는다.
 */
function updateRow_(tab, id, patch, actor, summary, action) {
  return withLock_(function () {
    var row = findRow_(tab, id);
    if (!row) throw userError_('고칠 항목을 찾지 못했어요. 화면을 새로 고쳐 주세요.', 'NOTFOUND');
    var head = headOf_(tab);
    var locked = [head[0], '입력자ID', '입력 시각', '수정자ID', '수정 시각'];
    var before = {}, after = {}, changed = false;
    var next = {};
    head.forEach(function (h) { next[h] = row[h] === undefined ? '' : row[h]; });
    Object.keys(patch).forEach(function (h) {
      if (head.indexOf(h) < 0 || locked.indexOf(h) >= 0) return;
      var v = patch[h] === null || patch[h] === undefined ? '' : String(patch[h]);
      if (next[h] !== v) {
        before[h] = next[h];
        after[h] = v;
        next[h] = v;
        changed = true;
      }
    });
    if (!changed) return publicRow_(row);
    next['수정자ID'] = actor.id || '';
    next['수정 시각'] = nowText_();
    sheet_(tab).getRange(row._row, 1, 1, head.length)
      .setValues([head.map(function (h) { return cellWrite_(next[h]); })]);
    writeLog_(actor, tab, id, action || '수정', summary || '', auditView_(before), auditView_(after));
    next._row = row._row;
    return publicRow_(next);
  });
}

/** 지우기 = 숨김 표시. 되살릴 수 있다. */
function softDelete_(tab, id, actor, summary) {
  return updateRow_(tab, id, { '삭제 여부': '삭제' }, actor, summary, '삭제');
}

function restoreRow_(tab, id, actor, summary) {
  return updateRow_(tab, id, { '삭제 여부': '' }, actor, summary, '되살리기');
}

/**
 * 기록을 남기지 않고 칸만 바꾼다. 틀린 횟수처럼 보안용 숫자에만 쓴다.
 * 반드시 withLock_ 안에서 부른다.
 */
function setCellsNoLog_(tab, row, patch) {
  var head = headOf_(tab);
  var sh = sheet_(tab);
  Object.keys(patch).forEach(function (h) {
    var c = head.indexOf(h);
    if (c < 0) return;
    sh.getRange(row._row, c + 1).setValue(cellWrite_(patch[h]));
    row[h] = String(patch[h]);
  });
}

// ---------------------------------------------------------------- 기록

function auditView_(rec) {
  if (!rec) return null;
  var o = {};
  var secret = secretCols_();
  Object.keys(rec).forEach(function (k) {
    if (k === '_row') return;
    o[k] = secret.indexOf(k) >= 0 ? '(비공개)' : rec[k];
  });
  return o;
}

function writeLog_(actor, tab, id, action, summary, before, after) {
  var sh = sheet_('기록');
  sh.appendRow([
    nowText_(),
    actor.id || '',
    actor.name || '',
    tab,
    id || '',
    action,
    summary || '',
    before ? JSON.stringify(before) : '',
    after ? JSON.stringify(after) : ''
  ].map(cellWrite_));
}

// ---------------------------------------------------------------- 오류

/** 사용자에게 그대로 보여 줄 오류 */
function userError_(msg, code) {
  var e = new Error(msg);
  e.userMessage = msg;
  e.code = code || 'USER';
  return e;
}

/** 글자 길이 확인 */
function cleanText_(v, max, label, required) {
  var s = v === null || v === undefined ? '' : String(v).trim();
  if (required && !s) throw userError_(label + josa_(label, '을', '를') + ' 적어 주세요.');
  if (s.length > max) throw userError_(label + josa_(label, '은', '는') + ' ' + max + '자까지 적을 수 있어요.');
  return s;
}

/** 받침에 맞는 조사 */
function josa_(word, withBatchim, without) {
  var c = String(word).charCodeAt(String(word).length - 1);
  if (c < 0xAC00 || c > 0xD7A3) return withBatchim + '(' + without + ')';
  return (c - 0xAC00) % 28 ? withBatchim : without;
}

/* ===== Auth.gs ===== */
/**
 * Auth.gs — 로그인·본인 확인·관리자 확인
 *
 * 비밀번호를 두는 곳
 * - 공통 비밀번호·관리자 비밀번호: 스크립트 속성에 '해시'로만 저장한다. 원래 글자는 어디에도 남지 않는다.
 * - 개인 번호 4자리: 교직원 탭에 '사람마다 다른 솔트 + 비밀 값(PIN_PEPPER)'을 섞은 해시로만 저장한다.
 * - 로그인 상태: 서명한 표(토큰)를 브라우저가 들고 있다. 번호·비밀번호 자체는 브라우저에 저장하지 않는다.
 *
 * 스크립트 속성 이름
 *   SHEET_ID, PIN_PEPPER, TOKEN_SECRET,
 *   COMMON_PW_HASH, COMMON_PW_SALT, COMMON_PW_VER,
 *   ADMIN_PW_HASH, ADMIN_PW_SALT, ADMIN_PW_VER, ADMIN_FAILS, ADMIN_LOCK_UNTIL
 */

var AUTH_LOGIN_HOURS_ = 12;   // '기억하기'를 끈 로그인·본인 확인이 유지되는 시간 (제안)
var AUTH_ADMIN_HOURS_ = 2;    // 관리자 화면이 열려 있는 시간 (제안)
var AUTH_MIN_PW_ = 6;         // 공통·관리자 비밀번호 최소 글자 수 (제안)

function props_() {
  return PropertiesService.getScriptProperties();
}

// ---------------------------------------------------------------- 해시·서명

function hex_(bytes) {
  return bytes.map(function (b) {
    var v = (b + 256) % 256;
    return (v < 16 ? '0' : '') + v.toString(16);
  }).join('');
}

function sha256Hex_(s) {
  return hex_(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, s, Utilities.Charset.UTF_8));
}

/** 없으면 만들어 두는 비밀 값(설치할 때 한 번 생김) */
function secretProp_(name) {
  var p = props_();
  var v = p.getProperty(name);
  if (!v) {
    v = Utilities.getUuid() + Utilities.getUuid();
    p.setProperty(name, v);
  }
  return v;
}

function sign_(body) {
  var sig = Utilities.computeHmacSha256Signature(body, secretProp_('TOKEN_SECRET'));
  return Utilities.base64EncodeWebSafe(sig).replace(/=+$/, '');
}

/** 같은 길이로 끝까지 비교 */
function sameText_(a, b) {
  a = String(a); b = String(b);
  if (a.length !== b.length) return false;
  var diff = 0;
  for (var i = 0; i < a.length; i++) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
  return diff === 0;
}

function makeToken_(payload) {
  var body = Utilities.base64EncodeWebSafe(JSON.stringify(payload), Utilities.Charset.UTF_8).replace(/=+$/, '');
  return body + '.' + sign_(body);
}

function readToken_(token, kind) {
  if (!token || typeof token !== 'string' || token.length > 2000) return null;
  var i = token.lastIndexOf('.');
  if (i < 1) return null;
  var body = token.slice(0, i);
  if (!sameText_(sign_(body), token.slice(i + 1))) return null;
  var o;
  try {
    var pad = body + '===='.slice(0, (4 - body.length % 4) % 4);
    o = JSON.parse(Utilities.newBlob(Utilities.base64DecodeWebSafe(pad)).getDataAsString('UTF-8'));
  } catch (e) {
    return null;
  }
  if (!o || o.k !== kind || !(o.exp > Date.now())) return null;
  return o;
}

// ---------------------------------------------------------------- 공통·관리자 비밀번호

function pwKey_(kind) {
  return kind === 'admin' ? 'ADMIN' : 'COMMON';
}

function hasPassword_(kind) {
  return !!props_().getProperty(pwKey_(kind) + '_PW_HASH');
}

function pwHash_(pw, salt) {
  return sha256Hex_(secretProp_('PIN_PEPPER') + ':' + salt + ':' + pw);
}

/** 비밀번호 정하기. 버전이 올라가 예전 로그인은 모두 풀린다. */
function setPassword_(kind, pw) {
  pw = String(pw || '');
  if (pw.length < AUTH_MIN_PW_) throw userError_('비밀번호는 ' + AUTH_MIN_PW_ + '자 이상으로 정해 주세요.');
  if (pw.length > 64) throw userError_('비밀번호는 64자까지 정할 수 있어요.');
  var k = pwKey_(kind);
  var other = kind === 'admin' ? 'common' : 'admin';
  if (hasPassword_(other) && checkPassword_(other, pw)) {
    throw userError_('공통 비밀번호와 관리자 비밀번호는 서로 다르게 정해 주세요.');
  }
  var salt = Utilities.getUuid();
  var p = props_();
  var ver = Number(p.getProperty(k + '_PW_VER') || 0) + 1;
  p.setProperty(k + '_PW_SALT', salt);
  p.setProperty(k + '_PW_HASH', pwHash_(pw, salt));
  p.setProperty(k + '_PW_VER', String(ver));
  if (kind === 'admin') {
    p.setProperty('ADMIN_FAILS', '0');
    p.setProperty('ADMIN_LOCK_UNTIL', '0');
  }
}

function checkPassword_(kind, pw) {
  var k = pwKey_(kind);
  var p = props_();
  var hash = p.getProperty(k + '_PW_HASH');
  var salt = p.getProperty(k + '_PW_SALT');
  if (!hash || !salt) return false;
  return sameText_(pwHash_(String(pw || ''), salt), hash);
}

function pwVer_(kind) {
  return Number(props_().getProperty(pwKey_(kind) + '_PW_VER') || 0);
}

// ---------------------------------------------------------------- 잠금 기준 (설정 탭)

function lockRule_() {
  return {
    tries: Math.max(1, Number(setting_('잠금 횟수')) || 5),
    minutes: Math.max(1, Number(setting_('잠금 분')) || 10)
  };
}

function rememberDays_() {
  return Math.max(1, Number(setting_('기기 기억 일수')) || 30);
}

function expiry_(remember, hours) {
  return Date.now() + (remember ? rememberDays_() * 24 : hours) * 3600 * 1000;
}

// ---------------------------------------------------------------- 1) 공통 로그인

function login_(args) {
  if (!hasPassword_('common')) {
    throw userError_('아직 공통 비밀번호가 정해지지 않았어요. 연구부장·부담당에게 알려 주세요.', 'SETUP');
  }
  if (!checkPassword_('common', args.password)) {
    Utilities.sleep(1200); // 하나씩 맞춰 보는 것을 느리게
    throw userError_('비밀번호가 맞지 않아요. 다시 넣어 주세요.', 'BADPW');
  }
  // '이름만' 방식에서는 공통 비밀번호를 기기에 기억해 둔다(기억 기간: 설정 '기기 기억 일수')
  var remember = !!args.remember || !pinMode_();
  return {
    login: makeToken_({ k: 'L', v: pwVer_('common'), exp: expiry_(remember, AUTH_LOGIN_HOURS_) }),
    remember: remember
  };
}

/** 본인 확인 방식: '이름만'(이름 고르기) 또는 '이름+개인 번호' — 설정 탭에서 바꾼다 */
function pinMode_() {
  return setting_('본인 확인 방식') === '이름+개인 번호';
}

function identityModeCode_() {
  return pinMode_() ? 'P' : 'N';
}

function checkLogin_(token) {
  var o = readToken_(token, 'L');
  return !!(o && o.v === pwVer_('common'));
}

// ---------------------------------------------------------------- 2) 본인 확인 (이름 + 개인 번호)

/** 이름 고르기 목록: 사용 중인 분만 */
function staffPicker_() {
  var depts = categoryNames_('부서');
  return sortStaff_(liveRows_('교직원').filter(function (r) { return r['사용 여부'] !== '사용 안 함'; }))
    .map(function (r) {
      return {
        id: r['교직원ID'],
        name: r['이름'],
        position: r['직위'],
        group: r['소속'],
        dept: depts[r['부서ID']] || '',
        hasPin: !!r['개인번호해시']
      };
    });
}

function sortStaff_(rows) {
  return rows.slice().sort(function (a, b) {
    var oa = Number(a['순서']) || 9999, ob = Number(b['순서']) || 9999;
    if (oa !== ob) return oa - ob;
    return String(a['이름']).localeCompare(String(b['이름']), 'ko');
  });
}

function pinHash_(pin, salt) {
  return sha256Hex_(secretProp_('PIN_PEPPER') + ':' + salt + ':' + pin);
}

function verifyPin_(args) {
  if (!pinMode_()) return pickName_(args);
  var staffId = String(args.staffId || '');
  var pin = String(args.pin || '');
  if (!/^\d{4}$/.test(pin)) throw userError_('개인 번호 4자리를 숫자로 넣어 주세요.', 'BADPIN');
  var remember = !!args.remember;
  var rule = lockRule_();

  var result = withLock_(function () {
    var row = findRow_('교직원', staffId);
    if (!row || row['삭제 여부'] || row['사용 여부'] === '사용 안 함') {
      throw userError_('명단에서 이름을 다시 골라 주세요.', 'NOTFOUND');
    }
    if (!row['개인번호해시']) {
      throw userError_('아직 개인 번호가 없어요. 연구부장·부담당에게 받아 주세요.', 'NOPIN');
    }
    var until = Number(row['잠금 해제 시각']) || 0;
    if (until > Date.now()) {
      var left = Math.ceil((until - Date.now()) / 60000);
      throw userError_('번호를 여러 번 틀려서 잠시 잠겼어요. ' + left + '분 뒤에 다시 해 주세요. 급하면 연구부장·부담당에게 알려 주세요.', 'LOCKED');
    }
    if (sameText_(pinHash_(pin, row['솔트']), row['개인번호해시'])) {
      if (row['틀린 횟수'] && row['틀린 횟수'] !== '0') setCellsNoLog_('교직원', row, { '틀린 횟수': '0', '잠금 해제 시각': '' });
      return { ok: true, row: row };
    }
    var fails = (Number(row['틀린 횟수']) || 0) + 1;
    if (fails >= rule.tries) {
      setCellsNoLog_('교직원', row, { '틀린 횟수': '0', '잠금 해제 시각': String(Date.now() + rule.minutes * 60000) });
      writeLog_({ id: row['교직원ID'], name: row['이름'] }, '교직원', row['교직원ID'], '잠김',
        '개인 번호를 ' + rule.tries + '번 틀려서 ' + rule.minutes + '분 잠김', null, null);
      return { ok: false, msg: '번호를 ' + rule.tries + '번 틀려서 ' + rule.minutes + '분 동안 잠겼어요. 잠시 뒤에 다시 해 주세요.', code: 'LOCKED' };
    }
    setCellsNoLog_('교직원', row, { '틀린 횟수': String(fails) });
    return { ok: false, msg: '번호가 맞지 않아요. 남은 기회는 ' + (rule.tries - fails) + '번이에요.', code: 'BADPIN' };
  });

  if (!result.ok) {
    Utilities.sleep(600);
    throw userError_(result.msg, result.code);
  }
  var row = result.row;
  var out = {
    identity: makeToken_({ k: 'I', m: 'P', s: row['교직원ID'], p: row['번호 바꾼 날'], exp: expiry_(remember, AUTH_LOGIN_HOURS_) }),
    me: meView_(row),
    remember: remember
  };
  // 기억하기를 켜면 공통 로그인도 같은 기간 동안 유지한다
  if (remember) out.login = makeToken_({ k: 'L', v: pwVer_('common'), exp: expiry_(true, AUTH_LOGIN_HOURS_) });
  return out;
}

/** '이름만' 방식: 명단에서 고른 이름으로 본인 확인(번호 없음). 기록에는 고른 이름으로 남는다. */
function pickName_(args) {
  var row = findRow_('교직원', String(args.staffId || ''));
  if (!row || row['삭제 여부'] || row['사용 여부'] === '사용 안 함') {
    throw userError_('명단에서 이름을 다시 골라 주세요.', 'NOTFOUND');
  }
  var remember = !!args.remember;
  var out = {
    identity: makeToken_({ k: 'I', m: 'N', s: row['교직원ID'], p: row['번호 바꾼 날'], exp: expiry_(remember, AUTH_LOGIN_HOURS_) }),
    me: meView_(row),
    remember: remember
  };
  if (remember) out.login = makeToken_({ k: 'L', v: pwVer_('common'), exp: expiry_(true, AUTH_LOGIN_HOURS_) });
  return out;
}

/** 본인 확인 표를 확인하고 교직원 행을 돌려준다. 번호를 다시 정했거나 사용 안 함이거나 확인 방식이 바뀌면 풀린다. */
function checkIdentity_(token) {
  var o = readToken_(token, 'I');
  if (!o) return null;
  if ((o.m || 'P') !== identityModeCode_()) return null;
  var row = findRow_('교직원', o.s);
  if (!row || row['삭제 여부'] || row['사용 여부'] === '사용 안 함') return null;
  if (String(row['번호 바꾼 날']) !== String(o.p)) return null;
  return row;
}

function meView_(row) {
  var depts = categoryNames_('부서');
  return {
    id: row['교직원ID'],
    name: row['이름'],
    position: row['직위'],
    group: row['소속'],
    dept: depts[row['부서ID']] || '',
    deptId: row['부서ID'] || '',
    role: row['역할'] || '일반'
  };
}

// ---------------------------------------------------------------- 3) 관리자

function adminLogin_(args) {
  if (!hasPassword_('admin')) {
    throw userError_('아직 관리자 비밀번호가 정해지지 않았어요. 시트 메뉴 "온라인 교무실 > 관리자 비밀번호 정하기"에서 먼저 정해 주세요.', 'SETUP');
  }
  var rule = lockRule_();
  var p = props_();
  var res = withLock_(function () {
    var until = Number(p.getProperty('ADMIN_LOCK_UNTIL') || 0);
    if (until > Date.now()) {
      return { ok: false, code: 'LOCKED', msg: '관리자 비밀번호를 여러 번 틀려서 잠겼어요. ' + Math.ceil((until - Date.now()) / 60000) + '분 뒤에 다시 해 주세요.' };
    }
    if (checkPassword_('admin', args.password)) {
      p.setProperty('ADMIN_FAILS', '0');
      return { ok: true };
    }
    var fails = Number(p.getProperty('ADMIN_FAILS') || 0) + 1;
    if (fails >= rule.tries) {
      p.setProperty('ADMIN_FAILS', '0');
      p.setProperty('ADMIN_LOCK_UNTIL', String(Date.now() + rule.minutes * 60000));
      writeLog_({ id: '', name: '' }, '설정', '', '잠김', '관리자 비밀번호를 ' + rule.tries + '번 틀려서 ' + rule.minutes + '분 잠김', null, null);
      return { ok: false, code: 'LOCKED', msg: '관리자 비밀번호를 ' + rule.tries + '번 틀려서 ' + rule.minutes + '분 동안 잠겼어요.' };
    }
    p.setProperty('ADMIN_FAILS', String(fails));
    return { ok: false, code: 'BADPW', msg: '관리자 비밀번호가 맞지 않아요. 남은 기회는 ' + (rule.tries - fails) + '번이에요.' };
  });
  if (!res.ok) {
    Utilities.sleep(1200);
    throw userError_(res.msg, res.code);
  }
  return { admin: makeToken_({ k: 'A', v: pwVer_('admin'), exp: Date.now() + AUTH_ADMIN_HOURS_ * 3600 * 1000 }) };
}

function checkAdmin_(token) {
  var o = readToken_(token, 'A');
  return !!(o && o.v === pwVer_('admin'));
}

// ---------------------------------------------------------------- 개인 번호 만들기

/** 무작위 4자리. 쉬운 번호(0000, 1234 등)는 피한다. */
function newPin_() {
  var bad = { '0000': 1, '1111': 1, '2222': 1, '3333': 1, '4444': 1, '5555': 1, '6666': 1, '7777': 1, '8888': 1, '9999': 1, '1234': 1, '4321': 1, '0123': 1, '9876': 1 };
  for (var n = 0; n < 50; n++) {
    var hex = Utilities.getUuid().replace(/[^0-9a-f]/gi, '');
    var v = parseInt(hex.slice(0, 7), 16);
    if (v >= 268430000) continue; // 0~268429999 만 써서 10000으로 나눈 나머지가 고르게
    var pin = ('000' + (v % 10000)).slice(-4);
    if (!bad[pin]) return pin;
  }
  throw new Error('번호를 만들지 못했어요');
}

/** 번호를 새로 정한다. 원래 숫자는 돌려주기만 하고 어디에도 저장하지 않는다. */
function assignPin_(row, actor) {
  var pin = newPin_();
  var salt = Utilities.getUuid();
  setCellsNoLog_('교직원', row, {
    '개인번호해시': pinHash_(pin, salt),
    '솔트': salt,
    '틀린 횟수': '0',
    '잠금 해제 시각': '',
    '번호 바꾼 날': String(Date.now())
  });
  writeLog_(actor, '교직원', row['교직원ID'], '번호 다시 정함', row['이름'] + ' 선생님 개인 번호를 새로 만듦(번호는 기록하지 않음)', null, null);
  return pin;
}

// ---------------------------------------------------------------- 설정

/** 설정 탭의 키. (확인 필요)는 학교에서 정해 주셔야 하는 값이다. */
function settingDefs_() {
  return [
    { key: '학교명', def: '인천장도초등학교', type: 'text', label: '학교 이름' },
    { key: '학년도', def: '2026', type: 'year', label: '지금 학년도' },
    { key: '1학기 시작일', def: '', type: 'date', label: '1학기 시작일', note: '확인 필요 · 수업일수 계산에 써요(2단계)' },
    { key: '1학기 끝일', def: '', type: 'date', label: '1학기 끝일', note: '확인 필요' },
    { key: '2학기 시작일', def: '', type: 'date', label: '2학기 시작일', note: '확인 필요' },
    { key: '2학기 끝일', def: '', type: 'date', label: '2학기 끝일', note: '확인 필요' },
    { key: '본인 확인 방식', def: '이름만', type: 'choice', options: ['이름만', '이름+개인 번호'], label: '본인 확인 방식', note: "'이름만'은 명단에서 이름만 골라요. 바꾸면 모든 기기에서 이름을 다시 골라야 해요" },
    { key: '기기 기억 일수', def: '365', type: 'int', min: 1, max: 400, label: '로그인·이름을 기기에 기억하는 기간', unit: '일' },
    { key: '잠금 횟수', def: '5', type: 'int', min: 3, max: 10, label: '개인 번호를 몇 번 틀리면 잠글까요', unit: '번', note: "'이름+개인 번호'일 때만 써요" },
    { key: '잠금 분', def: '10', type: 'int', min: 1, max: 120, label: '잠그는 시간', unit: '분', note: "'이름+개인 번호'일 때만 써요" },
    { key: '백업 남길 개수', def: '30', type: 'int', min: 3, max: 365, label: '매일 백업을 몇 개까지 남길까요', unit: '개' },
    { key: '기존 시트 바로가기', def: '[]', type: 'links', label: "홈의 '아직 기존 시트에서 하는 일' 바로가기", note: '2단계 홈 화면에 보여요' },
    { key: '백업 폴더ID', def: '', type: 'readonly', label: '백업 폴더(자동)' },
    { key: '자료 폴더ID', def: '', type: 'readonly', label: '자료 파일 폴더(자동, 4단계)' }
  ];
}

var SETTINGS_CACHE_ = null;

function settingsMap_() {
  if (SETTINGS_CACHE_) return SETTINGS_CACHE_;
  var m = {};
  settingDefs_().forEach(function (d) { m[d.key] = d.def; });
  try {
    readRows_('설정').forEach(function (r) { if (r['키']) m[r['키']] = r['값']; });
  } catch (e) {
    if (e.code !== 'SETUP') throw e;
  }
  SETTINGS_CACHE_ = m;
  return m;
}

function setting_(key) {
  var v = settingsMap_()[key];
  return v === undefined ? '' : v;
}

/** 설정 한 칸을 바꾸고 기록을 남긴다(잠금 안에서 부른다) */
function putSetting_(key, value, actor) {
  withLock_(function () {
    var rows = readRows_('설정');
    var row = null;
    rows.forEach(function (r) { if (r['키'] === key) row = r; });
    var sh = sheet_('설정');
    var before = row ? row['값'] : '';
    if (before === String(value)) return;
    if (row) {
      sh.getRange(row._row, 2).setValue(cellWrite_(value));
    } else {
      var def = settingDefs_().filter(function (d) { return d.key === key; })[0];
      sh.appendRow([key, value, def ? (def.note || def.label) : ''].map(cellWrite_));
    }
    writeLog_(actor, '설정', key, '수정', key + ' 바꿈', { '값': before }, { '값': String(value) });
  });
  SETTINGS_CACHE_ = null;
}

function adminSettingsGet_() {
  var m = settingsMap_();
  return settingDefs_().map(function (d) {
    return { key: d.key, label: d.label, type: d.type, note: d.note || '', unit: d.unit || '', min: d.min, max: d.max, options: d.options, value: m[d.key] };
  });
}

function adminSettingsSave_(args, actor) {
  var values = args.values || {};
  var defs = settingDefs_();
  var clean = {};
  defs.forEach(function (d) {
    if (!(d.key in values) || d.type === 'readonly') return;
    var v = values[d.key] === null || values[d.key] === undefined ? '' : String(values[d.key]).trim();
    if (d.type === 'text') v = cleanText_(v, 40, d.label, true);
    if (d.type === 'year') {
      if (!/^20\d\d$/.test(v)) throw userError_('학년도는 2026처럼 네 자리로 적어 주세요.');
    }
    if (d.type === 'date' && v && !isDate_(v)) throw userError_(d.label + josa_(d.label, '을', '를') + ' 날짜(예: 2026-03-02)로 골라 주세요.');
    if (d.type === 'int') {
      var n = Number(v);
      if (!/^\d+$/.test(v) || n < d.min || n > d.max) {
        throw userError_(d.label + ': ' + d.min + '~' + d.max + d.unit + ' 사이로 적어 주세요.');
      }
    }
    if (d.type === 'links') v = JSON.stringify(cleanLinks_(v));
    if (d.type === 'choice' && d.options.indexOf(v) < 0) throw userError_(d.label + josa_(d.label, '을', '를') + ' 다시 골라 주세요.');
    clean[d.key] = v;
  });
  var s1 = clean['1학기 시작일'] || setting_('1학기 시작일'), e1 = clean['1학기 끝일'] || setting_('1학기 끝일');
  var s2 = clean['2학기 시작일'] || setting_('2학기 시작일'), e2 = clean['2학기 끝일'] || setting_('2학기 끝일');
  if (s1 && e1 && s1 > e1) throw userError_('1학기 끝일이 시작일보다 앞에 있어요.');
  if (s2 && e2 && s2 > e2) throw userError_('2학기 끝일이 시작일보다 앞에 있어요.');
  Object.keys(clean).forEach(function (k) { putSetting_(k, clean[k], actor); });
  return adminSettingsGet_();
}

function isDate_(v) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
  var d = new Date(v + 'T00:00:00Z');
  return !isNaN(d) && d.toISOString().slice(0, 10) === v;
}

function cleanLinks_(v) {
  var list;
  try { list = typeof v === 'string' ? JSON.parse(v || '[]') : v; } catch (e) { list = []; }
  if (!Array.isArray(list)) list = [];
  if (list.length > 12) throw userError_('바로가기는 12개까지 둘 수 있어요.');
  return list.filter(function (x) { return x && (x.name || x.url); }).map(function (x) {
    var name = cleanText_(x.name, 20, '바로가기 이름', true);
    var url = cleanText_(x.url, 500, '바로가기 주소', true);
    if (!/^https:\/\//.test(url)) throw userError_('바로가기 주소는 https:// 로 시작해야 해요.');
    return { name: name, url: url };
  });
}

// ---------------------------------------------------------------- 분류 (부서·자료 분류·도움말 분류)

function categoryKinds_() {
  return ['부서', '자료 분류', '도움말 분류'];
}

/** id → 이름 (사용 안 함 포함, 예전 자료에도 이름이 보이게) */
function categoryNames_(kind) {
  var m = {};
  try {
    readRows_('분류').forEach(function (r) {
      if (!kind || r['종류'] === kind) m[r['분류ID']] = r['이름'];
    });
  } catch (e) {
    if (e.code !== 'SETUP') throw e;
  }
  return m;
}

function adminCategoryList_() {
  var rows = liveRows_('분류');
  return categoryKinds_().map(function (kind) {
    return {
      kind: kind,
      items: rows.filter(function (r) { return r['종류'] === kind; })
        .sort(function (a, b) { return (Number(a['순서']) || 999) - (Number(b['순서']) || 999) || a['이름'].localeCompare(b['이름'], 'ko'); })
        .map(publicRow_)
    };
  });
}

function adminCategorySave_(args, actor) {
  var kind = String(args.kind || '');
  var name = cleanText_(args.name, 20, '분류 이름', true);
  var order = String(args.order === undefined || args.order === null ? '' : args.order).trim();
  if (order && !/^\d{1,3}$/.test(order)) throw userError_('순서는 숫자로 적어 주세요.');
  var rows = liveRows_('분류');
  if (args.id) {
    var row = rows.filter(function (r) { return r['분류ID'] === args.id; })[0];
    if (!row) throw userError_('분류를 찾지 못했어요. 화면을 새로 고쳐 주세요.');
    kind = row['종류'];
    if (rows.some(function (r) { return r['종류'] === kind && r['이름'] === name && r['분류ID'] !== args.id; })) {
      throw userError_('같은 이름의 ' + kind + '가 이미 있어요.');
    }
    var patch = { '이름': name };
    if (order) patch['순서'] = order;
    var summary = row['이름'] === name ? kind + ' "' + name + '" 고침' : kind + ' 이름 바꿈: ' + row['이름'] + ' → ' + name;
    return updateRow_('분류', args.id, patch, actor, summary);
  }
  if (categoryKinds_().indexOf(kind) < 0) throw userError_('분류 종류를 골라 주세요.');
  if (rows.some(function (r) { return r['종류'] === kind && r['이름'] === name; })) {
    throw userError_('같은 이름의 ' + kind + '가 이미 있어요.');
  }
  return insertRow_('분류', { '종류': kind, '이름': name, '순서': order, '사용 여부': '사용' }, actor, kind + ' "' + name + '" 추가');
}

function adminCategorySetActive_(args, actor) {
  var row = findRow_('분류', String(args.id || ''));
  if (!row || row['삭제 여부']) throw userError_('분류를 찾지 못했어요.');
  var v = args.active ? '사용' : '사용 안 함';
  return updateRow_('분류', row['분류ID'], { '사용 여부': v }, actor, row['종류'] + ' "' + row['이름'] + '" ' + v);
}

// ---------------------------------------------------------------- 교직원 표

function staffAdminView_(r, depts) {
  var o = publicRow_(r);
  o.hasPin = !!r['개인번호해시'];
  o.locked = (Number(r['잠금 해제 시각']) || 0) > Date.now();
  o.deptName = depts[r['부서ID']] || '';
  delete o['틀린 횟수'];
  delete o['잠금 해제 시각'];
  delete o['번호 바꾼 날'];
  return o;
}

function adminStaffList_() {
  var depts = categoryNames_('부서');
  return sortStaff_(liveRows_('교직원')).map(function (r) { return staffAdminView_(r, depts); });
}

function adminStaffSave_(args, actor) {
  var f = args.fields || {};
  var rec = {
    '이름': cleanText_(f['이름'], 20, '이름', true),
    '직위': cleanText_(f['직위'], 20, '직위'),
    '소속': cleanText_(f['소속'], 30, '소속'),
    '부서ID': cleanText_(f['부서ID'], 20, '부서'),
    '담당 업무': cleanText_(f['담당 업무'], 200, '담당 업무'),
    '내선': cleanText_(f['내선'], 15, '내선'),
    '역할': f['역할'] === '관리' ? '관리' : '일반',
    '순서': cleanText_(f['순서'], 4, '순서')
  };
  if (rec['내선'] && !/^[0-9\-]+$/.test(rec['내선'])) throw userError_('내선은 숫자와 - 만 적어 주세요. (개인 연락처는 넣지 않아요)');
  if (rec['순서'] && !/^\d+$/.test(rec['순서'])) throw userError_('순서는 숫자로 적어 주세요.');
  if (rec['부서ID'] && !categoryNames_('부서')[rec['부서ID']]) throw userError_('부서를 다시 골라 주세요.');
  var rows = liveRows_('교직원');
  var dup = rows.filter(function (r) {
    return r['이름'] === rec['이름'] && r['소속'] === rec['소속'] && r['교직원ID'] !== args.id;
  });
  if (dup.length) throw userError_('같은 이름과 소속의 교직원이 이미 있어요. 소속을 다르게 적어 구분해 주세요.');
  var depts = categoryNames_('부서');
  if (args.id) {
    var row = findRow_('교직원', args.id);
    if (!row || row['삭제 여부']) throw userError_('교직원을 찾지 못했어요. 화면을 새로 고쳐 주세요.');
    var saved = updateRow_('교직원', args.id, rec, actor, rec['이름'] + ' 선생님 정보 고침');
    return staffAdminView_(findRow_('교직원', saved['교직원ID']), depts);
  }
  rec['사용 여부'] = '사용';
  rec['틀린 횟수'] = '0';
  var added = insertRow_('교직원', rec, actor, rec['이름'] + ' 선생님 추가');
  return staffAdminView_(findRow_('교직원', added['교직원ID']), depts);
}

function adminStaffSetActive_(args, actor) {
  var row = findRow_('교직원', String(args.id || ''));
  if (!row || row['삭제 여부']) throw userError_('교직원을 찾지 못했어요.');
  var v = args.active ? '사용' : '사용 안 함';
  updateRow_('교직원', row['교직원ID'], { '사용 여부': v }, actor, row['이름'] + ' 선생님 ' + v);
  return staffAdminView_(findRow_('교직원', row['교직원ID']), categoryNames_('부서'));
}

function adminStaffResetPin_(args, actor) {
  return withLock_(function () {
    var row = findRow_('교직원', String(args.id || ''));
    if (!row || row['삭제 여부']) throw userError_('교직원을 찾지 못했어요.');
    if (row['사용 여부'] === '사용 안 함') throw userError_('사용 안 함인 분은 번호를 만들 수 없어요. 먼저 "다시 사용"으로 바꿔 주세요.');
    var pin = assignPin_(row, actor);
    return { name: row['이름'], group: row['소속'], position: row['직위'], pin: pin };
  });
}

/** 번호가 없는 사용 중인 분 모두에게 번호를 만든다. 종이로 나눠 줄 목록을 한 번만 돌려준다. */
function adminStaffIssueMissing_(args, actor) {
  return withLock_(function () {
    var list = [];
    sortStaff_(liveRows_('교직원')).forEach(function (row) {
      if (row['사용 여부'] === '사용 안 함' || row['개인번호해시']) return;
      list.push({ name: row['이름'], group: row['소속'], position: row['직위'], pin: assignPin_(row, actor) });
    });
    return list;
  });
}

function adminStaffUnlock_(args, actor) {
  return withLock_(function () {
    var row = findRow_('교직원', String(args.id || ''));
    if (!row || row['삭제 여부']) throw userError_('교직원을 찾지 못했어요.');
    setCellsNoLog_('교직원', row, { '틀린 횟수': '0', '잠금 해제 시각': '' });
    writeLog_(actor, '교직원', row['교직원ID'], '잠금 풀기', row['이름'] + ' 선생님 잠금 풀어 줌', null, null);
    return staffAdminView_(row, categoryNames_('부서'));
  });
}

// ---------------------------------------------------------------- 수정 기록

function adminLogList_(args) {
  var tab = String(args.tab || '');
  var rows = readRows_('기록');
  var out = [];
  for (var i = rows.length - 1; i >= 0 && out.length < 200; i--) {
    var r = rows[i];
    if (tab && r['탭'] !== tab) continue;
    out.push({
      time: r['시각'], who: r['이름'], tab: r['탭'], target: r['대상ID'], action: r['동작'], summary: r['요약'],
      before: safeJson_(r['바뀌기 전']), after: safeJson_(r['바뀐 뒤'])
    });
  }
  return out;
}

function safeJson_(s) {
  if (!s) return null;
  try { return JSON.parse(s); } catch (e) { return null; }
}

// ---------------------------------------------------------------- 비밀번호 바꾸기 (관리자 화면)

function adminChangeCommonPw_(args, actor) {

}

function adminChangeAdminPw_(args, actor) {

  withLock_(function () { writeLog_(actor, '설정', '', '비밀번호 바꿈', '관리자 비밀번호를 바꿈', null, null); });
  return { done: true };
}

/* ===== Schedule.gs ===== */
/**
 * Schedule.gs — 일정(학사일정·월별 계획·홈)과 수업일수 계산
 *
 * 한 번 넣은 행사는 '일정' 탭 한 곳에만 저장되고, 달력·연간 학사일정·월별 계획·홈이 모두 같은 줄을 읽는다.
 * 구분: 행사 / 교육활동 / 휴업일 / 공휴일  (휴업일·공휴일은 수업일수에서 빠진다)
 * 대상 학년: '전체' 또는 '1,2,교직원' 처럼 쉼표로 이어 쓴다.
 * 고치기·지우기: 처음 넣은 사람, 역할이 '관리'인 분, 관리자 화면을 연 분만.
 */

function schedKinds_() {
  return ['행사', '교육활동', '휴업일', '공휴일'];
}

function schedTargets_() {
  return ['1', '2', '3', '4', '5', '6', '교직원'];
}

// ---------------------------------------------------------------- 날짜 도구 (모두 'yyyy-MM-dd' 글자)

function ymdToUtc_(s) {
  var p = String(s).split('-');
  return Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
}

function utcToYmd_(t) {
  var d = new Date(t);
  return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2);
}

function addDays_(s, n) {
  return utcToYmd_(ymdToUtc_(s) + n * 86400000);
}

/** 0=일 … 6=토 */
function weekday_(s) {
  return new Date(ymdToUtc_(s)).getUTCDay();
}

function todayYmd_() {
  return Utilities.formatDate(new Date(), tz_(), 'yyyy-MM-dd');
}

/** 그 주 월요일 */
function mondayOf_(s) {
  var w = weekday_(s);
  return addDays_(s, w === 0 ? -6 : 1 - w);
}

function lastDayOfMonth_(y, m) {
  return utcToYmd_(Date.UTC(y, m, 0)); // m은 1~12
}

/** 학년도 Y = Y년 3월 1일 ~ Y+1년 2월 말일 */
function schoolYearRange_(y) {
  return { from: y + '-03-01', to: lastDayOfMonth_(y + 1, 2) };
}

function eventEnd_(e) {
  return e['끝일'] && e['끝일'] >= e['시작일'] ? e['끝일'] : e['시작일'];
}

/** 시간 칸 정렬: 종일 → 시각(08:40) → 교시 → 그 밖 */
function timeKey_(t) {
  t = String(t || '').trim();
  if (!t || t === '종일') return -1;
  var m = /^(\d{1,2}):(\d{2})/.exec(t);
  if (m) return Number(m[1]) * 60 + Number(m[2]);
  var k = /^(\d)교시/.exec(t);
  if (k) return 9 * 60 + (Number(k[1]) - 1) * 50; // 정렬용 대략값(1교시 9:00부터 50분 간격)
  return 24 * 60;
}

function sortEvents_(list) {
  return list.sort(function (a, b) {
    if (a['시작일'] !== b['시작일']) return a['시작일'] < b['시작일'] ? -1 : 1;
    var ta = timeKey_(a['시간']), tb = timeKey_(b['시간']);
    if (ta !== tb) return ta - tb;
    return String(a['행사명']).localeCompare(String(b['행사명']), 'ko');
  });
}

// ---------------------------------------------------------------- 권한

/** 일정을 고치거나 지울 수 있는지: 처음 넣은 사람 / 역할 '관리' / 관리자 화면 열림 */
function canManage_(ctx) {
  if (ctx.tokens && ctx.tokens.admin && checkAdmin_(ctx.tokens.admin)) return true;
  return !!(ctx.identity && ctx.identity['역할'] === '관리');
}

function canEditEvent_(e, ctx) {
  if (canManage_(ctx)) return true;
  return !!(ctx.identity && e['입력자ID'] && e['입력자ID'] === ctx.identity['교직원ID']);
}

// ---------------------------------------------------------------- 읽기

/** 화면에 보낼 일정 한 줄 */
function eventView_(e, ctx, depts, names) {
  return {
    id: e['일정ID'],
    start: e['시작일'],
    end: eventEnd_(e),
    time: e['시간'],
    title: e['행사명'],
    target: e['대상 학년'],
    deptId: e['담당 부서ID'],
    dept: depts[e['담당 부서ID']] || '',
    place: e['장소'],
    kind: e['구분'] || '행사',
    memo: e['메모'],
    byId: e['입력자ID'],
    by: names[e['입력자ID']] || '',
    at: e['입력 시각'],
    editedAt: e['수정 시각'],
    canEdit: canEditEvent_(e, ctx)
  };
}

function staffNames_() {
  var m = {};
  readRows_('교직원').forEach(function (r) { m[r['교직원ID']] = r['이름']; });
  return m;
}

/** from~to 와 겹치는 일정 */
function eventsBetween_(from, to, ctx) {
  var depts = categoryNames_('부서');
  var names = staffNames_();
  var list = liveRows_('일정').filter(function (e) {
    return e['시작일'] && e['시작일'] <= to && eventEnd_(e) >= from;
  });
  return sortEvents_(list).map(function (e) { return eventView_(e, ctx, depts, names); });
}

function checkYmd_(s, label) {
  if (!isDate_(String(s || ''))) throw userError_(label + josa_(label, '을', '를') + ' 날짜로 골라 주세요.');
  return String(s);
}

/** 달력·월별 계획: 한 달(앞뒤 주 포함) */
function apiSchedMonth_(args, actor, ctx) {
  var y = Number(args.year), m = Number(args.month);
  if (!(y >= 2000 && y <= 2100 && m >= 1 && m <= 12)) throw userError_('달을 다시 골라 주세요.');
  var first = y + '-' + ('0' + m).slice(-2) + '-01';
  var last = lastDayOfMonth_(y, m);
  var from = mondayOf_(first), to = addDays_(mondayOf_(last), 6);
  var sy = m >= 3 ? y : y - 1; // 이 달이 속한 학년도
  return {
    today: todayYmd_(),
    from: from,
    to: to,
    events: eventsBetween_(from, to, ctx),
    focus: focusOf_(sy, m),
    monthDays: instructionalDays_(first, last),
    canManage: canManage_(ctx),
    depts: deptOptions_(),
    schoolYear: sy
  };
}

/** 연간 학사일정 + 수업일수 */
function apiSchedYear_(args, actor, ctx) {
  var y = Number(args.year) || Number(setting_('학년도'));
  if (!(y >= 2000 && y <= 2100)) throw userError_('학년도를 다시 골라 주세요.');
  var r = schoolYearRange_(y);
  return {
    year: y,
    today: todayYmd_(),
    events: eventsBetween_(r.from, r.to, ctx),
    days: semesterDays_(y),
    canManage: canManage_(ctx)
  };
}

/** 홈: 오늘·이번 주·내일 */
function apiHome_(args, actor, ctx) {
  var today = todayYmd_();
  var mon = mondayOf_(today);
  var tomorrow = addDays_(today, 1);
  var to = addDays_(mon, 6) > tomorrow ? addDays_(mon, 6) : tomorrow;
  var links = [];
  try { links = JSON.parse(setting_('기존 시트 바로가기') || '[]'); } catch (e) { links = []; }
  var m = Number(today.slice(5, 7)), y = Number(today.slice(0, 4));
  return {
    today: today,
    monday: mon,
    tomorrow: tomorrow,
    events: eventsBetween_(mon < today ? mon : today, to, ctx),
    links: links,
    focus: focusOf_(m >= 3 ? y : y - 1, m),
    canManage: canManage_(ctx)
  };
}

// ---------------------------------------------------------------- 쓰기

function cleanEvent_(f) {
  var start = checkYmd_(f.start, '날짜');
  var end = f.end ? checkYmd_(f.end, '끝나는 날') : '';
  if (end && end < start) throw userError_('끝나는 날이 시작하는 날보다 앞에 있어요.');
  if (end && ymdToUtc_(end) - ymdToUtc_(start) > 366 * 86400000) throw userError_('한 행사는 1년 안으로 넣어 주세요.');
  if (end === start) end = '';
  var kind = String(f.kind || '행사');
  if (schedKinds_().indexOf(kind) < 0) throw userError_('구분을 다시 골라 주세요.');
  var target = cleanTarget_(f.target);
  var deptId = cleanText_(f.deptId, 20, '담당 부서');
  if (deptId && !categoryNames_('부서')[deptId]) throw userError_('담당 부서를 다시 골라 주세요.');
  return {
    '시작일': start,
    '끝일': end,
    '시간': cleanText_(f.time, 20, '시간'),
    '행사명': cleanText_(f.title, 60, '행사 이름', true),
    '대상 학년': target,
    '담당 부서ID': deptId,
    '장소': cleanText_(f.place, 40, '장소'),
    '구분': kind,
    '메모': cleanText_(f.memo, 300, '메모')
  };
}

/** ['전체'] 또는 ['1','3','교직원'] → 글자 */
function cleanTarget_(t) {
  var list = Array.isArray(t) ? t : String(t || '').split(',');
  list = list.map(function (x) { return String(x).trim(); }).filter(Boolean);
  if (list.indexOf('전체') >= 0) return '전체';
  var ok = schedTargets_();
  list = ok.filter(function (x) { return list.indexOf(x) >= 0; });
  var grades = list.filter(function (x) { return x !== '교직원'; });
  if (grades.length === 6) return '전체' + (list.indexOf('교직원') >= 0 ? ',교직원' : '');
  return list.join(',');
}

function eventSummary_(r) {
  var d = r['시작일'] + (r['끝일'] ? '~' + r['끝일'] : '');
  return d + ' ' + r['행사명'] + (r['구분'] && r['구분'] !== '행사' ? ' (' + r['구분'] + ')' : '');
}

function apiSchedSave_(args, actor, ctx) {
  var rec = cleanEvent_(args.fields || {});
  if ((rec['구분'] === '휴업일' || rec['구분'] === '공휴일') && !canManage_(ctx)) {
    throw userError_('휴업일·공휴일은 수업일수에 영향을 줘서 연구부장·부담당만 넣을 수 있어요.');
  }
  var depts = categoryNames_('부서'), names = staffNames_();
  if (args.id) {
    var row = findRow_('일정', String(args.id));
    if (!row || row['삭제 여부']) throw userError_('이 일정을 찾지 못했어요. 이미 지워졌을 수 있어요.');
    if (!canEditEvent_(row, ctx)) throw userError_('처음 넣은 분과 연구부장·부담당만 고칠 수 있어요.', 'FORBIDDEN');
    if ((row['구분'] === '휴업일' || row['구분'] === '공휴일') && !canManage_(ctx)) {
      throw userError_('휴업일·공휴일은 연구부장·부담당만 고칠 수 있어요.', 'FORBIDDEN');
    }
    updateRow_('일정', row['일정ID'], rec, actor, '일정 고침: ' + eventSummary_(rec));
    return eventView_(findRow_('일정', row['일정ID']), ctx, depts, names);
  }
  var added = insertRow_('일정', rec, actor, '일정 추가: ' + eventSummary_(rec));
  return eventView_(findRow_('일정', added['일정ID']), ctx, depts, names);
}

function apiSchedDelete_(args, actor, ctx) {
  var row = findRow_('일정', String(args.id || ''));
  if (!row || row['삭제 여부']) throw userError_('이 일정을 찾지 못했어요. 이미 지워졌을 수 있어요.');
  if (!canEditEvent_(row, ctx)) throw userError_('처음 넣은 분과 연구부장·부담당만 지울 수 있어요.', 'FORBIDDEN');
  if ((row['구분'] === '휴업일' || row['구분'] === '공휴일') && !canManage_(ctx)) {
    throw userError_('휴업일·공휴일은 연구부장·부담당만 지울 수 있어요.', 'FORBIDDEN');
  }
  softDelete_('일정', row['일정ID'], actor, '일정 지움: ' + eventSummary_(row));
  return { done: true };
}

// ---------------------------------------------------------------- 월별 중점지도

function focusOf_(schoolYear, month) {
  var rows = liveRows_('월별중점').filter(function (r) {
    return String(r['학년도']) === String(schoolYear) && String(Number(r['월'])) === String(month);
  });
  var r = rows[rows.length - 1];
  return { year: schoolYear, month: month, text: r ? r['중점지도 내용'] : '', id: r ? r['중점ID'] : '' };
}

function apiFocusSave_(args, actor, ctx) {
  if (!canManage_(ctx)) throw userError_('중점지도는 연구부장·부담당이 넣어요.', 'FORBIDDEN');
  var y = Number(args.year), m = Number(args.month);
  if (!(y >= 2000 && y <= 2100 && m >= 1 && m <= 12)) throw userError_('달을 다시 골라 주세요.');
  var text = cleanText_(args.text, 500, '중점지도 내용');
  var cur = focusOf_(y, m);
  if (cur.id) {
    updateRow_('월별중점', cur.id, { '중점지도 내용': text }, actor, y + '학년도 ' + m + '월 중점지도 고침');
  } else if (text) {
    insertRow_('월별중점', { '학년도': String(y), '월': String(m), '중점지도 내용': text }, actor, y + '학년도 ' + m + '월 중점지도 넣음');
  }
  return focusOf_(y, m);
}

// ---------------------------------------------------------------- 수업일수

/**
 * from~to 사이 수업일수 = 평일(월~금) − 휴업일·공휴일이 걸린 평일(겹치면 한 번만)
 * 학기 기간 밖의 날은 세지 않는다. 학기 기간이 없으면 null.
 */
function instructionalDays_(from, to) {
  var sems = semesters_();
  if (!sems.length) return null;
  var off = offDays_(from, to);
  var weekdays = 0, removed = 0;
  for (var d = from; d <= to; d = addDays_(d, 1)) {
    var w = weekday_(d);
    if (w === 0 || w === 6) continue;
    if (!sems.some(function (s) { return d >= s.from && d <= s.to; })) continue;
    weekdays++;
    if (off[d]) removed++;
  }
  return { weekdays: weekdays, off: removed, days: weekdays - removed };
}

/** 설정의 학기 기간(들어 있는 것만) */
function semesters_() {
  var out = [];
  [['1학기', '1학기 시작일', '1학기 끝일'], ['2학기', '2학기 시작일', '2학기 끝일']].forEach(function (s) {
    var a = setting_(s[1]), b = setting_(s[2]);
    if (isDate_(a) && isDate_(b) && a <= b) out.push({ name: s[0], from: a, to: b });
  });
  return out;
}

/** 휴업일·공휴일이 걸린 날 → [이름들] */
function offDays_(from, to) {
  var m = {};
  liveRows_('일정').forEach(function (e) {
    if (e['구분'] !== '휴업일' && e['구분'] !== '공휴일') return;
    var a = e['시작일'] > from ? e['시작일'] : from;
    var b = eventEnd_(e) < to ? eventEnd_(e) : to;
    for (var d = a; d <= b; d = addDays_(d, 1)) (m[d] = m[d] || []).push(e['행사명']);
  });
  return m;
}

/** 학기별 수업일수와 계산 근거 */
function semesterDays_(year) {
  var r = schoolYearRange_(year);
  var sems = semesters_().filter(function (s) { return s.to >= r.from && s.from <= r.to; });
  var total = 0;
  var list = sems.map(function (s) {
    var weekdays = 0;
    var removed = [];
    var off = offDays_(s.from, s.to);
    for (var d = s.from; d <= s.to; d = addDays_(d, 1)) {
      var w = weekday_(d);
      if (w === 0 || w === 6) continue;
      weekdays++;
      if (off[d]) removed.push({ date: d, names: off[d] });
    }
    total += weekdays - removed.length;
    return { name: s.name, from: s.from, to: s.to, weekdays: weekdays, removed: removed, days: weekdays - removed.length };
  });
  return { semesters: list, total: total, missing: sems.length < 2 };
}

// ---------------------------------------------------------------- 휴지통 (관리자)

function adminTrashList_() {
  var depts = categoryNames_('부서'), names = staffNames_();
  return sortEvents_(readRows_('일정').filter(function (e) { return e['삭제 여부']; })).reverse().slice(0, 200).map(function (e) {
    var v = eventView_(e, { identity: null, tokens: {} }, depts, names);
    v.deletedBy = names[e['수정자ID']] || '';
    v.deletedAt = e['수정 시각'];
    return v;
  });
}

function adminTrashRestore_(args, actor) {
  var row = findRow_('일정', String(args.id || ''));
  if (!row || !row['삭제 여부']) throw userError_('되살릴 일정을 찾지 못했어요.');
  restoreRow_('일정', row['일정ID'], actor, '일정 되살림: ' + eventSummary_(row));

}

// ---------------------------------------------------------------- 테스트용 가짜 일정

/** 오늘을 기준으로 이번 달·다음 달에 가짜 일정을 넣는다(테스트 시트 전용) */
function seedTestSchedule_() {
  if (liveRows_('일정').length) throw userError_('일정 탭에 이미 일정이 있어요. 가짜 일정은 빈 테스트 시트에만 넣을 수 있어요.');
  var d = {};
  liveRows_('분류').forEach(function (c) { if (c['종류'] === '부서') d[c['이름']] = c['분류ID']; });
  var dept = function (n) { return d[n] || ''; };
  var actor = { id: '', name: '테스트 데이터' };
  var mon = mondayOf_(todayYmd_());
  var at = function (n) { return addDays_(mon, n); };
  var list = [
    [0, '', '08:40', '교직원 협의회', '교직원', '교무부', '교무실', '행사'],
    [0, '', '5교시', '안전점검의 날 대피 훈련', '전체', '인성안전부', '운동장', '행사'],

/** 여러 번 눌러도 괜찮다. 있는 탭·칸·값은 그대로 두고 없는 것만 더한다. */
function setupAll_() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var p = PropertiesService.getScriptProperties();
  p.setProperty('SHEET_ID', ss.getId());
  secretProp_('PIN_PEPPER');
  secretProp_('TOKEN_SECRET');
  DB_SS_ = ss;

  var created = [], extended = [];
  var defs = tabs_();
  Object.keys(defs).forEach(function (name) {
    var head = defs[name];
    var sh = ss.getSheetByName(name);
    if (!sh) {
      sh = ss.insertSheet(name);
      created.push(name);
    }
    var lastCol = Math.max(sh.getLastColumn(), 1);
    var cur = sh.getRange(1, 1, 1, lastCol).getValues()[0].map(cellText_);
    var curUsed = cur.filter(function (h) { return h !== ''; });
    var missing = head.filter(function (h) { return cur.indexOf(h) < 0; });
    if (missing.length) {
      var start = curUsed.length ? cur.length + 1 : 1;
      sh.getRange(1, start, 1, missing.length).setValues([missing]);
      if (curUsed.length) extended.push(name);
    }
    sh.setFrozenRows(1);
    sh.getRange(1, 1, 1, sh.getLastColumn()).setFontWeight('bold').setBackground('#F2F4F6');
  });

  // 설정 기본값(없는 키만)
  var have = {};
  readRows_('설정').forEach(function (r) { have[r['키']] = true; });
  var sheet = sheet_('설정');
  settingDefs_().forEach(function (d) {
    if (!have[d.key]) sheet.appendRow([d.key, d.def, d.note || d.label].map(cellWrite_));
  });
  SETTINGS_CACHE_ = null;
  return { created: created, extended: extended };
}

/** 시간 트리거가 부른다. 너무 자주 불리면(1시간 안) 건너뛴다. */
function dailyBackup() {
  var p = PropertiesService.getScriptProperties();
  var last = Number(p.getProperty('LAST_BACKUP_AT') || 0);
  if (Date.now() - last < 3600 * 1000) return;
  backupNow_('매일 백업');
}

function backupNow_(why) {
  var ss = ss_();
  var folder = backupFolder_();
  var name = '온라인 교무실 백업 ' + Utilities.formatDate(new Date(), tz_(), 'yyyy-MM-dd HHmm');
  DriveApp.getFileById(ss.getId()).makeCopy(name, folder);
  PropertiesService.getScriptProperties().setProperty('LAST_BACKUP_AT', String(Date.now()));

  var keep = Math.max(3, Number(setting_('백업 남길 개수')) || 30);
  var files = [];
  var it = folder.getFilesByType(MimeType.GOOGLE_SHEETS);
  while (it.hasNext()) files.push(it.next());
  files.sort(function (a, b) { return b.getDateCreated().getTime() - a.getDateCreated().getTime(); });
  var trashed = 0;
  files.slice(keep).forEach(function (f) { f.setTrashed(true); trashed++; });

  withLock_(function () {
    writeLog_({ id: '', name: '자동 백업' }, '설정', '', '백업', why + ': ' + name + (trashed ? ' (오래된 사본 ' + trashed + '개 휴지통으로)' : ''), null, null);
  });
  return { name: name, folder: folder.getName(), keep: keep };
}

function backupFolder_() {
  var id = setting_('백업 폴더ID');
  if (id) {
    try {
      var f = DriveApp.getFolderById(id);
      if (!f.isTrashed()) return f;
    } catch (e) { /* 폴더가 없어졌으면 새로 만든다 */ }
  }
  var folder = DriveApp.createFolder('온라인 교무실 백업');
  putSetting_('백업 폴더ID', folder.getId(), { id: '', name: '자동 백업' });
  return folder;
}
