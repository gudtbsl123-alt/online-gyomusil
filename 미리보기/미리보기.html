      '<h2>' + esc(m.label) + josa(m.label, '은', '는') + ' 아직 준비 중이에요</h2>' +
      '<p class="muted">' + esc(what) + '</p>' +
      '<button type="button" class="btn" data-go="home">홈으로</button></section>';
  }

  // ============================================================ 4단계 · 공통 도구
  function sizeText(n) {
    if (!n) return '';
    if (n < 1024) return n + 'B';
    if (n < 1024 * 1024) return Math.max(1, Math.round(n / 1024)) + 'KB';
    return (Math.round(n / 1024 / 1024 * 10) / 10) + 'MB';
  }
  /** '2026-10-15' → '10월 15일'(올해가 아니면 '2025년 10월 15일') */
  function dateText(ymd) {
    if (!ymd) return '';
    return (ymd.slice(0, 4) !== localToday().slice(0, 4) ? ymd.slice(0, 4) + '년 ' : '') + md(ymd);
  }
  /** https 주소만 링크로 쓴다(시트에 직접 적은 이상한 주소 막기) */
  function safeUrl(u) {
    return /^https:\/\/[^\s"'<>]+$/.test(String(u || '')) ? u : '';
  }
  function uniq(list) {
    var seen = {};
    return list.filter(function (x) { if (seen[x]) return false; seen[x] = true; return true; });
  }
  /** 낱말을 모두 품고 있으면 맞음(띄어쓰기·대소문자 무시) — 서버 검색과 같은 규칙 */
  function textMatch(q, fields) {
    var terms = String(q || '').toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return true;
    var hay = fields.join(' ').toLowerCase(), flat = hay.replace(/\s+/g, '');
    return terms.every(function (t) { return hay.indexOf(t) >= 0 || flat.indexOf(t) >= 0; });
  }
  /** 찾기 칸: 글자를 칠 때마다 목록만 다시 그린다(칸은 그대로라 한글 입력이 끊기지 않음) */
  function bindFind(id, onChange) {
    var el = qs('#' + id);
    if (el) el.addEventListener('input', function () { onChange(el.value); });
  }
  function findBox(id, label, ph, value) {
    return '<label class="search" for="' + id + '">' + icon('search', 20) + '<span class="sr-only">' + label + '</span>' +
      '<input id="' + id + '" type="search" placeholder="' + ph + '" value="' + esc(value || '') + '" autocomplete="off"></label>';
  }

  /** 고른 파일을 base64로 읽는다(크기 먼저 확인) */
  function readFile(file, maxMb) {
    return new Promise(function (resolve, reject) {
      if (file.size > maxMb * 1024 * 1024) return reject(new Error('파일이 너무 커요. ' + maxMb + 'MB까지 올릴 수 있어요. 더 큰 파일은 드라이브에 올리고 링크로 넣어 주세요.'));
      if (!file.size) return reject(new Error('빈 파일이에요. 다른 파일을 골라 주세요.'));
      var r = new FileReader();
      r.onload = function () { var s = String(r.result); resolve({ name: file.name, type: file.type, data: s.slice(s.indexOf(',') + 1) }); };
      r.onerror = function () { reject(new Error('파일을 읽지 못했어요. 다시 골라 주세요.')); };
      r.readAsDataURL(file);
    });
  }

  /** 올린 파일 내려받기(웹앱을 거쳐서만) */
  function downloadFile(tab, id, btn) {
    busy(btn, true, '받는 중');
    server('file.get', { tab: tab, id: id }).then(function (f) {
      busy(btn, false);
      try {
        var bin = atob(f.data), bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([bytes], { type: f.type }));
        a.download = f.name;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
        toast('파일을 내려받았어요');
      } catch (e) { toast('내려받지 못했어요. 다른 브라우저(크롬·웨일·엣지)로 해 보세요'); }
    }).catch(function (e) { busy(btn, false); toast(e.message); });
  }

  function fileBtn(tab, x, primary) {
    return '<button type="button" class="btn' + (primary ? ' btn-primary' : ' btn-sm') + '" data-action="file-dl" data-tab="' + tab + '" data-id="' + esc(x.id) + '">' +
      icon('down', 18) + '내려받기' + (primary ? '' : ' <span class="btn-note">' + esc(sizeText(x.fileSize)) + '</span>') + '</button>';
  }
  function linkBtn(url, primary, label) {
    var u = safeUrl(url);
    if (!u) return '';
    return '<a class="btn' + (primary ? ' btn-primary' : ' btn-sm') + '" href="' + esc(u) + '" target="_blank" rel="noopener">' + icon('ext', 18) + (label || '열기') + '</a>';
  }

  // ============================================================ 자료실
  S.lib = { data: null, view: 'now', q: '', dept: '', kind: '', year: '', openId: '' };

  /** 자료실 요청: 보관함(지난 학년도 자료)은 보관함을 열 때만 받는다 */
  function libArgs() { return S.lib.view === 'archive' ? { archive: 1 } : {}; }

  SCREENS.library = function ($s) {
    $s.innerHTML = pageHead('', '자료실', '', '<button type="button" class="btn btn-primary print-hide" data-action="lib-new">' + icon('plus', 18) + '자료 넣기</button>') +
      '<div id="lib-body" class="stack">' + loadingHtml('자료를 불러오는 중이에요') + '</div>';
    loadMemo('lib.list', libArgs(), function (d) {
      if (S.screen !== 'library') return;
      S.lib.data = d;
      drawLib();
      if (S.lib.openId) { var id = S.lib.openId; S.lib.openId = ''; openLib(id); }
    }, function (e) { var b = qs('#lib-body'); if (b) b.innerHTML = failHtml(e); });
  };

  function libYears() {
    var d = S.lib.data;
    if (d.archiveYears) return d.archiveYears.map(function (y) { return y.year; }); // 서버가 학년도별 개수를 늘 보낸다(보관함 자료는 열 때 받음)
    return uniq(d.items.filter(function (i) { return i.archived; }).map(function (i) { return i.year; })).sort().reverse();
  }

  function drawLib() {
    var L = S.lib, d = L.data, body = qs('#lib-body');
    if (!body || !d) return;
    var years = libYears();
    if (L.view === 'archive' && years.indexOf(L.year) < 0) L.year = years[0] || '';
    var opt = function (list, cur, none) {
      return '<option value="">' + none + '</option>' + list.map(function (x) {
        return '<option value="' + esc(x.id) + '"' + (x.id === cur ? ' selected' : '') + '>' + esc(x.name) + '</option>';
      }).join('');
    };
    body.innerHTML = '<div class="toolbar print-hide">' + findBox('lib-q', '자료 찾기', '제목·설명·담당으로 찾기', L.q) +
      '<div class="seg" role="group" aria-label="자료 보기">' +
      '<button type="button" data-action="lib-view" data-v="now" aria-pressed="' + (L.view === 'now') + '">' + esc(d.year) + '학년도</button>' +
      '<button type="button" data-action="lib-view" data-v="archive" aria-pressed="' + (L.view === 'archive') + '">' + icon('archive', 18) + '보관함</button></div>' +
      '<select class="input input-sm" id="lib-dept" aria-label="부서로 거르기">' + opt(d.depts, L.dept, '모든 부서') + '</select>' +
      '<select class="input input-sm" id="lib-kind" aria-label="분류로 거르기">' + opt(d.kinds, L.kind, '모든 분류') + '</select></div>' +
      (L.view === 'archive' && years.length ? '<div class="tgs print-hide" role="group" aria-label="학년도">' + years.map(function (y) {
        return '<button type="button" class="tg" data-action="lib-year" data-y="' + esc(y) + '" aria-pressed="' + (y === L.year) + '">' + esc(y) + '학년도</button>';
      }).join('') + '</div>' : '') +
      '<div id="lib-list" class="stack"></div>';
    bindFind('lib-q', function (v) { L.q = v; drawLibList(); });
    qs('#lib-dept').addEventListener('change', function (e) { L.dept = e.target.value; drawLibList(); });
    qs('#lib-kind').addEventListener('change', function (e) { L.kind = e.target.value; drawLibList(); });
    drawLibList();
  }

  function drawLibList() {
    var L = S.lib, d = L.data, box = qs('#lib-list');
    if (!box || !d) return;
    if (L.view === 'archive' && d.archiveYears && !d.archive && libYears().length) {
      // 보관함은 열 때 받는다(저장할 때마다 지난 자료를 모두 다시 받지 않게)
      box.innerHTML = loadingHtml('보관함을 불러오는 중이에요');
      loadMemo('lib.list', { archive: 1 }, function (d2) {
        if (S.screen !== 'library' || L.view !== 'archive') return;
        L.data = d2;
        drawLib();
      }, function (e) { var b = qs('#lib-list'); if (b) b.innerHTML = failHtml(e); });
      return;
    }
    var scope = d.items.filter(function (i) { return L.view === 'now' ? !i.archived : i.archived && i.year === L.year; });
    var list = scope.filter(function (i) {
      if (L.dept && i.deptId !== L.dept && !i.common) return false; // 공통 자료는 부서로 걸러도 맨 위에 그대로
      if (L.kind && i.kindId !== L.kind) return false;
      return textMatch(L.q, [i.title, i.desc, i.owner, i.dept, i.kind, i.fileName]);
    });
    if (!list.length) {
      var msg = L.view === 'archive' && !libYears().length ? '보관함이 비어 있어요. 새 학년도로 넘기면 지난 자료가 여기로 와요.'
        : scope.length ? '찾는 자료가 없어요.' + (L.view === 'now' ? ' 보관함에서도 찾아보세요.' : '')
        : '아직 자료가 없어요. "자료 넣기"로 첫 자료를 넣어 보세요.';
      box.innerHTML = '<div class="card"><p class="empty">' + msg + '</p></div>';
      return;
    }
    var known = {};
    // 공통 자료는 맨 위에 한 번만(부서 칸에는 다시 나오지 않음). 공통 순서 번호 → 제목 순
    var commons = list.filter(function (i) { return i.common; }).sort(function (a, b) {
      return (Number(a.commonOrder) || 999) - (Number(b.commonOrder) || 999) || a.title.localeCompare(b.title, 'ko');
    });
    var rest = list.filter(function (i) { return !i.common; });
    var groups = [{ name: '공통 자료', common: true, items: commons }].concat(d.depts.map(function (dp) {
      known[dp.id] = true;
      return { name: dp.name, items: rest.filter(function (i) { return i.deptId === dp.id; }) };
    }));
    groups.push({ name: '부서 없음', items: rest.filter(function (i) { return !known[i.deptId]; }) });
    box.innerHTML = '<p class="faint" aria-live="polite">' + (L.view === 'archive' ? esc(L.year) + '학년도 보관함 · ' : '') + list.length + '개</p>' +
      groups.filter(function (g) { return g.items.length; }).map(function (g) {
        return '<section class="lib-group' + (g.common ? ' common' : '') + '"><h2 class="lib-h">' + (g.common ? icon('star', 22, ' class="lib-h-ico"') : '') + esc(g.name) +
          ' <span class="faint">' + g.items.length + '</span>' + (g.common ? '<span class="lib-h-note">모든 선생님이 함께 보는 자료</span>' : '') + '</h2>' +
          '<div class="lib-grid">' + g.items.map(libCard).join('') + '</div></section>';
      }).join('');
  }

  function libCard(i) {
    return '<article class="lib-card' + (i.common ? ' common' : '') + '">' +
      '<div class="sv-chips">' + icon(i.hasFile ? 'doc' : 'link', 18, ' class="lib-ico"') +
      (i.common ? '<span class="chip chip-accent-solid">공통</span>' + (i.dept ? '<span class="chip">' + esc(i.dept) + '</span>' : '') : '') +
      (i.kind ? '<span class="chip">' + esc(i.kind) + '</span>' : '') +
      (i.archived ? '<span class="chip">' + esc(i.year) + ' 보관</span>' : '') +
      (i.home ? '<span class="chip chip-accent">홈에 보임</span>' : '') + '</div>' +
      '<button type="button" class="lib-title" data-action="lib-open" data-id="' + esc(i.id) + '">' + esc(i.title) + '</button>' +
      (i.desc ? '<p class="lib-desc">' + esc(i.desc) + '</p>' : '') +
      '<p class="lib-meta">' + esc([i.owner ? '담당 ' + i.owner : '', i.updated ? dateText(i.updated) + ' 고침' : ''].filter(Boolean).join(' · ')) + '</p>' +
      '<div class="lib-btns">' + (i.hasFile ? fileBtn('자료', i) : linkBtn(i.link)) +
      '<button type="button" class="btn btn-sm btn-ghost" data-action="lib-open" data-id="' + esc(i.id) + '">자세히</button></div></article>';
  }

  function libById(id) {
    var pools = [S.lib.data && S.lib.data.items, S.home && S.home.library, S.search && S.search.library.items];
    for (var k = 0; k < pools.length; k++) {
      var hit = (pools[k] || []).filter(function (i) { return i.id === id; })[0];
      if (hit) return hit;
    }
    return null;
  }

  function openLib(id) {
    var i = libById(id);
    if (!i) return;
    var manage = S.lib.data && S.lib.data.canManage;
    var rows = [
      ['부서', i.dept], ['분류', i.kind], ['학년도', i.year + '학년도' + (i.archived ? ' (보관함)' : '')], ['담당', i.owner],
      ['파일', i.hasFile ? i.fileName + ' · ' + sizeText(i.fileSize) : ''], ['링크', i.hasFile ? '' : i.link],
      ['넣은 사람', i.by], ['고친 날', dateText(i.updated)]
    ].filter(function (r) { return r[1]; });
    openModal('<div class="row-btns">' + (i.common ? '<span class="chip chip-accent-solid">공통 자료</span>' : '') + (i.kind ? '<span class="chip">' + esc(i.kind) + '</span>' : '') +
      (i.archived ? '<span class="chip">' + esc(i.year) + ' 보관함</span>' : '') + (i.home ? '<span class="chip chip-accent">홈에 보임</span>' : '') + '</div>' +
      '<h2 id="m-title">' + esc(i.title) + '</h2>' + (i.desc ? '<p class="sv-desc">' + esc(i.desc) + '</p>' : '') +
      '<dl class="ev-dl">' + rows.map(function (r) { return '<dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') + '</dl>' +
      (i.archived ? '<p class="hint">' + icon('info', 16) + '<span>지난 학년도 자료라 고칠 수 없어요.' + (manage ? ' 올해도 쓰려면 "지금 학년도로 꺼내기"를 눌러 주세요.' : ' 올해도 써야 하면 연구부장·부담당에게 알려 주세요.') + '</span></p>'
        : !i.canEdit && S.me ? '<p class="hint">' + icon('info', 16) + '<span>처음 넣은 분과 연구부장·부담당만 고칠 수 있어요.</span></p>' : '') +
      '<div class="modal-btns"><button type="button" class="btn" data-action="close-modal">닫기</button>' +
      (i.canEdit && !i.archived && S.lib.data ? '<button type="button" class="btn btn-ghost-danger" data-action="lib-del" data-id="' + esc(i.id) + '">지우기</button>' +
        '<button type="button" class="btn" data-action="lib-edit" data-id="' + esc(i.id) + '">고치기</button>' : '') +
      (i.archived && manage ? '<button type="button" class="btn" data-action="lib-unarchive" data-id="' + esc(i.id) + '">지금 학년도로 꺼내기</button>' : '') +
      (i.hasFile ? fileBtn('자료', i, true) : linkBtn(i.link, true, '링크 열기')) + '</div>');
  }

  function putLib(row) {
    var items = S.lib.data.items;
    var at = -1;
    items.forEach(function (x, k) { if (x.id === row.id) at = k; });
    if (at >= 0) items[at] = row; else items.push(row);
    items.sort(function (a, b) { return a.title.localeCompare(b.title, 'ko'); });
    S.home = null;
  }

  function catSelect(id, list, cur, none) {
    return '<select id="' + id + '" class="input">' + '<option value="">' + none + '</option>' +
      list.filter(function (x) { return x.active || x.id === cur; }).map(function (x) {

  function openLibForm(edit) {

      '<div class="field"><label class="label" for="lf-desc">설명</label><textarea id="lf-desc" class="input" maxlength="500" rows="3" placeholder="어떤 자료인지 한두 줄로 적어 주세요">' + esc(i.desc || '') + '</textarea></div>' +
      '<div class="field"><label class="label" for="lf-owner">담당</label><input id="lf-owner" class="input" maxlength="20" value="' + esc(edit ? i.owner || '' : S.me.name) + '" autocomplete="off"></div>' +
      '<div class="field"><span class="label">넣는 방법</span><div class="seg" role="group" aria-label="넣는 방법" style="max-width:360px">' +
      '<button type="button" data-mode="link" aria-pressed="' + (mode === 'link') + '">' + icon('link', 18) + '링크</button>' +
      '<button type="button" data-mode="file" aria-pressed="' + (mode === 'file') + '">' + icon('upload', 18) + '파일 올리기</button></div></div>' +
      '<div class="field" id="lf-link-box"' + (mode === 'link' ? '' : ' hidden') + '><label class="label" for="lf-link">링크 주소 <span class="req">*</span></label>' +
      '<input id="lf-link" class="input" type="url" inputmode="url" maxlength="1000" placeholder="https://" value="' + esc(i.hasFile ? '' : i.link || '') + '">' +
      '<p class="hint">' + icon('info', 16) + '<span>구글 드라이브·문서 주소를 붙여 넣으세요. 그 파일을 누가 열 수 있는지는 드라이브의 공유 설정을 따라요.</span></p></div>' +
      '<div class="field" id="lf-file-box"' + (mode === 'file' ? '' : ' hidden') + '><label class="label" for="lf-file">파일' + (edit && edit.hasFile ? ' (바꿀 때만 고르기)' : ' <span class="req">*</span>') + '</label>' +
      (edit && edit.hasFile ? '<p class="box file-now">' + icon('doc', 18) + '<span>지금 파일: <b>' + esc(i.fileName) + '</b> · ' + esc(sizeText(i.fileSize)) + '</span></p>' : '') +
      '<input id="lf-file" class="input input-file" type="file">' +
      '<p class="hint">' + icon('info', 16) + '<span>' + d.maxMb + 'MB까지 올릴 수 있어요. 올린 파일은 공유하지 않는 드라이브 폴더에 두고, 온라인 교무실에서만 내려받아요.</span></p></div>' +
      '<div class="common-box"><label class="check"><input type="checkbox" id="lf-common"' + (i.common ? ' checked' : '') + '>공통 자료로 자료실 맨 위에 보이기</label>' +

  function bindHomeSearch() {
    var form = qs('#home-search'), inp = qs('#home-q');
    if (!form) return;
    form.addEventListener('submit', function (e) { e.preventDefault(); clearTimeout(searchTimer); runSearch(inp.value); });

      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { runSearch(inp.value); }, 400);

  function runSearch(q) {
    q = String(q || '').trim();
    if (q === (S.homeQ || '') && (S.search || !q)) return;
    S.homeQ = q;
    var body = qs('#home-body');
    if (!body) return;
    var seq = ++searchSeq;
    if (!q) { S.search = null; if (S.home) drawHome(); else SCREENS.home(qs('#screen')); return; }
    body.innerHTML = loadingHtml('찾는 중이에요');
    server('search', { q: q }).then(function (r) {
      if (seq !== searchSeq) return;
      S.search = r;
      drawSearch();
    }).catch(function (e) { if (seq === searchSeq) body.innerHTML = failHtml(e); });
  }

  // ============================================================ 엑셀(.xlsx)·CSV 읽기와 양식 만들기 (바깥 도구 없이)
  var CRC_T = null;
  function crc32(bytes) {
    if (!CRC_T) {
      CRC_T = [];
      for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; CRC_T[n] = c >>> 0; }
    }
    var crc = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) crc = CRC_T[(crc ^ bytes[i]) & 255] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }
  function utf8b(s) { return new TextEncoder().encode(s); }
  function xmlEsc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /** 압축하지 않는 zip(엑셀 파일 껍데기) */
  function zipStore(files) {
    var parts = [], central = [], off = 0;
    files.forEach(function (f) {
      var name = utf8b(f.name), data = utf8b(f.text), crc = crc32(data), n = data.length;
      var h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(12, 0x21, true);
      h.setUint32(14, crc, true); h.setUint32(18, n, true); h.setUint32(22, n, true); h.setUint16(26, name.length, true);
      parts.push(new Uint8Array(h.buffer), name, data);
      var c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(14, 0x21, true);
      c.setUint32(16, crc, true); c.setUint32(20, n, true); c.setUint32(24, n, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
      central.push(new Uint8Array(c.buffer), name);
      off += 30 + name.length + n;
    });
    var size = central.reduce(function (a, b) { return a + b.length; }, 0);
    var e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, size, true); e.setUint32(16, off, true);
    return new Blob(parts.concat(central).concat([new Uint8Array(e.buffer)]), { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  /** XML 머리 줄. Apps Script 템플릿 표시와 헷갈리지 않게 '<' 와 '?' 를 떼어 적는다 */
  var XMLH = '<' + '?xml version="1.0" encoding="UTF-8" standalone="yes"?' + '>';
  var UP_HEAD = ['시작일', '끝일', '시간', '행사명', '대상', '담당 부서', '장소', '구분', '메모', '중요'];

  function templateXlsx(year, customRows, sheetName) {
    var y = Number(year) || new Date().getFullYear();
    var rows = customRows || [UP_HEAD,
      [y + '-03-02', '', '09:00', '(예시) 입학식', '1', '교무부', '강당', '행사', '이 줄은 지우고 쓰세요', '예'],
      [y + '-05-04', y + '-05-05', '', '(예시) 재량휴업일', '전체', '', '', '휴업일', '', '']];
    var cols = 'ABCDEFGHIJ';
    var sheet = XMLH + '' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' +
      '<cols><col min="1" max="2" width="13" customWidth="1"/><col min="3" max="3" width="9" customWidth="1"/><col min="4" max="4" width="30" customWidth="1"/>' +
      '<col min="5" max="8" width="11" customWidth="1"/><col min="9" max="9" width="24" customWidth="1"/><col min="10" max="10" width="7" customWidth="1"/></cols><sheetData>' +
      rows.map(function (r, i) {
        return '<row r="' + (i + 1) + '">' + r.map(function (v, j) {
          return '<c r="' + cols[j] + (i + 1) + '" t="inlineStr"' + (i === 0 ? ' s="1"' : '') + '><is><t>' + xmlEsc(v) + '</t></is></c>';
        }).join('') + '</row>';
      }).join('') + '</sheetData></worksheet>';
    return zipStore([
      { name: '[Content_Types].xml', text: XMLH + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>' },

    $s.innerHTML = pageHead('관리 · 연구부장·부담당', '관리자', '계정·분류·설정을 관리해요. 바꾼 내용은 모두 수정 기록에 남아요.',
      '<button type="button" class="btn btn-sm print-hide" data-action="admin-out">' + icon('lock', 18) + '관리자 화면 닫기</button>') +
      (S.me ? '' : '<div class="box" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px"><span class="warn-text" style="font-size:15px">본인 확인 전이라 기록에 "관리자(본인 확인 전)"으로 남아요.</span>' +
        '<button type="button" class="btn btn-sm" data-action="identity">본인 확인하기</button></div>') +
      '<div class="tabs print-hide" role="tablist">' + tabs.map(function (t) {
        return '<button type="button" class="tab" role="tab" data-admin-tab="' + t[0] + '" aria-selected="' + (S.adminTab === t[0]) + '">' + t[1] + '</button>';
      }).join('') + '</div><div id="admin-panel" role="tabpanel"></div>';
    var selTab = qs('.tabs [aria-selected="true"]', $s);
    if (selTab && selTab.scrollIntoView) { try { selTab.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) {} }
    var panel = qs('#admin-panel');
    ({ staff: adminStaff, cat: adminCat, settings: adminSettings, year: adminYear, log: adminLog, trash: adminTrash, pw: adminPw, check: adminCheck }[S.adminTab] || adminStaff)(panel);
  };

  function adminGate($s) {
    $s.innerHTML = pageHead('관리 · 연구부장·부담당', '관리자') +
      '<form class="card" id="admin-form" style="max-width:520px" novalidate><span class="glow" aria-hidden="true"></span>' +
      '<div style="display:flex;align-items:center;gap:12px"><span class="brand-mark">' + icon('shield', 24) + '</span><h2>관리자 비밀번호를 넣어 주세요</h2></div>' +
      '<p class="muted">공통 비밀번호와 다른 비밀번호예요. 연구부장·부담당만 알고 있어요.</p>' +
      '<div class="field"><label class="label" for="admin-pw">관리자 비밀번호</label>' +
      '<div class="pw-wrap"><input id="admin-pw" class="input" type="password" autocomplete="off">' +
      '<button type="button" class="icon-btn" data-action="pw-eye" data-for="admin-pw" aria-label="비밀번호 보이기">' + icon('eye') + '</button></div></div>' +
      '<p class="err" id="admin-err" role="alert"></p>' +
      '<button type="submit" class="btn btn-primary">관리자 화면 열기</button>' +
      '<p class="hint">' + icon('info', 16) + '<span>관리자 화면은 2시간 동안 열려 있고, 이 기기에 기억하지 않아요.</span></p></form>';
    qs('#admin-form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var pw = qs('#admin-pw').value;
      var err = qs('#admin-err');
      if (!pw) { err.textContent = '관리자 비밀번호를 넣어 주세요.'; return; }
      var btn = ev.target.querySelector('[type=submit]');
      busy(btn, true, '확인하는 중');
      server('adminLogin', { password: pw }).then(function (r) {
        stSet('gy.admin', r.admin, false);
        S.admin = true;
        renderApp();
      }).catch(function (e) {
        busy(btn, false);
        err.textContent = e.message;
      });
    });
  }

  function loadingHtml(t) {
    return '<div class="loading"><span class="spin" aria-hidden="true"></span>' + esc(t || '불러오는 중이에요') + '</div>';
  }
  function failHtml(e) {
    return '<div class="card"><p class="err">' + esc(e.message) + '</p>' + detailHtml(e) + '</div>';
  }
  /** 예상 못 한 오류의 원인 한 줄(연구부장·부담당이 고칠 곳을 찾게) */
  function detailHtml(e) {
    return e && e.detail ? '<p class="err-detail">자세한 내용(연구부장·부담당께 전해 주세요): <code>' + esc(e.detail) + '</code></p>' : '';
  }

  // ------------------------------------------------------------ 관리자 · 교직원 표
  function adminStaff(panel) {
    if (!panel) return; // 그사이 다른 화면으로 옮겼으면
    panel.innerHTML = loadingHtml('교직원 표를 불러오는 중이에요');
    server('admin.staff.list').then(function (r) {
      S.cache.staff = r.staff;
      S.cache.depts = r.depts;
      S.cache.pinMode = !!r.pinMode;
      drawStaff(panel);
    }).catch(function (e) { panel.innerHTML = failHtml(e); });
  }

  function drawStaff(panel) {
    if (!panel) return;
    var all = S.cache.staff || [];
    var on = all.filter(function (x) { return x['사용 여부'] !== '사용 안 함'; });
    var noPin = on.filter(function (x) { return !x.hasPin; });
    panel.innerHTML =
      '<div class="wrap" style="gap:16px">' +
      '<div class="counts"><span class="chip chip-ok">사용 ' + on.length + '명</span><span class="chip">사용 안 함 ' + (all.length - on.length) + '명</span>' +
      (!S.cache.pinMode ? '<span class="chip">본인 확인: 이름만</span>' : noPin.length ? '<span class="chip chip-warn">번호 없음 ' + noPin.length + '명</span>' : '<span class="chip">모두 번호 있음</span>') + '</div>' +
      '<div class="toolbar print-hide">' +
      '<label class="search" for="staff-find">' + icon('search', 20) + '<span class="sr-only">교직원 찾기</span>' +
      '<input id="staff-find" type="search" placeholder="이름·소속·업무로 찾기" value="' + esc(S.staffSearch) + '" autocomplete="off"></label>' +
      '<label class="check" style="padding:0 6px"><input type="checkbox" id="staff-off"' + (S.showOff ? ' checked' : '') + '>사용 안 함도 보기</label>' +
      (S.cache.pinMode ? '<button type="button" class="btn btn-sm" data-action="staff-issue"' + (noPin.length ? '' : ' disabled') + '>' + icon('key', 18) + '번호 없는 분 번호 만들기</button>' : '') +
      '<button type="button" class="btn btn-sm" data-action="staff-import">' + icon('upload', 18) + '명단 한 번에 넣기</button>' +
      '<button type="button" class="btn btn-sm btn-primary" data-action="staff-add">' + icon('plus', 18) + '교직원 추가</button></div>' +
      '<div id="staff-rows"></div>' +
      '<p class="hint">' + icon('info', 16) + '<span>전출·휴직하면 지우지 말고 "사용 안 함"으로 바꿔 주세요. 이름 목록과 알림에서 빠지고, 기록은 그대로 남아요. 개인 연락처는 넣지 않아요(내선만).</span></p>' +
      '</div>';
    var rowsBox = qs('#staff-rows', panel);
    function drawRows() {
      var q = S.staffSearch.trim();
      var shown = all.filter(function (x) {
        if (!S.showOff && x['사용 여부'] === '사용 안 함') return false;
        return !q || [x['이름'], x['직위'], x['소속'], x.deptName, x['담당 업무'], x['내선']].join(' ').indexOf(q) >= 0;
      });
      rowsBox.innerHTML = shown.length
        ? '<div class="rows" role="table" aria-label="교직원 표">' +
          '<div class="srow head" role="row"><span role="columnheader">이름·직위</span><span role="columnheader">소속·부서</span><span role="columnheader">담당 업무</span><span role="columnheader">내선</span><span role="columnheader" style="text-align:right">관리</span></div>' +
          shown.map(staffRow).join('') + '</div>'
        : '<div class="card"><p class="empty">' + (all.length ? '찾는 교직원이 없어요.' : '아직 교직원이 없어요. "교직원 추가"로 넣어 주세요.') + '</p></div>';
    }
    drawRows();
    qs('#staff-find', panel).addEventListener('input', function (e) { S.staffSearch = e.target.value; drawRows(); }); // 찾기 칸은 그대로 두고 줄만(한글 입력이 끊기지 않게)
    qs('#staff-off', panel).addEventListener('change', function (e) { S.showOff = e.target.checked; drawRows(); });
  }

  function staffRow(x) {
    var off = x['사용 여부'] === '사용 안 함';
    var chips = [];
    if (x['역할'] === '관리') chips.push('<span class="chip chip-accent">관리</span>');
    var pinMode = !!S.cache.pinMode;
    if (off) chips.push('<span class="chip">사용 안 함</span>');
    else if (pinMode && !x.hasPin) chips.push('<span class="chip chip-warn">번호 없음</span>');
    if (pinMode && x.locked) chips.push('<span class="chip chip-warn">잠김</span>');
    var id = esc(x['교직원ID']);
    return '<div class="srow' + (off ? ' off' : '') + '" role="row">' +
      '<div role="cell"><div class="s-name">' + esc(x['이름']) + '</div><div class="s-sub">' + esc(x['직위'] || '') + '</div>' +
      (chips.length ? '<div class="s-chips">' + chips.join('') + '</div>' : '') + '</div>' +
      '<div role="cell" class="s-col-mid">' + esc(x['소속'] || '') + (x.deptName ? '<div class="s-sub">' + esc(x.deptName) + '</div>' : '') + '</div>' +
      '<div role="cell" class="s-col-job s-sub">' + esc(x['담당 업무'] || '') + '</div>' +
      '<div role="cell" class="s-col-tel">' + esc(x['내선'] || '') + '</div>' +
      '<div role="cell" class="s-btns print-hide">' +
      '<button type="button" class="btn btn-sm" data-action="staff-edit" data-id="' + id + '">고치기</button>' +
      (off || !pinMode ? '' : x.locked
        ? '<button type="button" class="btn btn-sm" data-action="staff-unlock" data-id="' + id + '">잠금 풀기</button>'
        : '<button type="button" class="btn btn-sm" data-action="staff-pin" data-id="' + id + '">' + (x.hasPin ? '번호 새로' : '번호 만들기') + '</button>') +
      '<button type="button" class="btn btn-sm btn-ghost" data-action="staff-active" data-id="' + id + '">' + (off ? '다시 사용' : '사용 안 함') + '</button>' +
      '</div></div>';
  }

  function findStaff(id) {
    return (S.cache.staff || []).filter(function (x) { return x['교직원ID'] === id; })[0];
  }
  function putStaff(row) {
    var list = S.cache.staff || [];
    var i = list.map(function (x) { return x['교직원ID']; }).indexOf(row['교직원ID']);
    if (i >= 0) list[i] = row; else list.push(row);
    S.cache.staff = list;
  }

  function staffForm(x) {
    x = x || {};
    var depts = S.cache.depts || [];
    var deptOpts = '<option value="">(없음)</option>' + depts.filter(function (d) { return d.active || d.id === x['부서ID']; }).map(function (d) {
      return '<option value="' + esc(d.id) + '"' + (d.id === x['부서ID'] ? ' selected' : '') + '>' + esc(d.name) + (d.active ? '' : ' (사용 안 함)') + '</option>';
    }).join('');
    function f(key, label, opts) {
      opts = opts || {};
      return '<div class="field"><label class="label" for="sf-' + key + '">' + label + (opts.req ? ' <span class="req">*</span>' : '') + '</label>' +
        '<input id="sf-' + key + '" class="input" data-k="' + key + '" value="' + esc(x[key] || '') + '"' + (opts.attr || '') + ' placeholder="' + (opts.ph || '') + '"></div>';
    }
    return '<form class="form" id="staff-form" novalidate>' +
      '<div class="form-grid">' + f('이름', '이름', { req: true, attr: ' maxlength="20" autocomplete="off"' }) + f('직위', '직위', { ph: '예: 교사, 수석교사', attr: ' maxlength="20"' }) + '</div>' +
      '<div class="form-grid">' + f('소속', '소속', { ph: '예: 3학년 1반, 과학 전담', attr: ' maxlength="30"' }) +
      '<div class="field"><label class="label" for="sf-부서ID">부서</label><select id="sf-부서ID" class="input" data-k="부서ID">' + deptOpts + '</select></div></div>' +
      f('담당 업무', '담당 업무', { ph: '예: 교육과정, 전문적학습공동체', attr: ' maxlength="200"' }) +
      '<div class="form-grid">' + f('내선', '내선', { ph: '숫자만', attr: ' inputmode="numeric" maxlength="15"' }) + f('순서', '명단 순서', { ph: '숫자가 작을수록 위', attr: ' inputmode="numeric" maxlength="4"' }) + '</div>' +
      '<div class="field"><span class="label">역할</span><div class="seg" role="group" aria-label="역할" style="max-width:320px">' +
      '<button type="button" data-role="일반" aria-pressed="' + (x['역할'] !== '관리') + '">일반</button>' +
      '<button type="button" data-role="관리" aria-pressed="' + (x['역할'] === '관리') + '">관리</button></div>' +
      '<p class="hint">' + icon('info', 16) + '<span>"관리"는 연구부장·부담당 표시예요. 관리자 화면은 관리자 비밀번호로 들어가요.</span></p></div>' +
      (depts.length ? '' : '<p class="hint">' + icon('info', 16) + '<span>부서 목록이 비어 있어요. "분류" 탭에서 부서를 먼저 넣으면 고를 수 있어요.</span></p>') +
      '<p class="err" id="sf-err" role="alert"></p>' +
      '<div class="modal-btns"><button type="button" class="btn" data-action="close-modal">닫기</button>' +
      '<button type="submit" class="btn btn-primary">저장</button></div></form>';
  }

  function openStaffForm(x) {
    openModal('<h2 id="m-title">' + (x ? esc(x['이름']) + ' 선생님 고치기' : '교직원 추가') + '</h2>' + staffForm(x));
    var form = qs('#staff-form');
    qsa('[data-role]', form).forEach(function (b) {
      b.addEventListener('click', function () {
        qsa('[data-role]', form).forEach(function (o) { o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); });
      });
    });
    setTimeout(function () { qs('#sf-이름').focus(); }, 30);
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var fields = {};
      qsa('[data-k]', form).forEach(function (i) { fields[i.getAttribute('data-k')] = i.value; });
      fields['역할'] = qs('[data-role][aria-pressed=true]', form).getAttribute('data-role');
      var err = qs('#sf-err');
      if (!fields['이름'].trim()) { err.textContent = '이름을 적어 주세요.'; return; }
      var btn = form.querySelector('[type=submit]');
      busy(btn, true, '저장하는 중');
      server('admin.staff.save', { id: x ? x['교직원ID'] : '', fields: fields }).then(function (row) {
        putStaff(row);
        closeModal();
        drawStaff(qs('#admin-panel'));
        toast(row['이름'] + ' 선생님을 ' + (x ? '고쳤어요' : '넣었어요') + (row.hasPin ? '' : '. 개인 번호도 만들어 주세요'));
      }).catch(function (e) { busy(btn, false); err.textContent = e.message; });
    });
  }

  function confirmBox(title, body, okText, onOk, danger) {
    openModal('<h2 id="m-title">' + title + '</h2><p class="muted" style="margin:0">' + body + '</p><p class="err" id="cf-err" role="alert"></p>' +
      '<div class="modal-btns"><button type="button" class="btn" data-action="close-modal">그만두기</button>' +
      '<button type="button" class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" id="cf-ok">' + okText + '</button></div>');
    var ok = qs('#cf-ok');
    ok.addEventListener('click', function () {
      busy(ok, true, '하는 중');
      onOk().catch(function (e) { busy(ok, false); qs('#cf-err').textContent = e.message; });
    });
  }

  function staffResetPin(x) {
    confirmBox(esc(x['이름']) + ' 선생님 개인 번호 ' + (x.hasPin ? '새로 만들기' : '만들기'),
      x.hasPin ? '새 번호를 만들면 지금 번호는 더 쓸 수 없고, 이 분의 기기에 기억된 본인 확인도 풀려요.' : '무작위 4자리 번호를 만들어요. 번호는 한 번만 보여 드려요.',
      '번호 만들기', function () {
        return server('admin.staff.resetPin', { id: x['교직원ID'] }).then(function (r) {
          x.hasPin = true; x.locked = false;
          drawStaff(qs('#admin-panel'));
          showPins([r], false);
        });
      });
  }

  function staffIssueMissing() {
    var n = (S.cache.staff || []).filter(function (x) { return x['사용 여부'] !== '사용 안 함' && !x.hasPin; }).length;
    confirmBox('번호 없는 ' + n + '명의 번호 만들기', '사용 중이면서 아직 번호가 없는 분들의 무작위 4자리 번호를 한꺼번에 만들어요. 다음 창에서 한 번만 보여 드리니, 쪽지로 인쇄해 한 분씩 전해 주세요.',
      n + '명 번호 만들기', function () {
        return server('admin.staff.issueMissing').then(function (list) {
          return server('admin.staff.list').then(function (r) {
            S.cache.staff = r.staff;
            drawStaff(qs('#admin-panel'));
            showPins(list, true);
          });
        });
      });
  }

  /** 개인 번호를 한 번만 보여 준다. 창을 닫으면 화면에서도 지운다. */
  function showPins(list, many) {
    S.pinSlips = list;
    var body = list.length === 1 && !many
      ? '<p class="muted" style="margin:0">' + esc(list[0].name) + ' 선생님' + (list[0].group ? ' · ' + esc(list[0].group) : '') + '</p><p class="pin-big" aria-label="개인 번호">' + esc(list[0].pin) + '</p>'
      : list.length
        ? '<div class="pin-list">' + list.map(function (p) { return '<div><span><b style="all:unset;font-weight:800">' + esc(p.name) + '</b> <span class="faint">' + esc(p.group || '') + '</span></span><b>' + esc(p.pin) + '</b></div>'; }).join('') + '</div>'
        : '<p class="muted">번호를 만들 분이 없었어요.</p>';
    openModal('<h2 id="m-title">개인 번호' + (list.length > 1 ? ' ' + list.length + '명' : '') + '</h2>' + body +
      '<p class="hint">' + icon('info', 16) + '<span>이 창을 닫으면 다시 볼 수 없어요. 쪽지로 인쇄하거나 종이에 옮겨 적어 한 분씩 전해 주세요. 메신저나 단체방에는 올리지 마세요.</span></p>' +
      '<div class="modal-btns">' + (list.length ? '<button type="button" class="btn" data-action="print-slips">' + icon('print', 18) + '쪽지로 인쇄</button>' : '') +
      '<button type="button" class="btn btn-primary" data-action="close-pins">확인했어요</button></div>', { noBackdropClose: true });
  }

  function printSlips() {
    var school = S.start ? S.start.school : '';
    var area = qs('#print-area');
    area.innerHTML = '<div class="slips">' + (S.pinSlips || []).map(function (p) {
      return '<div class="slip"><div>' + esc(school) + ' 온라인 교무실 · 개인 번호</div>' +
        '<div style="font-size:18px;font-weight:800;margin-top:4px">' + esc(p.name) + ' 선생님 <span style="font-weight:600;font-size:14px">' + esc(p.group || '') + '</span></div>' +
        '<div class="slip-pin">' + esc(p.pin) + '</div>' +
        '<div>조사에 답하거나 일정을 넣을 때 이름을 고르고 이 번호를 넣어요. 다른 사람에게 보여 주지 마세요. 잊으면 연구부장·부담당에게 다시 받으세요.</div></div>';
    }).join('') + '</div>';
    document.body.classList.add('printing-slips');
    setTimeout(function () {
      window.print();
      setTimeout(function () { document.body.classList.remove('printing-slips'); }, 500);
    }, 50);
  }

  function clearPins() {
    S.pinSlips = null;
    var area = qs('#print-area');
    if (area) area.innerHTML = '';
  }

  function staffToggle(x) {
    var off = x['사용 여부'] === '사용 안 함';
    var go2 = function () {

  // ------------------------------------------------------------ 관리자 · 설정
  function adminSettings(panel) {
    if (!panel) return; // 그사이 다른 화면으로 옮겼으면
    panel.innerHTML = loadingHtml('설정을 불러오는 중이에요');
    server('admin.settings.get').then(function (list) { drawSettings(panel, list); })
      .catch(function (e) { panel.innerHTML = failHtml(e); });
  }

  function drawSettings(panel, list) {
    function byKey(k) { return list.filter(function (x) { return x.key === k; })[0]; }
    function input(d) {
      var id = 'set-' + list.indexOf(d);
      if (d.type === 'choice') {
        return '<div class="field"><label class="label" for="' + id + '">' + esc(d.label) + '</label>' +
          '<select id="' + id + '" class="input" data-set="' + esc(d.key) + '">' + d.options.map(function (o) {
            return '<option' + (o === d.value ? ' selected' : '') + '>' + esc(o) + '</option>';
          }).join('') + '</select>' + (d.note ? '<p class="hint">' + esc(d.note) + '</p>' : '') + '</div>';
      }
      var type = d.type === 'date' ? 'date' : 'text';
      var extra = d.type === 'int' || d.type === 'year' ? ' inputmode="numeric"' : '';
      return '<div class="field"><label class="label" for="' + id + '">' + esc(d.label) + (d.unit ? ' (' + d.unit + ')' : '') + '</label>' +
        '<input id="' + id + '" class="input" type="' + type + '" data-set="' + esc(d.key) + '" value="' + esc(d.value) + '"' + extra + '>' +
        (d.note ? '<p class="hint">' + esc(d.note) + (d.type === 'int' ? ' · ' : '') + (d.type === 'int' ? d.min + '~' + d.max + d.unit : '') + '</p>' : (d.type === 'int' ? '<p class="hint">' + d.min + '~' + d.max + d.unit + '</p>' : '')) + '</div>';
    }
    var links = [];
    try { links = JSON.parse(byKey('기존 시트 바로가기').value || '[]'); } catch (e) { links = []; }
    S.cache.links = links;
    var backup = byKey('백업 폴더ID').value;
    var yr = byKey('학년도'), sems = (byKey('학기 기간') || {}).value || null;
    /** 학년도마다 학기 기간(이번·다음 학년도). 예전 판 서버면(학기 기간이 오지 않음) 예전 설정 칸 그대로 */
    var semHtml = sems ? sems.map(function (v, k) {
      var f = function (key, label) {
        var id = 'sem-' + v.year + '-' + key;
        return '<div class="field"><label class="label" for="' + id + '">' + label + '</label><input id="' + id + '" class="input" type="date" data-sem="' + v.year + '" data-k="' + key + '" value="' + esc(v[key] || '') + '"' +
          ' min="' + v.year + '-03-01" max="' + (v.year + 1) + '-02-' + (new Date(Date.UTC(v.year + 1, 2, 0)).getUTCDate()) + '"></div>';
      };
      return '<fieldset class="sem-year"><legend>' + v.year + '학년도 <span class="faint">' + (k ? '다음 학년도' : '지금 학년도') + '</span></legend>' +
        (v.src === 'old' ? '<p class="hint">' + icon('info', 16) + '<span>예전 설정에 넣은 기간이에요. 저장하면 이 학년도 기간으로 따로 남아요.</span></p>' : '') +
        '<div class="form-grid">' + f('s1from', '1학기 시작일') + f('s1to', '1학기 끝일') + '</div>' +
        '<div class="form-grid">' + f('s2from', '2학기 시작일') + f('s2to', '2학기 끝일') + '</div></fieldset>';
    }).join('') : '<div class="form-grid">' + input(byKey('1학기 시작일')) + input(byKey('1학기 끝일')) + '</div>' +
      '<div class="form-grid">' + input(byKey('2학기 시작일')) + input(byKey('2학기 끝일')) + '</div>';
    panel.innerHTML = '<form class="wrap" id="set-form" style="gap:24px" novalidate>' +
      '<section class="card"><h2>학교·학년도</h2><div class="form-grid">' + input(byKey('학교명')) +
      '<div class="field"><span class="label">지금 학년도</span><p class="set-year"><b>' + esc(yr ? yr.value : '') + '학년도</b>' +
      '<button type="button" class="btn btn-sm" data-admin-tab="year">새 학년도로 넘기기' + icon('chev', 16) + '</button></p>' +
      '<p class="hint">학년도는 관리자 › 새 학년도에서 바꿔요(지금 학년도 자료를 보관하고, 고른 자료를 옮겨 적는 일과 함께 해요).</p></div></div></section>' +
      '<section class="card"><h2>학기 기간</h2><p class="faint">수업일수 계산에 써요. 학년도마다 따로 넣어요. 학교 학사일정을 보고 넣어 주세요(확인 필요).</p>' + semHtml + '</section>' +
      '<section class="card"><h2>본인 확인·백업</h2><div class="form-grid">' + input(byKey('본인 확인 방식')) + input(byKey('기기 기억 일수')) + '</div>' +
      '<div class="form-grid">' + input(byKey('잠금 횟수')) + input(byKey('잠금 분')) + '</div>' +
      '<div class="form-grid">' + input(byKey('백업 남길 개수')) + '</div>' +
      '<p class="faint">자동 백업: ' + (backup ? '켜져 있어요(백업 폴더가 만들어져 있어요).' : '아직 꺼져 있어요. 전용 시트 메뉴 "4. 매일 자동 백업 켜기"로 켜 주세요.') + '</p></section>' +
      (byKey('파일 크기 한도') ? '<section class="card"><h2>자료실</h2><div class="form-grid">' + input(byKey('파일 크기 한도')) + '</div></section>' : '') +
      '<section class="card"><div class="card-head"><h2>기존 시트 바로가기</h2><span class="chip">홈 아래에 보여요</span></div>' +
      '<p class="faint">특별실 시간표·방학 근무·연수 이수 확인처럼 2차에 옮길 일의 바로가기예요. 주소는 https:// 로 시작해야 해요.</p>' +
      '<div class="form" id="links" style="gap:8px"></div>' +
      '<div><button type="button" class="btn btn-sm" data-action="link-add">' + icon('plus', 18) + '바로가기 추가</button></div></section>' +
      '<p class="err" id="set-err" role="alert"></p>' +
      '<div class="print-hide"><button type="submit" class="btn btn-primary">설정 저장</button></div></form>';
    drawLinks();
    qs('#set-form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      readLinks();
      var values = {};
      qsa('[data-set]').forEach(function (i) { values[i.getAttribute('data-set')] = i.value; });
      values['기존 시트 바로가기'] = JSON.stringify(S.cache.links.filter(function (l) { return l.name || l.url; }));
      var req = { values: values };
      if (sems) {
        req.semesters = sems.map(function (v) {
          var o = { year: v.year };
          qsa('[data-sem="' + v.year + '"]').forEach(function (i) { o[i.getAttribute('data-k')] = i.value; });
          return o;
        });
      }
      var btn = ev.target.querySelector('[type=submit]');
      busy(btn, true, '저장하는 중');
      server('admin.settings.save', req).then(function (l2) {
        if (S.start) S.start.school = values['학교명'];
        var newPin = values['본인 확인 방식'] === '이름+개인 번호';
        if (S.start && S.start.pinMode !== newPin) {
          // 확인 방식이 바뀌면 지금 기기의 본인 확인도 풀린다(서버도 같은 규칙)
          S.start.pinMode = newPin;
          stDel('gy.identity');
          S.me = null;
          renderApp();
          toast('본인 확인 방식을 바꿨어요. 이름을 다시 골라 주세요');
          return;
        }
        if (S.start) S.start.rememberDays = Number(values['기기 기억 일수']) || S.start.rememberDays;
        drawSettings(panel, l2);
        toast('설정을 저장했어요');
      }).catch(function (e) { busy(btn, false); qs('#set-err').textContent = e.message; });
    });
  }

  function drawLinks() {
    var box = qs('#links');
    if (!box) return;
    var links = S.cache.links;
    box.innerHTML = links.length ? links.map(function (l, i) {
      return '<div class="link-row"><input class="input" data-link-name="' + i + '" value="' + esc(l.name) + '" placeholder="이름 (예: 특별실 시간표)" maxlength="20" aria-label="바로가기 이름">' +
        '<input class="input" data-link-url="' + i + '" value="' + esc(l.url) + '" placeholder="https://" aria-label="바로가기 주소">' +
        '<button type="button" class="btn btn-sm btn-ghost" data-action="link-del" data-i="' + i + '" aria-label="바로가기 빼기">' + icon('x', 18) + '</button></div>';
    }).join('') : '<p class="faint">아직 없어요.</p>';
  }
  function readLinks() {
    S.cache.links = S.cache.links.map(function (l, i) {
      var n = qs('[data-link-name="' + i + '"]'), u = qs('[data-link-url="' + i + '"]');
      return { name: n ? n.value.trim() : l.name, url: u ? u.value.trim() : l.url };
    });
  }

  // ------------------------------------------------------------ 관리자 · 수정 기록
  function adminLog(panel) {
    var tab = S.cache.logTab || '';
    panel.innerHTML = '<div class="wrap" style="gap:16px"><div class="toolbar print-hide"><label class="label" for="log-tab">어느 표</label>' +
      '<select id="log-tab" class="input" style="width:auto;min-width:160px">' +
      ['', '교직원', '분류', '설정', '일정', '조사', '응답', '자료', '도움말'].map(function (t) {
        return '<option value="' + t + '"' + (t === tab ? ' selected' : '') + '>' + (t || '전체') + '</option>';
      }).join('') + '</select><span class="faint">최근 200개까지 보여요. 전체는 전용 시트의 "기록" 탭에 있어요.</span></div>' +
      '<section class="card" id="log-list">' + loadingHtml('기록을 불러오는 중이에요') + '</section></div>';
    qs('#log-tab').addEventListener('change', function (e) { S.cache.logTab = e.target.value; adminLog(panel); });
    server('admin.log.list', { tab: tab }).then(function (list) {
      qs('#log-list').innerHTML = list.length ? list.map(logItem).join('') : '<p class="empty">아직 기록이 없어요.</p>';
    }).catch(function (e) { qs('#log-list').innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
  }

  function logItem(l) {
    var keys = [];
    if (l.before || l.after) {
      var b = l.before || {}, a = l.after || {};
      keys = Object.keys(a).concat(Object.keys(b)).filter(function (k, i, arr) { return arr.indexOf(k) === i; });
    }
    var detail = l.before && l.after && keys.length
      ? '<details><summary>바뀐 내용 ' + keys.length + '칸</summary><div class="diff">' + keys.map(function (k) {
          return '<span class="k">' + esc(k) + '</span><span class="b">' + esc(l.before[k] || '(빈칸)') + '</span><span class="to" aria-label="에서">→</span><span>' + esc(l.after[k] || '(빈칸)') + '</span>';
        }).join('') + '</div></details>'
      : '';
    var tone = l.action === '삭제' || l.action === '잠김' ? 'chip-warn' : l.action === '추가' ? 'chip-ok' : '';
    return '<div class="log-item"><div class="log-top"><span class="log-time">' + esc(l.time) + '</span>' +
      '<span class="chip ' + tone + '">' + esc(l.action) + '</span><span class="chip">' + esc(l.tab) + '</span>' +
      '<span class="faint">' + esc(l.who || '이름 없음') + '</span></div>' +
      '<p class="log-sum">' + esc(l.summary || '') + '</p>' + detail + '</div>';
  }

  // ------------------------------------------------------------ 관리자 · 비밀번호
  function adminPw(panel) {

      '<p class="err" id="pc-err" role="alert"></p><div><button type="submit" class="btn btn-primary">공통 비밀번호 바꾸기</button></div></form>' +

      '<p class="faint">연구부장·부담당이 바뀌면 꼭 바꿔 주세요. 공통 비밀번호와 다르게 정해야 해요.</p>' +
      pwField('pa-0', '지금 관리자 비밀번호', 'current-password') + pwField('pa-1', '새 관리자 비밀번호 (6자 이상)', 'new-password') + pwField('pa-2', '한 번 더', 'new-password') +
      '<p class="err" id="pa-err" role="alert"></p><div><button type="submit" class="btn btn-primary">관리자 비밀번호 바꾸기</button></div></form>' +

    qs('#pw-common').addEventListener('submit', function (ev) {

      busy(btn, true, '바꾸는 중');

      }).catch(function (e) { busy(btn, false); err.textContent = e.message; });

    qs('#pw-admin').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var c = qs('#pa-0').value, a = qs('#pa-1').value, b = qs('#pa-2').value, err = qs('#pa-err');
      if (a !== b) { err.textContent = '새 비밀번호 두 칸이 서로 달라요.'; return; }
      var btn = ev.target.querySelector('[type=submit]');

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go],[data-action],[data-theme-btn],[data-design-btn],[data-admin-tab],[data-sched-view],[data-home-f],[data-sv-tab]');
    if (!t) return;
    if (t.hasAttribute('data-go')) {
      var to = t.getAttribute('data-go');
      var nav = function () {
        if (to === 'schedule' && S.screen === 'home') S.sched.view = 'cal';
        if (to === 'table' && TB) TB.reset(); // 메뉴를 누르면 표 목록부터

      if (TB && TB.leaving && !TB.leaving(nav)) return; // 취합 시트에 저장하지 못한 칸이 있으면 먼저 묻는다
      nav();
      return;
    }
    if (t.hasAttribute('data-sched-view')) { S.sched.view = t.getAttribute('data-sched-view'); S.sched.form = null; renderApp(); return; }
    if (t.hasAttribute('data-home-f')) { S.homeFilter = t.getAttribute('data-home-f'); drawHome(); return; }
    if (t.hasAttribute('data-sv-tab')) { S.survey.tab = t.getAttribute('data-sv-tab'); S.survey.sel = ''; S.survey.showResults = false; drawSurvey(); return; }
    if (t.hasAttribute('data-theme-btn')) { setTheme(t.getAttribute('data-theme-btn')); return; }
    if (t.hasAttribute('data-design-btn')) { setDesign(t.getAttribute('data-design-btn'), true); return; }
    if (t.hasAttribute('data-admin-tab')) { S.adminTab = t.getAttribute('data-admin-tab'); renderApp(); return; }
    var a = t.getAttribute('data-action');
    var id = t.getAttribute('data-id');
    switch (a) {
      case 'theme-toggle':

  // 화면에서 무언가 입력하면 뒤에서 받은 새 내용으로 다시 그리지 않는다(쓰던 것이 지워지지 않게)
  document.addEventListener('input', function (e) { if (e.target.closest && e.target.closest('#screen')) screenEdited = true; }, true);
  document.addEventListener('focusout', function () { setTimeout(flushPending, 0); });

  });

  document.addEventListener('input', function (e) {
    if (!e.target.classList || !e.target.classList.contains('zoom-range')) return;
    var z = zoomSteps()[Number(e.target.value)] || 100;
    var box = e.target.closest('.zoom');
    if (box) qs('.zoom-val', box).textContent = z + '%';
    e.target.setAttribute('aria-valuetext', z + '%');
  });
  document.addEventListener('change', function (e) {
    if (!e.target.classList || !e.target.classList.contains('zoom-range')) return;
    var z = zoomSteps()[Number(e.target.value)];
    if (z) setZoom(z);
  });

  document.addEventListener('change', function (e) {
    var f = e.target.getAttribute && e.target.getAttribute('data-filter');

    S.sched.filter[f] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    drawCal();
  });

  var lastShape = isPhone() + '/' + isWide();
  var resizeTimer, shapeDirty = false;
  /** 모양이 바뀐 화면을 다시 그린다. 창이 열려 있거나 입력하는 중이면 끝난 뒤로 미룬다(쓰던 것이 사라지지 않게) */
  function reshape() {
    if (!shapeDirty || !qs('.app')) return;
    if ($modal.innerHTML || editingNow()) return;
    shapeDirty = false;
    captureEventForm();
    renderApp();
  }
  window.addEventListener('resize', function () {

      var shape = isPhone() + '/' + isWide();

      lastShape = shape;
      if (S.screen === 'schedule' || S.screen === 'home') { shapeDirty = true; reshape(); }
      updateTabHints();
    }, 200);
  });

  window.addEventListener('beforeprint', function () { qsa('.help-item').forEach(function (d) { d.open = true; }); });
  // 월별 계획은 A4 세로 한 장에 맞춰 인쇄한다
  window.addEventListener('beforeprint', planPrintStart);
  window.addEventListener('afterprint', planPrintEnd);

  // 달력에서 일정을 끌어서 옮기기(마우스·터치)
  document.addEventListener('pointerdown', dragDown);
  document.addEventListener('pointermove', dragMove);
  document.addEventListener('pointerup', dragUp);
  document.addEventListener('pointercancel', function () { dragStop(); });
  window.addEventListener('blur', function () { dragStop(); });
  document.addEventListener('touchmove', function (e) { if (drag && drag.on) e.preventDefault(); }, { passive: false }); // 끄는 동안 화면이 같이 넘어가지 않게
  document.addEventListener('contextmenu', function (e) { if (drag) e.preventDefault(); }); // 길게 누를 때 뜨는 메뉴 막기
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && drag) { var on = drag.on; dragStop(); if (on) eatClick(); } });

    go(h);

  // 옆으로 밀리는 탭(관리자 탭 등): 더 있으면 끝을 흐리게
  document.addEventListener('scroll', function (e) { if (e.target.classList && e.target.classList.contains('tabs')) updateTabHints(); }, true);
