            (q.texts.length > 30 ? '<p class="faint">나머지 ' + (q.texts.length - 30) + '개는 엑셀로 받아 보세요.</p>' : '') : '<p class="faint">아직 답이 없어요.</p>';
        }
        return '<div class="q-sum"><p class="q-sum-t">' + (i + 1) + '. ' + esc(q.title) + '</p>' + inner + '</div>';
      }).join('') +
      (resp.length ? '<details class="resp-list"><summary>낸 분들의 답 ' + resp.length + '개 보기</summary><div class="table-wrap"><table class="plan resp"><thead><tr><th>이름</th><th>낸 시각</th>' +
        d.questions.map(function (q, i) { return '<th>' + (i + 1) + '. ' + esc(q.title) + '</th>'; }).join('') + (hasNote ? '<th>하고 싶은 말</th>' : '') + '</tr></thead><tbody>' +
        resp.map(function (r) {
          return '<tr><td><b>' + esc(r.name) + '</b><br><span class="faint">' + esc(r.group) + '</span></td><td class="faint">' + esc(atText(r.at)) + (r.edited ? ' (고침)' : '') + '</td>' +
            d.questions.map(function (q) { var v = r.answers[q.id]; return '<td>' + esc(Array.isArray(v) ? v.join(', ') : v || '') + '</td>'; }).join('') +
            (hasNote ? '<td>' + esc(r.note || '') + '</td>' : '') + '</tr>';
        }).join('') + '</tbody></table></div></details>' : '') +
      '</div>';
  }

  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      return ok;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallback(); });
    }
    return Promise.resolve(fallback());
  }

  function surveyCsv() {
    var d = S.survey.detail;
    server('survey.csv', { id: d.card.id }).then(function (r) {
      // 표 복사: 여러 줄로 쓴 답이 다른 줄로 쪼개지지 않게 줄바꿈·탭·따옴표가 든 칸은 따옴표로 감싼다(엑셀·구글 시트가 한 칸으로 읽음)
      var tsv = parseDelimited(r.csv, ',').map(function (row) {
        return row.map(function (c) { return /[\t\r\n"]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join('\t');
      }).join('\n');
      openModal('<h2 id="m-title">엑셀로 받기</h2>' +
        '<p class="muted" style="margin:0">' + esc(r.filename) + ' · ' + (d.responses || []).length + '명의 답</p>' +
        '<p class="hint">' + icon('info', 16) + '<span>파일이 내려받아지지 않으면 "표 복사"를 누른 뒤 엑셀이나 구글 시트에 붙여 넣으세요.</span></p>' +
        '<div class="modal-btns"><button type="button" class="btn" data-action="close-modal">닫기</button>' +
        '<button type="button" class="btn" id="csv-copy">' + icon('copy', 18) + '표 복사</button>' +
        '<button type="button" class="btn btn-primary" id="csv-dl">' + icon('down', 18) + '파일 내려받기</button></div>');
      qs('#csv-dl').addEventListener('click', function () {
        try {
          var blob = new Blob(['﻿' + r.csv], { type: 'text/csv;charset=utf-8' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = r.filename;
          document.body.appendChild(a);
          a.click();
          setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
          toast('파일을 내려받았어요');
        } catch (e) { toast('내려받지 못했어요. "표 복사"를 써 주세요', 'error'); }
      });
      qs('#csv-copy').addEventListener('click', function () {
        copyText(tsv).then(function (ok) { toast(ok ? '표를 복사했어요. 엑셀에 붙여 넣으세요' : '복사하지 못했어요', ok ? '' : 'error'); });
      });
    }).catch(function (e) { toast(e.message, 'error'); });
  }

  // ------------------------------------------------------------ 새 조사 만들기·고치기
  var Q_TYPES = [['one', '하나 고르기'], ['many', '여러 개 고르기'], ['short', '짧은 글'], ['long', '긴 글'], ['number', '숫자'], ['date', '날짜']];

  /** 새 조사 만들기·고치기. copyFrom(지난 조사의 내용)을 주면 그 조사로 채운 새 조사(마감은 새로, 답은 가져오지 않음) */
  function openSurveyForm(edit, copyFrom) {
    if (!needMe('조사를 만들면')) return;
    var start = function (depts, people) { drawSurveyForm(edit, depts, people, copyFrom); };
    if (edit) return start(edit.depts || [], null);
    if (copyFrom && copyFrom.depts) return start(copyFrom.depts, null);
    // 부서 목록은 일정 화면과 같은 곳에서 받아 온다(미리 받아 둔 것이 있으면 바로)
    var key = { year: +localToday().slice(0, 4), month: +localToday().slice(5, 7) };
    var mm = MEMO[memoKey('sched.month', key)];
    if (mm) return start(mm.data.depts || [], null);
    if (surveyFormOpening) return; // 두 번 눌러도 한 번만(늦게 온 답이 쓰던 창을 다시 열지 않게)
    surveyFormOpening = true;
    var btn = qs('[data-action="sv-new"]');
    busy(btn, true, '여는 중');
    server('sched.month', key).then(function (m) { memoPut('sched.month', key, m); start(m.depts || [], null); }, function (e) { toast(e.message, 'error'); })
      .then(function () { surveyFormOpening = false; busy(btn, false); });
  }
  var surveyFormOpening = false;

  function drawSurveyForm(edit, depts, people, copyFrom) {
    var src = edit || copyFrom || null; // 고치기: 이 조사, 가져오기: 지난 조사(마감·답은 빼고)
    var d = src || {};
    var c = d.card || {};
    var tg = d.target || { type: 'all' };
    var locked = !!(edit && d.hasResponses);
    var def = addD(localToday(), 3) + ' 17:00';
    var dl = edit ? (c.deadline || def) : def;
    var deptId = src ? d.deptId || '' : (S.me && S.me.deptId) || '';
    var qsList = (d.questions && d.questions.length ? d.questions : [{ type: 'one', title: '', required: true, options: [] }]);
    if (copyFrom) qsList = qsList.map(function (q) { var o = {}; Object.keys(q).forEach(function (k) { if (k !== 'id') o[k] = q[k]; }); return o; }); // 새 질문으로
    // 지난 조사에서 가져오기(새 조사만): 보이는 조사(낼 것·만든 것·지난 것) 중에서 고른다
    var pool = [];
    if (!edit && S.survey.list) {
      var seen = {};
      [].concat(S.survey.list.mine || [], S.survey.list.past || [], S.survey.list.toAnswer || []).forEach(function (x) { if (!seen[x.id]) { seen[x.id] = 1; pool.push(x); } });
      pool.sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : a.createdAt > b.createdAt ? -1 : 0; });
    }
    openModal('<form class="form" id="svf" novalidate>' +
      '<div class="card-head"><h2 id="m-title">' + (edit ? '조사 고치기' : '새 조사 만들기') + '</h2>' +
      '<button type="button" class="icon-btn" data-action="close-modal" aria-label="닫기">' + icon('x') + '</button></div>' +
      (pool.length ? '<div class="field"><label class="label" for="svf-from">지난 조사에서 가져오기 <span class="faint">(안 골라도 돼요)</span></label><select id="svf-from" class="input"><option value="">(새로 쓰기)</option>' +
        pool.map(function (x) { return '<option value="' + esc(x.id) + '"' + (copyFrom && copyFrom.card && copyFrom.card.id === x.id ? ' selected' : '') + '>' + esc(x.title) + ' · ' + esc((x.createdAt || '').slice(0, 10)) + '</option>'; }).join('') +
        '</select><p class="hint">제목·설명·대상·질문·안내 문구를 채워요. 마감은 새로 정하고, 낸 답은 가져오지 않아요.</p></div>' : '') +

  function sizeText(n) {
    if (!n) return '';
    if (n < 1024) return n + 'B';
    if (n < 1024 * 1024) return Math.max(1, Math.round(n / 1024)) + 'KB';
    return (Math.round(n / 1024 / 1024 * 10) / 10) + 'MB';
  }
  /** '2026-10-15' → '10월 15일'(올해가 아니면 '2025년 10월 15일') */
  function dateText(ymd) {
    if (!ymd) return '';

  }
  /** https 주소만 링크로 쓴다(시트에 직접 적은 이상한 주소 막기) */
  function safeUrl(u) {
    return /^https:\/\/[^\s"'<>]+$/.test(String(u || '')) ? u : '';
  }
  /** 글 속의 https 주소만 누를 수 있는 링크로(나머지 글은 그대로 이스케이프). 끝의 마침표·괄호는 주소에 넣지 않는다 */
  function linkify(text) {
    return esc(text).replace(/https:\/\/[^\s"'<>&]+(?:&amp;[^\s"'<>&]+)*/g, function (m) {
      var tail = (/[.,)\]」』]+$/.exec(m) || [''])[0], u = m.slice(0, m.length - tail.length), raw = u.replace(/&amp;/g, '&');
      return safeUrl(raw) ? '<a href="' + esc(raw) + '" target="_blank" rel="noopener">' + u + '</a>' + tail : m;
    });
  }
  function uniq(list) {
    var seen = {};
    return list.filter(function (x) { if (seen[x]) return false; seen[x] = true; return true; });
  }
  /** 낱말을 모두 품고 있으면 맞음(띄어쓰기·대소문자 무시) — 서버 검색과 같은 규칙 */
  function textMatch(q, fields) {
    var terms = String(q || '').toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return true;
    var hay = fields.join(' ').toLowerCase(), flat = hay.replace(/\s+/g, '');
    return terms.every(function (t) { return hay.indexOf(t) >= 0 || flat.indexOf(t) >= 0; });
  }
  /** 찾기 칸: 글자를 칠 때마다 목록만 다시 그린다(칸은 그대로라 한글 입력이 끊기지 않음) */
  function bindFind(id, onChange) {

  /** 고른 파일을 base64로 읽는다(크기 먼저 확인) */
  function readFile(file, maxMb) {
    return new Promise(function (resolve, reject) {
      if (file.size > maxMb * 1024 * 1024) return reject(new Error('파일이 너무 커요. ' + maxMb + 'MB까지 올릴 수 있어요. 더 큰 파일은 드라이브에 올리고 링크로 넣어 주세요.'));
      if (!file.size) return reject(new Error('빈 파일이에요. 다른 파일을 골라 주세요.'));
      var r = new FileReader();
      r.onload = function () { var s = String(r.result); resolve({ name: file.name, type: file.type, data: s.slice(s.indexOf(',') + 1) }); };
      r.onerror = function () { reject(new Error('파일을 읽지 못했어요. 다시 골라 주세요.')); };
      r.readAsDataURL(file);
    });
  }

  /** 메신저·포털 앱 안의 브라우저(내려받기를 막는 곳이 많다. 이름표는 앱마다 다르고 바뀔 수 있어 확인 필요) */
  function inAppBrowser() {

  function downloadFile(tab, id, btn, force) {

        '<p class="muted" style="margin:0">메신저 안에서 연 화면은 파일 내려받기가 막혀 있을 수 있어요. 화면 오른쪽 위(또는 아래) 메뉴의 <b>다른 브라우저로 열기</b>를 누른 뒤 다시 받아 주세요.</p>' +
        '<div class="modal-btns"><button type="button" class="btn" data-action="close-modal">닫기</button><button type="button" class="btn btn-primary" id="dl-anyway">그래도 받아 보기</button></div>');
      qs('#dl-anyway').addEventListener('click', function () { closeModal(); downloadFile(tab, id, null, true); });
      return;
    }
    busy(btn, true, '받는 중');
    server('file.get', { tab: tab, id: id }).then(function (f) {

        var bin = atob(f.data), bytes = new Uint8Array(bin.length);

        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([bytes], { type: f.type }));
        a.download = f.name;
        document.body.appendChild(a);
        a.click();

  // ============================================================ 자료실
  S.lib = { data: null, view: 'now', q: '', dept: '', kind: '', year: '', openId: '' };

  /** 자료실 요청: 보관함(지난 학년도 자료)은 보관함을 열 때만 받는다 */
  function libArgs() { return S.lib.view === 'archive' ? { archive: 1 } : {}; }

  SCREENS.library = function ($s) {
    $s.innerHTML = pageHead('', '자료실', '', '<button type="button" class="btn btn-primary print-hide" data-action="lib-new">' + icon('plus', 18) + '자료 넣기</button>') +

  function libYears() {
    var d = S.lib.data;

  }

  // 부서 단추 줄(판 2026-10-21d, 교사 요청): [공통] [전체] [내 부서] [부서…] [부서 없음]. 숫자는 지금 보기(학년도·보관함·분류·찾기)에 맞는 그 단추의 자료 수.
  // 처음은 전체, 고른 단추는 이 창에서만 기억. 휴대폰은 한 줄로 옆으로 민다(끝이 흐려짐, updateTabHints)
  // [공통] 탭(판 2026-10-22a, 교사 선택): 공통 자료만 모아 보고, 부서 단추는 그 부서 자료만(그 부서의 공통 자료도 함께). [전체]는 공통 자료가 맨 위
  var LIB_NONE = '_none'; // '부서 없음' 단추: 부서가 비었거나 지금은 없는 부서의 자료
  var LIB_COMMON = '_common'; // '공통' 단추: 공통 자료(부서는 따지지 않음)
  function libInDept(i, dep, known) { return dep === LIB_COMMON ? !!i.common : dep === LIB_NONE ? !known[i.deptId] : i.deptId === dep; }
  function drawLibDepts(scope, base, known) {
    var L = S.lib, d = L.data, row = qs('#lib-depts');
    if (!row) return;
    var count = function (dep) { return base.filter(function (i) { return libInDept(i, dep, known); }).length; };
    var mine = S.me && S.me.deptId;
    // 사용 안 함 부서는 이 보기에 자료가 있을 때만(찾는 동안 단추가 생겼다 없어지지 않게 찾기 전 자료로 본다)
    var list = d.depts.filter(function (dp) {
      return dp.active || dp.id === L.dept || scope.some(function (i) { return i.deptId === dp.id; });
    });
    var me = list.filter(function (dp) { return dp.id === mine; });
    list = me.concat(list.filter(function (dp) { return dp.id !== mine; })); // 내 부서는 전체 바로 뒤
    var btn = function (id, name, n, tag) {

    };
    var keep = row.scrollLeft;
    row.hidden = !scope.length; // 이 보기에 자료가 하나도 없으면(빈 보관함 등) 0만 늘어선 줄을 숨긴다
    row.innerHTML = btn(LIB_COMMON, '공통', count(LIB_COMMON)) + btn('', '전체', base.length) + list.map(function (dp) {
      return btn(dp.id, dp.name, count(dp.id), dp.id === mine ? '<span class="tg-mine">내 부서</span>' : '');
    }).join('') + (L.dept === LIB_NONE || scope.some(function (i) { return !known[i.deptId]; }) ? btn(LIB_NONE, '부서 없음', count(LIB_NONE)) : '');
    var tail = qs('#lib-tail');
    if (tail) tail.innerHTML = '<span class="faint" aria-live="polite">' + (L.view === 'archive' ? esc(L.year) + '학년도 보관함 · ' : '') + (L.dept ? base.filter(function (i) { return libInDept(i, L.dept, known); }).length : base.length) + '개</span>' +
      '<div class="seg seg-sm" role="group" aria-label="자료 순서"><button type="button" data-action="lib-sort" data-v="" aria-pressed="' + !L.sort + '">가나다순</button>' +
      '<button type="button" data-action="lib-sort" data-v="recent" aria-pressed="' + (L.sort === 'recent') + '">최근 순</button></div>';
    row.scrollLeft = keep;
  }
  /** 고른 단추가 한 줄(휴대폰)에서 가려져 있으면 보이게 민다 */
  function libDeptIntoView() {

  }
  /** 새 자료의 처음 부서: 고른 부서 단추(사용 중인 부서일 때), 아니면 내 부서. [공통] 단추면 내 부서 + 공통 자료 켜기(openLibForm) */
  function libNewDept() {
    var dep = S.lib.dept, d = S.lib.data;
    if (dep && dep !== LIB_NONE && d && d.depts.some(function (dp) { return dp.id === dep && dp.active; })) return dep;
    return (S.me && S.me.deptId) || '';
  }
  /** '자료 넣기' 단추·끌어다 놓기 덮개 이름: 고른 단추에 넣는다는 것을 보여 준다('교무부에 자료 넣기'·'공통 자료 넣기') */
  function libNewLabel() {
    var dep = S.lib.dept, d = S.lib.data;
    if (dep === LIB_COMMON) return { btn: '공통 자료 넣기', drop: '공통 자료로' };
    var hit = dep && dep !== LIB_NONE && d && d.depts.filter(function (dp) { return dp.id === dep && dp.active; })[0];
    return hit ? { btn: hit.name + '에 자료 넣기', drop: hit.name + ' 자료로' } : { btn: '자료 넣기', drop: '자료로' };
  }

  function drawLibList() {
    var L = S.lib, d = L.data, box = qs('#lib-list');
    if (!box || !d) return;
    if (L.view === 'archive' && d.archiveYears && !d.archive && libYears().length) {
      // 보관함은 열 때 받는다(저장할 때마다 지난 자료를 모두 다시 받지 않게)
      box.innerHTML = loadingHtml('보관함을 불러오는 중이에요');
      loadMemo('lib.list', { archive: 1 }, function (d2) {
        if (S.screen !== 'library' || L.view !== 'archive') return;
        L.data = d2;
        drawLib();
      }, function (e) { var b = qs('#lib-list'); if (b) b.innerHTML = failHtml(e); });
      return;
    }
    var scope = d.items.filter(function (i) { return L.view === 'now' ? !i.archived : i.archived && i.year === L.year; });
    var known = {};
    d.depts.forEach(function (dp) { known[dp.id] = true; });
    if (L.dept && L.dept !== LIB_NONE && L.dept !== LIB_COMMON && !known[L.dept]) L.dept = ''; // 고른 부서가 분류에서 지워졌으면 전체로
    // 분류·찾기에 맞는 자료(부서 단추의 숫자도 이것으로 센다)
    var base = scope.filter(function (i) {
      if (L.kind && i.kindId !== L.kind) return false;
      return textMatch(L.q, [i.title, i.desc, i.owner, i.dept, i.kind, i.fileName]);
    });
    drawLibDepts(scope, base, known);
    var nb = qs('.page-head [data-action=lib-new]'), lab = libNewLabel();
    if (nb) nb.innerHTML = icon('plus', 18) + esc(lab.btn);
    var common = L.dept === LIB_COMMON;
    var list = L.dept ? base.filter(function (i) { return libInDept(i, L.dept, known); }) : base; // 부서 단추는 그 부서 자료만(공통 자료가 맨 위를 덮지 않게)
    var other = base.length - list.length;
    // 고른 단추에 보일 자료가 없으면 한 줄. 찾는 중에 다른 단추에 있으면 그 수와 '전체에서 보기'(내 부서만 보다가 없는 줄 알지 않게)
    var note = !L.dept || list.length ? '' : common ? (L.q || L.kind ? '공통 자료에는 찾는 자료가 없어요.' : '공통 자료가 아직 없어요. 자료를 넣을 때 "공통 자료"에 체크하면 여기에 모여요.')
      : L.q || L.kind ? '이 부서에는 찾는 자료가 없어요.' : '이 부서 자료는 아직 없어요.';
    var more = L.dept && L.q && other ? '<p class="hint lib-other">' + icon('info', 16) + '<span>' + (common ? '공통이 아닌 자료' : '다른 부서') + '에도 찾는 자료가 ' + other + '개 있어요. ' +
      '<button type="button" class="linkish" data-action="lib-dept" data-id="">전체에서 보기</button></span></p>' : '';
    if (!list.length) {
      var msg = L.view === 'archive' && !libYears().length ? '보관함이 비어 있어요. 새 학년도로 넘기면 지난 자료가 여기로 와요.'
        : note && scope.length ? note
        : scope.length ? '찾는 자료가 없어요.' + (L.view === 'now' ? ' 보관함에서도 찾아보세요.' : '')
        : '아직 자료가 없어요. "자료 넣기"로 첫 자료를 넣어 보세요.';

      return;
    }
    // [전체]·[공통]: 공통 자료는 맨 위에 한 번만(부서 칸에는 다시 나오지 않음), 공통 순서 번호 → 제목 순. 부서 단추: 그 부서 칸 하나(공통 자료도 '공통' 표시로 함께)
    var recent = L.sort === 'recent', byRecent = function (a, b) { return (b.updated || '').localeCompare(a.updated || '') || a.title.localeCompare(b.title, 'ko'); };
    var commons = L.dept && !common ? [] : list.filter(function (i) { return i.common; }).sort(recent ? byRecent : function (a, b) {
      return (Number(a.commonOrder) || 999) - (Number(b.commonOrder) || 999) || a.title.localeCompare(b.title, 'ko');
    });
    var rest = L.dept && !common ? list : list.filter(function (i) { return !i.common; });
    if (recent) rest = rest.slice().sort(byRecent); // 최근 순: 고친 날(없으면 넣은 날)이 최근인 것부터(이 창에서 기억)
    var groups = [{ name: '공통 자료', common: true, items: commons }].concat(d.depts.map(function (dp) {
      return { name: dp.name, items: rest.filter(function (i) { return i.deptId === dp.id; }) };
    }));
    groups.push({ name: '부서 없음', items: rest.filter(function (i) { return !known[i.deptId]; }) });

          ' <span class="faint">' + g.items.length + '</span>' + (g.alsoCommon ? '<span class="lib-h-note">+ 위 공통 자료 ' + g.alsoCommon + '개</span>' : '') +

  /** 넣은 지 7일 안인 자료(서버 added: 처음 넣은 날) */

  function libById(id) {
    var pools = [S.lib.data && S.lib.data.items, S.home && S.home.library, S.search && S.search.library.items];

      if (hit) return hit;

      ['부서', i.dept], ['분류', i.kind], ['학년도', i.year + '학년도' + (i.archived ? ' (보관함)' : '')], ['담당', i.owner],
      ['파일', i.hasFile ? i.fileName + ' · ' + sizeText(i.fileSize) : ''], ['링크', i.hasFile ? '' : i.link],

      '<dl class="ev-dl">' + rows.map(function (r) { return '<dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') + '</dl>' +
      (i.archived ? '<p class="hint">' + icon('info', 16) + '<span>지난 학년도 자료라 고칠 수 없어요.' + (manage ? ' 올해도 쓰려면 "지금 학년도로 꺼내기"를 눌러 주세요.' : ' 올해도 써야 하면 관리자에게 알려 주세요.') + '</span></p>'

  /**
   * 바탕화면 바로가기 파일(.url, 윈도우 인터넷 바로가기) 받기(판 2026-10-19a, 교사 결정). 웹앱 주소는 서버가 알려 주고(apiShortcutUrl_),
   * 모르면 주소창의 주소를 붙여 넣게 한다. 받은 파일을 바탕화면에 두면 두 번 눌러 기본 브라우저로 열린다(보안 경고가 뜨는지는 확인 필요)
   */
  function shortcutFile(btn) {
    busy(btn, true, '주소를 찾는 중');
    server('shortcut.url').then(function (r) { busy(btn, false); shortcutDialog(r.url || ''); }, function () { busy(btn, false); shortcutDialog(''); });
  }
  function shortcutDialog(url) {
    openModal('<h2 id="m-title">바탕화면 바로가기 파일 받기</h2>' +
      '<p class="muted" style="margin:0">받은 파일(<b>온라인 교무실.url</b>)을 바탕화면으로 옮겨 두면, 두 번 눌러 이 웹앱을 바로 열 수 있어요. 내려받은 폴더에서 바탕화면으로 끌어다 놓으면 돼요.</p>' +
      '<div class="field"><label class="label" for="sc-url">웹앱 주소</label><input class="input" id="sc-url" value="' + esc(url) + '" placeholder="https://script.google.com/…/exec" spellcheck="false" autocomplete="off"></div>' +
      '<p class="hint">' + icon('info', 16) + '<span>' + (url ? '주소창에 보이는 주소와 같은지 한 번 봐 주세요.' : '주소를 찾지 못했어요. 브라우저 주소창의 주소를 복사해 붙여 넣어 주세요.') +
      ' 파일을 열 때 윈도우가 한 번 물어보면 \'열기\'를 눌러요.</span></p>' +
      '<p class="err" id="sc-err" role="alert"></p>' +
      '<div class="modal-btns"><button type="button" class="btn" data-action="close-modal">닫기</button><button type="button" class="btn btn-primary" id="sc-go">' + icon('down', 18) + '파일 받기</button></div>');
    qs('#sc-url').addEventListener('input', function () { qs('#sc-err').textContent = ''; });
    qs('#sc-go').addEventListener('click', function () {
      var u = qs('#sc-url').value.trim(), err = qs('#sc-err');
      if (!/^https:\/\/[^\s"<>]+$/.test(u)) { err.textContent = 'https://로 시작하는 웹앱 주소를 넣어 주세요.'; qs('#sc-url').focus(); return; }
      saveBlob(new Blob(['[InternetShortcut]\r\nURL=' + u + '\r\n'], { type: 'application/octet-stream' }), '온라인 교무실.url');
      closeModal();
      toast('바로가기 파일을 받았어요. 바탕화면으로 옮겨 두세요');
    });
  }

   * 폴더에도(컴퓨터를 켤 때마다 열림) ③ 시작프로그램의 그 바로가기만 지우기. 관리자 권한·인터넷 내려받기·PowerShell·설정 바꾸기는 없다(바탕화면 위치는 읽기만)
   * - 한글: 한글 윈도우의 cmd는 CP949로 읽으므로 CP949로 담고 맨 위에서 chcp 949로 맞춘다(UTF-8로 담으면 한글이 깨질 수 있음).

   * - 주소: cmd가 특별하게 읽는 글자(빈칸 & % ^ ! ? = 따옴표 괄호 < > |)가 없는 https 주소만. 붙여 넣은 글이 명령이 되지 않게
   * - 확인 필요: 이 작업 환경에는 윈도우가 없어 실제로 돌려 보지 못함. 학교 PC의 보안 경고·백신·명령 프롬프트 막힘·메신저 첨부 막힘

  var BAT = (function () {
    var FILE = '온라인 교무실 등록.bat';
    var LINES = [
      '@echo off',
      'chcp 949 >nul',
      'title 온라인 교무실 등록',
      'rem ==============================================================',
      'rem  온라인 교무실 등록 파일 - 윈도우 PC용',
      'rem  메모장으로 열면 이 파일이 하는 일을 볼 수 있어요.',
      'rem   1번: 바탕화면에 \'온라인 교무실\' 바로가기를 만들고 지금 열어요.',
      'rem   2번: 1번과 함께, 컴퓨터를 켤 때마다 저절로 열리게 해요.',

      'rem ==============================================================',
      'setlocal',
      'set "URL={URL}"',
      'set "NAME=온라인 교무실"',
      'set "STARTUP=%APPDATA%\\Microsoft\\Windows\\Start Menu\\Programs\\Startup"',

      'set "DESK="',
      'for /f "tokens=1,2,*" %%a in (\'reg query "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\User Shell Folders" /v Desktop 2^>nul\') do if /i "%%a"=="Desktop" set "DESK=%%c"',

      'echo(',

      'echo(',
      'choice /c 123 /n /m "  번호를 누르세요 [1, 2, 3]: "',
      'set "PICK=%errorlevel%"',
      'echo(',
      'if "%PICK%"=="3" goto off',
      'if "%PICK%"=="2" goto make',
      'if "%PICK%"=="1" goto make',
      'goto done',
      '',
      ':make',
      '(',
      'echo [InternetShortcut]',
      'echo URL=%URL%',
      ')>"%DESK%\\%NAME%.url"',
      'if not exist "%DESK%\\%NAME%.url" goto failed',
      'echo   바탕화면에 \'%NAME%\' 바로가기를 만들었어요.',
      'if not "%PICK%"=="2" goto open',
      '(',
      'echo [InternetShortcut]',
      'echo URL=%URL%',
      ')>"%STARTUP%\\%NAME%.url"',
      'if exist "%STARTUP%\\%NAME%.url" echo   이제 컴퓨터를 켤 때마다 온라인 교무실이 저절로 열려요.',
      'if exist "%STARTUP%\\%NAME%.url" echo   끄려면 이 파일을 다시 열고 3을 누르세요.',
      'if not exist "%STARTUP%\\%NAME%.url" echo   저절로 열기는 켜지 못했어요. 백신이 막았을 수 있어요.',
      ':open',
      'echo   지금 온라인 교무실을 열어요.',
      'start "" "%DESK%\\%NAME%.url"',
      'goto done',
      '',
      ':off',
      'if not exist "%STARTUP%\\%NAME%.url" echo   저절로 열기가 켜져 있지 않아요.',
      'if not exist "%STARTUP%\\%NAME%.url" goto done',
      'del "%STARTUP%\\%NAME%.url" 2>nul',
      'if exist "%STARTUP%\\%NAME%.url" echo   저절로 열기를 끄지 못했어요.',
      'if not exist "%STARTUP%\\%NAME%.url" echo   저절로 열기를 껐어요. 바탕화면 바로가기는 그대로 있어요.',
      'goto done',
      '',
      ':failed',
      'echo   바탕화면에 바로가기를 만들지 못했어요. 백신이 막았을 수 있어요.',
      'echo   온라인 교무실 운영 안내서의 \'바로가기 파일 받기\'를 써 주세요.',
      'goto done',
      '',
      ':badurl',
      'echo   웹앱 주소가 비었거나 맞지 않아요.',
      'echo   이 파일을 메모장으로 열어 URL= 뒤의 주소를 확인해 주세요.',
      '',
      ':done',
      'echo(',
      'echo   아무 키나 누르면 이 창이 닫혀요.',
      'pause >nul',
      'endlocal'
    ];
    var map = null;
    function urlOk(u) {
      return typeof u === 'string' && u.length <= 400 && /^https:\/\/[A-Za-z0-9.-]+(\/[A-Za-z0-9._~\/-]*)?$/.test(u);
    }
    function text(u) { return LINES.join('\r\n').split('{URL}').join(u) + '\r\n'; }
    // CP949 표(글자 → 두 바이트): 앞 바이트 81~FE × 뒤 바이트 41~FE를 한 번에 풀고(사이마다 줄바꿈) 한 글자로 풀린 것만 담는다
    function cpMap() {
      if (map) return map;
      var buf = new Uint8Array(126 * 190 * 3), keys = [], k = 0;
      for (var a = 0x81; a <= 0xFE; a++) for (var b = 0x41; b <= 0xFE; b++) { buf[k++] = a; buf[k++] = b; buf[k++] = 10; keys.push(a * 256 + b); }
      var parts = new TextDecoder('euc-kr').decode(buf).split('\n'), m = Object.create(null);
      for (var i = 0; i < keys.length; i++) { var c = parts[i]; if (c && c.length === 1 && c !== '�' && !(c in m)) m[c] = keys[i]; }

      for (var i = 0; i < s.length; i++) {

      return new Uint8Array(out);

      if (!urlOk(u)) throw new Error('주소');
      return cp949(text(u));
    }
    // 메신저로 파일과 함께 보낼 안내 글
    function guide(u) {
      return ['[온라인 교무실 바로가기 등록 안내]',
        '첨부한 \'' + FILE + '\' 파일을 윈도우 PC에서 두 번 누르고 번호를 골라 주세요.',
        '1번: 바탕화면에 바로가기 만들기',
        '2번: 1번 + 컴퓨터를 켤 때마다 저절로 열기',
        '3번: 저절로 열기 끄기(2번을 고른 뒤 끄고 싶을 때 파일을 다시 열어 3번)',
        '· 바로가기를 만들고 지우는 일만 해요. 메모장으로 열면 하는 일이 적혀 있어요.',
        '· 윈도우가 실행할지 물으면 \'실행\'을 눌러 주세요. 백신이 막거나 열리지 않으면 억지로 열지 마시고, 아래 주소로 들어가 운영 안내서 › 들어오기의 \'바로가기 파일 받기\'를 써 주세요.',
        '· 보낸 사람을 모르는 실행 파일(.bat·.exe)은 열지 마세요.',

  function batFile(btn) {
    busy(btn, true, '주소를 찾는 중');
    server('shortcut.url').then(function (r) { busy(btn, false); batDialog(r.url || ''); }, function () { busy(btn, false); batDialog(''); });
  }
  // 받은 뒤에도 창을 닫지 않는다: 먼저 이 PC에서 열어 보고 '안내 글 복사'와 함께 메신저로 보내게
  function batDialog(url) {
    openModal('<h2 id="m-title">자동 등록 파일 받기</h2>' +
      '<p class="muted" style="margin:0">받은 파일(<b>' + esc(BAT.FILE) + '</b>)을 윈도우 PC에서 두 번 누르면 번호를 골라요.<br>' +
      '① 바탕화면에 바로가기 만들기<br>② ①과 함께, 컴퓨터를 켤 때마다 저절로 열기<br>③ 저절로 열기 끄기</p>' +
      '<div class="field"><label class="label" for="bat-url">웹앱 주소</label><input class="input" id="bat-url" value="' + esc(url) + '" placeholder="https://script.google.com/…/exec" spellcheck="false" autocomplete="off"></div>' +
      '<p class="hint">' + icon('info', 16) + '<span>' + (url ? '주소가 맞는지 한 번 봐 주세요. ' : '주소를 찾지 못했어요. 배포 관리의 웹 앱 주소나 주소창의 주소를 붙여 넣어 주세요. ') +
      '먼저 이 PC에서 열어 보고, 잘 되면 <b>안내 글 복사</b>와 함께 메신저로 보내요. 실행 파일이라 브라우저·윈도우가 한 번 더 묻거나 학교 백신이 막을 수 있어요. 막히면 \'바로가기 파일 받기\'를 써 주세요.</span></p>' +
      '<p class="err" id="bat-err" role="alert"></p>' +
      '<div class="modal-btns"><button type="button" class="btn" data-action="close-modal">닫기</button>' +
      '<button type="button" class="btn" id="bat-copy">' + icon('copy', 18) + '안내 글 복사</button>' +
      '<button type="button" class="btn btn-primary" id="bat-go">' + icon('down', 18) + '파일 받기</button></div>');
    var inp = qs('#bat-url'), err = qs('#bat-err');
    inp.addEventListener('input', function () { err.textContent = ''; });
    var good = function () {
      var u = inp.value.trim();
      if (!/^https:\/\//.test(u)) { err.textContent = 'https://로 시작하는 웹앱 주소를 넣어 주세요.'; inp.focus(); return ''; }
      if (!BAT.urlOk(u)) { err.textContent = '주소에 넣을 수 없는 글자(빈칸·&·%·?·괄호 등)가 있어요. 배포 관리의 웹 앱 주소를 그대로 넣어 주세요.'; inp.focus(); return ''; }
      return u;
    };
    qs('#bat-go').addEventListener('click', function () {
      var u = good(), b;
      if (!u) return;
      try { b = BAT.bytes(u); } catch (e) { err.textContent = '이 브라우저에서는 파일을 만들 수 없어요. 크롬이나 엣지에서 받아 주세요.'; return; }
      saveBlob(new Blob([b], { type: 'application/octet-stream' }), BAT.FILE);
      toast('자동 등록 파일을 받았어요. 먼저 이 PC에서 열어 보세요');
    });
    qs('#bat-copy').addEventListener('click', function () {
      var u = good();
      if (!u) return;
      copyText(BAT.guide(u)).then(function (ok) { toast(ok ? '안내 글을 복사했어요. 메신저에 붙여 넣고 파일을 함께 보내요' : '복사하지 못했어요', ok ? '' : 'error'); });
    });
  }

  // ------------------------------------------------------------ 운영 안내서 › 선생님용 1쪽 인쇄
  // 인쇄 직전에 '모든 선생님' 부분(#guide-teacher)의 인쇄 모양 사본을 화면 밖에서 재서, A4 한 장보다 길면 그만큼 줄인다(월별 계획 인쇄와 같은 방법)
  function guideTeacherStart() {
    guideTeacherEnd();
    var part = qs('#guide-teacher');
    if (!part) return false;
    var box = document.createElement('div'), copy = part.cloneNode(true);
    box.className = 'guide-measure';
    box.setAttribute('aria-hidden', 'true');
    copy.removeAttribute('id');
    copy.classList.add('guide-fit');
    box.appendChild(copy);
    document.body.appendChild(box);
    var h = copy.getBoundingClientRect().height;
    document.body.removeChild(box);
    root.style.setProperty('--guide-zoom', h > PLAN_PAGE_H ? (Math.floor(PLAN_PAGE_H / h * 1000) / 1000).toString() : '1');
    part.classList.add('guide-fit');
    document.body.classList.add('print-guide-teacher');
    var st = document.createElement('style');
    st.id = 'guide-page';
    st.textContent = '@page{size:A4 portrait;margin:10mm}';
    document.head.appendChild(st);
    return true;
  }
  function guideTeacherEnd() {
    document.body.classList.remove('print-guide-teacher');
    qsa('.guide-part.guide-fit').forEach(function (c) { c.classList.remove('guide-fit'); });
    var st = qs('#guide-page');
    if (st) st.parentNode.removeChild(st);
  }

  // ============================================================ 홈 검색
  var searchTimer = null, searchSeq = 0;

  function homeSearchBox() {
    return '<form class="search home-search print-hide" id="home-search" role="search"><label for="home-q" class="sr-only">일정·자료·선생님 검색</label>' +
      icon('search', 20) + '<input id="home-q" type="search" placeholder="일정·자료·선생님 찾기" value="' + esc(S.homeQ || '') + '" autocomplete="off"></form>';
  }

  function bindHomeSearch() {
    var form = qs('#home-search'), inp = qs('#home-q');
    if (!form) return;
    form.addEventListener('submit', function (e) { e.preventDefault(); clearTimeout(searchTimer); runSearch(inp.value); });
    inp.addEventListener('input', function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { runSearch(inp.value); }, 400);
    });
  }

  function runSearch(q) {
    q = String(q || '').trim();
    if (q === (S.homeQ || '') && (S.search || !q)) return;
    S.homeQ = q;
    var body = qs('#home-body');
    if (!body) return;
    var seq = ++searchSeq;
    if (!q) { S.search = null; if (S.home) drawHome(); else SCREENS.home(qs('#screen')); return; }
    body.innerHTML = loadingHtml('찾는 중이에요');
    server('search', { q: q }).then(function (r) {
      if (seq !== searchSeq) return;
      S.search = r;
      drawSearch();
    }).catch(function (e) { if (seq === searchSeq) body.innerHTML = failHtml(e); });
  }

      '<span class="sr-main"><span class="sr-t">' + title + '</span>' + (sub ? '<span class="sr-sub">' + esc(sub) + '</span>' : '') + '</span>' +
      (right ? '<span class="sr-right">' + esc(right) + '</span>' : '') + icon('chev', 18, ' class="sr-chev"') + '</button>';
  }

    if (!table) return null;
    var taken = {}; // 위 줄에서 아래로 합친 칸(rowspan)이 차지한 자리 → 그 칸의 값(아래 줄에도 같은 값을 채워 칸이 왼쪽으로 밀리지 않게)
    return Array.prototype.map.call(table.querySelectorAll('tr'), function (tr, i) {
      var line = [], j = 0;
      var skip = function () { while (taken[i + ':' + j] !== undefined) { line.push(taken[i + ':' + j]); j++; } };
      Array.prototype.forEach.call(tr.children, function (td) {
        skip();
        var v = (td.innerText || td.textContent || '').replace(/\s+/g, ' ').trim();

        }
        j += cs;
      });
      skip();
      return line;
    });
  }

  function meetTermOf(date, sem2) {
    var y = Number(date.slice(0, 4)), mo = Number(date.slice(5, 7)), sy = mo >= 3 ? y : y - 1, s2 = (sem2 || {})[sy];

  function meetMeta(m) { return [m.date ? mdw(m.date) : '', m.time, m.place].filter(Boolean).join(' · '); }
  /** 인쇄·워드 파일용: 날짜에 연도까지(남겨 두는 문서라서) */
  function meetMetaFull(m) { return [m.date ? Number(m.date.slice(0, 4)) + '년 ' + mdw(m.date) : '', m.time, m.place].filter(Boolean).join(' · '); }
  /** 종류 칩: 첫 종류(부장회의)는 포인트 색, 나머지는 보통 */
  function meetChip(m, kinds) {
    var first = kinds && kinds[0] && kinds[0].id === m.kindId;
    return '<span class="chip' + (first ? ' chip-accent' : '') + '">' + esc(m.kind || '회의') + '</span>';
  }

  function drawMeetList() {
    var M = S.meet, d = M.data, body = qs('#meet-body');
    if (!body || !d) return;
    M.view = 'list';
    var nb = qs('.page-head [data-action=meet-new]');
    if (nb) nb.hidden = false;
    if (M.term && !d.terms.some(function (t) { return t.key === M.term; })) M.term = '';
    var kinds = d.kinds.filter(function (k) { return k.active || d.items.some(function (m) { return m.kindId === k.id; }); });
    var list = d.items.filter(function (m) { return (!M.term || m.term === M.term) && (!M.kind || m.kindId === M.kind); });
    body.innerHTML = '<div class="toolbar print-hide meet-tools">' +
      '<select class="input input-sm" id="meet-term" aria-label="학기로 거르기"><option value="">모든 학기</option>' + d.terms.map(function (t) {
        return '<option value="' + esc(t.key) + '"' + (t.key === M.term ? ' selected' : '') + '>' + esc(t.label) + '</option>';
      }).join('') + '</select>' +
      '<div class="seg" role="group" aria-label="회의 종류">' + [{ id: '', name: '모두' }].concat(kinds).map(function (k) {
        return '<button type="button" data-action="meet-kind" data-id="' + esc(k.id) + '" aria-pressed="' + (M.kind === k.id) + '">' + esc(k.name) + '</button>';
      }).join('') + '</div></div>' +
      (list.length ? '<div class="meet-list">' + list.map(function (m) {
        return '<button type="button" class="card meet-card" data-action="meet-open" data-id="' + esc(m.id) + '">' +
          '<span class="sv-chips">' + meetChip(m, d.kinds) + '</span><span class="meet-title">' + esc(m.title) + '</span>' +
          '<span class="meet-meta">' + esc(meetMeta(m)) + '</span>' +
          '<span class="meet-fill">' + m.filled + ' / ' + m.total + '칸 씀' + (m.etc ? ' · 기타 안건 ' + m.etc + '개' : '') + '</span></button>';
      }).join('') + '</div>'
        : '<div class="card"><p class="empty">' + (d.items.length ? '이 학기·종류의 회의록이 없어요.' : '아직 회의록이 없어요. "회의 만들기"로 첫 회의록을 만들어 보세요.') + '</p></div>') +
      '<p class="hint">' + icon('info', 16) + '<span>회의록의 칸은 이름을 고른 선생님 누구나 쓸 수 있어요. 칸마다 마지막에 쓴 분이 남아요.</span></p>';
    qs('#meet-term').addEventListener('change', function (e) { M.term = e.target.value; drawMeetList(); });
  }

  function openMeet(id) {
    var M = S.meet, body = qs('#meet-body');
    M.openId = id;
    M.view = 'detail';
    if (body && !(M.detail && M.detail.meeting.id === id)) body.innerHTML = loadingHtml('회의록을 불러오는 중이에요');
    loadMemo('meet.get', { id: id }, function (d) {
      if (S.screen !== 'notice' || S.notice.tab !== 'meet' || M.openId !== id) return;
      M.detail = d;
      drawMeet();
    }, function (e) {
      var b = qs('#meet-body');
      if (b) b.innerHTML = '<div class="meet-bar print-hide"><button type="button" class="btn btn-sm" data-action="meet-back">' + icon('chevl', 18) + '회의 목록</button></div>' + failHtml(e);
    });
  }

  function drawMeet() {
    var M = S.meet, d = M.detail, body = qs('#meet-body');
    if (!body || !d) return;
    var m = d.meeting, can = d.canWrite, kinds = (M.data && M.data.kinds) || d.kinds;
    var nb = qs('.page-head [data-action=meet-new]');
    if (nb) nb.hidden = true; // 회의 하나를 보는 동안에는 '회의 만들기'를 숨긴다(목록으로 돌아가면 다시)
    var myDept = S.me && S.me.deptId, myRow = myDept ? m.rows.filter(function (r) { return r.k === myDept; })[0] : null;
    var flash = M.flash || {};
    M.flash = null;
    var foot = function (by, at, btns) {
      return '<div class="meet-foot">' + (by ? '<span class="meet-by">' + esc(by) + (at ? ' · ' + esc(atText(at)) : '') + '</span>' : '<span></span>') +
        (btns ? '<span class="row-btns print-hide">' + btns + '</span>' : '') + '</div>';
    };
    var rows = m.rows.map(function (r) {
      var has = !!String(r.content).trim(), mine = !!(myRow && r.k === myRow.k);
      var btn = can ? '<button type="button" class="btn btn-sm" data-action="meet-write" data-k="' + esc(r.k) + '">' + (has ? '고치기' : '쓰기') + '</button>' : '';
      return '<div class="meet-row' + (has ? '' : ' blank') + (r.top ? ' top' : '') + (mine ? ' mine' : '') + (flash[r.k] ? ' flash' : '') + '" role="row" data-k="' + esc(r.k) + '">' + // 'empty'는 빈 화면 글 모양과 겹쳐서 blank
        '<div class="meet-name" role="rowheader">' + esc(r.name) + (mine ? '<span class="tg-mine">내 부서</span>' : '') + '</div><div class="meet-cell" role="cell">' +
        (has ? '<div class="meet-text">' + esc(r.content) + '</div>' + foot(r.by, r.at, btn)
          : '<div class="meet-foot meet-blank-line"><p class="meet-none">아직 안 썼어요</p>' + (btn ? '<span class="row-btns print-hide">' + btn + '</span>' : '') + '</div>') + '</div></div>';
    }).join('');
    var etc = m.etcItems.map(function (x, i) {
      return '<div class="meet-etc' + (flash['e:' + x.id] ? ' flash' : '') + '"><div class="meet-text">' + (m.etcItems.length > 1 ? '<b>' + (i + 1) + '.</b> ' : '') + esc(x.content) + '</div>' +
        foot(x.by, x.at, (x.canDelete ? '<button type="button" class="btn btn-sm btn-ghost-danger" data-action="meet-etc-del" data-id="' + esc(x.id) + '">빼기</button>' : '') +
          (can ? '<button type="button" class="btn btn-sm" data-action="meet-etc-edit" data-id="' + esc(x.id) + '">고치기</button>' : '')) + '</div>';
    }).join('');
    var myBlank = can && myRow && !String(myRow.content).trim();
    body.innerHTML = '<div class="meet-bar print-hide"><span class="row-btns"><button type="button" class="btn btn-sm" data-action="meet-back">' + icon('chevl', 18) + '회의 목록</button>' +
      (myBlank ? '<button type="button" class="btn btn-sm btn-primary" data-action="meet-write" data-k="' + esc(myRow.k) + '">' + icon('send', 18) + esc(myRow.name) + ' 칸 쓰기</button>' : '') + '</span>' +
      '<span class="row-btns">' + (m.canEdit ? '<button type="button" class="btn btn-sm btn-ghost-danger" data-action="meet-del">지우기</button>' +
        '<button type="button" class="btn btn-sm" data-action="meet-edit">회의 고치기</button>' : '') +
      '<button type="button" class="btn btn-sm" data-action="meet-copy" data-v="ask">' + icon('copy', 16) + '안내 문구 복사</button>' +
      '<button type="button" class="btn btn-sm" data-action="meet-copy" data-v="text">' + icon('copy', 16) + '내용 글로 복사</button>' +
      '<button type="button" class="btn btn-sm" data-action="meet-print">' + icon('print', 18) + '인쇄</button>' +
      '<button type="button" class="btn btn-sm" data-action="meet-docx">' + icon('down', 18) + '워드로 내려받기</button></span></div>' +
      '<article class="card meet-doc"><div class="sv-chips">' + meetChip(m, kinds) + (m.schedId ? '<span class="chip">일정에 있음</span>' : '') + '</div>' +
      '<h2 class="meet-h">' + esc(m.title) + '</h2><p class="meet-sub">' + esc(meetMeta(m)) + '</p>' +
      '<div class="meet-table" role="table" aria-label="' + esc(m.title) + '">' +
      '<div class="meet-row head" role="row"><div class="meet-name" role="columnheader">구분</div><div class="meet-cell" role="columnheader">내용</div></div>' + rows +
      '<div class="meet-row etc" role="row"><div class="meet-name" role="rowheader">기타 안건</div><div class="meet-cell" role="cell">' +
      (etc || '<p class="meet-none">아직 없어요</p>') +
      (can ? '<div class="print-hide"><button type="button" class="btn btn-sm" data-action="meet-etc-add">' + icon('plus', 18) + '안건 추가</button></div>' : '') + '</div></div></div>' +
      (can ? '' : '<p class="hint print-hide">' + icon('info', 16) + '<span>이름을 고르면 칸을 쓸 수 있어요.</span></p>') +
      '<p class="hint print-hide">' + icon('info', 16) + '<span>다른 선생님이 쓴 칸은 30초 안에 저절로 보여요.</span></p></article>';
    if (M.autoWrite) { // 홈 '내가 할 일'의 '쓰기'로 왔으면 그 칸 쓰기 창을 바로 연다
      var ak = M.autoWrite;
      M.autoWrite = '';
      if (can && m.rows.some(function (r) { return r.k === ak; })) openMeetWrite('row', ak);
    }
  }

  /** 회의 하나를 보는 동안 30초마다(창이 다시 보일 때도) 뒤에서 새로 받아, 바뀐 칸만 잠깐 밝혀 다시 그린다(TV에 띄워 둔 회의록, 2026-10-28a). 창이 열려 있거나 입력 중이면 다음 번에 */
  function meetPoll() {
    var M = S.meet;
    if (document.hidden || S.screen !== 'notice' || S.notice.tab !== 'meet' || M.view !== 'detail' || !M.detail || M.polling) return;
    if ($modal.innerHTML || editingNow()) return;
    var id = M.detail.meeting.id;
    M.polling = true;
    server('meet.get', { id: id }, null, true).then(function (d) {
      M.polling = false;
      if (S.screen !== 'notice' || S.notice.tab !== 'meet' || M.view !== 'detail' || M.openId !== id || !M.detail || $modal.innerHTML || editingNow()) return;
      var a = M.detail.meeting, b = d.meeting;
      if (JSON.stringify(a) === JSON.stringify(b)) return;
      var old = {}, flash = {};
      a.rows.forEach(function (r) { old[r.k] = r.ver + '|' + r.content; });
      a.etcItems.forEach(function (x) { old['e:' + x.id] = x.ver + '|' + x.content; });
      b.rows.forEach(function (r) { if (old[r.k] !== r.ver + '|' + r.content) flash[r.k] = 1; });
      b.etcItems.forEach(function (x) { if (old['e:' + x.id] !== x.ver + '|' + x.content) flash['e:' + x.id] = 1; });
      memoPut('meet.get', { id: id }, d);
      M.detail = d;
      M.flash = flash;
      var y = window.scrollY;
      drawMeet();
      window.scrollTo(0, y);
    }, function () { M.polling = false; });
  }
  setInterval(meetPoll, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) meetPoll(); });

  /** 메신저로 보낼 글: 'ask' 회의 전 안내(칸을 미리 써 달라는 말) / 'text' 회의 내용(빈 칸은 빼고 '부서: 내용') */
  function meetCopy(kind) {
    var m = S.meet.detail && S.meet.detail.meeting;
    if (!m) return;
    var head = '[' + m.title + '] ' + meetMetaFull(m);
    var text = kind === 'ask'
      ? head + '\n온라인 교무실 › 공지·회의록 › 회의록에서 부서 칸에 전달할 내용을 회의 전까지 적어 주세요.' +
        (m.rows.some(function (r) { return !String(r.content).trim(); }) ? '\n아직 안 쓴 칸: ' + m.rows.filter(function (r) { return !String(r.content).trim(); }).map(function (r) { return r.name; }).join(', ') : '')
      : head + '\n' + m.rows.filter(function (r) { return String(r.content).trim(); }).map(function (r) { return '■ ' + r.name + '\n' + String(r.content).trim(); }).join('\n') +
        (m.etcItems.length ? '\n■ 기타 안건\n' + m.etcItems.map(function (x, i) { return (m.etcItems.length > 1 ? (i + 1) + '. ' : '') + String(x.content).trim(); }).join('\n') : '');
    copyText(text).then(function (ok) {
      if (ok) toast(kind === 'ask' ? '안내 문구를 복사했어요. 메신저에 붙여 넣어 주세요' : '회의 내용을 복사했어요. 메신저에 붙여 넣어 주세요');
      else toast('복사하지 못했어요. 다시 해 주세요', 'err');
    });
  }

  /** 저장한 뒤 회의 다시 그리기(같은 요청으로 받아 둔 회의를 바로 쓴다) */
  function refreshMeet(id) {
    if (S.screen !== 'notice' || S.notice.tab !== 'meet') return;
    openMeet(id);
  }

  /** 칸 쓰기·기타 안건 더하기·고치기 창. kind: 'row' | 'etc-add' | 'etc-edit' */
  function openMeetWrite(kind, key) {
    if (!needMe('회의록을 쓰면')) return;
    var d = S.meet.detail;
    if (!d) return;
    var m = d.meeting, title, value = '', base = 0, force = false;
    if (kind === 'row') {
      var row = m.rows.filter(function (r) { return r.k === key; })[0];
      if (!row) return;
      title = row.name + ' 칸 ' + (String(row.content).trim() ? '고치기' : '쓰기');
      value = row.content; base = row.ver;
    } else if (kind === 'etc-edit') {
      var it = m.etcItems.filter(function (x) { return x.id === key; })[0];
      if (!it) return;
      title = '기타 안건 고치기'; value = it.content; base = it.ver;
    } else title = '기타 안건 더하기';
    openModal('<h2 id="m-title">' + esc(title) + '</h2><p class="faint" style="margin:0">' + esc(m.title) + '</p>' +
      '<form class="form" id="mw-form" novalidate><div class="field"><label class="label" for="mw-text">' + (kind === 'row' ? '내용' : '안건') + '</label>' +
      '<textarea id="mw-text" class="input meet-ta" rows="9" maxlength="5000" placeholder="' + (kind === 'row' ? '줄을 바꿔 여러 줄로 써요. 전할 것이 없으면 \'전달 사항 없음\'' : '협의할 안건을 적어 주세요') + '">' + esc(value) + '</textarea></div>' +
      '<div id="mw-conflict"></div><p class="err" id="mw-err" role="alert"></p>' +
      '<div class="modal-btns"><button type="button" class="btn" data-action="close-modal">닫기</button><button type="submit" class="btn btn-primary" id="mw-go">저장</button></div></form>',
      { noBackdropClose: true });
    var ta = qs('#mw-text');
    setTimeout(function () { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 40);
    var send = function () {
      var text = ta.value, btn = qs('#mw-go'), err = qs('#mw-err');
      err.textContent = '';
      if (kind !== 'row' && !text.trim()) { err.textContent = '안건을 적어 주세요.'; ta.focus(); return; }
      busy(btn, true, '저장하는 중');
      var req = kind === 'row' ? ['meet.row', { id: m.id, k: key, content: text, base: base, force: force }]
        : kind === 'etc-edit' ? ['meet.etc.save', { eid: key, content: text, base: base, force: force }]
          : ['meet.etc.add', { id: m.id, content: text }];
      server(req[0], req[1], [['meet.get', { id: m.id }]]).then(function (r) {
        if (r && r.conflict) { // 그사이 다른 분이 고쳤다 → 먼저 고친 내용을 보여 주고 고르게 한다(쓰던 글은 그대로)
          busy(btn, false);
          var c = r.conflict;
          base = c.ver;
          qs('#mw-conflict').innerHTML = '<div class="meet-conflict" role="alert"><p><b>' + esc(c.by || '다른 분') + '</b> 선생님이 그사이 먼저 고쳤어요' + (c.at ? ' (' + esc(atText(c.at)) + ')' : '') + '. 먼저 고친 내용이에요.</p>' +
            '<div class="meet-text meet-theirs">' + (String(c.content).trim() ? esc(c.content) : '(비어 있음)') + '</div>' +
            '<div class="row-btns"><button type="button" class="btn btn-sm" id="mw-keep">먼저 고친 내용 두기</button>' +
            (String(c.content).trim() && ta.value.trim() ? '<button type="button" class="btn btn-sm" id="mw-both">둘 다 남기기</button>' : '') +
            '<button type="button" class="btn btn-sm btn-primary" id="mw-mine">내 내용으로 바꾸기</button></div></div>';
          qs('#mw-keep').addEventListener('click', function () { closeModal(); toast('먼저 고친 내용을 두었어요'); refreshMeet(m.id); });
          qs('#mw-mine').addEventListener('click', function () { force = true; send(); });
          // 둘 다 남기기: 먼저 고친 내용 아래에 내 글을 붙여 저장(같은 부서 두 분이 각자 쓴 경우)
          if (qs('#mw-both')) qs('#mw-both').addEventListener('click', function () { ta.value = String(c.content).replace(/\s+$/, '') + '\n' + ta.value.replace(/^\s+/, ''); force = true; send(); });
          return;
        }
        closeModal();
        toast(kind === 'etc-add' ? '안건을 더했어요' : '저장했어요');
        refreshMeet(m.id);
      }).catch(function (e) { busy(btn, false); err.textContent = e.message; });
    };
    qs('#mw-form').addEventListener('submit', function (ev) { ev.preventDefault(); force = false; send(); });
  }

  /** 회의 만들기·고치기 창 */
  function openMeetForm(edit) {
    if (!needMe('회의를 만들면')) return;
    var list = S.meet.data || {}, src = edit ? S.meet.detail : list;
    if (!src || !src.kinds) return;
    var m = edit || {};
    var kinds = src.kinds.filter(function (k) { return k.active || (edit && k.id === m.kindId); });
    // 칸 후보: 고칠 때는 이 회의의 칸(내용이 있으면 뺄 수 없음) + 지금 기본 칸 중 없는 것
    var rows;
    if (edit) {
      rows = m.rows.map(function (r) { return { k: r.k, n: r.name, t: r.top, on: true, locked: !!String(r.content).trim() }; });
      // 회의에 없는 기본 칸은 기본 차례의 바로 앞 칸 뒤에 끼워 넣는다(맨 위 칸은 맨 위 근처, 부서는 부서 사이)
      var at = -1;
      (src.rowsDefault || []).forEach(function (x) {
        var idx = -1;
        rows.forEach(function (r, i) { if (x.t ? r.t && r.n === x.n : r.k === x.k) idx = i; });
        if (idx >= 0) { at = idx; return; }
        rows.splice(at + 1, 0, { k: x.k, n: x.n, t: !!x.t, on: false });
        at++;
      });
    } else rows = (src.rowsDefault || []).map(function (x) { return { k: x.k, n: x.n, t: !!x.t, on: true }; }); // 맨 위 칸 → 부서 차례(서버가 정함)
    var pickHtml = function () {
      return rows.map(function (r, i) {
        return '<label class="check' + (r.locked ? ' locked' : '') + '"><input type="checkbox" data-mi="' + i + '"' + (r.on ? ' checked' : '') + (r.locked ? ' disabled' : '') + '>' +
          esc(r.n) + (r.locked ? ' <span class="faint">(내용 있음)</span>' : '') + '</label>';
      }).join('');
    };
    openModal('<h2 id="m-title">' + (edit ? '회의 고치기' : '회의 만들기') + '</h2><form class="form" id="mt-form" novalidate>' +
      '<div class="form-grid"><div class="field"><label class="label" for="mt-kind">회의 종류</label><select id="mt-kind" class="input">' + kinds.map(function (k) {
        return '<option value="' + esc(k.id) + '"' + (k.id === m.kindId ? ' selected' : '') + '>' + esc(k.name) + '</option>';
      }).join('') + '</select></div>' +
      '<div class="field"><label class="label" for="mt-date">날짜 <span class="req">*</span></label><input id="mt-date" class="input" type="date" value="' + esc(m.date || localToday()) + '"></div></div>' +
      '<div class="form-grid"><div class="field"><label class="label" for="mt-time">시간</label><input id="mt-time" class="input" type="time" value="' + esc(edit ? m.time || '' : '15:00') + '"></div>' +
      '<div class="field"><label class="label" for="mt-place">장소</label><input id="mt-place" class="input" maxlength="40" value="' + esc(m.place || '') + '" placeholder="예: 교무실" autocomplete="off"></div></div>' +
      '<div class="field"><label class="label" for="mt-title">제목 <span class="req">*</span></label><input id="mt-title" class="input" maxlength="60" value="' + esc(m.title || '') + '" autocomplete="off"></div>' +
      '<fieldset class="field meet-pick-box"><legend class="label">회의록에 넣을 칸</legend><div class="meet-pick" id="mt-pick">' + pickHtml() + '</div>' +
      '<div class="meet-addrow"><input id="mt-newrow" class="input input-sm" maxlength="20" placeholder="칸 추가: 예) 1학년, 특별 안건" autocomplete="off" aria-label="추가할 칸 이름">' +
      '<button type="button" class="btn btn-sm" id="mt-addrow">' + icon('plus', 16) + '칸 추가</button></div>' +
      '<p class="hint">' + icon('info', 16) + '<span>맨 위 칸은 관리자 › 설정, 부서 칸은 관리자 › 분류에서 정해요. 이 회의에만 필요한 칸(학년협의회의 1~6학년 등)은 위에서 추가해요. 회의를 만든 뒤 부서 이름이 바뀌어도 이 회의록은 그대로예요.</span></p></fieldset>' +
      (edit && m.schedId ? '<p class="hint">' + icon('calendar', 16) + '<span>일정과 이어진 회의예요. 날짜·시간·장소·제목을 고치면 일정도 함께 바뀌어요.</span></p>'
        : '<label class="check"><input type="checkbox" id="mt-sched"' + (edit ? '' : ' checked') + '>일정에도 넣기 <span class="faint">(달력·홈에 \'회의\'로 보이고, 회의를 고치면 함께 바뀌어요)</span></label>') +
      '<p class="err" id="mt-err" role="alert"></p>' +
      '<div class="modal-btns"><button type="button" class="btn" data-action="close-modal">닫기</button><button type="submit" class="btn btn-primary">' + (edit ? '저장' : '만들기') + '</button></div></form>',
      { noBackdropClose: true });
    // 제목은 손으로 고치기 전까지 저절로: '2026학년도 2학기 부장회의 (5)'
    var touched = !!edit;
    var suggest = function () {
      if (touched) return;
      var k = kinds.filter(function (x) { return x.id === qs('#mt-kind').value; })[0], date = qs('#mt-date').value;
      if (!k || !/^\d{4}-\d\d-\d\d$/.test(date)) return;
      var t = meetTermOf(date, list.sem2);
      var n = (list.items || []).filter(function (x) { return x.kindId === k.id && x.term === t.key; }).length + 1;
      qs('#mt-title').value = t.label + ' ' + k.name + ' (' + n + ')';
    };
    qs('#mt-title').addEventListener('input', function () { touched = true; });
    // 이 회의에만 쓸 칸 추가(맨 위 칸처럼 이름만 있는 칸, 서버가 k를 정한다)
    var addRow = function () {
      var inp = qs('#mt-newrow'), n = inp.value.trim(), err = qs('#mt-err');
      err.textContent = '';
      if (!n) { inp.focus(); return; }
      if (rows.some(function (r) { return r.n === n; })) { err.textContent = '"' + n + '" 칸이 이미 있어요.'; return; }
      qsa('#mt-pick input[data-mi]').forEach(function (c) { rows[Number(c.getAttribute('data-mi'))].on = c.checked; }); // 고른 것 그대로
      rows.push({ k: '', n: n, t: true, on: true });
      qs('#mt-pick').innerHTML = pickHtml();
      inp.value = '';
      inp.focus();
    };
    qs('#mt-addrow').addEventListener('click', addRow);
    qs('#mt-newrow').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addRow(); } });
    qs('#mt-kind').addEventListener('change', suggest);
    qs('#mt-date').addEventListener('change', suggest);
    suggest();
    qs('#mt-form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var err = qs('#mt-err'), btn = ev.target.querySelector('[type=submit]');
      var pick = rows.filter(function (r, i) { return r.locked || qs('[data-mi="' + i + '"]').checked; }).map(function (r) { return { k: r.k, n: r.n, t: r.t ? 1 : 0 }; });
      var req = { id: edit ? m.id : '', kindId: qs('#mt-kind').value, title: qs('#mt-title').value.trim(), date: qs('#mt-date').value, time: qs('#mt-time').value, place: qs('#mt-place').value.trim(), rows: pick,
        addSched: !!(qs('#mt-sched') && qs('#mt-sched').checked) };
      if (!req.title) { err.textContent = '제목을 적어 주세요.'; qs('#mt-title').focus(); return; }
      if (!req.date) { err.textContent = '날짜를 골라 주세요.'; qs('#mt-date').focus(); return; }
      if (!pick.length) { err.textContent = '칸을 하나 이상 골라 주세요.'; return; }
      busy(btn, true, '저장하는 중');
      server('meet.save', req, [['meet.list', {}]]).then(function (r) {
        closeModal();
        toast((edit ? '회의를 고쳤어요' : '회의를 만들었어요') + (r.sched ? (edit ? ' · 일정도 함께 바꿨어요' : ' · 일정에도 넣었어요') : ''));
        if (r.sched) { memoForget('sched.'); memoForget('home'); memoForget('search'); } // 이어진 일정이 바뀌었으니 달력·홈은 다시 받는다
        S.meet.data = memoGet('meet.list', {}) ? memoGet('meet.list', {}).data : S.meet.data;
        S.meet.detail = null;
        if (S.screen === 'notice' && S.notice.tab === 'meet') openMeet(r.id);
      }).catch(function (e) { busy(btn, false); err.textContent = e.message; });
    });
  }

  /** 회의록 인쇄: A4 세로, 쓴 분 이름은 넣지 않는다 */

  /** 회의록 워드 파일(.docx): 바깥 도구 없이 브라우저에서 만든다(엑셀 양식과 같은 zip). A4 세로, 맑은 고딕, '부서 | 내용' 표(머리 줄은 쪽마다) */
  function meetDocx(m) {
    var W = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';
    var clean = function (s) { return xmlEsc(String(s || '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')); };
    var run = function (text, o) {
      return '<w:r><w:rPr>' + (o.b ? '<w:b/>' : '') + (o.color ? '<w:color w:val="' + o.color + '"/>' : '') + (o.sz ? '<w:sz w:val="' + o.sz + '"/><w:szCs w:val="' + o.sz + '"/>' : '') +
        '</w:rPr><w:t xml:space="preserve">' + clean(text) + '</w:t></w:r>';
    };
    var para = function (text, o) {
      o = o || {};
      return '<w:p><w:pPr>' + (o.after !== undefined ? '<w:spacing w:after="' + o.after + '"/>' : '') + (o.jc ? '<w:jc w:val="' + o.jc + '"/>' : '') + '</w:pPr>' + (text ? run(text, o) : '') + '</w:p>';
    };
    var lines = function (text) { return String(text || '').split('\n').map(function (l) { return para(l); }).join(''); };
    var W1 = 2200, W2 = 7438; // A4 폭 11906 - 여백 1134×2 = 9638
    var cell = function (w, inner, fill) {
      return '<w:tc><w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/>' + (fill ? '<w:shd w:val="clear" w:color="auto" w:fill="' + fill + '"/>' : '') + '</w:tcPr>' + inner + '</w:tc>';
    };
    var line = function (side) { return '<w:' + side + ' w:val="single" w:sz="4" w:space="0" w:color="AEB5BC"/>'; };
    var rows = '<w:tr><w:trPr><w:tblHeader/></w:trPr>' + cell(W1, para('구분', { b: 1 }), 'F2F4F6') + cell(W2, para('내용', { b: 1 }), 'F2F4F6') + '</w:tr>' +
      m.rows.map(function (r) { return '<w:tr>' + cell(W1, para(r.name, { b: 1 })) + cell(W2, lines(r.content)) + '</w:tr>'; }).join('') +
      '<w:tr>' + cell(W1, para('기타 안건', { b: 1 })) + cell(W2, m.etcItems.length ? m.etcItems.map(function (x, i) {
        return lines((m.etcItems.length > 1 ? (i + 1) + '. ' : '') + x.content);
      }).join('') : para('')) + '</w:tr>';
    var doc = XMLH + '<w:document ' + W + '><w:body>' +
      para(m.title, { b: 1, sz: 32, jc: 'center', after: 80 }) +
      para([m.kind, meetMetaFull(m), (S.start && S.start.school) || ''].filter(Boolean).join(' · '), { sz: 20, color: '4E5968', jc: 'center', after: 240 }) +
      '<w:tbl><w:tblPr><w:tblW w:w="' + (W1 + W2) + '" w:type="dxa"/><w:tblBorders>' + // 순서는 규격대로: tblW → tblBorders → tblLayout → tblCellMar(어기면 워드가 복구 창을 띄울 수 있음)
      ['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map(line).join('') + '</w:tblBorders><w:tblLayout w:type="fixed"/>' +
      '<w:tblCellMar><w:top w:w="80" w:type="dxa"/><w:left w:w="120" w:type="dxa"/><w:bottom w:w="80" w:type="dxa"/><w:right w:w="120" w:type="dxa"/></w:tblCellMar></w:tblPr>' +
      '<w:tblGrid><w:gridCol w:w="' + W1 + '"/><w:gridCol w:w="' + W2 + '"/></w:tblGrid>' + rows + '</w:tbl>' + para('') +
      '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>';
    var styles = XMLH + '<w:styles ' + W + '><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="맑은 고딕" w:eastAsia="맑은 고딕" w:hAnsi="맑은 고딕" w:cs="맑은 고딕"/>' +
      '<w:sz w:val="21"/><w:szCs w:val="21"/><w:lang w:val="en-US" w:eastAsia="ko-KR"/></w:rPr></w:rPrDefault>' +
      '<w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="300" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults></w:styles>';
    var REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships/';
    return zipStore([
      { name: '[Content_Types].xml', text: XMLH + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
        '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>' },
      { name: '_rels/.rels', text: XMLH + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="' + REL + 'officeDocument" Target="word/document.xml"/></Relationships>' },
      { name: 'word/_rels/document.xml.rels', text: XMLH + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="' + REL + 'styles" Target="styles.xml"/></Relationships>' },
      { name: 'word/document.xml', text: doc },
      { name: 'word/styles.xml', text: styles }
    ], 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
  }
  function meetDocxSave() {
    var m = S.meet.detail && S.meet.detail.meeting;
    if (!m) return;
    saveBlob(meetDocx(m), (String(m.title || '회의록').replace(/[\\/:*?"<>|]+/g, ' ').trim() || '회의록') + '.docx');
    toast('워드 파일을 내려받았어요');
  }

      '<button type="button" class="btn btn-sm" data-action="staff-import">' + icon('upload', 18) + '명단 한 번에 넣기</button>' +
      '<button type="button" class="btn btn-sm btn-primary" data-action="staff-add">' + icon('plus', 18) + '교직원 추가</button></div>' +
      '<div id="staff-rows"></div>' +
      '<p class="hint">' + icon('info', 16) + '<span>전출·휴직하면 지우지 말고 "사용 안 함"으로 바꿔 주세요. 이름 목록과 알림에서 빠지고, 기록은 그대로 남아요. 개인 연락처는 넣지 않아요(내선만).</span></p>' +
      '</div>';
    var rowsBox = qs('#staff-rows', panel);
    function drawRows() {

    qs('#staff-find', panel).addEventListener('input', function (e) { S.staffSearch = e.target.value; drawRows(); }); // 찾기 칸은 그대로 두고 줄만(한글 입력이 끊기지 않게)
    qs('#staff-off', panel).addEventListener('change', function (e) { S.showOff = e.target.checked; drawRows(); });
  }

  function staffRow(x) {
    var off = x['사용 여부'] === '사용 안 함';
    var chips = [];
    if (x['역할'] === '관리') chips.push('<span class="chip chip-accent">관리</span>');
    var pinMode = !!S.cache.pinMode;
    if (off) chips.push('<span class="chip">사용 안 함</span>');
    else if (pinMode && !x.hasPin) chips.push('<span class="chip chip-warn">번호 없음</span>');
    if (pinMode && x.locked) chips.push('<span class="chip chip-warn">잠김</span>');
    var id = esc(x['교직원ID']);
    return '<div class="srow' + (off ? ' off' : '') + '" role="row">' +
      '<div role="cell"><div class="s-name">' + esc(x['이름']) + '</div><div class="s-sub">' + esc(x['직위'] || '') + '</div>' +
      (chips.length ? '<div class="s-chips">' + chips.join('') + '</div>' : '') + '</div>' +
      '<div role="cell" class="s-col-mid">' + esc(x['소속'] || '') + (x.deptName ? '<div class="s-sub">' + esc(x.deptName) + '</div>' : '') + '</div>' +
      '<div role="cell" class="s-col-job s-sub">' + esc(x['담당 업무'] || '') + '</div>' +
      '<div role="cell" class="s-col-tel">' + esc(x['내선'] || '') + '</div>' +
      '<div role="cell" class="s-btns print-hide">' +
      '<button type="button" class="btn btn-sm" data-action="staff-edit" data-id="' + id + '">고치기</button>' +
      (off || !pinMode ? '' : x.locked
        ? '<button type="button" class="btn btn-sm" data-action="staff-unlock" data-id="' + id + '">잠금 풀기</button>'
        : '<button type="button" class="btn btn-sm" data-action="staff-pin" data-id="' + id + '">' + (x.hasPin ? '번호 새로' : '번호 만들기') + '</button>') +
      '<button type="button" class="btn btn-sm btn-ghost" data-action="staff-active" data-id="' + id + '">' + (off ? '다시 사용' : '사용 안 함') + '</button>' +
      '</div></div>';
  }

  function findStaff(id) {
    return (S.cache.staff || []).filter(function (x) { return x['교직원ID'] === id; })[0];
  }
  function putStaff(row) {
    var list = S.cache.staff || [];
    var i = list.map(function (x) { return x['교직원ID']; }).indexOf(row['교직원ID']);
    if (i >= 0) list[i] = row; else list.push(row);
    S.cache.staff = list;
  }

  function staffForm(x) {
    x = x || {};
    var depts = S.cache.depts || [];
    var deptOpts = '<option value="">(없음)</option>' + depts.filter(function (d) { return d.active || d.id === x['부서ID']; }).map(function (d) {
      return '<option value="' + esc(d.id) + '"' + (d.id === x['부서ID'] ? ' selected' : '') + '>' + esc(d.name) + (d.active ? '' : ' (사용 안 함)') + '</option>';
    }).join('');
    function f(key, label, opts) {
      opts = opts || {};
      return '<div class="field"><label class="label" for="sf-' + key + '">' + label + (opts.req ? ' <span class="req">*</span>' : '') + '</label>' +
        '<input id="sf-' + key + '" class="input" data-k="' + key + '" value="' + esc(x[key] || '') + '"' + (opts.attr || '') + ' placeholder="' + (opts.ph || '') + '"></div>';
    }
    return '<form class="form" id="staff-form" novalidate>' +
      '<div class="form-grid">' + f('이름', '이름', { req: true, attr: ' maxlength="20" autocomplete="off"' }) + f('직위', '직위', { ph: '예: 교사, 수석교사', attr: ' maxlength="20"' }) + '</div>' +
      '<div class="form-grid">' + f('소속', '소속', { ph: '예: 3학년 1반, 과학 전담', attr: ' maxlength="30"' }) +
      '<div class="field"><label class="label" for="sf-부서ID">부서</label><select id="sf-부서ID" class="input" data-k="부서ID">' + deptOpts + '</select></div></div>' +
      f('담당 업무', '담당 업무', { ph: '예: 교육과정, 전문적학습공동체', attr: ' maxlength="200"' }) +
      '<div class="form-grid">' + f('내선', '내선', { ph: '숫자만', attr: ' inputmode="numeric" maxlength="15"' }) + f('순서', '명단 순서', { ph: '숫자가 작을수록 위', attr: ' inputmode="numeric" maxlength="4"' }) + '</div>' +
      '<div class="field"><span class="label">역할</span><div class="seg" role="group" aria-label="역할" style="max-width:320px">' +
      '<button type="button" data-role="일반" aria-pressed="' + (x['역할'] !== '관리') + '">일반</button>' +
      '<button type="button" data-role="관리" aria-pressed="' + (x['역할'] === '관리') + '">관리</button></div>' +
      '<p class="hint">' + icon('info', 16) + '<span>"관리"는 관리자 표시예요. 관리자 화면은 관리자 비밀번호로 들어가요.</span></p></div>' +
      (depts.length ? '' : '<p class="hint">' + icon('info', 16) + '<span>부서 목록이 비어 있어요. "분류" 탭에서 부서를 먼저 넣으면 고를 수 있어요.</span></p>') +
      '<p class="err" id="sf-err" role="alert"></p>' +
      '<div class="modal-btns"><button type="button" class="btn" data-action="close-modal">닫기</button>' +
      '<button type="submit" class="btn btn-primary">저장</button></div></form>';
  }

  function openStaffForm(x) {
    openModal('<h2 id="m-title">' + (x ? esc(x['이름']) + ' 선생님 고치기' : '교직원 추가') + '</h2>' + staffForm(x));
    var form = qs('#staff-form');
    qsa('[data-role]', form).forEach(function (b) {
      b.addEventListener('click', function () {
        qsa('[data-role]', form).forEach(function (o) { o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); });
      });
    });
    setTimeout(function () { qs('#sf-이름').focus(); }, 30);
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var fields = {};
      qsa('[data-k]', form).forEach(function (i) { fields[i.getAttribute('data-k')] = i.value; });
      fields['역할'] = qs('[data-role][aria-pressed=true]', form).getAttribute('data-role');
      var err = qs('#sf-err');
      if (!fields['이름'].trim()) { err.textContent = '이름을 적어 주세요.'; return; }
      var btn = form.querySelector('[type=submit]');
      busy(btn, true, '저장하는 중');
      server('admin.staff.save', { id: x ? x['교직원ID'] : '', fields: fields }).then(function (row) {
        putStaff(row);
        closeModal();
        drawStaff(qs('#admin-panel'));
        toast(row['이름'] + ' 선생님을 ' + (x ? '고쳤어요' : '넣었어요') + (row.hasPin ? '' : '. 개인 번호도 만들어 주세요'));
      }).catch(function (e) { busy(btn, false); err.textContent = e.message; });
    });
  }

  function confirmBox(title, body, okText, onOk, danger) {
    openModal('<h2 id="m-title">' + title + '</h2><p class="muted" style="margin:0">' + body + '</p><p class="err" id="cf-err" role="alert"></p>' +
      '<div class="modal-btns"><button type="button" class="btn" data-action="close-modal">그만두기</button>' +
      '<button type="button" class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" id="cf-ok">' + okText + '</button></div>');
    var ok = qs('#cf-ok');
    ok.addEventListener('click', function () {
      busy(ok, true, '하는 중');
      onOk().catch(function (e) { busy(ok, false); qs('#cf-err').textContent = e.message; });
    });
  }

  function staffResetPin(x) {
    confirmBox(esc(x['이름']) + ' 선생님 개인 번호 ' + (x.hasPin ? '새로 만들기' : '만들기'),
      x.hasPin ? '새 번호를 만들면 지금 번호는 더 쓸 수 없고, 이 분의 기기에 기억된 본인 확인도 풀려요.' : '무작위 4자리 번호를 만들어요. 번호는 한 번만 보여 드려요.',
      '번호 만들기', function () {
        return server('admin.staff.resetPin', { id: x['교직원ID'] }).then(function (r) {
          x.hasPin = true; x.locked = false;
          drawStaff(qs('#admin-panel'));
          showPins([r], false);
        });
      });

  function staffIssueMissing() {
    var n = (S.cache.staff || []).filter(function (x) { return x['사용 여부'] !== '사용 안 함' && !x.hasPin; }).length;
    confirmBox('번호 없는 ' + n + '명의 번호 만들기', '사용 중이면서 아직 번호가 없는 분들의 무작위 4자리 번호를 한꺼번에 만들어요. 다음 창에서 한 번만 보여 드리니, 쪽지로 인쇄해 한 분씩 전해 주세요.',
      n + '명 번호 만들기', function () {
        return server('admin.staff.issueMissing').then(function (list) {
          return server('admin.staff.list').then(function (r) {
            S.cache.staff = r.staff;
            drawStaff(qs('#admin-panel'));
            showPins(list, true);
          });
        });
      });
  }

  /** 개인 번호를 한 번만 보여 준다. 창을 닫으면 화면에서도 지운다. */
  function showPins(list, many) {
    S.pinSlips = list;
    var body = list.length === 1 && !many
      ? '<p class="muted" style="margin:0">' + esc(list[0].name) + ' 선생님' + (list[0].group ? ' · ' + esc(list[0].group) : '') + '</p><p class="pin-big" aria-label="개인 번호">' + esc(list[0].pin) + '</p>'
      : list.length
        ? '<div class="pin-list">' + list.map(function (p) { return '<div><span><b style="all:unset;font-weight:800">' + esc(p.name) + '</b> <span class="faint">' + esc(p.group || '') + '</span></span><b>' + esc(p.pin) + '</b></div>'; }).join('') + '</div>'
        : '<p class="muted">번호를 만들 분이 없었어요.</p>';
    openModal('<h2 id="m-title">개인 번호' + (list.length > 1 ? ' ' + list.length + '명' : '') + '</h2>' + body +
      '<p class="hint">' + icon('info', 16) + '<span>이 창을 닫으면 다시 볼 수 없어요. 쪽지로 인쇄하거나 종이에 옮겨 적어 한 분씩 전해 주세요. 메신저나 단체방에는 올리지 마세요.</span></p>' +
      '<div class="modal-btns">' + (list.length ? '<button type="button" class="btn" data-action="print-slips">' + icon('print', 18) + '쪽지로 인쇄</button>' : '') +
      '<button type="button" class="btn btn-primary" data-action="close-pins">확인했어요</button></div>', { noBackdropClose: true });
  }

  function printSlips() {
    var school = S.start ? S.start.school : '';
    var area = qs('#print-area');
    area.innerHTML = '<div class="slips">' + (S.pinSlips || []).map(function (p) {
      return '<div class="slip"><div>' + esc(school) + ' 온라인 교무실 · 개인 번호</div>' +
        '<div style="font-size:18px;font-weight:800;margin-top:4px">' + esc(p.name) + ' 선생님 <span style="font-weight:600;font-size:14px">' + esc(p.group || '') + '</span></div>' +
        '<div class="slip-pin">' + esc(p.pin) + '</div>' +
        '<div>조사에 답하거나 일정을 넣을 때 이름을 고르고 이 번호를 넣어요. 다른 사람에게 보여 주지 마세요. 잊으면 관리자에게 다시 받으세요.</div></div>';
    }).join('') + '</div>';
    document.body.classList.add('printing-slips');
    setTimeout(function () {
      window.print();
      setTimeout(function () { document.body.classList.remove('printing-slips'); }, 500);
    }, 50);
  }

  function clearPins() {
    S.pinSlips = null;
    var area = qs('#print-area');
    if (area) area.innerHTML = '';
  }

  function staffToggle(x) {
    var off = x['사용 여부'] === '사용 안 함';
    var go2 = function () {
      return server('admin.staff.setActive', { id: x['교직원ID'], active: off }).then(function (row) {
        putStaff(row);
        closeModal();
        drawStaff(qs('#admin-panel'));
        toast(row['이름'] + ' 선생님을 ' + (off ? '다시 사용으로 바꿨어요' : '사용 안 함으로 바꿨어요'));
      });

      confirmBox(esc(x['이름']) + ' 선생님 다시 사용', '이름 목록에 다시 보여요. ' + (x.hasPin ? '예전 개인 번호를 그대로 쓸 수 있어요.' : '개인 번호를 만들어 드려야 해요.'), '다시 사용', go2);
    } else {
      confirmBox(esc(x['이름']) + ' 선생님 사용 안 함', '전출·휴직 때 써요. 이름 목록과 알림에서 빠지고, 이 분의 기억된 본인 확인도 풀려요. 다만 공통 비밀번호로 로그인된 기기는 그대로라, 그 기기에서 다른 이름을 고를 수는 있어요(막으려면 공통 비밀번호를 바꿔요). 지금까지의 기록은 그대로 남고, 언제든 다시 사용으로 바꿀 수 있어요.', '사용 안 함으로 바꾸기', go2, true);
    }

  function staffUnlock(x) {
    server('admin.staff.unlock', { id: x['교직원ID'] }).then(function (row) {
      putStaff(row);
      drawStaff(qs('#admin-panel'));
      toast(row['이름'] + ' 선생님 잠금을 풀었어요');
    }).catch(function (e) { toast(e.message, 'error'); });
  }

    panel.innerHTML = loadingHtml('분류를 불러오는 중이에요');
    server('admin.cat.list').then(function (groups) {
      S.cache.cats = groups;
      drawCat(panel);
    }).catch(function (e) { panel.innerHTML = failHtml(e); });
  }

    var notes = {
      '부서': '교직원 표·일정·자료에 쓰는 부서 이름이에요.',
      '자료 분류': '자료실 카드를 나누는 이름이에요.',

          '<p class="faint">' + (notes[g.kind] || '') + '</p>' +
          (g.items.length ? '<div class="cat-cols" aria-hidden="true"><span>이름</span><span>순서</span><span></span></div>' : '') +

          }).join('') : '<p class="faint">아직 없어요.</p>') + '</div>' +
          '<div class="cat-new"><input class="input" placeholder="새 ' + esc(g.kind) + ' 이름" data-cat-new="' + esc(g.kind) + '" maxlength="20" aria-label="새 ' + esc(g.kind) + ' 이름">' +
          '<button type="button" class="btn btn-sm" data-action="cat-add" data-kind="' + esc(g.kind) + '">' + icon('plus', 18) + '추가</button></div>' +

      toast(kind + josa(kind, '을', '를') + ' 넣었어요');

  // ------------------------------------------------------------ 관리자 · 설정
  /** 설정 › 백업 한 줄: 마지막 백업 때(2일 넘게 없으면 빨갛게) */
  function backupLine(folder, last) {
    var at = last && Number(last.value) || 0, hrs = at ? Math.floor((Date.now() - at) / 3600000) : -1;
    var when = !at ? '아직 없어요' : hrs < 1 ? '1시간 안' : hrs < 48 ? hrs + '시간 전' : Math.floor(hrs / 24) + '일 전';
    var bad = !at || hrs >= 48;
    return '<p class="' + (bad ? 'err' : 'faint') + '">' + (bad ? icon('info', 16) + ' ' : '') + '마지막 백업: ' + when +
      (bad ? (folder ? ' · 매일 자동 백업이 멈췄을 수 있어요. 전용 시트 메뉴 "4. 매일 자동 백업 켜기"를 다시 눌러 주세요.' : ' · 전용 시트 메뉴 "4. 매일 자동 백업 켜기"로 켜 주세요.') : ' · 매일 자동으로 백업해요(관리자 › 점검에서 자세히).') + '</p>';
  }
  /** 관리자 › 설정에 저장하지 않은 바꿈이 있으면 다른 곳으로 가기 전에 묻는다(괜찮으면 true) */
  function settingsLeaveOk(proceed) {
    if (!S.setDirty || !qs('#set-form')) { S.setDirty = false; return true; }
    confirmBox('저장하지 않은 설정이 있어요', '고친 설정을 저장하지 않고 나가면 사라져요.', '저장하지 않고 나가기', function () {
      S.setDirty = false;
      closeModal();
      proceed();
      return Promise.resolve();
    }, true);
    return false;
  }
  function adminSettings(panel) {
    if (!panel) return; // 그사이 다른 화면으로 옮겼으면
    panel.innerHTML = loadingHtml('설정을 불러오는 중이에요');
    server('admin.settings.get').then(function (list) { drawSettings(panel, list); })
      .catch(function (e) { panel.innerHTML = failHtml(e); });
  }

  function drawSettings(panel, list) {
    function byKey(k) { return list.filter(function (x) { return x.key === k; })[0]; }
    function input(d) {

  function logTabName(t) {
    return { '함께표': '취합 시트', '함께표줄': '취합 시트', '시트양식': '시트 양식', '월별중점': '월별 중점지도', '학생수': '학생 수', '학기': '학기 기간', '회의': '회의록', '회의내용': '회의록' }[t] || t;
  }

  function logItem(l) {
    var keys = [];
    if (l.before || l.after) {
      var b = l.before || {}, a = l.after || {};
      keys = Object.keys(a).concat(Object.keys(b)).filter(function (k, i, arr) { return arr.indexOf(k) === i; });
    }
    var detail = l.before && l.after && keys.length
      ? '<details><summary>바뀐 내용 ' + keys.length + '칸</summary><div class="diff">' + keys.map(function (k) {
          return '<span class="k">' + esc(k) + '</span><span class="b">' + esc(l.before[k] || '(빈칸)') + '</span><span class="to" aria-label="에서">→</span><span>' + esc(l.after[k] || '(빈칸)') + '</span>';
        }).join('') + '</div></details>'
      : '';
    var tone = l.action === '삭제' || l.action === '잠김' ? 'chip-warn' : l.action === '추가' ? 'chip-ok' : '';
    return '<div class="log-item"><div class="log-top"><span class="log-time">' + esc(l.time) + '</span>' +
      '<span class="chip ' + tone + '">' + esc(l.action) + '</span><span class="chip">' + esc(logTabName(l.tab)) + '</span>' +
      '<span class="faint">' + esc(l.who || '이름 없음') + '</span></div>' +
      '<p class="log-sum">' + esc(l.summary || '') + '</p>' + detail + '</div>';
  }

  // 이 화면을 처음 열 때 서버(ui.table)에서 받아 붙인다. 메뉴·홈 '채우기'에 손이 가면 미리 받기 시작한다.

  function tableUiInject(html) {
