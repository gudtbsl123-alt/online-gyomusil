<script>
/**
 * App.html — 온라인 교무실 화면
 * 화면은 한 페이지 안에서 바뀐다. 서버는 server('요청 이름', {...}) 하나로 부른다.
 * 사용자가 넣은 글은 모두 esc()로 감싸서 화면에 넣는다.
 */
(function () {
  'use strict';

  // ============================================================ 기본 도구
  var APP_FILE_BUILD = '2026-10-17g'; // 판 표시(관리자 › 점검)
  var $app = document.getElementById('app');
  var $modal = document.getElementById('modal-root');
  var $toast = document.getElementById('toast');
  var root = document.documentElement;

  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function qs(sel, el) { return (el || document).querySelector(sel); }
  function qsa(sel, el) { return Array.prototype.slice.call((el || document).querySelectorAll(sel)); }
  function josa(word, a, b) {
    var c = String(word).charCodeAt(String(word).length - 1);
    if (c < 0xAC00 || c > 0xD7A3) return a + '(' + b + ')';
    return (c - 0xAC00) % 28 ? a : b;
  }

  var toastTimer;
  function toast(msg) {
    $toast.textContent = msg;
    $toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $toast.classList.remove('show'); }, 2200);
  }

  // ------------------------------------------------------------ 브라우저 저장(안 되면 기억만 안 됨)
  var mem = {};
  function stGet(k) {
    try { var v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {}
    try { var w = sessionStorage.getItem(k); if (w !== null) return w; } catch (e) {}
    return mem[k] === undefined ? null : mem[k];
  }
  /** keep: true면 기기에 오래(localStorage), 아니면 이 창을 닫을 때까지(sessionStorage) */
  function stSet(k, v, keep) {
    stDel(k);
    mem[k] = v;
    try { (keep ? localStorage : sessionStorage).setItem(k, v); } catch (e) {}
  }
  function stDel(k) {
    delete mem[k];
    try { localStorage.removeItem(k); } catch (e) {}
    try { sessionStorage.removeItem(k); } catch (e) {}
  }
  function tokens() {
    return { login: stGet('gy.login'), identity: stGet('gy.identity'), admin: stGet('gy.admin') };
  }

  // ------------------------------------------------------------ 서버 부르기
  // 읽기만 하는 요청. 이것 말고는 모두 무언가를 바꾸는 요청이라, 성공하면 화면 기억(MEMO)을 모두 잊는다
  var READS = {
    start: 1, ping: 1, boot: 1, batch: 1, session: 1, staffPicker: 1, home: 1, search: 1, 'sched.month': 1, 'sched.year': 1,
    'sched.upload.info': 1, 'sched.upload.check': 1, 'survey.list': 1, 'survey.get': 1, 'survey.csv': 1, 'lib.list': 1, 'file.get': 1,
    'help.list': 1, 'staff.list': 1, 'notice.list': 1, 'admin.settings.get': 1, 'admin.cat.list': 1, 'admin.staff.list': 1,
    'admin.log.list': 1, 'admin.trash.list': 1, 'admin.trash.surveys': 1, 'admin.trash.library': 1, 'admin.year.preview': 1,
    'admin.check': 1, 'admin.speed': 1, 'admin.staff.importCheck': 1
  };
  var recentCalls = []; // 속도 재기: 이 창에서 최근에 서버를 다녀온 요청과 걸린 시간(ms)

  /**
   * then: [[읽기 이름, args], …] 를 함께 보내면 서버가 저장한 다음 그 화면들을 같은 요청으로 돌려준다(왕복 한 번).
   * 받은 것은 화면 기억에 넣어 두므로, 저장 뒤 평소처럼 화면을 다시 불러오면 기다리지 않고 바로 그려진다.
   * bg: 뒤에서 보내는 요청(미리 받기·뒤에서 새로 받기). 기다리는 사람이 없으니 서버가 오래된 기억을 시트와 다시 맞춘다
   */
  var pendingWrites = 0; // 저장 같은 요청이 서버에 가 있는 동안에는 창을 닫지 않게(실패하면 쓰던 것과 안내가 사라지므로)
  function server(action, args, then, bg) {
    var t0 = Date.now();
    var writing = !READS[action];
    if (writing) pendingWrites++;
    var settled = false;
    var settle = function () { if (!settled) { settled = true; if (writing) pendingWrites = Math.max(0, pendingWrites - 1); } };
    return new Promise(function (resolve, reject) {
      var payload = { action: action, args: args || {}, tokens: tokens() };
      if (then) payload.then = then;
      if (bg) payload.bg = 1;
      var req = JSON.stringify(payload);
      function done(text) {
        settle();
        recentCalls.unshift({ action: action, ms: Date.now() - t0, bg: !!bg });
        recentCalls.length = Math.min(recentCalls.length, 15);
        var r;
        try { r = JSON.parse(text); } catch (e) { r = { ok: false, error: '서버 답을 읽지 못했어요. 다시 해 주세요.', code: 'ERROR' }; }
        if (r.ok) {
          if (!READS[action]) { memoClear(); setTimeout(prefetchScreens, 400); }
          if (then && r.then) then.forEach(function (x, i) { if (r.then[i]) memoPut(x[0], x[1], r.then[i].data); });
          return resolve(r.data);
        }
        var err = new Error(r.error);
        err.code = r.code;
        err.detail = r.detail || '';
        authTrouble(err);
        reject(err);
      }
      if (window.__previewServer) {
        window.__previewServer(req).then(done);
      } else {
        google.script.run
          .withSuccessHandler(done)
          .withFailureHandler(function (e) {
            settle();
            // 연결이 끊긴 것과 서버가 처리하다 멈춘 것(시간 초과·권한 등)을 나눠 알린다
            var msg = e && e.message ? String(e.message) : '';
            var net = !msg || /NetworkError|HTTP 0|Failed to fetch|network/i.test(msg);
            var err = new Error(net ? '서버에 닿지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.'
              : '서버에서 처리하다 멈췄어요. 잠깐 뒤에 다시 해 주세요. 계속 안 되면 연구부장·부담당에게 알려 주세요.');
            err.code = net ? 'NET' : 'ERROR';
            err.detail = msg ? ((e.name ? e.name + ': ' : '') + msg).slice(0, 300) : '';
            reject(err);
          })
          .api(req);
      }
    });
  }

  /** 로그인·본인 확인·관리자 표가 만료됐을 때 */
  function authTrouble(err) {
    if (err.code === 'LOGIN') {
      stDel('gy.login'); stDel('gy.identity'); stDel('gy.admin');
      S.me = null; S.admin = false;
      forgetScreens();
      setTimeout(function () { showLogin('다시 로그인해 주세요.'); }, 0);
    } else if (err.code === 'ADMIN') {
      stDel('gy.admin');
      S.admin = false;
      forgetScreens();
      setTimeout(renderApp, 0);
    } else if (err.code === 'IDENTITY') {
      stDel('gy.identity');
      S.me = null;
      forgetScreens();
      setTimeout(function () { showIdentity(); }, 0);
    }
  }

  /**
   * 누구로 보는지(로그인·이름·관리자 화면)가 바뀌면 화면 기억과 들고 있던 화면 내용을 모두 버린다
   * (그 권한으로만 보이던 조사 결과 같은 것이 남지 않게)
   */
  function forgetScreens() {
    memoClear();
    S.home = null; S.search = null;
    S.sched.data = null; S.sched.yearData = null; S.sched.form = null;
    S.survey.list = null; S.survey.detail = null; S.survey.showResults = false; S.survey.draft = null;
    S.lib.data = null; S.dir.data = null; S.help.data = null; S.notice.data = null;
  }

  // ------------------------------------------------------------ 화면 기억(속도)
  // 한 번 본 화면은 기억한 내용을 곧바로 그리고, 오래됐으면 뒤에서 새로 받아 바뀐 경우에만 다시 그린다.
  // 이 창에서만 기억한다(창을 닫으면 사라져 함께 쓰는 PC에 남지 않는다). 무엇이든 저장하면 모두 잊는다(server).
  var MEMO = {};
  var MEMO_FRESH = 15000; // 이보다 최근에 받은 것은 다시 받지 않는다(서버를 덜 부르게)
  var navSeq = 0;         // 화면을 새로 그릴 때마다 늘어난다(늦게 온 답이 다른 화면을 덮지 않게)
  var screenEdited = false; // 그린 뒤 화면에서 무언가 입력했으면 뒤에서 다시 그리지 않는다(쓰던 것이 지워지지 않게)
  var pendingDraw = null;   // 창이 열려 있거나 입력하는 중이라 미뤄 둔 다시 그리기
  var refreshN = 0;
  var memoGen = 0;          // 기억을 비울 때마다 늘어난다(저장하기 전에 떠난 요청의 옛 답을 버리게)
  function memoKey(action, args) { return action + '|' + JSON.stringify(args || {}); }
  function memoPut(action, args, data) { MEMO[memoKey(action, args)] = { data: data, json: JSON.stringify(data), at: Date.now() }; }
  function memoClear() { MEMO = {}; pendingDraw = null; memoGen++; }
  function editingNow() {
    if ($modal.innerHTML || qs('#sheet')) return true;
    var a = document.activeElement;
    return !!(a && a.closest && a.closest('#screen') && (a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' ||
      (a.tagName === 'INPUT' && !/^(checkbox|radio|button|submit)$/.test(a.type))));
  }
  function flushPending() {
    if (typeof reshape === 'function') reshape();
    if (!pendingDraw || editingNow()) return;
    var f = pendingDraw;
    pendingDraw = null;
    f();
  }
  /** 뒤에서 새 내용을 받는 동안 화면 맨 위에 가는 줄 */
  function refreshing(on) {
    refreshN = Math.max(0, refreshN + (on ? 1 : -1));
    var bar = qs('#refresh-bar');
    if (bar) bar.hidden = !refreshN;
  }
  /**
   * 기억이 있으면 곧바로 draw(data)하고, 15초보다 오래됐으면 뒤에서 새로 받는다.
   * 새 내용이 다르면 다시 draw(그사이 화면을 옮겼거나 쓰던 것이 있으면 그리지 않음, 창이 열려 있으면 닫은 뒤에).
   * 기억이 없으면 받아서 draw, 안 되면 fail(e).
   */
  var paintN = {}; // 키마다 그린 횟수(같은 화면을 두 요청이 받아 와도 두 번째 답이 쓰던 것을 덮지 않게)
  function loadMemo(action, args, draw, fail) {
    var key = memoKey(action, args), m = MEMO[key], seq = navSeq;
    var paint = function (d, fromMemo) { paintN[key] = (paintN[key] || 0) + 1; screenEdited = false; draw(d, fromMemo); };
    if (m) paint(m.data, true);
    var p0 = paintN[key] || 0;
    if (m && Date.now() - m.at < MEMO_FRESH) return;
    if (m) refreshing(true);
    var done = function () { if (m) refreshing(false); };
    var gen = memoGen;
    server(action, args, null, !!m).then(function (d) {
      done();
      if (gen !== memoGen) { // 그사이 저장해서 기억을 비웠으면 이 답은 옛 내용
        if (!m && seq === navSeq && (paintN[key] || 0) === p0) loadMemo(action, args, draw, fail); // 아직 아무것도 못 그렸으면 새로 받는다('불러오는 중'에 멈추지 않게)
        return;
      }
      var json = JSON.stringify(d), prev = MEMO[key];
      var changed = !prev || prev.json !== json;
      MEMO[key] = { data: d, json: json, at: Date.now() };
      if (seq !== navSeq) return;
      if (!m && (paintN[key] || 0) === p0) { paint(d, false); return; } // 처음 그리기
      if (!changed || screenEdited) return; // 같거나, 쓰던 것이 있으면 그대로(다음에 열 때 새 내용으로)
      var redraw = function () { if (seq === navSeq && !screenEdited) { paintN[key] = (paintN[key] || 0) + 1; draw(d, false); } };
      if (editingNow()) pendingDraw = redraw; else redraw();
    }, function (e) {
      done();
      if (!m && seq === navSeq && (paintN[key] || 0) === p0 && fail) fail(e);
    });
  }

  // ------------------------------------------------------------ 미리 받기(속도)
  // 화면을 그린 뒤·저장한 뒤, 자주 여는 화면을 뒤에서 한 번에(batch) 받아 화면 기억에 넣는다 → 처음 누르는 메뉴도 바로 보인다
  var prefetchBusy = false, prefetchAgain = false;
  function prefetchList() {
    var t = localToday(), sc = S.sched;
    var list = [['home', {}], ['sched.month', { year: +t.slice(0, 4), month: +t.slice(5, 7) }]];
    if (S.screen === 'schedule' && sc.view !== 'year' && sc.y) {
      // 달력·월별 계획을 보는 중이면 지난달·다음 달도 받아 둔다(달을 넘기면 바로 보이게)
      [-1, 1].forEach(function (k) {
        var d = new Date(Date.UTC(sc.y, sc.m - 1 + k, 1));
        list.push(['sched.month', { year: d.getUTCFullYear(), month: d.getUTCMonth() + 1 }]);
      });
    }
    list = list.concat([['survey.list', {}], ['lib.list', {}], ['notice.list', {}], ['help.list', {}], ['staff.list', {}]]);
    var seen = {};
    return list.filter(function (x) {
      var k = memoKey(x[0], x[1]);
      if (MEMO[k] || seen[k]) return false;
      seen[k] = 1;
      return true;
    }).slice(0, 8); // 서버가 한 번에 8개까지 받는다
  }
  function prefetchScreens() {
    if (!qs('.app') || !stGet('gy.login')) return; // 앱 화면이 열려 있을 때만
    if (prefetchBusy) { prefetchAgain = true; return; }
    var reads = prefetchList();
    if (!reads.length) return;
    prefetchBusy = true;
    var gen = memoGen;
    server('batch', { reads: reads }, null, true).then(function (res) {
      if (gen !== memoGen) return; // 그사이 저장했으면 옛 내용이라 버린다(저장 뒤 다시 받는다)
      (res || []).forEach(function (x, i) {
        if (x && !MEMO[memoKey(reads[i][0], reads[i][1])]) memoPut(reads[i][0], reads[i][1], x.data);
      });
    }, function () { /* 미리 받기는 못 해도 괜찮다(누를 때 받는다) */ }).then(function () {
      prefetchBusy = false;
      if (prefetchAgain) { prefetchAgain = false; setTimeout(prefetchScreens, 300); }
    });
  }

  /** 단추를 누르는 동안 막고 '…하는 중'을 보여 준다 */
  function busy(btn, on, text) {
    if (!btn) return;
    if (on) {
      btn.dataset.label = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spin" aria-hidden="true"></span>' + esc(text || '잠시만요');
    } else {
      btn.disabled = false;
      if (btn.dataset.label) btn.innerHTML = btn.dataset.label;
    }
  }

  // ============================================================ 그림(아이콘): 시안과 같은 선
  var P = {
    book: '<path d="M4 6.5c2.5-1 5-1 8 1 3-2 5.5-2 8-1V18c-2.5-1-5-1-8 1-3-2-5.5-2-8-1z"></path><path d="M12 7.5V19"></path>',
    home: '<path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"></path>',

    people: '<circle cx="9" cy="9" r="3"></circle><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 6.5a3 3 0 0 1 0 6M17.5 19a4.5 4.5 0 0 0-2.5-4"></path>',
    help: '<circle cx="12" cy="12" r="8.5"></circle><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.4M12 16.8v.2"></path>',

    doc: '<path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path><path d="M14 3v5h5M9 13h6M9 17h4"></path>',

    reload: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"></path>',
    bell: '<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path>',
    archive: '<rect x="3.5" y="4.5" width="17" height="4.5" rx="1"></rect><path d="M5 9v9.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"></path>',
    ext: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path>',
    shield: '<path d="M12 3.5 19 6v5.5c0 4.2-3 7.7-7 9-4-1.3-7-4.8-7-9V6z"></path><path d="m9 12 2 2 4-4"></path>'
  };
  function icon(name, size, extra) {
    size = size || 22;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"' + (extra || '') + '>' + P[name] + '</svg>';
  }

  // ============================================================ 상태
  var S = {
    start: null,      // 학교 이름, 학년도, 준비 여부
    me: null,         // 본인 확인된 사람
    admin: false,     // 관리자 화면 열림
    screen: 'home',
    adminTab: 'staff',
    staffSearch: '',
    showOff: false,
    cache: {}
  };

  var MENU = [
    { id: 'home', label: '홈', icon: 'home' },
    { id: 'schedule', label: '일정', icon: 'calendar' },
    { id: 'survey', label: '조사·신청', icon: 'survey' },
    { id: 'notice', label: '공지', icon: 'bell' },
    { id: 'library', label: '자료실', icon: 'folder' },
    { id: 'staff', label: '교직원', icon: 'people' },
    { id: 'help', label: '도움말', icon: 'help' }
  ];
  var ADMIN_MENU = [
    { id: 'admin', label: '관리자', icon: 'lock' },
    { id: 'guide', label: '운영 안내서', icon: 'doc', small: true }
  ];
  /** 메뉴에는 없고 단추로만 여는 화면 */
  var HIDDEN_SCREENS = [
    { id: 'upload', label: '학사일정 올리기', icon: 'calendar' }
  ];
  function menuItem(id) {
    return MENU.concat(ADMIN_MENU).concat(HIDDEN_SCREENS).filter(function (m) { return m.id === id; })[0];
  }

  // ============================================================ 밝기·화면 크기
  function setTheme(t) {
    root.setAttribute('data-theme', t);
    stSet('gy.theme', t, true);
    qsa('[data-theme-btn]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-theme-btn') === t ? 'true' : 'false'); });
  }

  /**
   * 화면 디자인(교사 결정): ① 기본(시안 그대로) ② 장도(교표의 남색·초록) ③ 따뜻한 종이색. 선생님마다 기기에서 고르고 기억한다(gy.design).
   * 색은 Styles.html(:root[data-design]), 처음 그릴 때는 Index.html 머리 스크립트가 먼저 정해 깜빡이지 않는다
   */
  var DESIGNS = [
    { id: 'base', label: '기본', dot: ['#F2F4F6', '#1B64DA'] },
    { id: 'jangdo', label: '장도', dot: ['#232C6F', '#9BD86E'] },
    { id: 'paper', label: '종이색', dot: ['#F4EEE3', '#A0502A'] }
  ];
  var designTimer;
  function designNow() {
    var d = stGet('gy.design');
    return d === 'jangdo' || d === 'paper' ? d : 'base';
  }
  /** smooth: 고른 순간 색이 부드럽게 바뀌게(0.35초 동안만 transition) */
  function setDesign(d, smooth) {
    if (d !== 'jangdo' && d !== 'paper') d = 'base';
    if (smooth) {
      root.classList.add('design-anim');
      clearTimeout(designTimer);
      designTimer = setTimeout(function () { root.classList.remove('design-anim'); }, 450);
    }
    if (d === 'base') root.removeAttribute('data-design');
    else root.setAttribute('data-design', d);
    stSet('gy.design', d, true);
    qsa('[data-design-btn]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-design-btn') === d ? 'true' : 'false'); });
  }
  function designSeg() {
    var cur = designNow();
    return '<div class="seg design-seg" role="group" aria-label="화면 디자인">' + DESIGNS.map(function (x) {
      return '<button type="button" data-design-btn="' + x.id + '" aria-pressed="' + (cur === x.id) + '" title="화면 디자인: ' + x.label + '">' +
        '<span class="design-dot" style="--dot-a:' + x.dot[0] + ';--dot-b:' + x.dot[1] + '" aria-hidden="true"></span>' + x.label + '</button>';
    }).join('') + '</div>';
  }

  /**
   * 화면 크기(확대·축소): 본문과 창만 키운다(메뉴는 그대로라 막대가 손가락 밑에서 움직이지 않음).
   * 칸마다 멈추는 값만 쓴다(이 값들로 넘침을 시험했다). 넓은 화면만 150%, 휴대폰은 120%까지. 기기마다 기억한다.
   */
  var ZOOMS = [90, 100, 110, 120, 130, 150];
  function zoomSteps() {
    var max = isPhone() ? 120 : window.innerWidth >= 1600 ? 150 : 130;
    return ZOOMS.filter(function (z) { return z <= max; });
  }
  function zoomWanted() {
    var z = Number(stGet('gy.zoom'));
    if (ZOOMS.indexOf(z) >= 0) return z;
    return stGet('gy.big') === '1' ? 110 : 100; // 예전 '글자 크게'를 켜 두었던 기기
  }
  /** 고른 값이 이 화면에서 너무 크면(창을 줄였을 때) 쓸 수 있는 가장 큰 값으로 */
  function zoomNow() {
    var steps = zoomSteps(), z = zoomWanted();
    return Math.min(z, steps[steps.length - 1]);
  }
  function applyZoom() {
    var z = zoomNow(), steps = zoomSteps(), i = steps.indexOf(z);
    root.style.setProperty('--gy-zoom', String(z / 100));
    qsa('.zoom').forEach(function (el) {
      var r = qs('.zoom-range', el);
      r.max = String(steps.length - 1);
      r.value = String(i);
      r.setAttribute('aria-valuetext', z + '%');
      qs('.zoom-val', el).textContent = z + '%';
      qs('[data-action="zoom-out"]', el).disabled = i <= 0;
      qs('[data-action="zoom-in"]', el).disabled = i >= steps.length - 1;
    });
  }
  function setZoom(z) {
    stSet('gy.zoom', String(z), true);
    stDel('gy.big');
    applyZoom();
  }
  function stepZoom(n) {
    var steps = zoomSteps(), i = steps.indexOf(zoomNow()) + n;
    if (i >= 0 && i < steps.length) setZoom(steps[i]);
  }
  function zoomControl() {
    var steps = zoomSteps(), z = zoomNow(), i = steps.indexOf(z);
    return '<div class="zoom" role="group" aria-label="화면 크기">' +
      '<div class="zoom-top">' + icon('textsize', 20) + '<span>화면 크기</span><b class="zoom-val" aria-hidden="true">' + z + '%</b></div>' +
      '<div class="zoom-row">' +
      '<button type="button" class="icon-btn zoom-btn" data-action="zoom-out" aria-label="화면 작게"' + (i <= 0 ? ' disabled' : '') + '>' + icon('minus', 18) + '</button>' +
      '<input type="range" class="zoom-range" min="0" max="' + (steps.length - 1) + '" step="1" value="' + i + '" aria-label="화면 크기" aria-valuetext="' + z + '%">' +
      '<button type="button" class="icon-btn zoom-btn" data-action="zoom-in" aria-label="화면 크게"' + (i >= steps.length - 1 ? ' disabled' : '') + '>' + icon('plus', 18) + '</button>' +
      '</div></div>';
  }
  function themeSeg() {
    var t = root.getAttribute('data-theme');
    return '<div class="seg" role="group" aria-label="화면 밝기">' +
      '<button type="button" data-theme-btn="light" aria-pressed="' + (t === 'light') + '">' + icon('sun', 18) + '밝게</button>' +
      '<button type="button" data-theme-btn="dark" aria-pressed="' + (t === 'dark') + '">' + icon('moon', 18) + '어둡게</button></div>';
  }

  // ============================================================ 시작
  function init() {
    setTheme(stGet('gy.theme') === 'dark' ? 'dark' : 'light');
    setDesign(designNow());
    applyZoom();
    var h = (location.hash || '').replace('#', '');
    if (menuItem(h)) S.screen = h;
    // 로그인이 기억된 기기는 시작 정보·로그인 상태·홈을 한 번에(boot) 받는다. 안 되면(예전 서버 파일 등) 예전처럼 차례로
    var first = stGet('gy.login')
      ? server('boot', { home: S.screen === 'home' }).then(function (b) {
        S.start = b.start;
        if (!b.start.ready) return showNotReady();
        if (b.home) memoPut('home', {}, b.home);
        return afterSession(b.session);
      }, function (e) {
        if (e.code !== 'LOGIN') return startStepByStep();
        // 로그인이 풀렸으면 로그인 화면은 authTrouble이 띄운다. 이름 고르기에 쓸 시작 정보만 받아 둔다
        server('start').then(function (st) { S.start = st; }).catch(function () {});
      })
      : startStepByStep();
    first.catch(function (e) {
      if (e.code === 'LOGIN') return;
      $app.innerHTML = gateWrap('<div class="gate-card"><h1>잠깐 문제가 생겼어요</h1><p class="muted" style="margin:0">' + esc(e.message) + '</p>' + detailHtml(e) +
        '<button type="button" class="btn btn-primary btn-block" data-action="reload">다시 열기</button></div>');
    }).then(introDone, introDone);
  }

  /** 여는 그림(인트로, Index.html): 첫 화면(홈·로그인·이름 고르기·오류)을 그린 뒤 알린다. 인사에 고른 이름과 학교 이름을 쓴다 */
  function introDone() {
    try {
      if (window.GYIntro && window.GYIntro.ready) window.GYIntro.ready({ name: S.me ? S.me.name : '', school: S.start && S.start.school ? S.start.school : '' });
    } catch (e) { /* 인트로가 없거나 멈춰도 앱은 그대로 */ }
  }

  /** 차례로 열기: 시작 → (로그인이 기억돼 있으면) 로그인 상태 */
  function startStepByStep() {
    return server('start').then(function (st) {
      S.start = st;
      if (!st.ready) return showNotReady();
      if (!stGet('gy.login')) return showLogin();
      return server('session').then(afterSession);
    });
  }

  function afterSession(s) {
    S.me = s.me;
    S.admin = s.admin;
    S.todoCount = s.todoCount || 0;
    S.noticeLatest = s.noticeLatest || '';
    if (!s.me) stDel('gy.identity');
    if (!s.admin) stDel('gy.admin');
    if (!S.me && stGet('gy.skipIdentity') !== '1') return showIdentity();
    renderApp();
  }

  function gateWrap(inner, opts) {
    opts = opts || {};
    var school = S.start ? S.start.school : '인천장도초등학교';
    return '<div class="gate print-root">' +
      '<div class="gate-top"><span class="brand" style="padding:0;cursor:default"><span class="brand-mark emblem" aria-hidden="true"></span>' +
      '<span class="brand-text"><span class="brand-sub">' + esc(school) + '</span><span class="brand-name">온라인 교무실</span></span></span>' +
      '<button type="button" class="icon-btn" data-action="theme-toggle" aria-label="' + (root.getAttribute('data-theme') === 'dark' ? '밝은 화면으로 바꾸기' : '어두운 화면으로 바꾸기') + '">' +
      icon(root.getAttribute('data-theme') === 'dark' ? 'sun' : 'moon') + '</button></div>' +
      (window.__previewNote ? '<div class="preview-banner">' + window.__previewNote + '</div>' : '') +
      inner +
      (opts.foot ? '<p class="gate-foot">' + opts.foot + '</p>' : '') +
      '</div>';
  }

  function showNotReady() {
    $app.innerHTML = gateWrap('<div class="gate-card"><span class="glow" aria-hidden="true"></span>' +
      '<h1>아직 준비 중이에요</h1>' +
      '<p class="muted" style="margin:0">연구부장·부담당이 전용 시트에서 처음 설정과 공통 비밀번호 정하기를 마치면 열려요.</p></div>');
  }

  // ============================================================ 1) 공통 로그인
  function showLogin(msg) {
    closeModal();
    $app.innerHTML = gateWrap(
      '<form class="gate-card" id="login-form" novalidate><span class="glow" aria-hidden="true"></span>' +
      '<div><p class="kicker">교직원만 들어올 수 있어요</p><h1>어서 오세요</h1></div>' +
      '<div class="field"><label class="label" for="login-pw">공통 비밀번호</label>' +
      '<div class="pw-wrap"><input id="login-pw" class="input" type="password" autocomplete="current-password" required>' +
      '<button type="button" class="icon-btn" data-action="pw-eye" data-for="login-pw" aria-label="비밀번호 보이기">' + icon('eye') + '</button></div></div>' +
      '<p class="err" id="login-err" role="alert">' + esc(msg || '') + '</p>' +
      '<button type="submit" class="btn btn-primary btn-block">들어가기</button>' +
      '<p class="hint">' + icon('info', 16) + '<span>비밀번호는 연구부장·부담당에게 물어보세요. 학기 초에 바뀔 수 있어요.</span></p>' +
      '</form>', { foot: '학생 정보와 개인 연락처는 이곳에 올리지 않아요.' });
    var f = qs('#login-form');
    setTimeout(function () { var i = qs('#login-pw'); if (i) i.focus(); }, 50);
    f.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var pw = qs('#login-pw').value;
      var err = qs('#login-err');
      if (!pw) { err.textContent = '공통 비밀번호를 넣어 주세요.'; return; }
      var btn = f.querySelector('[type=submit]');
      busy(btn, true, '확인하는 중');
      err.textContent = '';
      server('login', { password: pw }).then(function (r) {
        stSet('gy.login', r.login, r.remember);
        stDel('gy.skipIdentity');
        showIdentity();
      }).catch(function (e) {
        busy(btn, false);
        err.textContent = e.message;
        qs('#login-pw').select();
      });
    });
  }

  // ============================================================ 2) 본인 확인
  function showIdentity(opts) {
    opts = opts || {};
    closeModal();
    $app.innerHTML = gateWrap('<div class="gate-card"><div class="loading"><span class="spin" aria-hidden="true"></span>교직원 명단을 불러오는 중이에요</div></div>');
    server('staffPicker').then(function (list) {
      S.cache.picker = list;
      drawIdentity(list, opts);
    }).catch(function (e) {
      if (e.code === 'LOGIN') return;
      $app.innerHTML = gateWrap('<div class="gate-card"><h1>명단을 불러오지 못했어요</h1><p class="err">' + esc(e.message) + '</p>' +
        '<button type="button" class="btn btn-primary btn-block" data-action="identity">다시 하기</button></div>');
    });
  }

  function drawIdentity(list, opts) {
    var days = (S.start && S.start.rememberDays) || 365;
    var dayText = days % 365 === 0 ? (days / 365) + '년' : days + '일';
    var pin = !!(S.start && S.start.pinMode);
    $app.innerHTML = gateWrap(
      '<form class="gate-card" id="id-form" novalidate><span class="glow" aria-hidden="true"></span>' +
      '<div><p class="kicker">본인 확인</p><h1>누구신가요?</h1>' +
      '<p class="muted" style="margin:6px 0 0;font-size:16px">' + (pin
        ? '이름을 고르고 개인 번호 4자리를 넣어 주세요. 일정을 넣거나 조사에 답할 때 누가 했는지 남아요.'
        : '명단에서 내 이름을 골라 주세요. 일정을 넣거나 조사에 답하면 고른 이름으로 남아요.') + '</p></div>' +
      (list.length
        ? '<div class="field"><label class="search" for="id-find">' + icon('search', 20) +
          '<span class="sr-only">이름으로 찾기</span><input id="id-find" type="search" placeholder="이름으로 찾기" autocomplete="off"></label></div>' +
          '<div class="people" id="id-people" role="radiogroup" aria-label="교직원 명단"></div>'
        : '<div class="box muted">아직 교직원 명단이 비어 있어요. 연구부장·부담당이 관리자 화면에서 명단을 넣으면 고를 수 있어요.</div>') +
      (pin ? '<div class="field"><label class="label" for="id-pin">개인 번호 4자리</label>' +
        '<input id="id-pin" class="input input-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off"></div>' : '') +
      '<label class="check"><input type="checkbox" id="id-remember"' + (pin ? '' : ' checked') + '>이 기기에서 기억하기 (' + dayText + ')</label>' +
      '<p class="hint">' + icon('info', 16) + '<span>' + (pin
        ? '기억하기는 내 휴대폰에서만 켜 주세요. 교무실 공용 PC에서는 꺼 두세요. 번호를 잊었다면 연구부장·부담당에게 다시 받으세요.'
        : '여러 사람이 함께 쓰는 교무실 PC에서는 기억하기를 꺼 주세요. 다른 분이 내 이름으로 기록하지 않게요.') + '</span></p>' +
      '<p class="err" id="id-err" role="alert"></p>' +
      '<button type="submit" class="btn btn-primary btn-block"' + (list.length ? '' : ' disabled') + '>확인</button>' +
      '<button type="button" class="btn btn-ghost" data-action="skip-identity">나중에 할게요 (보기만 하기)</button>' +
      '</form>', { foot: '<button type="button" class="linkish" data-action="logout">나가기</button>' });

    var $people = qs('#id-people');
    function drawPeople(q) {
      if (!$people) return;
      q = (q || '').trim();
      var shown = list.filter(function (p) {
        return !q || (p.name + ' ' + p.group + ' ' + p.dept + ' ' + p.position).indexOf(q) >= 0;
      });
      var checked = (qs('input[name=who]:checked') || {}).value;
      $people.innerHTML = shown.length ? shown.map(function (p) {
        return '<label class="person' + (checked === p.id ? ' on' : '') + '"><input type="radio" name="who" value="' + esc(p.id) + '"' + (checked === p.id ? ' checked' : '') + '>' +
          '<span class="avatar" aria-hidden="true">' + esc(p.name.charAt(0)) + '</span>' +
          '<span class="person-lines"><span class="person-name">' + esc(p.name) + '</span>' +
          '<span class="person-sub">' + esc([p.position, p.group, p.dept].filter(Boolean).join(' · ')) + '</span></span>' +
          (p.hasPin || !pin ? '' : '<span class="chip chip-warn">번호 없음</span>') + '</label>';
      }).join('') : '<p class="empty">찾는 이름이 없어요.</p>';
    }
    drawPeople('');
    var find = qs('#id-find');
    if (find) find.addEventListener('input', function () { drawPeople(find.value); });
    var pinBox = qs('#id-pin');
    if (pinBox) pinBox.addEventListener('input', function () { pinBox.value = pinBox.value.replace(/\D/g, '').slice(0, 4); });
    if ($people) $people.addEventListener('change', function () {
      qsa('.person', $people).forEach(function (l) { l.classList.toggle('on', l.querySelector('input').checked); });
      var p = list.filter(function (x) { return x.id === (qs('input[name=who]:checked') || {}).value; })[0];
      qs('#id-err').textContent = pin && p && !p.hasPin ? '아직 개인 번호가 없어요. 연구부장·부담당에게 받아 주세요.' : '';
      if (pin && p && p.hasPin) pinBox.focus();
    });

    qs('#id-form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var who = (qs('input[name=who]:checked') || {}).value;
      var err = qs('#id-err');
      if (!who) { err.textContent = '명단에서 이름을 골라 주세요.'; return; }
      if (pin && !/^\d{4}$/.test(pinBox.value)) { err.textContent = '개인 번호 4자리를 숫자로 넣어 주세요.'; pinBox.focus(); return; }
      var remember = qs('#id-remember').checked;
      var btn = ev.target.querySelector('[type=submit]');
      busy(btn, true, '확인하는 중');
      err.textContent = '';
      server('verify', { staffId: who, pin: pin ? pinBox.value : '', remember: remember }).then(function (r) {
        stSet('gy.identity', r.identity, remember);
        if (r.login) stSet('gy.login', r.login, true);
        stDel('gy.skipIdentity');
        S.me = r.me;
        S.todoCount = 0;
        forgetScreens(); // 고른 이름으로 다시 받는다
        renderApp();
        toast(r.me.name + ' 선생님, 본인 확인이 됐어요');
        server('session').then(function (s2) { setTodoCount(s2.todoCount || 0); }).catch(function () {});

  // ============================================================ 화면들
  function pageHead(kicker, title, lead, right) {

      '<h1 class="title">' + title + '</h1>' + (lead ? '<p class="lead">' + lead + '</p>' : '') + '</div>' + (right || '') + '</header>';

  function todayText() {
    var d = new Date();
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + '일월화수목금토'.charAt(d.getDay()) + '요일';
  }

  var SCREENS = {};

  // ============================================================ 날짜·일정 도구
  var DOW = '일월화수목금토';
  function ymdUtc(s) { var p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function ymdOf(t) {
    var d = new Date(t);
    return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2);
  }
  function addD(s, n) { return ymdOf(ymdUtc(s) + n * 86400000); }
  function wd(s) { return new Date(ymdUtc(s)).getUTCDay(); }
  function mondayOf(s) { var w = wd(s); return addD(s, w === 0 ? -6 : 1 - w); }
  function md(s) { return Number(s.slice(5, 7)) + '월 ' + Number(s.slice(8, 10)) + '일'; }
  function mdw(s) { return md(s) + ' (' + DOW.charAt(wd(s)) + ')'; }
  function dayNum(s) { return Number(s.slice(8, 10)); }
  function localToday() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function isOff(e) { return e.kind === '휴업일' || e.kind === '공휴일'; }
  function onDay(e, d) { return e.start <= d && e.end >= d; }
  function timeText(e) { return e.time || (e.end !== e.start ? md(e.start) + '~' + md(e.end) : '종일'); }
  function targetText(t) {
    if (!t) return '';
    return t.split(',').map(function (x) { return /^\d$/.test(x) ? x + '학년' : x; }).join('·')
      .replace(/(\d)학년·(?=\d)/g, '$1·');
  }
  function metaText(e) { return [e.place, e.dept].filter(Boolean).join(' · '); }
  function myGrade() {
    var m = S.me && /(\d)\s*학년/.exec(S.me.group || '');
    return m ? m[1] : '';
  }
  function isPhone() { return window.matchMedia('(max-width: 899px)').matches; }
  function isWide() { return window.innerWidth / zoomFactor() >= 1200; } // 화면 크기를 키우면 그만큼 좁은 화면처럼
  function zoomFactor() {
    var z = parseFloat(getComputedStyle(root).getPropertyValue('--gy-zoom'));
    return z > 0 ? z : 1;
  }

  /** 필터: grade('', '1'~'6', '교직원'), dept(부서ID), mine */
  function passFilter(e, f) {
    if (f.grade) {
      var list = (e.target || '').split(',');
      if (e.target) {
        if (f.grade === '교직원') { if (list.indexOf('교직원') < 0) return false; }
        else if (list.indexOf('전체') < 0 && list.indexOf(f.grade) < 0) return false;
      }
    }
    if (f.dept && e.deptId !== f.dept) return false;
    if (f.imp && !e.important) return false;
    if (f.mine) {
      if (!S.me) return false;
      if (!(S.me.deptId && e.deptId === S.me.deptId) && e.byId !== S.me.id) return false;
    }
    return true;
  }

  /** 일정 한 칸. opts.drag(그 칸의 날짜)를 주면 고칠 수 있는 일정은 끌어서 옮길 수 있다(달력) */
  function evChip(e, opts) {
    opts = opts || {};
    var cls = 'ev' + (isOff(e) ? ' ev-off' : e.important ? ' ev-imp' : e.kind === '교육활동' ? ' ev-act' : '');
    return '<button type="button" class="' + cls + '" data-action="ev-open" data-ev="' + esc(e.id) + '"' +
      (opts.drag && e.canEdit ? ' data-drag="1" data-from="' + esc(opts.drag) + '" title="끌어서 다른 날로 옮길 수 있어요"' : '') + '>' +
      (opts.prefix ? '<span class="ev-pre">' + opts.prefix + '</span>' : '') + (e.important ? starHtml() : '') + esc(e.title) + '</button>';
  }

  function starHtml() {

  /** 오늘·하루 일정 한 줄(시간 | 이름 | 장소·부서) */
  function evRow(e) {
    return '<button type="button" class="ev-row' + (isOff(e) ? ' off' : '') + (e.important ? ' imp' : '') + '" data-action="ev-open" data-ev="' + esc(e.id) + '">' +
      '<span class="ev-time">' + esc(timeText(e)) + '</span>' +
      '<span class="ev-main"><span class="ev-title">' + (e.important ? starHtml() : '') + esc(e.title) + '</span>' +

      (e.target && e.target !== '전체' ? '<span class="chip">' + esc(targetText(e.target)) + '</span>' : '') + '</span></button>';
  }

  /** 일정을 들고 있는 곳들. 지금 보는 화면의 것을 먼저 본다 */
  function eventPools() {
    var home = S.home && S.home.events, month = S.sched.data && S.sched.data.events, year = S.sched.yearData && S.sched.yearData.events,
      found = S.search && S.search.events && S.search.events.items;
    return S.screen === 'schedule' ? [month, year, found, home] : S.screen === 'search' ? [found, home, month, year] : [home, month, year, found];
  }
  function eventById(id) {
    var pools = eventPools();
    for (var i = 0; i < pools.length; i++) {
      var hit = (pools[i] || []).filter(function (e) { return e.id === id; })[0];
      if (hit) return hit;
    }
    return null;
  }
  /** 저장·지운 일정을 들고 있는 모든 곳에 바로 반영한다(다른 화면에서 다시 열어도 옛 내용이 나오지 않게) */
  function patchEvent(saved, removedId) {
    eventPools().forEach(function (list) {
      if (!list) return;
      for (var i = list.length - 1; i >= 0; i--) {
        if (list[i].id !== (saved ? saved.id : removedId)) continue;
        if (saved) list[i] = saved; else list.splice(i, 1);
      }
    });
  }

      '<div class="week">' + days.map(function (d) {
