      case 'notice-open': openNotice(id); break;
      case 'notice-all': S.notice.tab = 'notice'; go('notice'); break; // 홈·공지 창의 '모두 보기'는 늘 공지 탭(회의록 탭을 보던 창이어도)
      case 'notice-view': S.notice.view = t.getAttribute('data-v'); drawNotices(); break;
      case 'notice-tab': S.notice.tab = t.getAttribute('data-v') === 'meet' ? 'meet' : 'notice'; SCREENS.notice(qs('#screen')); break;
      case 'meet-new':
        if (S.screen === 'notice' && S.notice.tab === 'meet' && S.meet.data) openMeetForm(null);
        else if (needMe('회의를 만들면')) { S.notice.tab = 'meet'; S.meet.openId = ''; S.meet.view = 'list'; go('notice'); }
        break;
      case 'meet-kind': S.meet.kind = id || ''; drawMeetList(); break;
      case 'meet-open': openMeet(id); break;
      case 'meet-goto': // 검색·일정 창·홈 '내가 할 일'에서 회의록 하나를 바로 연다(쓰기면 그 칸 쓰기 창까지)
        S.notice.tab = 'meet'; S.meet.openId = id; S.meet.view = 'detail'; S.meet.autoWrite = t.getAttribute('data-k') || '';
        if (S.meet.detail && S.meet.detail.meeting.id !== id) S.meet.detail = null;
        go('notice');
        break;
      case 'meet-copy': meetCopy(t.getAttribute('data-v')); break;
      case 'meet-back':
        S.meet.openId = ''; S.meet.view = 'list'; S.meet.detail = null;
        if (S.meet.data && memoGet('meet.list', {})) drawMeetList(); else loadMeet();
        break;
      case 'meet-edit': if (S.meet.detail) openMeetForm(S.meet.detail.meeting); break;
      case 'meet-del':
        var md0 = S.meet.detail && S.meet.detail.meeting;
        if (md0) confirmBox('회의록 지우기', '"' + esc(md0.title) + '" 회의록을 지울까요? 관리자가 휴지통에서 되살릴 수 있어요.', '지우기', function () {
          return server('meet.delete', { id: md0.id }, [['meet.list', {}]]).then(function () {
            if (md0.schedId) { memoForget('sched.'); memoForget('home'); memoForget('search'); } // 이어진 일정도 함께 지웠다
            closeModal();
            toast('회의록을 지웠어요');
            S.meet.openId = ''; S.meet.view = 'list'; S.meet.detail = null;
            loadMeet();
          });
        }, true);
        break;
      case 'meet-write': openMeetWrite('row', t.getAttribute('data-k')); break;
      case 'meet-etc-add': openMeetWrite('etc-add'); break;
      case 'meet-etc-edit': openMeetWrite('etc-edit', id); break;
      case 'meet-etc-del':
        var mdm = S.meet.detail && S.meet.detail.meeting;
        if (mdm) confirmBox('안건 빼기', '이 안건을 뺄까요? 관리자는 수정 기록에서 뺀 내용을 볼 수 있어요.', '빼기', function () {
          return server('meet.etc.delete', { eid: id }, [['meet.get', { id: mdm.id }]]).then(function () {
            closeModal();
            toast('안건을 뺐어요');
            refreshMeet(mdm.id);
          });
        }, true);
        break;
      case 'meet-print': printMeet(); break;
      case 'meet-docx': meetDocxSave(); break;
      case 'trash-restore-mt':
        server('admin.trash.restoreMeeting', { id: id }).then(function () {
          toast('회의록을 되살렸어요');
          adminTrash(qs('#admin-panel'));
        }).catch(function (e2) { toast(e2.message, 'error'); });
        break;
      case 'notice-older': S.notice.older = true; busy(t, true, '불러오는 중'); loadNotices(); break;
      case 'notice-edit': openNoticeForm(noticeById(id)); break;
      case 'notice-del':
        var nd2 = noticeById(id);
        confirmBox('공지 지우기', '"' + esc(nd2.title) + '" 공지를 지울까요? 관리자가 휴지통에서 되살릴 수 있어요.', '지우기', function () {
          return server('notice.delete', { id: id }, noticeThen()).then(function () {
            closeModal(); S.home = null; toast('공지를 지웠어요');
            if (S.screen === 'home') return SCREENS.home(qs('#screen'));
            return loadNotices();
          });
        }, true);
        break;
      case 'check-again': adminCheck(qs('#admin-panel')); break;
      case 'speed-run': speedRun(); break;
      case 'sheet-trim':
        confirmBox('빈 열 지우기', '온라인 교무실 탭마다 머리글과 글이 없는 오른쪽 열을 지워요. 자료는 그대로예요. 지울까요?', '지우기', function () {
          return server('admin.sheet.trim').then(function (r) { closeModal(); toast('빈 열 ' + Number(r.cut).toLocaleString() + '칸을 지웠어요'); adminCheck(qs('#admin-panel')); });
        });
        break;
      case 'cache-clear':
        server('admin.cache.clear').then(function (r) {
          toast(r.done ? '서버 기억을 비웠어요. 다음 화면부터 시트에서 새로 읽어요' : '서버 기억을 쓸 수 없어요. 늘 시트에서 읽고 있어요');
        }).catch(function (e) { toast(e.message, 'error'); });
        break;
      case 'staff-import': openStaffImport(); break;
      case 'imp-template':
        saveBlob(templateXlsx(S.start && S.start.year, [['이름', '직위', '소속', '부서', '담당 업무', '내선', '역할', '순서'],
          ['(예시) 홍길동', '교사', '3학년 1반', '연구부', '교육과정', '101', '관리', '1']], '교직원'), '교직원_명단_양식.xlsx');
        toast('양식을 내려받았어요');
        break;
      case 'imp-read':
        var itxt = qs('#imp-paste').value;
        qs('#imp-err').textContent = '';
        if (!itxt.trim() && !S.imp.pasteGrid) { qs('#imp-err').textContent = '명단 표를 붙여 넣거나 파일을 골라 주세요.'; break; }
        staffImportCheck({ grid: S.imp.pasteGrid || parseDelimited(itxt) });
        break;
      case 'imp-go': staffImportGo(t); break;
      case 'help-new': openHelpForm(null); break;
      case 'help-safety':
        confirmBox('안전·생활교육 안내 만들기', "도움말에 '안전·생활교육' 분류와 빈 글 2개(대피 경로·집결지, 학교폭력 사안 처리 순서)를 만들어요. 글에는 '여기에 적어 주세요'만 들어 있어요. 학교에서 정한 내용을 적은 뒤, 급할 때 볼 글은 고치기에서 '홈에 보이기'를 켜 주세요.", '만들기', function () {
          return server('help.seedSafety', {}, [['help.list', {}]]).then(function (r) {
            closeModal();
            toast(r.made ? '안내 글 ' + r.made + '개를 만들었어요. 내용을 적어 주세요' : '이미 만들어져 있어요');
            S.help.kind = r.kindId; S.help.q = '';
            loadMemo('help.list', {}, function (d2) { S.help.data = d2; if (S.screen === 'help') drawHelp(); }, function (e) { toast(e.message, 'error'); });
          });
        });
        break;
      case 'sos-open': S.help.q = ''; S.help.kind = ''; S.help.openId = id; go('help'); break;
      case 'help-edit': openHelpForm(helpById(id)); break;
      case 'help-kind': S.help.kind = id || ''; drawHelp(); break;
      case 'help-del':
        var hd = helpById(id);
        confirmBox('도움말 지우기', '"' + esc(hd.title) + '" 글을 지울까요? 관리자가 휴지통에서 되살릴 수 있어요.', '지우기', function () {
          return server('help.delete', { id: id }).then(function () {
            S.help.data.items = S.help.data.items.filter(function (x) { return x.id !== id; });
            closeModal(); drawHelpList(); toast('도움말을 지웠어요');
          });
        }, true);
        break;
      case 'ny-all':
        var on = t.getAttribute('data-on') === '1';
        qsa('.ny-item input').forEach(function (x) { x.checked = on; });
        var nc = qs('#ny-count'); if (nc) nc.textContent = (on ? qsa('.ny-item input').length : 0) + '/' + qsa('.ny-item input').length;
        break;
      case 'link-add': readLinks(); S.cache.links.push({ name: '', url: '' }); drawLinks(); break;
      case 'link-del': readLinks(); S.cache.links.splice(Number(t.getAttribute('data-i')), 1); drawLinks(); break;
    }
  });

  // 화면에서 무언가 입력하면 뒤에서 받은 새 내용으로 다시 그리지 않는다(쓰던 것이 지워지지 않게)
  document.addEventListener('input', function (e) { if (e.target.closest && e.target.closest('#screen')) screenEdited = true; }, true);
  window.addEventListener('beforeunload', function (e) { if (S.setDirty && qs('#set-form')) { e.preventDefault(); e.returnValue = ''; } });
  // 긴 글 칸(maxlength): 붙여 넣은 글이 잘리면 말없이 자르지 않고 칸 아래에 알린다. 한도에 가까우면 글자 수를 보여 준다(2026-10-28a)
  function lenNote(t, text) {
    var id = (t.id || 'x') + '-len', el = document.getElementById(id);
    if (!text) { if (el) el.parentNode.removeChild(el); return; }
    if (!el) {
      el = document.createElement('p');
      el.id = id; el.className = 'len-note'; el.setAttribute('aria-live', 'polite');
      t.parentNode.insertBefore(el, t.nextSibling);
    }
    el.classList.toggle('err', /들어가지 않았어요|가득/.test(text));
    el.textContent = text;
  }
  document.addEventListener('paste', function (e) {
    var t = e.target;
    if (!t || t.tagName !== 'TEXTAREA' || !(t.maxLength > 0) || t.id === 'tb-ed' || !e.clipboardData) return;
    var clip = e.clipboardData.getData('text/plain').replace(/\r\n?/g, '\n');
    var after = t.value.length - Math.abs((t.selectionEnd || 0) - (t.selectionStart || 0)) + clip.length;
    if (after > t.maxLength) setTimeout(function () { lenNote(t, t.maxLength + '자까지 들어가요. 붙여 넣은 글 중 뒤의 ' + (after - t.maxLength) + '자는 들어가지 않았어요. 나눠서 적거나 줄여 주세요.'); }, 0);
  }, true);
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t || t.tagName !== 'TEXTAREA' || !(t.maxLength >= 300) || t.id === 'tb-ed') return;
    var n = t.value.length, max = t.maxLength, el = document.getElementById((t.id || 'x') + '-len');
    if (el && el.classList.contains('err') && n >= max) return; // 잘렸다는 안내는 줄일 때까지 둔다
    lenNote(t, n >= max ? max + '자가 가득 찼어요' : n >= max * 0.9 ? n + ' / ' + max + '자' : '');
  }, true);
  document.addEventListener('focusout', function () { setTimeout(flushPending, 0); });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (qs('#sheet')) closeSheet();
    else if ($modal.innerHTML && !qs('[data-action="close-pins"]') && !modalOpts.noBackdropClose) userCloseModal();
  });

  // 화면 크기 막대: 끄는 동안은 숫자만 바꾸고, 놓으면(또는 화살표 키) 적용한다
  document.addEventListener('input', function (e) {
    if (!e.target.classList || !e.target.classList.contains('zoom-range')) return;
    var z = zoomSteps()[Number(e.target.value)] || 100;
    var box = e.target.closest('.zoom');
    if (box) qs('.zoom-val', box).textContent = z + '%';
    e.target.setAttribute('aria-valuetext', z + '%');
  });
  document.addEventListener('change', function (e) {
    if (!e.target.classList || !e.target.classList.contains('zoom-range')) return;
    var z = zoomSteps()[Number(e.target.value)];
    if (z) setZoom(z);
  });

  document.addEventListener('change', function (e) {
    var f = e.target.getAttribute && e.target.getAttribute('data-filter');
    if (!f) return;
    S.sched.filter[f] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    drawCal();
  });

  // 화면 폭(또는 화면 크기)이 바뀌어 휴대폰/PC·넓은 화면·홈 사이드바 모양이 달라지면 일정·홈 화면을 다시 그린다
  function shapeNow() { return isPhone() + '/' + isWide() + '/' + homeSide(); }
  var lastShape = shapeNow();
  var resizeTimer, shapeDirty = false;
  /** 모양이 바뀐 화면을 다시 그린다. 창이 열려 있거나 입력하는 중이면 끝난 뒤로 미룬다(쓰던 것이 사라지지 않게) */
  function reshape() {
    if (!shapeDirty || !qs('.app')) return;
    if ($modal.innerHTML || editingNow()) return;
    shapeDirty = false;
    captureEventForm();
    renderApp();
  }
  function shapeCheck() {
    var shape = shapeNow();
    if (shape === lastShape) return;
    lastShape = shape;
    if (S.screen === 'schedule' || S.screen === 'home') { shapeDirty = true; reshape(); }
    updateTabHints();
  }
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      applyZoom(); // 창을 줄이면 화면 크기도 그 폭에서 쓸 수 있는 만큼만
      shapeCheck();
    }, 200);
  });

  // 인쇄할 때는 접힌 도움말도 모두 펼친다
  window.addEventListener('beforeprint', function () { qsa('.help-item').forEach(function (d) { d.open = true; }); });
  // 월별 계획은 A4 세로 한 장에 맞춰 인쇄한다
  window.addEventListener('beforeprint', planPrintStart);
  window.addEventListener('afterprint', planPrintEnd);
  window.addEventListener('afterprint', guideTeacherEnd);

  // 달력에서 일정을 끌어서 옮기기(마우스·터치)
  document.addEventListener('pointerdown', dragDown);
  document.addEventListener('pointermove', dragMove);
  document.addEventListener('pointerup', dragUp);
  document.addEventListener('pointercancel', function () { dragStop(); });
  window.addEventListener('blur', function () { dragStop(); });
  document.addEventListener('touchmove', function (e) { if (drag && drag.on) e.preventDefault(); }, { passive: false }); // 끄는 동안 화면이 같이 넘어가지 않게
  document.addEventListener('contextmenu', function (e) { if (drag) e.preventDefault(); }); // 길게 누를 때 뜨는 메뉴 막기
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && drag) { var on = drag.on; dragStop(); if (on) eatClick(); } });

  window.addEventListener('hashchange', function () {
    var h = (location.hash || '').replace('#', '');
    if (!menuItem(h) || h === S.screen || !qs('.app')) return;
    if (TB && TB.leaving && !TB.leaving(function () { go(h); })) { try { history.replaceState(null, '', '#' + S.screen); } catch (x) {} return; }
    if (!settingsLeaveOk(function () { go(h); })) { try { history.replaceState(null, '', '#' + S.screen); } catch (x) {} return; }
    go(h);
  });

  // 옆으로 밀리는 탭(관리자 탭 등): 더 있으면 끝을 흐리게
  document.addEventListener('scroll', function (e) { if (e.target.classList && (e.target.classList.contains('tabs') || e.target.classList.contains('tg-scroll'))) updateTabHints(); }, true);
  if (window.MutationObserver) {
    var tabTimer;
    new MutationObserver(function () { clearTimeout(tabTimer); tabTimer = setTimeout(updateTabHints, 50); }).observe($app, { childList: true, subtree: true });
  }

  // 취합 시트(TableUi.html)를 붙인다: 화면 도구를 넘겨주면 표 화면과 그 화면의 누르기·키 처리를 스스로 붙인다
  function tableUiAttach() {
    try {
      if (typeof window.__gyTableUi === 'function') {
        TB = window.__gyTableUi({
          S: S, SCREENS: SCREENS, $modal: $modal,
          esc: esc, qs: qs, qsa: qsa, josa: josa, toast: toast, icon: icon, server: server,
          memoPut: memoPut, memoGet: memoGet, memoForget: memoForget, loadMemo: loadMemo,
          pageHead: pageHead, loadingHtml: loadingHtml, failHtml: failHtml, isPhone: isPhone,
          mdw: mdw, md: md, localToday: localToday, addD: addD, ymdUtc: ymdUtc,
          openModal: openModal, closeModal: closeModal, confirmBox: confirmBox, busy: busy, needMe: needMe,
          copyText: copyText, saveBlob: saveBlob, closeSheet: closeSheet
        });
      }
    } catch (e) {
      TB = null;
      if (window.console) console.error('취합 시트 화면을 붙이지 못했어요', e);
    }
    if (!TB) { SCREENS.table = tbMissing; S.table = { tab: 'open', list: null, sel: '', d: null, edit: null, menu: null }; }
    return TB;
  }
  if (window.__gyTableUiLazy && typeof window.__gyTableUi !== 'function') {
    SCREENS.table = tableUiLazyScreen; // 그 화면을 처음 열 때 받는다
    // 메뉴·홈 '채우기'·검색 결과에 손이 가면(마우스를 올리거나 칸으로 옮기면) 미리 받기 시작한다
    var tableUiWarm = function (e) {
      if (tableUiLazy() && e.target && e.target.closest && e.target.closest('[data-go="table"],[data-action="todo-table"],[data-action="sr-table"]')) tableUiLoad().catch(function () {});
    };
    document.addEventListener('pointerover', tableUiWarm, { passive: true });
    document.addEventListener('focusin', tableUiWarm);
  } else tableUiAttach();

  // 미리보기·자동 점검에서 쓰는 창구
  window.__gy = { S: S, go: go, renderApp: renderApp, server: server, init: init, memoClear: memoClear, toast: toast, tableUi: function () { return TB; } };

  init();
})();
</script>
