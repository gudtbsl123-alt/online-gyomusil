<style>
/* ---------- 취합 시트(TableUi.html, 판 2026-10-18b. 예전 이름 '함께 쓰는 표'): 구글 시트처럼 여럿이 한 표를 채운다 ----------
 * 표 하나에 시트(탭) 여러 개, 도구 막대(글꼴·크기·굵게·색·테두리·합치기·맞춤·줄 바꿈), 열 너비·줄 높이 끌기, 왼쪽 열 고정·줄 간격,
 * 정렬·걸러 보기(내 화면만), 찾기·바꾸기. 색은 시안의 CSS 변수만 쓴다(장도·종이색 디자인에서도 그대로)
 */
.wrap.tb-full{max-width:none}
.tb-list{display:flex;flex-direction:column;gap:12px}
.tb-card{display:flex;flex-direction:column;align-items:stretch;gap:8px;width:100%;padding:20px 22px;border:1px solid var(--c-line);border-radius:18px;background:var(--c-card);color:var(--c-t1);font:inherit;text-align:left;cursor:pointer}
.tb-chips{display:flex;flex-wrap:wrap;gap:6px}
.tb-card-t{font-size:19px;font-weight:800;line-height:1.35;letter-spacing:-0.02em}
.tb-meta{font-size:15px;color:var(--c-t3)}
.tb-prog{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--c-t2)}
.tb-prog b{flex:none;font-weight:700}
.tb-shts{display:flex;flex-wrap:wrap;gap:6px}
.tb-shts span{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:9999px;background:var(--c-card2);color:var(--c-t2);font-size:14px;font-weight:700}
.tb-shts span small{font-size:12px;font-weight:800;color:var(--c-okFg)}
.tb-page{display:flex;flex-direction:column;gap:16px}
.tb-back{align-self:flex-start}
.page-head .tb-actions{display:flex;flex-direction:row;flex-wrap:wrap;gap:6px;align-self:flex-end}
.tb-desc{margin:0;white-space:pre-line;color:var(--c-t2)}
.tb-desc b{color:var(--c-t1)}
.tb-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tb-live{display:inline-flex;align-items:center;gap:8px;margin-left:auto;font-size:14px;color:var(--c-t3)}
.tb-live .dot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--c-okFg);box-shadow:0 0 0 4px var(--c-okBg)}
.tb-live.off .dot{background:var(--c-warnFg);box-shadow:0 0 0 4px var(--c-warnBg)}
.tb-missing{display:flex;flex-direction:column;gap:12px}
/* 숫자 열·할 일 열·목록 찾기·휴대폰 줄 찾기(판 2026-10-19a) */
.tb-grid td.num{text-align:right;font-variant-numeric:tabular-nums}
.tb-grid th .td{display:inline-flex;vertical-align:-2px;margin-left:4px;color:var(--accent)}
.tb-sum b{font-weight:800;color:var(--c-t1)}
.tb-todo{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px}
.tb-todo .btn{min-height:30px}
.tb-lfind{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tb-lfind .search{flex:1 1 260px;height:44px}
.tb-lfind select{flex:0 1 200px;width:auto}
.tb-rfind{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.tb-rfind .search{flex:1 1 180px;height:44px}
.tb-rfind .chip{min-height:40px;padding:0 14px;border:0;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.tb-rfind .chip[aria-pressed="true"]{background:var(--accent);color:var(--c-onAccent)}

/* 시트 상자: 도구 막대 + (찾기·걸러 보기 알림) + 표 + 시트 탭 */
.tb-box{display:flex;flex-direction:column;border:1px solid var(--c-line);border-radius:16px;background:var(--c-card)}
.tb-box>:first-child{border-top-left-radius:15px;border-top-right-radius:15px}
.tb-box>:last-child{border-bottom-left-radius:15px;border-bottom-right-radius:15px}
.tb-tools{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--c-line);background:var(--c-card)}
.tb-tools .tsep,.tb-find .tsep{flex:none;width:1px;height:22px;margin:0 5px;background:var(--c-line)}
.tb-tb{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:1px;flex:none;min-width:34px;height:34px;padding:0 5px;border:0;border-radius:8px;background:transparent;color:var(--c-t2);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.tb-tb .chv{display:inline-flex;color:var(--c-t3)}
.tb-tb[aria-pressed="true"],.tb-tb[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent)}
.tb-tb[aria-expanded="true"] .chv{color:var(--accent)}
.tb-tb:disabled{opacity:.35;cursor:default}
.tb-tb:focus-visible{outline:2px solid var(--accent-ring);outline-offset:1px}
.tb-tb .cbar{position:absolute;left:8px;width:20px;bottom:3px;height:4px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.tb-tb.wide{min-width:128px;justify-content:space-between;gap:6px;padding:0 6px 0 10px;box-shadow:inset 0 0 0 1px var(--c-line2);font-weight:600;color:var(--c-t1)}
.tb-tb.wide span:first-child{max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-fs{display:inline-flex;align-items:center;flex:none;height:34px;margin-left:4px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--c-line2)}
.tb-fs .tb-tb{min-width:28px;padding:0}
.tb-fs input{width:34px;height:30px;padding:0;border:0;background:transparent;color:var(--c-t1);font:inherit;font-size:14px;font-weight:700;text-align:center}
.tb-fs input:focus{outline:2px solid var(--accent-ring);border-radius:6px}
.tb-tools .tb-sp{flex:1 1 auto}
.tb-tools .tb-viewbtn{padding:0 8px 0 7px;gap:4px}
.tb-tools.ro .tb-fmt{display:none}
.tb-local{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px 10px 14px;border-bottom:1px solid var(--c-line);background:var(--accent-soft);color:var(--c-t1);font-size:15px;line-height:1.45}
.tb-local svg{flex:none;color:var(--accent)}
.tb-local .btn{margin-left:auto}
.tb-find{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--c-line);background:var(--c-card)}
.tb-fi{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 10px;border:1px solid var(--c-line2);border-radius:10px;background:var(--c-card);color:var(--c-t3)}
.tb-fi:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tb-fi input{width:150px;padding:0;border:0;background:transparent;color:var(--c-t1);font:inherit;font-size:15px;outline:0}
.tb-find .cnt{min-width:42px;font-size:14px;font-weight:700;color:var(--c-t2);text-align:center}
.tb-find .btn-sm{min-height:38px}
.tb-fnote{font-size:14px;color:var(--c-t3)}
.tb-find .tb-x{margin-left:auto}

/* 표 */
.tb-grid-wrap{position:relative;overflow:auto;max-height:calc((100vh - 176px) / var(--gy-zoom,1));max-height:calc((100dvh - 176px) / var(--gy-zoom,1));background:var(--c-card);overscroll-behavior:contain}
.tb-grid{--tb-bd:var(--c-t1);border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:100%;font-size:15px;line-height:1.45}
:root[data-theme="dark"] .tb-grid{--tb-bd:var(--c-t2)}
.tb-grid th,.tb-grid td{padding:9px 12px;border-right:1px solid var(--c-line);border-bottom:1px solid var(--c-line);text-align:left;vertical-align:middle;overflow:hidden;overflow-wrap:anywhere}
.tb-grid.gap-s td{padding-top:4px;padding-bottom:4px}
.tb-grid.gap-w td{padding-top:15px;padding-bottom:15px}
.tb-grid tbody tr{height:41px}
.tb-grid.gap-s tbody tr{height:31px}
.tb-grid.gap-w tbody tr{height:53px}
.tb-grid th{position:sticky;top:0;z-index:2;background:var(--c-card2);font-size:14px;font-weight:800;color:var(--c-t2);white-space:nowrap;text-overflow:ellipsis;cursor:default}
.tb-grid th.hb-on{padding-right:34px}
.tb-grid th.tb-who{padding-right:12px}
.tb-grid th .lk{display:inline-flex;vertical-align:-2px;margin-left:4px;color:var(--c-t3)}
.tb-grid th.colsel{background:linear-gradient(var(--accent-soft),var(--accent-soft)) var(--c-card2);color:var(--accent)}
.tb-grid th.rn,.tb-grid td.rn{position:sticky;left:0;z-index:1;padding:0;text-align:center;font-size:12px;font-weight:700;color:var(--c-t3);background:var(--c-card2);cursor:default;-webkit-user-select:none;user-select:none}
.tb-grid th.rn{z-index:4}
.tb-grid td.rn.sel{background:linear-gradient(var(--accent-soft),var(--accent-soft)) var(--c-card2);color:var(--accent)}
.tb-grid .frz{position:sticky;z-index:1}
.tb-grid th.frz{z-index:3}
.tb-grid .frz-end{border-right:3px solid var(--c-line2)}
.tb-all{position:absolute;inset:0;width:100%;border:0;background:transparent;cursor:pointer}
.tb-hb{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:26px;height:26px;display:grid;place-items:center;padding:0;border:0;border-radius:6px;background:var(--c-card2);box-shadow:-10px 0 8px -2px var(--c-card2);color:var(--c-t3);cursor:pointer;opacity:0}
.tb-grid th.colsel .tb-hb{background:linear-gradient(var(--accent-soft),var(--accent-soft)) var(--c-card2);box-shadow:none}
.tb-grid th:hover .tb-hb,.tb-hb:focus-visible,.tb-hb.on,.tb-hb[aria-expanded="true"]{opacity:1}
.tb-hb.on{background:linear-gradient(var(--accent-soft),var(--accent-soft)) var(--c-card2);box-shadow:none;color:var(--accent)}
.tb-hb[aria-expanded="true"]{background:var(--c-card);box-shadow:0 0 0 1px var(--c-line2);color:var(--c-t1)}
.tb-cr{position:absolute;top:0;right:0;z-index:2;width:7px;height:100%;cursor:col-resize}
.tb-rr{position:absolute;left:0;right:0;bottom:0;z-index:2;height:7px;cursor:row-resize}
.tb-grid td{background:var(--c-card);cursor:cell;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tb-grid td.ro{color:var(--c-t2);cursor:default}
.tb-grid td.merged{font-weight:800;text-align:center}
.tb-grid td.paint,.tb-prevt td.paint{background:rgb(var(--bg));color:#191F28}
.tb-grid td.paint.paint-dark,.tb-prevt td.paint.paint-dark{color:#FFFFFF}
:root[data-theme="dark"] .tb-grid td.paint,:root[data-theme="dark"] .tb-prevt td.paint{background:linear-gradient(rgba(var(--bg),.26),rgba(var(--bg),.26)) var(--c-card);color:var(--c-t1)}
.tb-grid td.ghost{color:var(--c-t3)!important;font-weight:600!important}
.tb-grid td.sel{box-shadow:inset 0 0 0 9999px var(--accent-soft)}
.tb-grid td.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.tb-grid td.sel.cur{box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 0 9999px var(--accent-soft)}
.tb-grid td.hit{box-shadow:inset 0 0 0 9999px rgba(255,196,0,.30)}
.tb-grid td.hit.now{box-shadow:inset 0 0 0 2px #E39B00,inset 0 0 0 9999px rgba(255,196,0,.46)}
.tb-grid td.saving{opacity:.6}
.tb-grid td.unsaved{box-shadow:inset 0 0 0 2px var(--c-red)}
.tb-unsaved{display:inline-flex;align-items:center;gap:8px;padding:4px 6px 4px 12px;border-radius:9999px;background:var(--c-warnBg);color:var(--c-red);font-size:14px;font-weight:800}
.tb-unsaved .btn{min-height:32px}
.tb-grid td.flash{position:relative;box-shadow:inset 0 0 0 9999px var(--accent-soft)}
.tb-tip{position:absolute;right:4px;top:3px;padding:1px 8px;border-radius:9999px;background:var(--accent);color:var(--c-onAccent);font-size:12px;font-weight:700;line-height:1.5;white-space:nowrap;pointer-events:none;font-style:normal;text-decoration:none}
.tb-grid .tb-who{position:relative;padding-right:40px;font-size:13px;color:var(--c-t3);white-space:nowrap;text-overflow:ellipsis;cursor:default}
.tb-rowbtn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--c-t3);cursor:pointer}
.tb-grid td.tb-none{padding:28px 16px;text-align:center;color:var(--c-t3);cursor:default}
.tb-pick{display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:0 10px;border-radius:9999px;background:var(--c-pill);color:var(--c-t2);font-size:14px;font-weight:800;white-space:nowrap;font-style:normal}
.tb-pick.ok{background:var(--c-okBg);color:var(--c-okFg)}
.tb-pick.other{background:var(--c-warnBg);color:var(--c-warnFg)}
.tb-pick.none{background:transparent;color:var(--c-t3);font-weight:600;box-shadow:inset 0 0 0 1px var(--c-line2)}
.tb-ed{position:absolute;left:-9999px;top:0;z-index:3;margin:0;padding:9px 12px;border:0;border-radius:0;background:var(--c-card);color:var(--c-t1);font:inherit;font-size:15px;line-height:1.45;resize:none;overflow:hidden;opacity:0;pointer-events:none;outline:0}
.tb-ed.on{opacity:1;pointer-events:auto;box-shadow:0 0 0 2px var(--accent),0 8px 24px rgba(0,0,0,.18)}
.tb-ed:focus-visible{outline:0}
.tb-guide-v{position:absolute;top:0;width:2px;margin-left:-1px;background:var(--accent);z-index:6;pointer-events:none}
.tb-guide-h{position:absolute;left:0;height:2px;margin-top:-1px;background:var(--accent);z-index:6;pointer-events:none}
.tb-gtip{position:absolute;z-index:7;padding:4px 10px;border-radius:8px;background:var(--c-t1);color:var(--c-bg);font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none}
.tb-hint{margin:0;font-size:14px;color:var(--c-t3)}
body.tb-resizing,body.tb-resizing *{cursor:col-resize!important}
body.tb-resizing.rows,body.tb-resizing.rows *{cursor:row-resize!important}

/* 시트 탭 */
.tb-tabs{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:4px;padding:6px 8px;border-top:1px solid var(--c-line);background:var(--c-card2)}
.tb-tabs .icon-btn{flex:none;width:38px;height:38px;border-radius:10px}
.tb-tabs .icon-btn[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent)}
.tb-tabs-in{display:flex;gap:4px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.tb-tabs-in.more{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent)}
.tb-tabs-in::-webkit-scrollbar{display:none}
.tb-tab{display:inline-flex;align-items:center;gap:6px;flex:none;max-width:240px;min-height:38px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:var(--c-t2);font:inherit;font-size:15px;font-weight:600;white-space:nowrap;cursor:pointer}
.tb-tab>span:first-child{overflow:hidden;text-overflow:ellipsis}
.tb-tab[aria-selected="true"]{background:var(--c-card);color:var(--accent);font-weight:800;box-shadow:0 0 0 1px var(--c-line),0 2px 6px rgba(0,0,0,.06)}
.tb-tab[aria-selected="true"].own{padding-right:8px}
.tb-tab .tchv{display:grid;place-items:center;width:24px;height:24px;flex:none;border-radius:6px;color:var(--c-t3)}
.tb-tab .tchv[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent)}
.tb-tab .n{display:inline-grid;place-items:center;flex:none;min-width:22px;height:22px;padding:0 6px;border-radius:9999px;background:rgba(255,196,0,.32);color:var(--c-t1);font-size:12px;font-weight:800}
.tb-tabs .tb-tcount{flex:none;padding:0 6px;font-size:13px;font-weight:700;color:var(--c-t3);white-space:nowrap}
.tb-loading{padding:40px 16px;text-align:center;color:var(--c-t3)}
/* 휴대폰: 시트 고르기 */
.tb-msheets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.tb-msheets::-webkit-scrollbar{display:none}
.tb-msheets button{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:40px;padding:0 14px;border:1px solid var(--c-line2);border-radius:9999px;background:var(--c-card);color:var(--c-t2);font:inherit;font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer}
.tb-msheets button[aria-selected="true"]{border-color:transparent;background:var(--accent);color:var(--c-onAccent)}

/* 떠 있는 메뉴·색 고르기·테두리 */
.tb-menu{position:fixed;z-index:75;min-width:180px;max-width:min(340px,calc(100vw - 16px));max-height:min(420px,calc(100vh - 16px));overflow:auto;padding:6px;border:1px solid var(--c-line);border-radius:14px;background:var(--c-card);box-shadow:0 16px 40px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:2px}
.tb-menu>*{flex:none}
.tb-menu.wide{min-width:280px;max-height:min(640px,calc(100vh - 16px))}
.tb-menu button{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--c-t1);font:inherit;font-size:16px;font-weight:600;text-align:left;cursor:pointer}
.tb-menu button[aria-checked="true"]{color:var(--accent);font-weight:800}
.tb-menu button.danger{color:var(--c-red)}
.tb-menu button:disabled{color:var(--c-t3);opacity:.6;cursor:default}
.tb-menu button:focus-visible{outline:2px solid var(--accent-ring);outline-offset:-2px}
.tb-menu button .ck{margin-left:auto;display:inline-flex;color:var(--accent)}
.tb-menu button small{margin-left:auto;padding-left:16px;font-size:13px;font-weight:600;color:var(--c-t3)}
.tb-menu .mh{margin:0;padding:8px 12px 2px;font-size:13px;font-weight:800;color:var(--c-t3)}
.tb-menu hr{width:100%;margin:4px 0;border:0;border-top:1px solid var(--c-line)}
.tb-menu .mnote{margin:0;padding:6px 12px 8px;font-size:13px;line-height:1.45;color:var(--c-t3)}
.tb-menu .tb-fl{display:flex;flex-direction:column;max-height:200px;overflow:auto;margin:2px 4px;padding:4px;border:1px solid var(--c-line);border-radius:10px}
.tb-menu .tb-fl label{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 8px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
.tb-menu .tb-fl label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-menu .tb-fl label input{width:18px;height:18px;flex:none;accent-color:var(--accent)}
.tb-menu .tb-fl label small{margin-left:auto;padding-left:8px;font-size:13px;color:var(--c-t3)}
.tb-menu .tb-flt{display:flex;gap:12px;padding:4px 10px 2px}
.tb-menu .tb-flt button{min-height:30px;padding:0 4px;font-size:14px;font-weight:600;color:var(--c-t2);text-decoration:underline}
.tb-menu .tb-mbtns{display:flex;justify-content:flex-end;gap:6px;padding:6px 4px 2px}
.tb-menu .tb-mbtns button{min-height:38px;padding:0 16px;border:1px solid var(--c-line2);border-radius:10px;background:var(--c-card);font-size:15px;font-weight:700}
.tb-menu .tb-mbtns button.primary{border-color:transparent;background:var(--accent);color:var(--c-onAccent)}
.tb-menu .tb-segrow{display:flex;padding:2px 6px 6px}
.tb-menu .tb-segrow .seg{flex:1}
.tb-menu .tb-segrow .seg button{min-height:36px;padding:0 8px;font-size:14px}
.tb-menu .tb-mfi{display:flex;align-items:center;gap:6px;min-height:40px;margin:2px 2px 4px;padding:0 10px;border:1px solid var(--c-line2);border-radius:10px;color:var(--c-t3)}
.tb-menu .tb-mfi input{flex:1;min-width:0;border:0;background:transparent;color:var(--c-t1);font:inherit;font-size:15px;outline:0}
.tb-menu .tb-sl{min-height:48px}
.tb-menu .tb-sl>span:first-child{display:flex;flex-direction:column;gap:1px;min-width:0;line-height:1.3}
.tb-menu .tb-sl>span:first-child b{font-weight:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-menu .tb-sl>span:first-child small{margin:0;padding:0;font-size:12px}
.tb-pop{position:fixed;z-index:75;display:flex;flex-direction:column;gap:10px;max-width:calc(100vw - 16px);padding:12px;border:1px solid var(--c-line);border-radius:14px;background:var(--c-card);box-shadow:0 16px 40px rgba(0,0,0,.2)}

  /** 홈 '내가 할 일'에 쓰려고 이 시트에서 직접 본 내 남은 줄 수를 기억한다(서버 목록은 10분까지 늦을 수 있어, 그 뒤에 본 것을 믿는다) */

  // ------------------------------------------------------------ 목록

      (l.tables.length ? '<div class="tb-lfind print-hide" role="search"><label class="search">' + icon('search', 20) +

  function tbListMatch(c) {
    var T = S.table, q = String(T.lq || '').replace(/\s+/g, ' ').trim().toLowerCase();

  /** 탭과 카드만 다시 그린다(찾기 칸에 쓰는 동안 한글 입력이 끊기지 않게) */

  function tbCard(c, today) {
    var chips = c.dept ? '<span class="chip chip-accent">' + esc(c.dept) + '</span>' : '';

    else if (c.deadline) {
      var n = Math.round((ymdUtc(c.deadline) - ymdUtc(today)) / 86400000);
      chips += '<span class="chip' + (n <= 7 ? ' chip-warn' : '') + '">마감 ' + esc(mdw(c.deadline)) +
        (n <= 0 ? ' · 오늘 마감' : n === 1 ? ' · 내일 마감' : n <= 7 ? ' · ' + n + '일 남음' : '') + '</span>';
    } else chips += '<span class="chip">마감 없음</span>';
    var sheets = c.sheets || [], many = sheets.length > 1;
    var meta = [c.by ? c.by + ' 선생님이 만듦' : '', many ? '시트 ' + sheets.length + '개' : c.summary.rows + '줄',

  // ------------------------------------------------------------ 표 열기
  function tbArgs() { var T = S.table; return T.sheet ? { id: T.sel, sheet: T.sheet } : { id: T.sel }; }

    var m = memoGet('table.get', tbArgs());

    T.d = null;
    var args = tbArgs();
    server('table.get', args).then(function (d) {

  /** 열·표 정보를 바꾼 뒤(또는 줄이 어긋났을 때) 시트를 새로 받는다. 고르던 칸은 그대로 */

  function tbDrawDetail() {

        (t.cols.some(function (c) { return c.lock; }) ? '자물쇠 열은 만든 분과 연구부장·부담당(그 줄을 더한 분도)만 고칠 수 있어요. ' : '') +

    if (t.canWrite) items.push({ key: 'below', label: '아래에 줄 더하기', icon: icon('plus', 16) });
    items.push({ key: 'edit', label: t.canWrite ? '이 줄 한 번에 고치기' : '이 줄 보기', icon: icon('doc', 16) });
    if (t.canWrite && r.h) items.push({ key: 'fit', label: '줄 높이를 글에 맞추기', icon: ti('rows' in TP ? 'rows' : 'fit', 16) });
    if (tbCanDelRow(r)) items.push({ key: 'del', label: '줄 빼기', icon: icon('x', 16), danger: true });
    tbMenu(btn, items, function (x) {
      if (x.key === 'below') tbRowAdd(rowId);
      else if (x.key === 'edit') tbRowEditor(rowId);
      else if (x.key === 'fit') tbSetHeights([rowId], 0);
      else tbRowDelete(rowId);
    });
  }
  function tbTableMenu(btn) {
    var t = S.table.d.table;
    tbMenu(btn, [
      { key: 'meta', label: '표 이름·마감 고치기' },
      { key: 'cols', label: '열 고치기(이 시트)' },
      { key: 'sheet', label: '시트 더하기' },
      { key: 'open', label: t.closedByHand ? '다시 열기' : t.closed ? '마감 날짜 바꾸기' : '지금 마감' },
      { key: 'del', label: '표 지우기(시트 모두)', danger: true }
    ], function (x) {
      if (x.key === 'meta' || (x.key === 'open' && t.closed && !t.closedByHand)) tbEditMeta();
      else if (x.key === 'cols') tbEditCols();
      else if (x.key === 'sheet') tbNew('sheet');
      else if (x.key === 'open') tbSetOpen(!!t.closedByHand);
      else tbDelete();
    });
  }

  // ------------------------------------------------------------ 표 고치기(만든 분·관리)
  function tbEditMeta() {
    var d = S.table.d, t = d.table, depts = d.depts || [];
    openModal('<h2 id="m-title">표 이름·마감 고치기</h2>' +
      '<div class="field"><label class="label" for="tbe-title">표 이름</label><input class="input" id="tbe-title" maxlength="80" value="' + esc(t.title) + '"></div>' +
      '<div class="form-grid2"><div class="field"><label class="label" for="tbe-dept">담당 부서</label><select class="input" id="tbe-dept"><option value="">정하지 않음</option>' +
      depts.map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === t.deptId ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') +
      (t.deptId && !depts.some(function (x) { return x.id === t.deptId; }) ? '<option value="' + esc(t.deptId) + '" selected>' + esc(t.dept || '지금 부서') + '</option>' : '') + '</select></div>' +
      '<div class="field"><label class="label" for="tbe-deadline">마감 (비우면 없음)</label><input class="input" type="date" id="tbe-deadline" value="' + esc(t.deadline) + '"></div></div>' +
      '<p class="hint">' + icon('info', 16) + '<span>마감 날짜가 지나면(그날까지는 열려 있어요) 만든 분과 연구부장·부담당만 고칠 수 있어요. 표의 시트 모두에 같이 적용돼요.</span></p>' +
      '<div class="field"><label class="label" for="tbe-desc">\'' + esc(t.name) + '\' 시트 설명 (안 써도 돼요)</label><textarea class="input tb-ta" id="tbe-desc" rows="3" maxlength="500">' + esc(t.desc) + '</textarea></div>' +
      '<p class="err" id="tbe-err" role="alert"></p>' +
      '<div class="modal-btns"><button type="button" class="btn" data-action="close-modal">닫기</button><button type="button" class="btn btn-primary" id="tbe-save">저장</button></div>');
    var btn = qs('#tbe-save');
    btn.addEventListener('click', function () {
      var title = qs('#tbe-title').value.trim(), err = qs('#tbe-err'), desc = qs('#tbe-desc').value;
      if (!title) { err.textContent = '표 이름을 적어 주세요.'; qs('#tbe-title').focus(); return; }
      busy(btn, true, '저장하는 중');
      server('table.save', { id: t.doc, fields: { title: title, deptId: qs('#tbe-dept').value, deadline: qs('#tbe-deadline').value } }).then(function () {
        return desc.trim() !== String(t.desc || '').trim() ? server('table.sheet.save', { id: t.id, name: t.name, desc: desc }) : null;
      }).then(function () {
        closeModal();
        toast('표를 고쳤어요');
        tbReload();
      }, function (e) { busy(btn, false); err.textContent = e.message; });
    });
  }

  /** 열 고치기(이 시트): 이름·종류(글/고르기/숫자)·고를 값·잠금·위아래 합침·할 일 열·순서·더하기·빼기 */
  function tbEditCols() {
    var d = S.table.d, t = d.table;
    var list = t.cols.map(function (c) { return { id: c.id, name: c.name, type: c.type, options: c.options.slice(), lock: !!c.lock, merge: !!c.merge, w: c.w || 0, todo: !!c.todo }; });
    openModal('<h2 id="m-title">열 고치기' + (d.doc.sheets.length > 1 ? ' · ' + esc(t.name) : '') + '</h2>' +
      '<p class="hint">' + icon('info', 16) + '<span>잠근 열은 만든 분과 연구부장·부담당(그 줄을 더한 분도)만 고쳐요. 고르기 열은 정해 둔 값 중 하나를 고르고, 맨 앞 값이 표 위에 "끝난 것"으로 세어져요(예: 완료, 미완료). 숫자 열은 표 위에 합계·평균이 나와요. \'위아래 합침\'을 켜면 위아래로 같은 값이 이어지는 칸을 한 칸처럼 보여 줘요. 뺀 열의 내용은 시트에 남아요.</span></p>' +
      '<p class="hint">' + ti('todo', 16) + '<span><b>할 일 열</b>(글 열 하나, 예: 담임)에 이름이 있는 분은 홈 \'내가 할 일\'에 끝나지 않은 줄이 떠요(늦어도 10분 안에). 첫 고르기 열이 맨 앞 값이 되면 끝난 줄이에요. 고르기 열이 없으면 숫자 열이, 숫자 열도 없으면 잠그지 않은 글 열이 모두 채워지면 끝난 줄이에요.</span></p>' +
      '<div class="tb-cols" id="tbc-list"></div>' +
      '<button type="button" class="btn btn-sm" id="tbc-add" style="align-self:flex-start">' + icon('plus', 18) + '열 더하기</button>' +
      '<p class="err" id="tbc-err" role="alert"></p>' +
      '<div class="modal-btns"><button type="button" class="btn" data-action="close-modal">닫기</button><button type="button" class="btn btn-primary" id="tbc-save">저장</button></div>', { wide: true, noBackdropClose: true });
    var box = qs('#tbc-list');
    var read = function () {
      qsa('.tb-colrow', box).forEach(function (row, k) {
        var c = list[k];
        c.name = qs('.tb-cn', row).value;
        c.type = qs('.tb-ct', row).value;
        var o = qs('.tb-co', row);
        if (o) c.options = tbOptList(o.value);
        c.lock = qs('.tb-cl', row).checked;
        c.merge = qs('.tb-cm', row).checked;
        c.todo = c.type === 'text' && qs('.tb-ctd', row).checked;
      });
    };
    var draw = function () {
      box.innerHTML = list.map(function (c, k) {
        return '<div class="tb-colrow" data-k="' + k + '"><span class="tb-colno">' + (k + 1) + '</span>' +
          '<input class="input input-sm tb-cn" value="' + esc(c.name) + '" maxlength="40" aria-label="' + (k + 1) + '번째 열 이름">' +
          '<select class="input input-sm tb-ct" aria-label="' + (k + 1) + '번째 열 종류"><option value="text"' + (c.type !== 'pick' && c.type !== 'num' ? ' selected' : '') + '>글</option>' +
          '<option value="pick"' + (c.type === 'pick' ? ' selected' : '') + '>고르기</option><option value="num"' + (c.type === 'num' ? ' selected' : '') + '>숫자</option></select>' +
          (c.type === 'pick' ? '<input class="input input-sm tb-co" value="' + esc(c.options.join(', ')) + '" placeholder="고를 값(쉼표로 나눠 적기)" aria-label="고를 값">' : '<span class="tb-co-ph"></span>') +
          '<label class="check"><input type="checkbox" class="tb-cl"' + (c.lock ? ' checked' : '') + '>잠금</label>' +
          '<label class="check"><input type="checkbox" class="tb-cm"' + (c.merge ? ' checked' : '') + '>위아래 합침</label>' +
          '<label class="check' + (c.type === 'text' ? '' : ' off') + '" title="글 열 하나만 할 일 열로 정할 수 있어요"><input type="checkbox" class="tb-ctd"' + (c.todo && c.type === 'text' ? ' checked' : '') + (c.type === 'text' ? '' : ' disabled') + '>할 일</label>' +
          '<span class="tb-colbtns"><button type="button" class="icon-btn" data-m="up" aria-label="앞으로"' + (k ? '' : ' disabled') + '>' + icon('up', 18) + '</button>' +
          '<button type="button" class="icon-btn" data-m="down" aria-label="뒤로"' + (k < list.length - 1 ? '' : ' disabled') + '>' + icon('chevd', 18) + '</button>' +
          '<button type="button" class="icon-btn" data-m="del" aria-label="이 열 빼기"' + (list.length > 1 ? '' : ' disabled') + '>' + icon('x', 18) + '</button></span></div>';
      }).join('');
    };
    draw();
    box.addEventListener('change', function (e) {
      if (e.target.classList.contains('tb-ctd')) { // 할 일 열은 하나만
        if (e.target.checked) qsa('.tb-ctd', box).forEach(function (x) { if (x !== e.target) x.checked = false; });
        return;
      }
      if (!e.target.classList.contains('tb-ct')) return;
      read();
      var c = list[+e.target.closest('.tb-colrow').getAttribute('data-k')];
      if (c.type === 'pick' && !c.options.length) c.options = tbOptsFrom(d.rows.map(function (r) { return tbVal(r, c.id); })) || ['완료', '미완료'];
      draw();
    });
    box.addEventListener('click', function (e) {
      var b = e.target.closest('[data-m]');
      if (!b) return;
      read();
      var k = +b.closest('.tb-colrow').getAttribute('data-k'), m = b.getAttribute('data-m');
      if (m === 'up' && k > 0) list.splice(k - 1, 0, list.splice(k, 1)[0]);
      else if (m === 'down' && k < list.length - 1) list.splice(k + 1, 0, list.splice(k, 1)[0]);
      else if (m === 'del' && list.length > 1) list.splice(k, 1);
      draw();
    });
    qs('#tbc-add').addEventListener('click', function () {
      read();
      if (list.length >= 30) { qs('#tbc-err').textContent = '열은 30개까지예요.'; return; }
      list.push({ name: '열 ' + (list.length + 1), type: 'text', options: [], lock: false, merge: false, w: 0, todo: false });
      draw();
      var ins = qsa('.tb-cn', box);
      if (ins.length) { ins[ins.length - 1].focus(); ins[ins.length - 1].select(); }
    });
    var btn = qs('#tbc-save');
    btn.addEventListener('click', function () {
      read();
      var err = qs('#tbc-err');
      var bad = list.filter(function (c) { return c.type === 'pick' && !c.options.length; })[0];
      if (bad) { err.textContent = "'" + (bad.name || '고르기') + "' 열에서 고를 값을 적어 주세요."; return; }
      busy(btn, true, '저장하는 중');
      server('table.cols', { id: t.id, cols: list }).then(function () {
        closeModal();
        toast('열을 고쳤어요');
        tbReload();
      }, function (e2) { busy(btn, false); err.textContent = e2.message; });
    });
  }
  function tbOptList(s) {
    var out = [];
    String(s || '').split(/[,，·\/]/).forEach(function (x) { x = x.trim().slice(0, 20); if (x && out.indexOf(x) < 0) out.push(x); });
    return out.slice(0, 12);
  }
  /** 열의 값으로 고를 값 만들기(12개까지, 짧은 값만) */
  function tbOptsFrom(vals) {
    var uniq = [];
    vals.forEach(function (v) { v = String(v || '').trim(); if (v && v.length <= 20 && uniq.indexOf(v) < 0) uniq.push(v); });
    return uniq.length && uniq.length <= 12 ? tbOptOrder(uniq) : null;
  }

  function tbSetOpen(open) {
    var t = S.table.d.table;
    confirmBox(open ? '표 다시 열기' : '표 지금 마감', open ? '다시 열면 이름을 고른 선생님 모두가 다시 고칠 수 있어요.'
      : '마감하면 만든 분과 연구부장·부담당만 고칠 수 있어요(시트 모두). 나중에 다시 열 수 있어요.', open ? '다시 열기' : '마감하기', function () {
      return server('table.setOpen', { id: t.doc, open: open }).then(function () {
        closeModal();
        toast(open ? '표를 다시 열었어요' : '표를 마감했어요');
        tbReload();
      });
    });
  }
  function tbDelete() {
    var d = S.table.d, t = d.table;
    confirmBox('표 지우기', '"' + esc(t.title) + '" 표를 지울까요?' + (d.doc.sheets.length > 1 ? ' 시트 ' + d.doc.sheets.length + '개가 모두 지워져요.' : '') +
      ' 연구부장·부담당이 관리자 › 휴지통에서 되살릴 수 있어요.', '지우기', function () {
      return server('table.delete', { id: t.doc }).then(function () {
        closeModal();
        toast('표를 지웠어요');
        tbBackToList(true);
      });
    }, true);
  }

  // ------------------------------------------------------------ 엑셀(CSV)·표 복사
  /** 시트의 줄(시트 차례) 값: 합친 칸에 덮인 칸은 빈칸(구글 시트처럼) */
  function tbExportRows() {
    var T = S.table, d = T.d, cols = d.table.cols, hide = {};
    (T.merges || []).forEach(function (m) {
      if (m.run) return;
      for (var a = m.i; a < m.i + m.rs; a++) for (var b = m.j; b < m.j + m.cs; b++) if ((a !== m.i || b !== m.j) && d.rows[a] && cols[b]) hide[d.rows[a].id + '|' + cols[b].id] = 1;
    });
    return d.rows.map(function (r) { return cols.map(function (c) { return hide[r.id + '|' + c.id] ? '' : tbVal(r, c.id); }); });
  }
  function tbCsv() {
    var d = S.table.d, t = d.table, cols = t.cols;
    var cell = function (v) {
      var s = String(v === undefined || v === null ? '' : v);
      if (/^[=+\-@\t\r]/.test(s) && !/^-?\d+(\.\d+)?$/.test(s)) s = "'" + s; // 엑셀 수식으로 읽히지 않게(음수 같은 숫자는 그대로)
      return '"' + s.replace(/"/g, '""') + '"';
    };
    var csv = [cols.map(function (c) { return cell(c.name); }).join(',')].concat(tbExportRows().map(function (line) { return line.map(cell).join(','); })).join('\r\n');
    var name = (t.title + (d.doc.sheets.length > 1 ? ' - ' + t.name : '')).replace(/[\\\/:*?"<>|]/g, '_') + '.csv';
    openModal('<h2 id="m-title">엑셀로 받기</h2>' +
      '<p class="muted" style="margin:0">' + esc(name) + ' · ' + d.rows.length + '줄' + (d.doc.sheets.length > 1 ? ' · 지금 시트만' : '') + '</p>' +
      '<p class="hint">' + icon('info', 16) + '<span>파일이 내려받아지지 않으면 "표 복사"를 누른 뒤 엑셀이나 구글 시트에 붙여 넣으세요(서식도 함께 가요).</span></p>' +
      '<div class="modal-btns"><button type="button" class="btn" data-action="close-modal">닫기</button>' +
      '<button type="button" class="btn" id="tbx-copy">' + icon('copy', 18) + '표 복사</button>' +
      '<button type="button" class="btn btn-primary" id="tbx-dl">' + icon('down', 18) + '파일 내려받기</button></div>');
    qs('#tbx-dl').addEventListener('click', function () {
      try { saveBlob(new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' }), name); toast('파일을 내려받았어요'); }
      catch (e) { toast('내려받지 못했어요. "표 복사"를 써 주세요', 'error'); }
    });
    qs('#tbx-copy').addEventListener('click', function () { tbCopyAll(); });
  }
  /** 표 복사: 열 이름과 지금 보이는 줄 모두(서식·합친 칸 그대로) */
  function tbCopyAll() {
    var T = S.table, d = T.d;
    if (!d) return;
    var out = T.vrows.length && d.table.cols.length ? tbClipOut({ i1: 0, i2: T.vrows.length - 1, j1: 0, j2: d.table.cols.length - 1 }, true)
      : { tsv: d.table.cols.map(function (c) { return tbTsvCell(c.name); }).join('\t'), html: '' };
    (out.html ? tbCopyRich(out) : copyText(out.tsv)).then(function (ok) { toast(ok ? '표를 복사했어요. 구글 시트나 엑셀에 붙여 넣으세요' : '복사하지 못했어요', ok ? '' : 'error'); });
  }

  // ------------------------------------------------------------ 새 표 만들기·시트 더하기(구글 시트에서 붙여 넣기)
  var TB_NEG = /^(미|안 ?|아니|불|비|X$|x$|N$|n$|FALSE$|×$)/;
  var TB_STATUS = /^(O|o|X|x|V|v|✓|✔|●|○|△|완료|미완료|신청|미신청|확인|미확인|제출|미제출|예|아니요|아니오|참석|불참|동의|비동의|가능|불가|불가능|있음|없음|해당|미해당|진행|대기|보류|TRUE|FALSE|Y|N)$/;
  /** 고를 값 차례: '끝난 것'(완료·제출·O)이 앞, 미완료·X 같은 값은 뒤로 */
  function tbOptOrder(vals) {
    return vals.filter(function (v) { return !TB_NEG.test(v); }).concat(vals.filter(function (v) { return TB_NEG.test(v); }));
  }
  /** 고르기 열로 알맞은지: 짧은 값 몇 가지(4개까지)가 되풀이되고, 완료·미완료·O·X 같은 값이 있을 때 */
  function tbSuggestPick(vals, n) {
    if (n < 3 || vals.length < Math.max(2, Math.ceil(n * 0.4))) return null;
    var uniq = [];
    vals.forEach(function (v) { if (uniq.indexOf(v) < 0) uniq.push(v); });
    if (uniq.length > 4 || vals.length < uniq.length * 2) return null;
    if (!uniq.every(function (v) { return v.length <= 6 && !/^[\d\s.,:\-\/~]+$/.test(v); })) return null;
    if (!uniq.some(function (v) { return TB_STATUS.test(v) || /^미./.test(v); })) return null;
    return tbOptOrder(uniq);
  }
  function tbNextSheetName() {
    var d = S.table.d, used = {};
    (d ? d.doc.sheets : []).forEach(function (s) { used[s.name.toLowerCase()] = 1; });
    for (var k = (d ? d.doc.sheets.length : 0) + 1; k < 999; k++) if (!used[('시트' + k).toLowerCase()]) return '시트' + k;
    return '새 시트';
  }

  /**
   * mode: 'doc'(새 표 만들기) · 'sheet'(지금 표에 시트 더하기).
   * 어떻게 시작할지: 구글 시트에서 붙여 넣기 · 양식에서 고르기(판 2026-10-18b) · 빈 표(시트) · 지금 시트의 열만 복사(시트 더하기)
   */
  function tbNew(mode) {
    if (!needMe(mode === 'sheet' ? '시트를 더하면' : '표를 만들면')) return;
    var T = S.table, l = T.list || {}, sheet = mode === 'sheet' && T.d;
    if (mode === 'sheet' && (!T.d || !T.d.table.canEdit)) { toast('시트는 만든 분과 연구부장·부담당만 더할 수 있어요'); return; }
    var depts = sheet ? T.d.depts || [] : l.depts || [];

      return;
    }
    server('table.create', { fields: { title: title, sheet: sname.trim(), deptId: qs('#tbm-dept').value, deadline: qs('#tbm-deadline').value, desc: '' }, cols: cols, rows: rows,
      view: M.how === 'tpl' && M.view ? M.view : undefined, tpl: M.tpl ? M.tpl.name : '' }, [['table.list', {}]]).then(function (r) {
      closeModal();
      toast('표를 만들었어요');
      T.make = null;
      T.list = null;
      T.sel = r.id;
      T.sheet = '';
      T.d = null;
      if (S.screen === 'table' && qs('#screen')) { SCREENS.table(qs('#screen')); window.scrollTo(0, 0); }
    }, function (e) { busy(btn, false); err.textContent = e.message; });
  }

  // ------------------------------------------------------------ 인쇄: 표는 A4 가로
  function tbPrintStart() {
    tbPrintEnd();
    if (S.screen !== 'table' || !S.table.d || !qs('#tb-wrap') || qs('#tb-page')) return;
    var st = document.createElement('style');
    st.id = 'tb-page';
    st.textContent = '@page{size:A4 landscape;margin:10mm}';
    document.head.appendChild(st);
  }
  function tbPrintEnd() {
    var st = qs('#tb-page');
    if (st) st.parentNode.removeChild(st);
  }

  // ------------------------------------------------------------ 누르기·키·창 크기(이 화면 것만, App.html은 손대지 않는다)
  /** 같은 단추를 다시 누르면 메뉴를 닫는다 */
  function tbToggleMenu(t, open) {
    if (S.table.menu && S.table.menu.anchor === t) { tbCloseMenu(); tbFocusEd(); return; }
    open();
  }
  function tbAction(a, t) {
    var T = S.table, id = t.getAttribute('data-id');
    switch (a) {
      case 'tb-new': tbNew('doc'); break;
      case 'tb-open': T.sel = id; T.sheet = T.last[id] || ''; T.d = null; T.find = null; SCREENS.table(qs('#screen')); window.scrollTo(0, 0); break;
      case 'tb-back': tbBackToList(); break;
      case 'tb-resend': tbResend(); break;
      case 'tb-copy': tbCopyAll(); break;
      case 'tb-csv': tbCsv(); break;
      case 'tb-menu': tbToggleMenu(t, function () { tbTableMenu(t); }); break;
      case 'tb-row-add': tbRowAdd(''); break;
      case 'tb-rowmenu': tbToggleMenu(t, function () { tbRowMenu(t, t.getAttribute('data-row')); }); break;
      case 'tb-rowedit': tbRowEditor(t.getAttribute('data-row')); break;
      case 'tb-view': T.phoneGrid = t.getAttribute('data-v') === 'grid'; tbDrawMain(); break;
      case 'tb-tool': tbToggleMenu(t, function () { tbTool(t.getAttribute('data-k'), t); }); break;
      case 'tb-head': tbToggleMenu(t, function () { tbHeadMenu(t, +t.getAttribute('data-j')); }); break;
      case 'tb-selall': tbSelectAll(); tbFocusEd(); break;
      case 'tb-local-clear': tbLocalClear(); break;
      case 'tb-fprev': tbFindGo(-1); break;
      case 'tb-fnext': tbFindGo(1); break;
      case 'tb-frep': tbFindReplace(false); break;
      case 'tb-frepall': tbFindReplace(true); break;
      case 'tb-fclose': tbFindClose(); break;
      case 'tb-sheet': tbSwitchSheet(id); break;
      case 'tb-sheet-menu': tbToggleMenu(t, function () { tbSheetMenu(t); }); break;
      case 'tb-sheet-add': tbNew('sheet'); break;
      case 'tb-sheet-list': tbToggleMenu(t, function () { tbSheetList(t); }); break;
      case 'tb-todo-copy': tbTodoCopy(); break;
      case 'tb-rmine': T.rf.mine = !T.rf.mine; tbDrawMain(); break;
    }
  }
  // 목록 찾기 칸·부서, 휴대폰 줄 찾기
  document.addEventListener('input', function (e) {
    var id = e.target && e.target.id;
    if (id === 'tb-lq') { S.table.lq = e.target.value; tbDrawCards(); }
    else if (id === 'tb-rq' && S.table.d) { S.table.rf.q = e.target.value; var rb = qs('#tb-rowsbox'); if (rb) rb.innerHTML = tbRowsInner(); }
  });
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'tb-ldept') { S.table.ldept = e.target.value; tbDrawCards(); }
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action],[data-tb-tab]');
    if (!t) return;
    if (t.hasAttribute('data-tb-tab')) { S.table.tab = t.getAttribute('data-tb-tab'); tbDrawCards(); return; }
    var a = t.getAttribute('data-action') || '';
    if (a.indexOf('tb-') === 0) tbAction(a, t, e);
  });
  // 끌어서 여러 칸 고르기·열 너비·줄 높이, 떠 있는 메뉴 닫기
  document.addEventListener('mouseup', function () { if (tbRs) tbResizeEnd(); if (S.table.drag) tbUp(); });
  document.addEventListener('mousemove', function (e) { if (tbRs) tbResizeMove(e); });
  document.addEventListener('mousedown', function (e) {
    var m = S.table.menu;
    if (m && !m.el.contains(e.target) && !(m.anchor && m.anchor.contains(e.target))) tbCloseMenu();
  }, true);
  // 활성 시트 탭: 두 번 누르면 이름 고치기(만든 분·관리), 오른쪽 단추(길게 누르기)는 시트 메뉴(이름을 고른 분, 다른 분은 '양식으로 저장'만)
  document.addEventListener('dblclick', function (e) {
    var tab = e.target.closest('.tb-tab[aria-selected="true"]');
    if (tab && S.table.d && S.table.d.table.canEdit) { e.preventDefault(); tbSheetEdit(); }
  });
  document.addEventListener('contextmenu', function (e) {
    var tab = e.target.closest('.tb-tab');
    if (!tab || !S.table.d || !(S.table.d.table.canEdit || S.me)) return;
    e.preventDefault();
    if (tab.getAttribute('aria-selected') === 'true') tbSheetMenu(tab);
  });
  // 표 화면에서는 Ctrl+F가 이 표의 찾기(구글 시트처럼)
  document.addEventListener('keydown', function (e) {
    var T = S.table, mod = e.ctrlKey || e.metaKey, k = String(e.key).toLowerCase();
    if (!mod || (k !== 'f' && k !== 'h') || S.screen !== 'table' || !T.d || !qs('#tb-wrap') || isPhone() || $modal.innerHTML) return;
    if (e.target && e.target.id === 'tb-ed') return; // 편집 칸은 tbKey가 맡는다
    e.preventDefault();
    tbFindOpen(k === 'h');
  });
  document.addEventListener('keydown', function (e) { // 도구 막대의 글자 크기 칸
    if (!e.target || e.target.id !== 'tt-fs' || e.isComposing) return;
    if (e.key === 'Enter') { e.preventDefault(); tbSetSize(e.target.value); }
    else if (e.key === 'Escape') { e.preventDefault(); tbSyncTools(); tbFocusEd(); }
  });
  document.addEventListener('focusout', function (e) { if (e.target && e.target.id === 'tt-fs') setTimeout(tbSyncTools, 0); });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && S.screen === 'table' && S.table.sel && S.table.d) tbPollNow();
  });
  window.addEventListener('beforeunload', function (e) {
    if (!tbBusy && !S.table.edit && !tbFailed.length) return;
    e.preventDefault();
    e.returnValue = '';
  });
  window.addEventListener('beforeprint', tbPrintStart);
  window.addEventListener('afterprint', tbPrintEnd);
  var tbShape = isPhone(), tbResizeTimer;
  window.addEventListener('resize', function () {
    tbCloseMenu();
    clearTimeout(tbResizeTimer);
    tbResizeTimer = setTimeout(function () {
      var shape = isPhone();
      if (shape !== tbShape) {
        tbShape = shape;
        if (S.screen === 'table' && S.table.sel && S.table.d) tbDrawDetail(); // PC 표 ↔ 휴대폰 줄 목록(고치던 글은 그대로)
      } else tbTabsFade(true);
    }, 200);
  });

  // App.html이 부르는 것
  return {
    build: window.__gyTableUiBuild,
    /** 메뉴에서 '취합 시트'를 누르면 목록부터 */
    reset: function () { S.table.sel = ''; S.table.sheet = ''; S.table.d = null; S.table.find = null; S.table.lq = ''; S.table.ldept = ''; },
    /** 홈(내가 할 일·검색)에서 표를 바로 연다. sheet: 시트ID(없으면 이 창에서 마지막에 본 시트) */
    open: function (doc, sheet) { S.table.sel = doc; S.table.sheet = sheet || S.table.last[doc] || ''; S.table.d = null; S.table.find = null; },
    /** 누구로 보는지가 바뀌면 들고 있던 표를 버린다 */
    forget: function () {
      S.table.list = null; S.table.d = null; S.table.edit = null; S.table.find = null; S.table.loc = {}; S.table.last = {};
      S.table.lq = ''; S.table.ldept = ''; S.table.rf = { id: '', q: '', mine: false }; S.tbSeen = {};
      tbUndo = []; tbRedo = []; // 다음 선생님이 앞 선생님이 고친 칸을 되돌리지 않게
      tbDropFailed();
      tbConfShown = null; tbConfQ = [];
    },
    /** 다른 화면으로 갈 때: 저장 못 한 칸이 있으면 묻는다(괜찮으면 true, 아니면 묻고 false: 나가기를 고르면 proceed) */
    leaving: function (proceed) { return S.screen !== 'table' || tbLeaveOk(proceed); },
    /** 휴지통에서 되살린 뒤 목록을 새로 받게 */
    listDirty: function () { S.table.list = null; },
    busy: function () { return tbBusy > 0 || !!S.table.edit; }
  };
};
</script>
