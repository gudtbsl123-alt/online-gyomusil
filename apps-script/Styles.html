<style>
/* 색 토큰: 온라인교무실_시안.html 그대로 (이름·값 바꾸지 않기) */
:root,:root[data-theme="light"]{--c-bg:#F2F4F6;--c-sub:#FFFFFF;--c-card:#FFFFFF;--c-card2:#F2F4F6;--c-pill:#F2F4F6;--c-line:#E5E8EB;--c-line2:#D1D6DB;--c-seg:#F2F4F6;--c-avatar:#E5E8EB;--c-t0:#191F28;--c-t1:#191F28;--c-t2:#4E5968;--c-t3:#606B78;--c-dot:#B0B8C1;--c-radio:#B0B8C1;--c-warnBg:#FFF4E5;--c-warnFg:#9A5200;--c-okBg:#E8F7EE;--c-okFg:#12784A;--c-red:#D92D20;--c-onAccent:#FFFFFF;--accent:#1B64DA;--accent-soft:rgba(27, 100, 218, 0.1);--accent-ring:rgba(27, 100, 218, 0.35);--accent-glow:rgba(27, 100, 218, 0.22);--hero-a:rgba(27, 100, 218, 0.14);--hero-b:rgba(27, 100, 218, 0.05);--scheme:light;--seg-light-bg:#FFFFFF;--seg-light-fg:#191F28;--seg-dark-bg:transparent;--seg-dark-fg:#606B78;--sun-display:none;--moon-display:block;--stage:#E5E8EB}

/* 화면 디자인(교사 결정, 판 2026-10-17g): ① 기본은 위 시안 값 그대로, ② 장도(교표의 남색·초록)·③ 따뜻한 종이색은 같은 변수 이름에 값만 바꾼다
 * 선생님마다 기기에서 고른다(App.html designSeg, 기기에 gy.design). 밝게·어둡게 둘 다 있고 글자 대비는 4.5:1 이상(tools/test.js) */
:root[data-design="jangdo"]{--c-bg:#EFF3ED;--c-sub:#FFFFFF;--c-card:#FFFFFF;--c-card2:#EEF2EA;--c-pill:#EEF2EA;--c-line:#DCE3D6;--c-line2:#C3CDBC;--c-seg:#EEF2EA;--c-avatar:#DCE3D6;--c-t0:#161B33;--c-t1:#161B33;--c-t2:#434C69;--c-t3:#58617C;--c-dot:#A3AE9D;--c-radio:#A3AE9D;--c-warnBg:#FFF0E1;--c-warnFg:#94470A;--c-okBg:#E6F3DB;--c-okFg:#367318;--c-red:#D92D20;--c-onAccent:#FFFFFF;--accent:#2B3990;--accent-soft:rgba(43, 57, 144, 0.1);--accent-ring:rgba(43, 57, 144, 0.35);--accent-glow:rgba(43, 57, 144, 0.22);--hero-a:rgba(118, 186, 76, 0.24);--hero-b:rgba(43, 57, 144, 0.06);--scheme:light;--seg-light-bg:#FFFFFF;--seg-light-fg:#161B33;--seg-dark-bg:transparent;--seg-dark-fg:#58617C;--sun-display:none;--moon-display:block;--stage:#DCE3D6}
:root[data-design="jangdo"][data-theme="dark"]{--c-bg:#0B0F1E;--c-sub:#10152A;--c-card:#151B31;--c-card2:#1A2139;--c-pill:#1C2440;--c-line:#212A46;--c-line2:#2C3657;--c-seg:#2C3657;--c-avatar:#2C3657;--c-t0:#F7F9FC;--c-t1:#EEF1F8;--c-t2:#B4BBD1;--c-t3:#8D96B1;--c-dot:#8D96B1;--c-radio:#4A5475;--c-warnBg:#2E1C08;--c-warnFg:#FFB067;--c-okBg:#13280D;--c-okFg:#93D865;--c-red:#FF6B6B;--c-onAccent:#0B0F1E;--accent:#93A3FF;--accent-soft:rgba(147, 163, 255, 0.14);--accent-ring:rgba(147, 163, 255, 0.32);--accent-glow:rgba(147, 163, 255, 0.18);--hero-a:rgba(118, 186, 76, 0.30);--hero-b:rgba(147, 163, 255, 0.12);--scheme:dark;--seg-light-bg:transparent;--seg-light-fg:#8D96B1;--seg-dark-bg:#2C3657;--seg-dark-fg:#EEF1F8;--sun-display:block;--moon-display:none;--stage:#06080F}
/* 장도 밝게: 왼쪽 메뉴와 휴대폰 위 막대는 교표의 남색, 그 안의 점·숫자는 초록 */
:root[data-design="jangdo"]:not([data-theme="dark"]) .side,:root[data-design="jangdo"]:not([data-theme="dark"]) .topbar{--c-bg:#232C6F;--c-sub:#232C6F;--c-card:#2E3882;--c-card2:rgba(255, 255, 255, 0.12);--c-pill:rgba(255, 255, 255, 0.14);--c-line:rgba(255, 255, 255, 0.14);--c-line2:rgba(255, 255, 255, 0.26);--c-avatar:rgba(255, 255, 255, 0.18);--c-seg:rgba(255, 255, 255, 0.12);--c-t0:#FFFFFF;--c-t1:#FFFFFF;--c-t2:#D7DCF4;--c-t3:#AEB6DD;--accent:#9BD86E;--accent-soft:rgba(155, 216, 110, 0.2);--accent-ring:rgba(155, 216, 110, 0.55);--c-onAccent:#10152A;--c-okFg:#B5E88F;color:var(--c-t1)}
:root[data-design="paper"]{--c-bg:#F4EEE3;--c-sub:#FFFBF4;--c-card:#FFFDF8;--c-card2:#F4EEE3;--c-pill:#F1E9DB;--c-line:#E6DBC9;--c-line2:#D3C4AD;--c-seg:#F1E9DB;--c-avatar:#E6DBC9;--c-t0:#2A231C;--c-t1:#2A231C;--c-t2:#5A4F42;--c-t3:#6B6052;--c-dot:#B5A792;--c-radio:#B5A792;--c-warnBg:#FCEED6;--c-warnFg:#864809;--c-okBg:#E5F1E1;--c-okFg:#2E6A32;--c-red:#BE321C;--c-onAccent:#FFFFFF;--accent:#A0502A;--accent-soft:rgba(160, 80, 42, 0.1);--accent-ring:rgba(160, 80, 42, 0.35);--accent-glow:rgba(160, 80, 42, 0.22);--hero-a:rgba(214, 140, 70, 0.20);--hero-b:rgba(160, 80, 42, 0.06);--scheme:light;--seg-light-bg:#FFFDF8;--seg-light-fg:#2A231C;--seg-dark-bg:transparent;--seg-dark-fg:#6B6052;--sun-display:none;--moon-display:block;--stage:#E6DBC9}
:root[data-design="paper"][data-theme="dark"]{--c-bg:#15120E;--c-sub:#1B1712;--c-card:#211C16;--c-card2:#28221B;--c-pill:#2B241C;--c-line:#2F281F;--c-line2:#3C3328;--c-seg:#3C3328;--c-avatar:#3C3328;--c-t0:#FBF6EE;--c-t1:#F3EBDF;--c-t2:#CFC1AF;--c-t3:#A89986;--c-dot:#A89986;--c-radio:#5E5243;--c-warnBg:#2E1F0A;--c-warnFg:#F2B36B;--c-okBg:#162814;--c-okFg:#86D080;--c-red:#FF7A66;--c-onAccent:#15120E;--accent:#E89C64;--accent-soft:rgba(232, 156, 100, 0.14);--accent-ring:rgba(232, 156, 100, 0.32);--accent-glow:rgba(232, 156, 100, 0.18);--hero-a:rgba(232, 156, 100, 0.26);--hero-b:rgba(232, 156, 100, 0.10);--scheme:dark;--seg-light-bg:transparent;--seg-light-fg:#A89986;--seg-dark-bg:#3C3328;--seg-dark-fg:#F3EBDF;--sun-display:block;--moon-display:none;--stage:#0B0907}
html{background:var(--c-bg)}
:root{--gy-build:"2026-10-28a"} /* 판 표시(관리자 › 점검) */
body{margin:0;word-break:keep-all;background:var(--c-bg);color:var(--c-t1);font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
input::placeholder,textarea::placeholder{color:currentColor;opacity:.7}
button,input,select,textarea{font-family:inherit;letter-spacing:inherit}
*,*::before,*::after{box-sizing:border-box}
body{font-size:17px;line-height:1.5;letter-spacing:-0.02em}
/* 화면 크기(확대·축소): 본문과 창만 키운다. 메뉴는 그대로(막대가 손가락 밑에서 움직이지 않게). 값은 App.html이 정한다 */
.main,.gate,.modal{zoom:var(--gy-zoom,1)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent-ring);outline-offset:2px}
svg{flex:none}

/* ---------- 앱 틀: PC 사이드 메뉴 + 본문 ---------- */
.app{display:flex;min-height:100vh;min-height:100dvh;background:var(--c-bg)}
.side{flex:none;width:248px;position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;background:var(--c-sub);border-right:1px solid var(--c-line);display:flex;flex-direction:column}
.side-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:28px 16px 16px;display:flex;flex-direction:column;gap:28px;
  /* 메뉴가 길어 아래가 가려지면 아래쪽에 옅은 그림자(끝까지 내리면 사라짐) */
  background:linear-gradient(to top,var(--c-sub) 45%,transparent) center bottom/100% 36px no-repeat local,linear-gradient(to top,rgba(0,0,0,.12),transparent) center bottom/100% 16px no-repeat scroll}
.side-me{flex:none;display:flex;flex-direction:column;gap:4px;padding:12px 16px 14px;border-top:1px solid var(--c-line);background:var(--c-sub)} /* 내 이름·나가기: 늘 보이게 맨 아래 */
@media (max-height:860px){.side-scroll{padding-top:20px;gap:18px}.side .nav{gap:2px}.side .nav-item{min-height:42px}.side .nav-item.small{min-height:38px}.side-me .me-card{padding:10px 12px}.side-foot{gap:8px}}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px;color:var(--c-t1);text-decoration:none;background:none;border:0;cursor:pointer;text-align:left}
.brand-mark{width:40px;height:40px;flex:none;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.brand-text{display:flex;flex-direction:column;line-height:1.3}
.brand-sub{font-size:13px;font-weight:600;color:var(--c-t3)}
.brand-name{font-size:18px;font-weight:800;letter-spacing:-0.03em}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 14px;border:0;border-radius:12px;background:transparent;color:var(--c-t2);font-size:17px;font-weight:600;text-decoration:none;text-align:left;cursor:pointer}
.nav-item.small{min-height:44px;font-size:15px}
.nav-item[aria-current="page"]{background:var(--c-card2);color:var(--c-t1);font-weight:700}
.nav-item[aria-current="page"] svg{color:var(--accent)}
.nav-soon{margin-left:auto;padding:2px 8px;border-radius:9999px;background:var(--c-pill);font-size:12px;font-weight:700;color:var(--c-t3)}
.nav-group{display:flex;flex-direction:column;gap:6px;padding-top:20px;border-top:1px solid var(--c-line)}
.nav-label{padding:0 14px;font-size:13px;font-weight:700;color:var(--c-t3)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--c-card2);border:1px solid var(--c-line)}
.seg button{flex:1 1 0;min-height:40px;display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:9px;background:transparent;color:var(--c-t3);font-size:15px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c-card);color:var(--c-t1);box-shadow:0 0 0 1px var(--c-line)}
.toolbar .seg,.card-head .seg{flex:none}
.toolbar .seg button,.card-head .seg button{flex:0 0 auto;padding:0 14px;white-space:nowrap}
[hidden]{display:none!important}
.me-card{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--c-card);border:1px solid var(--c-line)}
.me-lines{display:flex;flex-direction:column;min-width:0;line-height:1.4}
.me-name{font-size:16px;font-weight:700}
.me-sub{font-size:14px;color:var(--c-t3)}
.linkish{padding:0;border:0;background:none;color:var(--c-t2);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.avatar{width:40px;height:40px;flex:none;border-radius:50%;background:var(--c-avatar);color:var(--c-t1);display:grid;place-items:center;font-size:16px;font-weight:800}
.ok-text{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--c-okFg)}
.warn-text{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--c-warnFg)}

.main{flex:1 1 auto;min-width:0;padding:36px 40px 56px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.page-head>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.kicker{margin:0;font-size:15px;font-weight:600;color:var(--c-t3)}
.title{margin:0;font-size:32px;line-height:1.2;font-weight:800;letter-spacing:-0.03em}
.lead{margin:0;font-size:16px;color:var(--c-t2)}

/* ---------- 휴대폰: 위 막대 + 아래 메뉴 ---------- */
.topbar{display:none}
.bottom-nav{display:none}

/* ---------- 카드·상자 ---------- */
.card{position:relative;overflow:hidden;background:var(--c-card);border:1px solid var(--c-line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:16px}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.card h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-0.03em}
.card h3{margin:0;font-size:17px;font-weight:800}
.card p{margin:0}
.glow{position:absolute;right:-90px;top:-110px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,var(--hero-a) 0%,var(--hero-b) 40%,transparent 70%);pointer-events:none}
.box{padding:16px 18px;border-radius:14px;background:var(--c-card2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:24px}
.muted{color:var(--c-t2)}
.faint{color:var(--c-t3);font-size:14px}
.big-num{margin:0;font-size:44px;line-height:1.15;font-weight:800;letter-spacing:-0.04em}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:12px;align-items:flex-start}
.step-no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:14px;font-weight:800}
.step-no.done{background:var(--c-okBg);color:var(--c-okFg)}
.soon-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.soon-list li{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--c-line);font-weight:700}
.soon-list li:first-child{border-top:0}
.soon-list li .chip{margin-left:auto}

/* ---------- 단추 ---------- */
.btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;border-radius:12px;border:1px solid var(--c-line2);background:var(--c-card);color:var(--c-t1);font-size:16px;font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--c-onAccent);box-shadow:0 8px 20px var(--accent-glow)}
.btn-block{width:100%;min-height:52px;font-size:17px}
.btn-sm{min-height:40px;padding:0 14px;border-radius:10px;font-size:15px}
.btn-ghost{border-color:transparent;background:transparent;color:var(--c-t2)}
.btn-danger{color:var(--c-red)}
.btn:disabled{opacity:.55;cursor:default;box-shadow:none}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:12px;background:transparent;color:var(--c-t2);cursor:pointer}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- 입력 ---------- */
.form{display:flex;flex-direction:column;gap:16px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-size:15px;font-weight:700;color:var(--c-t2)}
.req{color:var(--c-red)}
.input{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--c-line2);background:var(--c-card);color:var(--c-t1);font-size:16px}
textarea.input{min-height:96px;padding:12px 14px;resize:vertical}
select.input{appearance:auto}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input-pin{font-size:24px;font-weight:800;letter-spacing:.5em;text-align:center;padding-left:calc(14px + .5em)}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:56px}
.pw-wrap .icon-btn{position:absolute;right:2px;top:2px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:16px;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.hint{display:flex;gap:6px;margin:0;font-size:14px;line-height:1.5;color:var(--c-t3)}
.hint svg{margin-top:2px}
.err{margin:0;min-height:0;color:var(--c-red);font-size:15px;font-weight:700}
.err:empty{display:none}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;background:var(--c-card);border:1px solid var(--c-line2);border-radius:12px;color:var(--c-t3)}
.search{min-width:0}
.search input{flex:1 1 auto;width:100%;min-width:0;height:100%;border:0;outline:none;background:transparent;color:var(--c-t1);font-size:16px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* ---------- 칩 ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;min-height:26px;padding:0 10px;border-radius:9999px;background:var(--c-pill);color:var(--c-t2);font-size:13px;font-weight:700;white-space:nowrap}
.chip-ok{background:var(--c-okBg);color:var(--c-okFg)}
.chip-warn{background:var(--c-warnBg);color:var(--c-warnFg)}
.chip-accent{background:var(--accent-soft);color:var(--accent)}

/* ---------- 탭 ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--c-line);overflow-x:auto;scrollbar-width:none}
.tab{flex:none;min-height:48px;padding:0 16px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--c-t3);font-size:17px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--c-t1);border-bottom-color:var(--accent)}

/* ---------- 로그인·본인 확인 ---------- */
.gate{min-height:calc(100vh / var(--gy-zoom,1));min-height:calc(100dvh / var(--gy-zoom,1));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px 16px}
.gate-card{width:min(460px,100%);background:var(--c-card);border:1px solid var(--c-line);border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:20px;position:relative;overflow:hidden}
.gate-card h1{margin:0;font-size:28px;line-height:1.25;font-weight:800;letter-spacing:-0.03em}
.gate-top{width:min(460px,100%);display:flex;align-items:center;justify-content:space-between;gap:12px}
.gate-foot{width:min(460px,100%);margin:0;font-size:14px;color:var(--c-t3);text-align:center}
.people{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;padding:2px}
#id-people{max-height:min(300px,34vh);min-height:132px} /* 이름 고르기: 낮은 화면에서도 '확인' 단추가 첫 화면에 들어오게 */
.person{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px;border:1px solid var(--c-line);border-radius:14px;background:var(--c-card);cursor:pointer}
.person input{position:absolute;opacity:0;pointer-events:none}
.person.on{border:2px solid var(--accent);background:var(--accent-soft);padding:7px 13px}
.person:has(input:focus-visible){outline:3px solid var(--accent-ring);outline-offset:2px}
.person-lines{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.person-name{font-weight:800}
.person-sub{font-size:14px;color:var(--c-t3)}
.person .chip{margin-left:auto}
.preview-banner{width:min(460px,100%);padding:12px 16px;border-radius:14px;background:var(--c-warnBg);color:var(--c-warnFg);font-size:14px;font-weight:600}

/* ---------- 목록(교직원 표 등) ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.toolbar .search{flex:1 1 240px}
.counts{display:flex;flex-wrap:wrap;gap:8px}
.rows{display:flex;flex-direction:column;border:1px solid var(--c-line);border-radius:16px;overflow:hidden}
.srow{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(150px,1fr) minmax(160px,1.5fr) 64px minmax(250px,auto);align-items:center;gap:12px;padding:14px 18px;border-top:1px solid var(--c-line);background:var(--c-card)}
.srow:first-child{border-top:0}
.srow.head{background:var(--c-card2);font-size:14px;font-weight:700;color:var(--c-t3);padding-top:10px;padding-bottom:10px}
.srow.off{background:var(--c-card2)}
.srow.off .s-name{color:var(--c-t3)}
.s-name{font-weight:800}
.s-sub{font-size:14px;color:var(--c-t3)}
.s-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.s-btns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.empty{padding:32px 16px;text-align:center;color:var(--c-t3)}
/* 분류: 이름 칸은 6글자 이상이 한 번에 보이게(최소 156px), 순서 칸은 숫자 3자리만큼 */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:24px;align-items:start}
.cat-list{display:flex;flex-direction:column;gap:8px}
.cat-row{display:grid;grid-template-columns:minmax(156px,1fr) 68px 172px;gap:8px;align-items:center}
.cat-row .input{min-width:0}
.cat-row .cat-order{padding:0 8px;text-align:center}
.cat-row .row-btns{flex-wrap:nowrap;justify-content:flex-end;gap:4px}
.cat-row.off .input{color:var(--c-t3)}
.cat-cols{display:grid;grid-template-columns:minmax(156px,1fr) 68px 172px;gap:8px;font-size:13px;font-weight:700;color:var(--c-t3)}
.cat-cols span:nth-child(2){text-align:center}
.cat-new{display:grid;grid-template-columns:minmax(156px,1fr) auto;gap:8px;align-items:center;padding-top:12px;border-top:1px solid var(--c-line)}
.link-row{display:grid;grid-template-columns:minmax(120px,1fr) minmax(160px,2fr) auto;gap:8px;align-items:center}
.log-item{padding:14px 0;border-top:1px solid var(--c-line)}
.log-item:first-child{border-top:0}
.log-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.log-time{font-size:14px;color:var(--c-t3);font-variant-numeric:tabular-nums}
.log-sum{margin:4px 0 0;font-weight:600}
.log-item details{margin-top:6px}
.log-item summary{min-height:32px;display:inline-flex;align-items:center;font-size:14px;font-weight:700;color:var(--c-t2);cursor:pointer}
.diff{margin-top:6px;display:grid;grid-template-columns:max-content minmax(0,max-content) auto minmax(0,1fr);gap:4px 10px;font-size:14px;overflow-wrap:anywhere}
.diff .to{color:var(--c-t3)}
.diff .k{font-weight:700;color:var(--c-t2)}
.diff .b{color:var(--c-t3);text-decoration:line-through}

/* ---------- 창(모달)·알림 ---------- */
.modal-back{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.45)}
.modal{width:min(560px,100%);max-height:calc((100vh - 32px) / var(--gy-zoom,1));max-height:calc((100dvh - 32px) / var(--gy-zoom,1));overflow:auto;background:var(--c-card);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-0.03em}
.modal-btns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.pin-big{margin:0;padding:22px 12px;border-radius:16px;background:var(--c-card2);text-align:center;font:800 52px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.3em;padding-left:calc(12px + .3em)}
.pin-list{display:flex;flex-direction:column;border:1px solid var(--c-line);border-radius:14px;overflow:hidden}
.pin-list div{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--c-line)}
.pin-list div:first-child{border-top:0}
.pin-list b{margin-left:auto;font:800 20px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em}
.sheet-back{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:85vh;max-height:85dvh;overflow:auto;background:var(--c-sub);border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet-grab{width:40px;height:4px;border-radius:2px;background:var(--c-line2);margin:0 auto 4px}
.toast{position:fixed;left:50%;bottom:76px;z-index:80;transform:translateX(-50%);max-width:calc(100% - 32px);padding:12px 16px;border-radius:12px;background:var(--c-t1);color:var(--c-bg);font:600 14px/1.4 Pretendard,-apple-system,'Malgun Gothic',sans-serif;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.toast.toast-err{pointer-events:auto;display:flex;align-items:flex-start;gap:10px;border-left:4px solid var(--c-red)}
.toast-x{flex:none;display:grid;place-items:center;width:28px;height:28px;margin:-4px -8px -4px 0;border:0;border-radius:8px;background:transparent;color:inherit;cursor:pointer}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;min-height:120px;color:var(--c-t3);font-weight:600}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--c-line2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}.toast{transition:none}}
.print-only{display:none}
.slips{display:grid;grid-template-columns:repeat(2,1fr);gap:0}
.slip{border:1px dashed #9AA3AD;padding:16px 18px;break-inside:avoid;font-size:14px;line-height:1.5;color:#191F28}
.slip-pin{margin:6px 0;font:800 30px/1.1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.3em}
/* 주간 안내 A4 인쇄(App.html printWeek): #print-area에 그린 표만 찍는다 */
.wn-text{font:inherit;font-size:14px;line-height:1.6;min-height:280px;resize:vertical}
.week-print{color:#191F28}
.week-print h1{margin:0 0 4px;font-size:22px;font-weight:800}
.week-print .wp-sub{margin:0 0 10px;font-size:13px;color:#4E5968}
.week-print table{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.45}
.week-print th,.week-print td{border:1px solid #C9CED4;padding:5px 7px;text-align:left;vertical-align:top}
.week-print th{background:#F2F4F6;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.week-print .wp-day{width:92px;font-weight:700;white-space:nowrap}
.week-print .wp-time{width:64px;white-space:nowrap}
.week-print .wp-meta{width:34%;color:#4E5968}
/* 회의록 A4 인쇄(App.html printMeet): '부서 | 내용' 표, 쓴 분 이름은 넣지 않는다 */
.meet-print{color:#191F28}
.meet-print h1{margin:0 0 4px;font-size:20px;font-weight:800;text-align:center}
.meet-print .mp-sub{margin:0 0 12px;font-size:12.5px;color:#4E5968;text-align:center}
.meet-print table{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.55}
.meet-print th,.meet-print td{border:1px solid #AEB5BC;padding:6px 8px;text-align:left;vertical-align:top}
.meet-print thead th{background:#F2F4F6;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.meet-print tbody th{width:110px;font-weight:700;white-space:nowrap}
.meet-print td{white-space:pre-wrap;overflow-wrap:anywhere}
.meet-print tr{break-inside:avoid}

@media (hover:hover){
  .nav-item:hover{background:var(--c-card2);color:var(--c-t1)}
  .btn:not(:disabled):hover{filter:brightness(.97)}
  .btn-primary:not(:disabled):hover{filter:brightness(1.06)}
  .person:hover{border-color:var(--c-line2)}
  .icon-btn:hover{background:var(--c-card2)}
}

/* ---------- 휴대폰·좁은 화면 ---------- */
@media (max-width:899px){
  .side{display:none}
  .app{flex-direction:column}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;min-height:60px;padding:8px 8px 8px 16px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--c-bg)}
  .topbar .brand-mark{width:36px;height:36px;border-radius:10px}
  .topbar-name{font-size:18px;font-weight:800;letter-spacing:-0.03em}
  .topbar .icon-btn:first-of-type{margin-left:auto}
  .main{padding:4px 16px calc(96px + env(safe-area-inset-bottom))}
  .wrap{gap:16px}
  .title{font-size:23px}
  .kicker{font-size:14px}
  .card{padding:20px;border-radius:16px}
  .big-num{font-size:34px}
  .bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:calc(72px + env(safe-area-inset-bottom));padding:6px 4px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--c-line);background:var(--c-sub)}
  .bottom-nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:var(--c-t3);font-size:12px;font-weight:600;cursor:pointer}
  .bottom-nav button[aria-current="page"]{color:var(--accent);font-weight:700}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom))}
  .toolbar .search{flex-basis:100%}
  .srow{grid-template-columns:1fr auto;gap:6px 12px;padding:14px 16px}
  .srow.head{display:none}
  .srow .s-col-mid,.srow .s-col-job{grid-column:1 / -1}
  .srow .s-col-tel{grid-column:1;font-size:14px;color:var(--c-t3)}
  .srow .s-col-tel::before{content:'내선 '}
  .srow .s-btns{grid-column:1 / -1;justify-content:flex-start}
  .gate-card{padding:24px 20px}
  .modal{padding:20px}
  .pin-big{font-size:44px}
  .link-row{grid-template-columns:1fr auto}
  .cat-row,.cat-cols{grid-template-columns:minmax(0,1fr) 68px}
  .cat-row .row-btns{grid-column:1 / -1;justify-content:flex-start}
  .cat-cols span:nth-child(3){display:none}
  .link-row .input:nth-child(2){grid-column:1 / 2}
}
@media (max-width:899px) and (min-width:600px){ .main{padding-left:24px;padding-right:24px} }

/* ---------- 인쇄: 흰 바탕·검은 글씨, 메뉴·단추 숨김 (시안 규칙) ---------- */
@media print{
  html,body{background:#FFFFFF!important} /* 인쇄 창에서 '배경 그래픽'을 켜도 화면 바탕(회색·어두운 화면은 검정)이 찍히지 않게(판 2026-10-22a) */
  .print-root{background:#FFFFFF!important;min-height:0!important}
  .print-root *{color:#191F28!important;background-color:transparent!important;border-color:#D1D6DB!important;box-shadow:none!important}
  .print-root .print-keep{background-color:#606B78!important}
  /* 일정 인쇄(달력·월별 계획·연간 학사일정)의 공휴일·휴업일은 화면처럼 빨강(교사 요청, 판 2026-10-21a). 월별 계획은 토·일 요일도 빨강, 쉬는 날 줄은 연한 빨간 바탕(흑백 인쇄에서도 구분) */
  .print-root .cal-d.off .cal-num,.print-root .ev-off,.print-root .plan tr.off .c-date,.print-root .plan tr.off .c-dow,.print-root .plan tr.we .c-dow,.print-root .plan-ev.off,.print-root .ylist li.off .yd{color:#D92D20!important}
  .print-root .plan tr.off td{background-color:#FBEAE9!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-root .lg-off{background-color:#D92D20!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-hide,.toast,.side,.topbar,.bottom-nav,.glow{display:none!important}
  .main{padding:0!important}
  body.printing-slips #app,body.printing-slips #modal-root,body.printing-slips #toast{display:none!important}
  body.printing-slips .print-only{display:block!important}
  body.printing-week .week-print{zoom:var(--week-zoom,1)}
  .main,.gate,.modal{zoom:1!important}
}
/* ---------- 2단계: 홈·일정 ---------- */
.home-top{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px}
.dashed{border-style:dashed;border-color:var(--c-line2);background:transparent}
.big-num.sm{font-size:36px}
.ev-rows{display:flex;flex-direction:column;gap:8px}
.ev-row{display:flex;align-items:flex-start;gap:16px;width:100%;min-height:52px;padding:12px 18px;border:1px solid var(--c-line);border-radius:14px;background:var(--c-card);color:var(--c-t1);font:inherit;text-align:left;cursor:pointer}
.ev-row.off .ev-title,.ev-row.off .ev-time{color:var(--c-red)}
.ev-time{flex:none;min-width:64px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.ev-row.duty .ev-time{color:var(--c-t3)}
.ev-main{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;min-width:0;flex:1 1 auto}
.ev-title{font-weight:700}
.ev-meta{margin-left:auto;font-size:14px;color:var(--c-t3)}
.ev-rows.small .ev-row{min-height:44px;padding:8px 14px;border:0;background:transparent;border-top:1px solid var(--c-line);border-radius:0}
.tomorrow{margin:0;padding-top:14px;border-top:1px solid var(--c-line);font-size:15px;color:var(--c-t2)}
.tomorrow b{margin-right:8px;color:var(--c-t1)}
.focus-text{margin:0;white-space:pre-line;font-weight:700;line-height:1.6}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.wday{display:flex;flex-direction:column;gap:8px;min-height:150px;padding:14px;border:1px solid var(--c-line);border-radius:14px;background:var(--c-card)}
.wday.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.wday-head{display:flex;align-items:center;justify-content:space-between;gap:6px}
.wev{display:flex;flex-direction:column;gap:2px;padding:0;border:0;background:none;color:var(--c-t1);font:inherit;text-align:left;cursor:pointer}
.wev-title{font-size:15px;font-weight:700;line-height:1.35}
.wev-meta{font-size:13px;color:var(--c-t3)}
.wev.off .wev-title{color:var(--c-red)}
.chip-accent-solid{background:var(--accent);color:var(--c-onAccent)}
.chip-red{background:var(--c-pill);color:var(--c-red)}

.bar{flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:12px 16px;border-radius:16px}
.month-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.month-title{margin:0 4px;font-size:22px;font-weight:800;letter-spacing:-0.03em}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto}
.more-fields{border:1px solid var(--c-line);border-radius:12px;padding:0 14px}
.more-fields>summary{min-height:48px;display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:700;color:var(--c-t1)}
.more-fields[open]{padding-bottom:14px}
.more-fields[open]>summary{margin-bottom:8px}
.more-fields>.field+.field{margin-top:12px}
.modal .sticky-btns{position:sticky;bottom:-24px;z-index:2;margin:0 -24px -24px;padding:12px 24px 16px;background:var(--c-card);border-top:1px solid var(--c-line)}
.set-save{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;justify-content:flex-end;gap:12px;margin:0 -8px;padding:12px 8px;background:var(--c-bg);border-top:1px solid var(--c-line)}
.set-save .faint{color:var(--c-warnFg);font-weight:700}
.len-note{margin:4px 0 0;font-size:13px;color:var(--c-t3)}
.len-note.err{color:var(--c-red);font-weight:700}
.filter-note{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0;padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--c-t1);font-size:14px}
.filter-note svg{flex:none;color:var(--accent)}
.ev.cal-extra{display:none}
.ev.ev-chg{position:relative;padding-right:16px}
.ev.ev-chg::after{content:'';position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--c-warnFg)}
.ev-hist{margin-top:4px}
.ev-hist-list{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px}
.ev-hist-list li{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:10px;background:var(--c-card2)}
.ev-hist-ch{overflow-wrap:anywhere}
.input-sm{width:auto;min-height:40px;padding:0 10px;border-radius:10px;font-size:15px}
.check-box{min-height:40px;padding:0 12px;border:1px solid var(--c-line2);border-radius:10px;font-size:15px}
.stats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,2fr);gap:16px}
.stat{gap:4px;padding:18px 20px;border-radius:16px}
.stat-num{margin:0;font-size:30px;line-height:1.2;font-weight:800;letter-spacing:-0.03em}
.stat-focus .card-head{gap:8px}

.sched-main{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
.sched-main.with-side{grid-template-columns:minmax(0,1fr) 380px}
.cal-card{padding:16px}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.cal-h{padding:0 8px 4px;font-size:14px;font-weight:700;color:var(--c-t3)}
.cal-d{display:flex;flex-direction:column;gap:4px;min-height:112px;padding:8px;border:1px solid var(--c-line);border-radius:12px;background:var(--c-card);min-width:0}
.cal-d.other{background:var(--c-card2)}
.cal-d.other .cal-num{color:var(--c-t3)}
.cal-d.off .cal-num{color:var(--c-red)}
.cal-d.today{border:2px solid var(--accent);padding:7px}
.cal-num{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 4px;border:0;background:none;color:var(--c-t1);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.today-dot{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--c-onAccent);font-size:14px}
.today-label{font-size:13px;color:var(--accent)}
.ev{display:block;width:100%;padding:4px 8px;border:0;border-radius:8px;background:var(--c-card2);color:var(--c-t1);font:inherit;font-size:13px;font-weight:600;line-height:1.35;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:keep-all;overflow-wrap:anywhere}
.ev-act{background:var(--c-okBg);color:var(--c-okFg)}
.ev-meet{background:var(--accent-soft);color:var(--accent)} /* 회의(2026-10-19a) */
.ev-duty{background:transparent;color:var(--c-t2);box-shadow:inset 0 0 0 1px var(--c-line2)} /* 관리자 근무 */
.kind-tag{display:inline-block;margin-right:4px;padding:0 5px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;line-height:1.5;vertical-align:1px}

/* ---------- 월별 계획 인쇄: A4 세로 한 장(교사 요청) ----------
 * .plan-fit = 인쇄 모양. 인쇄 직전에 스크립트(App.html planPrintStart)가 진짜 칸에 붙이고, 같은 모양의 사본을 화면 밖에서 재서
 * 넘치면 --plan-zoom으로 줄인다. 화면 폭에 따라 달라지는 값은 여기서 모두 정해 둔다(잰 높이와 인쇄 높이가 같게) */
.plan-measure{position:absolute;left:-10000px;top:0;width:190mm;visibility:hidden;pointer-events:none}
.plan-measure .plan-card{zoom:1!important}
.card.plan-fit{padding:0;gap:8px;border:0;border-radius:0;box-shadow:none}
.plan-fit .month-nav{gap:0}
.plan-fit .month-title{margin:0;font-size:18px}
.plan-fit .plan-focus{padding:6px 10px;border-radius:8px}
.plan-fit .plan-focus .card-head{gap:4px}
.plan-fit .focus-text{font-size:12.5px;line-height:1.45}
.plan-fit .table-wrap{overflow:visible;border:0;border-radius:0}
.plan-fit .plan{min-width:0;font-size:12px;line-height:1.3}
.plan-fit .plan th{padding:3px 5px;font-size:11.5px}
.plan-fit .plan td{padding:2px 5px}
.plan-fit .plan .c-date,.plan-fit .plan .c-dow{width:28px}
.plan-fit .plan .c-dept{width:120px}
.plan-fit .plan .c-duty{width:100px}
.plan-fit .plan-ev{padding:0}
.plan-fit .print-hide,.plan-fit .hint{display:none!important}
@media print{
  body.print-plan #screen>:not(#sched-body){display:none!important}
  body.print-plan .plan-card.plan-fit{zoom:var(--plan-zoom,1)}
}
/* ---------- 달력: 끌어서 날짜 옮기기(고칠 수 있는 일정만 data-drag) ---------- */
.ev[data-drag]{touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
@media (hover:hover){.ev[data-drag]{cursor:grab}}
body.gy-dragging,body.gy-dragging *{cursor:grabbing!important;-webkit-user-select:none!important;user-select:none!important}
.ev.drag-src{opacity:.35}
.ev.drag-ghost{position:fixed;z-index:120;width:auto;max-width:220px;margin:0;pointer-events:none;box-shadow:0 12px 28px -10px rgba(0,0,0,.45);transform:translate(-50%,-70%) rotate(-2deg)}
.cal-d.drop-on{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
/* 태블릿(손가락): 달력 칸 안의 행사·날짜·더 보기를 손가락 크기로(2026-10-19a). 화면 배치는 그대로 */
@media (pointer:coarse){
  .cal .ev{min-height:36px;padding:7px 8px;font-size:14px}
  .cal-num{min-height:36px;min-width:36px}
  .cal-more{min-height:36px;padding:6px 6px}
  .cal-card .btn-sm,.plan-card .btn-sm{min-height:44px}
}

.ny-item{align-items:flex-start;padding:6px 0;font-weight:500}
.ny-item input{margin-top:3px}
@media (hover:hover){ .sr-row:hover{background:var(--c-card2)} .lib-title:hover{color:var(--accent)} .help-item summary:hover .help-t{color:var(--accent)} }
@media (max-width:899px){
  .home-search{width:100%}
  .intro{flex-wrap:nowrap;gap:8px;padding:10px 12px 10px 16px}
  .intro-more,.intro-list{display:none}
  .intro-t{flex:1 1 auto;font-size:15px}
  .intro-btns .linkish{padding:0 8px;font-size:15px}
  .check-row{flex-direction:column;gap:6px}
  .up-steps{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .up-stats{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .up-go .btn{width:100%}
  .up-table{min-width:0;display:block}
  .up-table thead{display:none}
  .up-table tbody{display:block}
  .up-table tr{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;padding:12px 14px;border-top:1px solid var(--c-line)}
  .up-table tbody tr:first-child{border-top:0}
  .up-table td{display:block;padding:0;border:0;grid-column:2}
  .up-table td:first-child{grid-column:1;grid-row:1 / span 3;padding-top:2px}
  .up-table td:last-child{grid-column:3;grid-row:1 / span 3;align-self:center}
  .up-table td:nth-child(5),.up-table td:nth-child(6),.up-table td:nth-child(7){display:none}
  .up-st{flex-direction:row;flex-wrap:wrap;align-items:center}
  .up-title{font-weight:700}
  .up-sub{display:block;font-size:14px;font-weight:500;color:var(--c-t3)}
  .intro{padding:14px 16px}
  .intro-list li{font-size:14px}
  .lib-card{padding:16px}
  .dir-row{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 16px}
  .dir-row.head{display:none}
  .d-name{grid-column:1}
  .d-ext{grid-column:2;grid-row:1;text-align:right}
  .d-ext:not(:empty)::before{content:'내선 ';font-size:13px;color:var(--c-t3);font-weight:600}
  .d-group,.d-dept{display:none}
  .d-gd{display:block;grid-column:1 / -1;font-size:15px;color:var(--c-t2)}
  .d-gd:empty,.d-duty:empty{display:none}
  #lib-body .toolbar .seg{flex:1 1 100%}
  #lib-body .toolbar .seg button{flex:1 1 0}
  #lib-body .toolbar select{flex:1 1 0;min-width:0}
  .d-duty{grid-column:1 / -1}
}
@media print{
  .intro,.search-res .sr-chev,.lib-btns,.help-foot .row-btns{display:none!important}
  .lib-grid{grid-template-columns:repeat(2,1fr)}
  .lib-card,.dir-row,.guide-card{break-inside:avoid}
  .help-body{display:flex!important}
  .dir-row{padding:6px 10px;font-size:13px}
  /* 교직원 명단은 A4에서도 한 줄 표로(종이 폭이 휴대폰 모양 기준보다 좁아 카드 모양이 되던 것, 2026-10-28a) */
  .dir-print-h{display:flex!important;justify-content:space-between;align-items:baseline;margin:0 0 8px;font-size:15pt;font-weight:800;color:#000}
  .dir-print-h span{font-size:10pt;font-weight:600}
  #dir-list>.faint{display:none}
  .dir-row{display:grid!important;grid-template-columns:20% 17% 15% minmax(0,1fr) 11%!important;gap:8px!important;padding:3px 8px!important;font-size:10pt!important;line-height:1.35}
  .dir-row.head{display:grid!important;font-size:9.5pt!important}
  .d-group,.d-dept{display:block!important}
  .d-gd{display:none!important}
  .d-name,.d-ext,.d-duty{grid-column:auto!important;grid-row:auto!important;text-align:left!important;font-size:inherit!important}
  .d-ext::before{content:none!important}
  .d-duty:empty{display:block!important}
}

/* ---------- 화면 기억(속도): 뒤에서 새 내용을 받는 동안 맨 위의 가는 줄 ---------- */
.refresh-bar{position:fixed;top:0;left:0;right:0;z-index:90;height:3px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--accent),transparent) 0 0/40% 100% no-repeat;animation:gy-refresh 1.1s linear infinite}
@keyframes gy-refresh{from{background-position:-40% 0}to{background-position:140% 0}}
@media (prefers-reduced-motion:reduce){.refresh-bar{animation:none;background:var(--accent-soft)}}

/* ---------- 관리자 › 점검 › 속도 재기 ---------- */
.speed{display:flex;flex-direction:column;gap:12px}
.speed p{margin:0}
.speed h3{margin:4px 0 0;font-size:16px;font-weight:800}
.speed-wrap{overflow-x:auto}
.speed-table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.speed-table th,.speed-table td{padding:8px 10px;border-bottom:1px solid var(--c-line);text-align:right;white-space:nowrap}
.speed-table th:first-child{text-align:left}
.speed-table thead th{font-size:13px;font-weight:700;color:var(--c-t3)}
.speed-recent{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.speed-recent li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--c-line);font-variant-numeric:tabular-nums}

/* ---------- 화면 크기 막대 (사이드 메뉴 아래·휴대폰 '전체') ---------- */
.zoom{display:flex;flex-direction:column;gap:4px;padding:2px 2px 0 14px}
.zoom-top{display:flex;align-items:center;gap:12px;min-height:30px;color:var(--c-t2);font-size:15px;font-weight:600}
.zoom-val{margin-left:auto;padding-right:10px;font-size:14px;font-weight:800;color:var(--c-t1);font-variant-numeric:tabular-nums}
.zoom-row{display:flex;align-items:center;gap:2px}
.zoom-btn{width:40px;height:40px;border-radius:10px}
.zoom-btn:disabled{opacity:.35;cursor:default;background:transparent!important}
.zoom-range{flex:1 1 auto;min-width:0;height:32px;margin:0 4px;accent-color:var(--accent);cursor:pointer}
.sheet .zoom{padding-left:14px}
.sheet .zoom-btn{width:44px;height:44px}

/* ---------- 홈: 창이 좁거나 화면을 키워 본문이 좁아지면 휴대폰처럼 ---------- */
/* '내가 할 일'은 오늘 일정 아래로, 이번 주 5칸은 날짜별 목록으로(칸이 좁아 행사 이름이 넘치지 않게) */
.home-wrap{container:home / inline-size}
@container home (max-width: 819px){
  .home-top{grid-template-columns:minmax(0,1fr)}
  .week{grid-template-columns:minmax(0,1fr)}
  .wday{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:12px 14px}
  .wday-head{width:100%}
  .wday .wev{flex:1 1 100%}
}

/* ---------- 홈: 넓은 모니터는 오른쪽에 '내가 할 일'(스크롤을 따라옴, 판 2026-10-22a 교사 요청) ---------- */
/* App.html homeSide()가 정한다(본문 폭 1264 이상, 100%로 보면 창 폭 약 1600 이상). 홈만 본문을 넓혀 가운데 기둥은 예전 폭(1120)까지, 오른쪽 300px에 붙인다 */
#screen.home-side{max-width:1444px}
.wrap.home-cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;align-items:start;gap:24px;max-width:none}
.home-main{display:flex;flex-direction:column;gap:24px;min-width:0;container:home / inline-size}
.home-aside{position:sticky;top:24px;min-width:0}
.home-aside>.card{max-height:calc((100vh - 48px) / var(--gy-zoom,1));max-height:calc((100dvh - 48px) / var(--gy-zoom,1));overflow:auto;overscroll-behavior:contain}
@media print{
  #screen.home-side{max-width:none}
  .wrap.home-cols{display:flex;flex-direction:column}
  .home-aside{position:static}
  .home-aside>.card{max-height:none;overflow:visible}
}

/* ---------- 홈 맨 아래: 중점지도(왼쪽) · 학생 수 현황(오른쪽) ---------- */
.home-bottom>.card{flex:1 1 320px}
.stu-card{container:stu / inline-size}
.stu-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;min-width:0}
.stu-total{margin:0;display:flex;align-items:baseline;gap:6px}
.stu-total-label{margin-right:4px;font-size:15px;font-weight:700;color:var(--c-t3)}
.stu-total-num{font-size:36px;line-height:1.15;font-weight:800;letter-spacing:-0.04em;font-variant-numeric:tabular-nums}
.stu-unit{font-size:15px;font-weight:700;color:var(--c-t2)}
.stu-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.stu-g{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;padding:12px 4px;border:0;border-radius:12px;background:var(--c-card2);color:var(--c-t1);font:inherit;cursor:pointer}
.stu-g-name{font-size:13px;font-weight:700;color:var(--c-t3);white-space:nowrap}
.stu-g-num{font-size:20px;line-height:1.25;font-weight:800;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stu-g-num .stu-unit{margin-left:1px;font-size:13px}
.stu-g.mine{background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.stu-g.mine .stu-g-name,.stu-g.mine .stu-g-num,.stu-g.mine .stu-unit{color:var(--accent)}
@container stu (max-width: 399px){ .stu-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
.stu-mf{margin-left:8px;font-size:14px;font-weight:700;color:var(--c-t3);font-variant-numeric:tabular-nums}
.stu-tip{margin-top:-4px!important;font-size:13px}
.stu-modal-date{margin-top:-10px!important}
/* 학년 상세(반별 남·여) */
.stu-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.stu-table th,.stu-table td{padding:10px 12px;border-bottom:1px solid var(--c-line);text-align:right;font-size:16px}
.stu-table th:first-child{text-align:left}
.stu-table thead th{font-size:14px;font-weight:700;color:var(--c-t3)}
.stu-table tbody th{font-weight:700;color:var(--c-t2)}
.stu-table tfoot th,.stu-table tfoot td{border-bottom:0;border-top:2px solid var(--c-line2);font-weight:800}
/* 넣기 창: 학교 전체 한 창 */
.stu-secs{display:flex;flex-direction:column;gap:12px}
.stu-sec{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:1px solid var(--c-line);border-radius:14px;scroll-margin-top:8px}
.stu-sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.stu-sec-head h3{margin:0;font-size:17px;font-weight:800}
.stu-sec-sum{font-size:14px;font-weight:700;color:var(--c-t2);font-variant-numeric:tabular-nums}
.stu-rows{display:flex;flex-direction:column;gap:6px}
.stu-row{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr) 52px;align-items:center;gap:8px}
.stu-cls{font-weight:700;color:var(--c-t2);font-variant-numeric:tabular-nums}
.stu-mf-in{display:flex;align-items:center;gap:6px;min-width:0}
.stu-mf-in span{flex:none;font-size:14px;font-weight:700;color:var(--c-t3)}
.stu-mf-in .input{min-width:0;min-height:42px;padding:0 10px;text-align:right;font-variant-numeric:tabular-nums}
.stu-row-sum{text-align:right;font-variant-numeric:tabular-nums}
.stu-foot{position:sticky;bottom:-24px;z-index:1;margin:0 -24px -24px;padding:12px 24px 24px;display:flex;flex-direction:column;gap:10px;background:var(--c-card);border-top:1px solid var(--c-line)}
.stu-sum{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;padding:10px 14px;border-radius:12px;background:var(--c-card2);font-weight:700;color:var(--c-t2)}
.stu-sum b{font-size:17px;color:var(--c-t1);font-variant-numeric:tabular-nums}
@media (hover:hover){ .stu-g:hover{box-shadow:0 0 0 1px var(--c-line2) inset} .stu-g.mine:hover{box-shadow:0 0 0 2px var(--accent) inset} }
@media (max-width:899px){ .stu-foot{bottom:-20px;margin:0 -20px -20px;padding:12px 20px 20px} }
@media (max-width:599px){
  .stu-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stu-total-num{font-size:30px}
  .stu-sec{padding:12px}
  .stu-row{grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 44px;gap:6px}
}
@media print{
  .stu-g.mine{box-shadow:none}
}

/* 화면 디자인 고르기(밝게·어둡게 아래): 단추마다 그 디자인의 바탕색·포인트 색 점 */
.design-dot{width:14px;height:14px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--dot-a) 50%,var(--dot-b) 50%);box-shadow:0 0 0 1px var(--c-line2)}
/* 디자인을 바꿀 때만 색이 부드럽게(0.35초) 바뀐다 */
html.design-anim,html.design-anim *{transition:background-color .35s ease,border-color .35s ease,color .35s ease,box-shadow .35s ease!important}

/* 함께 쓰는 표의 모양은 TableUi.html 안에 있다(판 2026-10-18a부터 표 화면을 따로 된 파일로 뗌) */

/* ---------- 학교 교표: 책 모양 로고 대신(교사 요청, 판 2026-10-17e) ----------
 * 학교 홈페이지 맨 위의 교표를 교사가 보낸 휴대폰 사진에서 동그랗게 오린 그림(PNG 132×132, 바깥은 투명). 다시 그리거나 고치지 않았다
 * 메뉴·위 막대·로그인 화면(App.html)과 여는 그림(Index.html)이 함께 쓴다. 더 선명한 원본이 생기면 맨 아래 --gy-emblem 한 줄만 바꾼다
 * 위 막대의 .topbar .brand-mark(모서리 10px)보다 뒤에 두어 늘 동그랗게 */
